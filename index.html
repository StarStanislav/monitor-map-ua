<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             user-scalable=no,
             viewport-fit=cover"
  >

  <title>ONLINE RADAR</title>

  <!-- =========================================================
       MAPLIBRE
  ========================================================== -->

  <link
    rel="stylesheet"
    href="https://unpkg.com/maplibre-gl@5.9.0/dist/maplibre-gl.css"
  >

  <script src="https://unpkg.com/maplibre-gl@5.9.0/dist/maplibre-gl.js"></script>

  <!-- Turf: використовується тільки для затемнення території
       поза реальною геометрією Київської області -->
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>

  <!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>


  <style>

    /* =========================================================
       ROOT
    ========================================================== */

    :root {
      --bg: #050708;
      --panel: rgba(5, 9, 10, .84);

      --text: #edf2f3;
      --muted: #7f8b90;

      --green: #62ff91;

      --border: rgba(255,255,255,.085);
    }


    /* =========================================================
       RESET
    ========================================================== */

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }


    html,
    body {
      width: 100%;
      height: 100%;

      margin: 0;
      padding: 0;

      overflow: hidden;

      background: var(--bg);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }


    body {
      position: fixed;
      inset: 0;
    }


    /* =========================================================
       MAP
    ========================================================== */

    #map {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      background: #050708;
    }


    /* =========================================================
       TOP STATUS
    ========================================================== */

    .topbar {
      position: fixed;

      z-index: 1000;

      top: max(12px, env(safe-area-inset-top));
      left: 13px;

      display: flex;
      align-items: center;

      gap: 9px;

      padding: 9px 12px;

      border:
        1px solid var(--border);

      border-radius: 11px;

      background:
        rgba(5,8,9,.78);

      backdrop-filter:
        blur(16px);

      -webkit-backdrop-filter:
        blur(16px);

      box-shadow:
        0 8px 30px rgba(0,0,0,.38);

      pointer-events: none;
    }


    .status-dot {
      width: 7px;
      height: 7px;

      flex: 0 0 7px;

      border-radius: 50%;

      background: var(--green);

      box-shadow:
        0 0 8px rgba(98,255,145,.95);

      animation:
        radarPulse 1.8s infinite;
    }


    .top-title {
      color: #f0f4f5;

      font-size: 11px;

      font-weight: 750;

      letter-spacing: .17em;

      line-height: 1;

      white-space: nowrap;
    }


    @keyframes radarPulse {

      0% {
        box-shadow:
          0 0 0 0 rgba(98,255,145,.48),
          0 0 8px rgba(98,255,145,.85);
      }

      70% {
        box-shadow:
          0 0 0 7px rgba(98,255,145,0),
          0 0 10px rgba(98,255,145,.85);
      }

      100% {
        box-shadow:
          0 0 0 0 rgba(98,255,145,0),
          0 0 8px rgba(98,255,145,.85);
      }

    }


    /* =========================================================
       BOTTOM INFO
    ========================================================== */

    .bottom-panel {
      position: fixed;

      z-index: 1000;

      left: 13px;
      bottom: max(13px, env(safe-area-inset-bottom));

      padding:
        9px
        12px;

      border:
        1px solid var(--border);

      border-radius: 10px;

      background:
        rgba(5,8,9,.84);

      backdrop-filter:
        blur(16px);

      -webkit-backdrop-filter:
        blur(16px);

      box-shadow:
        0 8px 30px rgba(0,0,0,.4);

      pointer-events: none;
    }


    .region-name {
      color: #e8edef;

      font-size: 9px;

      font-weight: 750;

      letter-spacing: .15em;
    }


    .clock {
      margin-top: 4px;

      color: #7f8b90;

      font-family:
        "SF Mono",
        "Roboto Mono",
        Consolas,
        monospace;

      font-size: 9px;

      letter-spacing: .035em;
    }


    /* =========================================================
       MAPLIBRE CONTROLS
    ========================================================== */

    .maplibregl-ctrl-bottom-right {
      right: 7px;
      bottom: 7px;
    }


    .maplibregl-ctrl-group {
      overflow: hidden;

      border:
        1px solid rgba(255,255,255,.08) !important;

      border-radius: 9px !important;

      background:
        rgba(5,8,9,.80) !important;

      backdrop-filter:
        blur(12px);
    }


    .maplibregl-ctrl-group button {
      width: 33px;
      height: 33px;

      background-color:
        transparent !important;
    }


    .maplibregl-ctrl-attrib {
      background:
        rgba(4,7,8,.70) !important;

      color: #657176 !important;

      border-radius: 6px;

      font-size: 8px !important;
    }


    .maplibregl-ctrl-attrib a {
      color: #7c898e !important;
    }


    /* =========================================================
       LOADING SCREEN
    ========================================================== */

    #loading {
      position: fixed;

      z-index: 5000;

      inset: 0;

      display: flex;

      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          circle at center,
          #101719 0%,
          #06090a 45%,
          #030506 100%
        );

      transition:
        opacity .45s ease;
    }


    #loading.hidden {
      opacity: 0;

      pointer-events: none;
    }


    .loading-box {
      text-align: center;
    }


    .loading-ring {
      width: 30px;
      height: 30px;

      margin: 0 auto 12px;

      border-radius: 50%;

      border:
        2px solid rgba(255,255,255,.08);

      border-top-color:
        var(--green);

      animation:
        spin .75s linear infinite;
    }


    .loading-text {
      color: #778388;

      font-size: 9px;

      font-weight: 650;

      letter-spacing: .18em;
    }


    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }


    /* =========================================================
       MAP FADE
    ========================================================== */

    #map::after {
      content: "";

      position: absolute;

      z-index: 5;

      pointer-events: none;

      inset: 0;

      background:
        radial-gradient(
          ellipse at center,
          rgba(0,0,0,0) 48%,
          rgba(0,0,0,.20) 100%
        );
    }


    /* =========================================================
       MOBILE
    ========================================================== */

    @media (max-width: 430px) {

      .topbar {
        left: 10px;
        top: max(10px, env(safe-area-inset-top));
      }

      .bottom-panel {
        left: 10px;
        bottom: max(10px, env(safe-area-inset-bottom));
      }

    }

  </style>
</head>


<body>


  <!-- =======================================================
       MAP
  ======================================================== -->

  <div id="map"></div>


  <!-- =======================================================
       LOADING
  ======================================================== -->

  <div id="loading">

    <div class="loading-box">

      <div class="loading-ring"></div>

      <div class="loading-text">
        INITIALIZING MAP
      </div>

    </div>

  </div>


  <!-- =======================================================
       ONLINE RADAR
  ======================================================== -->

  <div class="topbar">

    <span class="status-dot"></span>

    <span class="top-title">
      ONLINE RADAR
    </span>

  </div>


  <!-- =======================================================
       REGION / CLOCK
  ======================================================== -->

  <div class="bottom-panel">

    <div class="region-name">
      КИЇВСЬКА ОБЛАСТЬ
    </div>

    <div
      id="clock"
      class="clock"
    >
      --.--.---- · --:--:--
    </div>

  </div>



  <script>

    /* =========================================================
       TELEGRAM
    ========================================================== */

    const tg =
      window.Telegram?.WebApp;

    if (tg) {

      try {

        tg.ready();

        tg.expand();

        tg.setHeaderColor?.("#050708");

        tg.setBackgroundColor?.("#050708");

      } catch (error) {

        console.warn(
          "Telegram:",
          error
        );

      }

    }



    /* =========================================================
       CLOCK
    ========================================================== */

    const clock =
      document.getElementById("clock");


    function updateClock() {

      const now =
        new Date();


      const date =
        new Intl.DateTimeFormat(
          "uk-UA",
          {
            timeZone: "Europe/Kyiv",

            day: "2-digit",
            month: "2-digit",
            year: "numeric"
          }
        ).format(now);


      const time =
        new Intl.DateTimeFormat(
          "uk-UA",
          {
            timeZone: "Europe/Kyiv",

            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",

            hour12: false
          }
        ).format(now);


      clock.textContent =
        `${date} · ${time}`;

    }


    updateClock();

    setInterval(
      updateClock,
      1000
    );



    /* =========================================================
       CONSTANTS
    ========================================================== */


    const STYLE_URL =
      "https://tiles.openfreemap.org/styles/dark";


    /*
     * Реальна геометрія Київської області.
     *
     * Це не намальований нами полігон.
     */

    const KYIV_OBLAST_GEOJSON =
      "https://geo2day.com/europe/ukraine/kiev_oblast.geojson";


    /*
     * Максимальна зона панорамування.
     *
     * Не даємо випадково від'їхати на всю Україну.
     */

    const MAX_BOUNDS = [

      [29.15, 49.05],

      [32.30, 51.65]

    ];



    /* =========================================================
       FETCH STYLE
       
       Беремо готовий Dark style і модифікуємо його
       перед запуском MapLibre.
    ========================================================== */


    async function loadMap() {

      try {

        const response =
          await fetch(
            STYLE_URL,
            {
              cache: "no-store"
            }
          );


        if (!response.ok) {

          throw new Error(
            `Style HTTP ${response.status}`
          );

        }


        const style =
          await response.json();


        customizeStyle(style);


        createMap(style);


      } catch (error) {

        console.error(
          "Unable to load map style:",
          error
        );


        /*
         * Якщо OpenFreeMap тимчасово недоступний,
         * не залишаємо чорний екран без пояснення.
         */

        document.querySelector(
          ".loading-text"
        ).textContent =
          "MAP CONNECTION ERROR";

      }

    }



    /* =========================================================
       STYLE CUSTOMIZATION
    ========================================================== */


    function customizeStyle(style) {

      if (!style.layers) {
        return;
      }


      for (
        const layer of style.layers
      ) {

        const sourceLayer =
          layer["source-layer"] || "";


        const id =
          String(
            layer.id || ""
          ).toLowerCase();


        /* -----------------------------------------------------
           BACKGROUND
        ------------------------------------------------------ */

        if (
          layer.type === "background"
        ) {

          layer.paint = {

            ...(layer.paint || {}),

            "background-color":
              "#050809"

          };

        }


        /* -----------------------------------------------------
           LAND
        ------------------------------------------------------ */

        if (
          layer.type === "fill" &&
          (
            sourceLayer === "landcover" ||
            sourceLayer === "landuse"
          )
        ) {

          /*
           * Робимо землю холодною та дуже темною.
           */

          layer.paint = {

            ...(layer.paint || {}),

            "fill-opacity":
              0.88

          };

        }


        /* -----------------------------------------------------
           WATER
        ------------------------------------------------------ */

        if (
          sourceLayer === "water"
        ) {

          if (
            layer.type === "fill"
          ) {

            layer.paint = {

              ...(layer.paint || {}),

              "fill-color":
                "#09191d",

              "fill-opacity":
                1

            };

          }

        }


        /* -----------------------------------------------------
           WATERWAYS
        ------------------------------------------------------ */

        if (
          sourceLayer === "waterway"
        ) {

          if (
            layer.type === "line"
          ) {

            layer.paint = {

              ...(layer.paint || {}),

              "line-color":
                "#19464d",

              "line-opacity":
                0.72

            };

          }

        }


        /* -----------------------------------------------------
           ROADS
        ------------------------------------------------------ */

        if (
          sourceLayer === "transportation"
        ) {

          if (
            layer.type === "line"
          ) {

            layer.paint = {

              ...(layer.paint || {}),

              "line-opacity":
                0.65

            };

          }

        }


        /* -----------------------------------------------------
           POI
           
           Вимикаємо непотрібний міський шум.
        ------------------------------------------------------ */

        if (
          sourceLayer === "poi" ||
          sourceLayer === "housenumber"
        ) {

          layer.layout = {

            ...(layer.layout || {}),

            visibility:
              "none"

          };

        }


        /*
         * Старі city/place labels вимикаємо.
         *
         * Нижче створимо власну ієрархію.
         */

        if (
          sourceLayer === "place" &&
          layer.type === "symbol"
        ) {

          layer.layout = {

            ...(layer.layout || {}),

            visibility:
              "none"

          };

        }


        /*
         * Прибираємо стандартні назви доріг.
         */

        if (
          sourceLayer ===
          "transportation_name" &&
          layer.type === "symbol"
        ) {

          layer.layout = {

            ...(layer.layout || {}),

            visibility:
              "none"

          };

        }


        /*
         * Старі межі регіонів прибираємо,
         * щоб не отримувати кашу з різних admin levels.
         */

        if (
          sourceLayer === "boundary" &&
          layer.type === "line"
        ) {

          /*
           * Залишаємо тільки державні/основні
           * межі базової карти.
           *
           * Райони Київщини додамо власним шаром.
           */

          if (
            layer.filter
          ) {

            const filterText =
              JSON.stringify(
                layer.filter
              );

            if (
              filterText.includes("admin_level")
            ) {

              /*
               * admin-level 4/6/8 тощо
               * будемо контролювати самі.
               */

              const filter =
                layer.filter;


              /*
               * Не видаляємо layer,
               * просто робимо його менш помітним.
               */

              layer.paint = {

                ...(layer.paint || {}),

                "line-opacity":
                  0.15

              };

            }

          }

        }

      }

    }



    /* =========================================================
       CREATE MAP
    ========================================================== */


    function createMap(style) {


      const map =
        new maplibregl.Map({

          container:
            "map",

          style:
            style,

          center: [
            30.85,
            50.35
          ],

          zoom:
            8.15,

          minZoom:
            7.25,

          maxZoom:
            16,

          maxBounds:
            MAX_BOUNDS,

          attributionControl:
            true,

          pitchWithRotate:
            false,

          dragRotate:
            false,

          touchPitch:
            false,

          touchZoomRotate:
            true,

          cooperativeGestures:
            false

        });



      window.__KYIV_MAP__ =
        map;



      /* =======================================================
         NAVIGATION
      ======================================================== */

      map.addControl(

        new maplibregl.NavigationControl({

          showCompass:
            false,

          visualizePitch:
            false

        }),

        "bottom-right"

      );



      /* =======================================================
         MAP LOAD
      ======================================================== */

      map.once(
        "load",
        async () => {

          try {

            await addKyivOblast(
              map
            );


            addDistricts(
              map
            );


            addPlaces(
              map
            );


            addWaterNames(
              map
            );


            addRoadNames(
              map
            );


            addKyivHighlight(
              map
            );


            /*
             * Додаємо зовнішнє затемнення
             * після завантаження геометрії.
             */

            await addOutsideMask(
              map
            );


            /*
             * Повертаємо межу області
             * поверх усіх шарів.
             */

            addOblastBorder(
              map
            );


            /*
             * Стартове положення.
             */

            map.easeTo({

              center: [
                30.80,
                50.42
              ],

              zoom:
                8.25,

              duration:
                700

            });


          } catch (error) {

            console.error(
              "Map initialization:",
              error
            );

          }


          /*
           * Прибираємо loading.
           */

          setTimeout(
            () => {

              document
                .getElementById(
                  "loading"
                )
                .classList.add(
                  "hidden"
                );

            },
            500
          );

        }
      );


    }



    /* =========================================================
       KYIV OBLAST GEOJSON
    ========================================================== */


    async function fetchOblast() {

      const response =
        await fetch(
          KYIV_OBLAST_GEOJSON,
          {
            cache:
              "no-store"
          }
        );


      if (!response.ok) {

        throw new Error(
          `Kyiv Oblast HTTP ${response.status}`
        );

      }


      return await response.json();

    }



    /* =========================================================
       OBLAST BASE FILL
    ========================================================== */


    async function addKyivOblast(map) {

      const oblast =
        await fetchOblast();


      map.addSource(
        "kyiv-oblast-geometry",
        {

          type:
            "geojson",

          data:
            oblast

        }
      );


      /*
       * Дуже слабке підсвічування території.
       */

      map.addLayer({

        id:
          "kyiv-oblast-fill",

        type:
          "fill",

        source:
          "kyiv-oblast-geometry",

        paint: {

          "fill-color":
            "#173027",

          "fill-opacity":
            0.14

        }

      });


      return oblast;

    }



    /* =========================================================
       OUTSIDE MASK
       
       Все поза Київщиною приглушується.
    ========================================================== */


    async function addOutsideMask(map) {

      const oblast =
        await fetchOblast();


      /*
       * Великий прямокутник навколо карти.
       */

      const outer =
        turf.polygon([

          [

            [20, 45],

            [40, 45],

            [40, 55],

            [20, 55],

            [20, 45]

          ]

        ]);


      /*
       * Difference:
       *
       * зовнішній прямокутник
       * мінус Київська область.
       */

      let outside;


      try {

        outside =
          turf.difference(
            turf.featureCollection([
              outer,
              oblast.features[0]
            ])
          );

      } catch (error) {

        console.warn(
          "Mask difference:",
          error
        );

        return;

      }


      if (!outside) {
        return;
      }


      map.addSource(
        "kyiv-outside-mask",
        {

          type:
            "geojson",

          data:
            outside

        }
      );


      map.addLayer({

        id:
          "kyiv-outside-mask-fill",

        type:
          "fill",

        source:
          "kyiv-outside-mask",

        paint: {

          "fill-color":
            "#020405",

          "fill-opacity":
            0.58

        }

      });

    }



    /* =========================================================
       OBLAST BORDER
    ========================================================== */


    function addOblastBorder(map) {

      map.addLayer({

        id:
          "kyiv-oblast-border",

        type:
          "line",

        source:
          "kyiv-oblast-geometry",

        paint: {

          "line-color":
            "#8ba39c",

          "line-width": [

            "interpolate",

            ["linear"],

            ["zoom"],

            7,
            1.15,

            9,
            1.75,

            12,
            2.3,

            15,
            3

          ],

          "line-opacity":
            0.92,

          "line-blur":
            0.05

        }

      });

    }



    /* =========================================================
       DISTRICTS
       
       OpenMapTiles boundary layer:
       admin_level = 6
       
       Це реальні адміністративні межі,
       а не намальовані координати.
    ========================================================== */


    function addDistricts(map) {


      /*
       * Дуже слабкий fill.
       */

      map.addLayer({

        id:
          "kyiv-district-fill",

        type:
          "fill",

        source:
          "openmaptiles",

        "source-layer":
          "boundary",

        minzoom:
          7,

        filter: [

          "all",

          [
            "==",
            "admin_level",
            6
          ],

          [
            "!=",
            "maritime",
            1
          ]

        ],

        paint: {

          "fill-color":
            "#78948c",

          "fill-opacity":
            0.035

        }

      });



      /*
       * Межі районів.
       */

      map.addLayer({

        id:
          "kyiv-district-border",

        type:
          "line",

        source:
          "openmaptiles",

        "source-layer":
          "boundary",

        minzoom:
          7,

        filter: [

          "all",

          [
            "==",
            "admin_level",
            6
          ],

          [
            "!=",
            "maritime",
            1
          ]

        ],

        paint: {

          "line-color":
            "#667a76",

          "line-width": [

            "interpolate",

            ["linear"],

            ["zoom"],

            7,
            0.45,

            9,
            0.8,

            12,
            1.15,

            15,
            1.6

          ],

          "line-opacity":
            0.48,

          "line-dasharray":
            [2, 3]

        }

      });



      /*
       * Назви районів.
       */

      map.addLayer({

        id:
          "kyiv-district-labels",

        type:
          "symbol",

        source:
          "openmaptiles",

        "source-layer":
          "boundary",

        minzoom:
          7.7,

        filter: [

          "all",

          [
            "==",
            "admin_level",
            6
          ],

          [
            "has",
            "name"
          ]

        ],

        layout: {

          "symbol-placement":
            "point",

          "text-field": [

            "coalesce",

            [
              "get",
              "name:uk"
            ],

            [
              "get",
              "name"
            ]

          ],

          "text-font": [
            "Noto Sans Regular"
          ],

          "text-size": [

            "interpolate",

            ["linear"],

            ["zoom"],

            8,
            8,

            10,
            9,

            13,
            10

          ],

          "text-letter-spacing":
            0.08,

          "text-max-width":
            8,

          "text-allow-overlap":
            false,

          "text-ignore-placement":
            false

        },

        paint: {

          "text-color":
            "#849793",

          "text-opacity":
            0.52,

          "text-halo-color":
            "#050809",

          "text-halo-width":
            1.4

        }

      });

    }



    /* =========================================================
       PLACES
       
       Не ручні координати.
       Беремо населені пункти з vector tile.
    ========================================================== */


    function addPlaces(map) {


      /*
       * Міста.
       */

      map.addLayer({

        id:
          "kyiv-places-city",

        type:
          "symbol",

        source:
          "openmaptiles",

        "source-layer":
          "place",

        minzoom:
          7.5,

        filter: [

          "all",

          [
            "==",
            "$type",
            "Point"
          ],

          [
            "==",
            "class",
            "city"
          ]

        ],

        layout: {

          "text-field": [

            "coalesce",

            [
              "get",
              "name:uk"
            ],

            [
              "get",
              "name"
            ]

          ],

          "text-font": [
            "Noto Sans Bold"
          ],

          "text-size": [

            "interpolate",

            ["linear"],

            ["zoom"],

            7.5,
            10,

            9,
            12,

            12,
            14,

            15,
            16

          ],

          "text-anchor":
            "center",

          "text-padding":
            4,

          "text-allow-overlap":
            false

        },

        paint: {

          "text-color":
            "#e7eeee",

          "text-halo-color":
            "#050809",

          "text-halo-width":
            2,

          "text-halo-blur":
            0.3

        }

      });



      /*
       * Міста/селища.
       */

      map.addLayer({

        id:
          "kyiv-places-town",

        type:
          "symbol",

        source:
          "openmaptiles",

        "source-layer":
          "place",

        minzoom:
          8,

        filter: [

          "all",

          [
            "==",
            "$type",
            "Point"
          ],

          [
            "in",
            "class",
            "town",
            "village"
          ]

        ],

        layout: {

          "text-field": [

            "coalesce",

            [
              "get",
              "name:uk"
            ],

            [
              "get",
              "name"
            ]

          ],

          "text-font": [
            "Noto Sans Regular"
          ],

          "text-size": [

            "interpolate",

            ["linear"],

            ["zoom"],

            8,
            8,

            10,
            9,

            13,
            11,

            15,
            12

          ],

          "text-padding":
            3,

          "text-anchor":
            "center",

          "text-allow-overlap":
            false

        },

        paint: {

          "text-color":
            "#b7c2c3",

          "text-halo-color":
            "#050809",

          "text-halo-width":
            1.7

        }

      });



      /*
       * Маленька точка під містом.
       */

      map.addLayer({

        id:
          "kyiv-city-points",

        type:
          "circle",

        source:
          "openmaptiles",

        "source-layer":
          "place",

        minzoom:
          8,

        filter: [

          "all",

          [
            "==",
            "$type",
            "Point"
          ],

          [
            "in",
            "class",
            "city",
            "town"
          ]

        ],

        paint: {

          "circle-radius": [

            "interpolate",

            ["linear"],

            ["zoom"],

            8,
            1.7,

            12,
            2.5,

            16,
            3

          ],

          "circle-color":
            "#d7e1e0",

          "circle-opacity":
            0.82,

          "circle-stroke-color":
            "#050809",

          "circle-stroke-width":
            1

        }

      });

    }



    /* =========================================================
       WATER NAMES
    ========================================================== */


    function addWaterNames(map) {


      map.addLayer({

        id:
          "kyiv-water-names",

        type:
          "symbol",

        source:
          "openmaptiles",

        "source-layer":
          "water_name",

        minzoom:
          8,

        filter: [

          "has",
          "name"
        ],

        layout: {

          "text-field": [

            "coalesce",

            [
              "get",
              "name:uk"
            ],

            [
              "get",
              "name"
            ]

          ],

          "text-font": [
            "Noto Sans Regular"
          ],

          "text-size": [

            "interpolate",

            ["linear"],

            ["zoom"],

            8,
            8,

            12,
            10,

            15,
            12

          ],

          "text-letter-spacing":
            0.05,

          "text-max-width":
            7

        },

        paint: {

          "text-color":
            "#39727b",

          "text-opacity":
            0.68,

          "text-halo-color":
            "#071013",

          "text-halo-width":
            1.2

        }

      });

    }



    /* =========================================================
       ROAD NAMES
       
       Показуємо тільки з достатнього zoom.
       Не забиваємо карту назвами всіх вулиць.
    ========================================================== */


    function addRoadNames(map) {


      map.addLayer({

        id:
          "kyiv-major-road-names",

        type:
          "symbol",

        source:
          "openmaptiles",

        "source-layer":
          "transportation_name",

        minzoom:
          10.5,

        filter: [

          "has",
          "name"

        ],

        layout: {

          "symbol-placement":
            "line",

          "text-field": [

            "coalesce",

            [
              "get",
              "name:uk"
            ],

            [
              "get",
              "name"
            ]

          ],

          "text-font": [
            "Noto Sans Regular"
          ],

          "text-size": [

            "interpolate",

            ["linear"],

            ["zoom"],

            10.5,
            8,

            13,
            9,

            16,
            11

          ],

          "text-max-angle":
            30,

          "text-padding":
            40

        },

        paint: {

          "text-color":
            "#687477",

          "text-opacity":
            0.55,

          "text-halo-color":
            "#050809",

          "text-halo-width":
            1.2

        }

      });

    }



    /* =========================================================
       KYIV CITY HIGHLIGHT
       
       Київ — окрема адміністративна одиниця.
       
       Робимо тільки subtle highlight.
    ========================================================== */


    function addKyivHighlight(map) {


      /*
       * Це vector boundary city filter.
       *
       * Kyiv має окрему адміністративну геометрію
       * в OSM/OpenMapTiles.
       *
       * Використовуємо назву Київ + admin_level 6.
       */

      map.addLayer({

        id:
          "kyiv-city-admin-highlight",

        type:
          "line",

        source:
          "openmaptiles",

        "source-layer":
          "boundary",

        minzoom:
          8,

        filter: [

          "all",

          [
            "==",
            "admin_level",
            6
          ],

          [
            "any",

            [
              "==",
              "name",
              "Київ"
            ],

            [
              "==",
              "name",
              "Kyiv"
            ]

          ]

        ],

        paint: {

          "line-color":
            "#a8bbb6",

          "line-width": [

            "interpolate",

            ["linear"],

            ["zoom"],

            8,
            0.8,

            11,
            1.4,

            15,
            2.2

          ],

          "line-opacity":
            0.68

        }

      });

    }



    /* =========================================================
       MAP ERRORS
    ========================================================== */


    window.addEventListener(
      "error",
      event => {

        console.warn(
          "Page error:",
          event.message
        );

      }
    );



    /* =========================================================
       START
    ========================================================== */


    loadMap();

  </script>
