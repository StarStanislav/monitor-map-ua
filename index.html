<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ONLINE RADAR</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #05070b;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    }


    /* =====================================================
       TOP BAR
    ===================================================== */

    .top-bar {

      position: fixed;

      top: 0;
      left: 0;
      right: 0;

      height: 58px;

      z-index: 2000;

      display: flex;

      align-items: center;
      justify-content: center;

      background: rgba(5, 7, 11, 0.98);

      border-bottom:
        1px solid rgba(255,255,255,0.07);

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }


    .logo {

      display: flex;

      align-items: center;
      justify-content: center;

      gap: 11px;

      color: #ffffff;

      font-size: 16px;

      font-weight: 700;

      letter-spacing: 2.5px;
    }


    /* =====================================================
       ONLINE DOT
    ===================================================== */

    .online-dot {

      width: 9px;
      height: 9px;

      border-radius: 50%;

      background: #27e66b;

      animation:
        onlinePulse 1.5s ease-in-out infinite;
    }


    @keyframes onlinePulse {

      0% {

        opacity: 1;

        transform: scale(1);

        box-shadow:
          0 0 5px rgba(39,230,107,0.9),
          0 0 15px rgba(39,230,107,0.65);
      }

      50% {

        opacity: 0.3;

        transform: scale(0.72);

        box-shadow:
          0 0 2px rgba(39,230,107,0.3),
          0 0 5px rgba(39,230,107,0.2);
      }

      100% {

        opacity: 1;

        transform: scale(1);

        box-shadow:
          0 0 5px rgba(39,230,107,0.9),
          0 0 15px rgba(39,230,107,0.65);
      }

    }


    /* =====================================================
       MAP CONTAINER
    ===================================================== */

    .map-container {

      position: fixed;

      top: 58px;

      left: 0;
      right: 0;

      bottom: 90px;

      background: #05070b;

      overflow: hidden;
    }


    /* =====================================================
       NEPTUN IFRAME
    ===================================================== */

    .map-frame {

      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      border: 0;

      display: block;
    }


    /* =====================================================
       COVER FOR ORIGINAL WHITE NEPTUN NOTICE
    ===================================================== */

    .neptun-notice-cover {

      position: absolute;

      top: 5px;

      left: 50%;

      transform: translateX(-50%);

      width: 390px;

      height: 145px;

      z-index: 1400;

      background: rgba(5, 7, 11, 0.98);

      border-radius: 30px;

      pointer-events: none;
    }


    /* =====================================================
       OUR DARK NOTICE
    ===================================================== */

    .neptun-notice {

      position: absolute;

      top: 22px;

      left: 50%;

      transform: translateX(-50%);

      width: 235px;

      padding: 9px 15px;

      z-index: 1500;

      border-radius: 22px;

      background:
        rgba(13, 16, 22, 0.94);

      border:
        1px solid rgba(255,255,255,0.12);

      box-shadow:
        0 8px 30px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(255,255,255,0.04);

      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);

      color: #aeb5c0;

      text-align: center;

      font-size: 11px;

      line-height: 1.4;

      pointer-events: none;
    }


    .neptun-notice strong {

      display: block;

      margin-bottom: 2px;

      color: #ffffff;

      font-size: 12px;

      font-weight: 700;

      letter-spacing: 0.4px;
    }


    /* =====================================================
       NEPTUN SOURCE
    ===================================================== */

    .neptun-source {

      position: absolute;

      left: 0;
      right: 0;

      bottom: 0;

      height: 30px;

      z-index: 1600;

      display: flex;

      align-items: center;
      justify-content: center;

      background:
        rgba(5,7,11,0.96);

      border-top:
        1px solid rgba(255,255,255,0.05);

      font-size: 11px;
    }


    .neptun-source a {

      color: #5aa6ff;

      text-decoration: none;
    }


    .neptun-source a:hover {

      text-decoration: underline;
    }


    /* =====================================================
       BOTTOM MENU
    ===================================================== */

    .bottom-menu {

      position: fixed;

      left: 0;
      right: 0;

      bottom: 0;

      height: 64px;

      z-index: 2000;

      background:
        rgba(5,7,11,0.98);

      border-top:
        1px solid rgba(255,255,255,0.08);

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }


    .navigation {

      width: 100%;

      max-width: 500px;

      height: 100%;

      margin: 0 auto;

      display: flex;

      align-items: center;

      justify-content: space-around;
    }


    .nav-item {

      width: 33.333%;

      height: 100%;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      gap: 5px;

      color: #737985;

      text-decoration: none;

      font-size: 11px;

      font-weight: 500;

      transition: 0.2s ease;
    }


    .nav-icon {

      font-size: 20px;

      line-height: 1;
    }


    .nav-item.active {

      color: #ffffff;
    }


    .nav-item.active .nav-icon {

      color: #3d9cff;

      filter:
        drop-shadow(
          0 0 5px rgba(61,156,255,0.8)
        )
        drop-shadow(
          0 0 12px rgba(61,156,255,0.35)
        );
    }


    .nav-item:active {

      transform: scale(0.95);
    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 600px) {

      .top-bar {

        height: 54px;
      }


      .logo {

        font-size: 15px;

        letter-spacing: 2.2px;
      }


      .map-container {

        top: 54px;

        bottom: 90px;
      }


      .bottom-menu {

        height: 62px;
      }


      .neptun-notice-cover {

        top: 5px;

        width: 390px;

        height: 145px;

        border-radius: 28px;
      }


      .neptun-notice {

        top: 22px;

        width: 235px;

        padding: 8px 14px;

        font-size: 11px;
      }


      .neptun-notice strong {

        font-size: 12px;
      }

    }

  </style>
</head>


<body>


  <!-- =====================================================
       TOP BAR
  ===================================================== -->

  <header class="top-bar">

    <div class="logo">

      <span class="online-dot"></span>

      <span>ONLINE RADAR</span>

    </div>

  </header>



  <!-- =====================================================
       MAP
  ===================================================== -->

  <main class="map-container">


    <!-- ORIGINAL NEPTUN MAP -->

    <iframe

      class="map-frame"

      src="https://neptun.in.ua/embed/map?lang=uk"

      title="Карта повітряних тривог України — NEPTUN"

      loading="eager"

      allow="geolocation">

    </iframe>



    <!-- =================================================
         COVER ORIGINAL WHITE NOTICE
    ================================================= -->

    <div class="neptun-notice-cover"></div>



    <!-- =================================================
         OUR DARK NOTICE
    ================================================= -->

    <div class="neptun-notice">

      <strong>NEPTUN</strong>

      Інформаційний агрегатор.
      Не офіційна тривога.

    </div>



    <!-- =================================================
         SOURCE
    ================================================= -->

    <div class="neptun-source">

      <a

        href="https://neptun.in.ua/"

        target="_blank"

        rel="noopener noreferrer">

        Карта повітряних тривог України — NEPTUN

      </a>

    </div>


  </main>



  <!-- =====================================================
       BOTTOM MENU
  ===================================================== -->

  <nav class="bottom-menu">

    <div class="navigation">


      <!-- MAP -->

      <a

        href="#"

        class="nav-item active"

        onclick="return false;">

        <span class="nav-icon">⌁</span>

        <span>Карта</span>

      </a>



      <!-- EVENTS -->

      <a

        href="#"

        class="nav-item"

        onclick="return false;">

        <span class="nav-icon">◷</span>

        <span>Події</span>

      </a>



      <!-- INFO -->

      <a

        href="#"

        class="nav-item"

        onclick="return false;">

        <span class="nav-icon">ⓘ</span>

        <span>Інфо</span>

      </a>


    </div>

  </nav>


</body>
</html>
