<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NEPTUN — Карта повітряних загроз України</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
    }

    .map {
      width: 100%;
      height: calc(100vh - 28px);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    .source {
      height: 28px;
      background: #000;
      text-align: center;
      font: 12px/28px Arial, sans-serif;
    }

    .source a {
      color: #5aa6ff;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="map">
    <iframe
      src="https://neptun.in.ua/embed/map?lang=uk"
      title="Карта повітряних загроз України — NEPTUN"
      loading="eager"
      allow="geolocation">
    </iframe>
  </div>

  <div class="source">
    <a
      href="https://neptun.in.ua/"
      target="_blank"
      rel="noopener">
      Карта повітряних загроз України — NEPTUN
    </a>
  </div>

</body>
</html>
