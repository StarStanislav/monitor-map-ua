<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
/>

<title>ONLINE RADAR — Київщина</title>

<!-- Leaflet -->
<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html,
  body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #050908;
    font-family:
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      Roboto,
      Arial,
      sans-serif;
  }

  body {
    position: fixed;
    inset: 0;
  }

  /* =========================
     MAP
  ========================= */

  #map {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    background: #07100d;
  }

  .leaflet-container {
    background: #07100d;
    font-family: inherit;
  }

  /*
    Darken the normal OSM map.
    Geography remains real, but visual style becomes
    much closer to the dark radar interface.
  */
  .leaflet-tile {
    filter:
      brightness(0.43)
      saturate(0.55)
      contrast(1.15)
      hue-rotate(8deg);
  }

  /* Slight atmospheric dark overlay */
  #map::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 400;
    background:
      radial-gradient(
        ellipse at center,
        rgba(0, 25, 18, 0.00) 30%,
        rgba(0, 8, 6, 0.30) 100%
      );
  }

  /* =========================
     TOP HEADER
  ========================= */

  .top-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;

    height: calc(64px + env(safe-area-inset-top));

    padding:
      calc(12px + env(safe-area-inset-top))
      16px
      10px
      16px;

    display: flex;
    align-items: center;

    background:
      linear-gradient(
        to bottom,
        rgba(3, 10, 8, 0.94),
        rgba(3, 10, 8, 0.68),
        rgba(3, 10, 8, 0)
      );

    pointer-events: none;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 9px;

    color: #eef8f2;

    font-size: 14px;
    font-weight: 700;
    letter-spacing: 2px;

    text-shadow:
      0 1px 5px rgba(0, 0, 0, 0.9);
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;

    background: #35e27f;

    box-shadow:
      0 0 5px rgba(53, 226, 127, 0.8),
      0 0 14px rgba(53, 226, 127, 0.45);

    animation: pulse 1.7s infinite ease-in-out;
  }

  @keyframes pulse {
    0% {
      transform: scale(0.85);
      opacity: 0.55;
    }

    50% {
      transform: scale(1.15);
      opacity: 1;
    }

    100% {
      transform: scale(0.85);
      opacity: 0.55;
    }
  }

  /* =========================
     BOTTOM STATUS
  ========================= */

  .status-panel {
    position: absolute;
    left: 13px;
    bottom: calc(14px + env(safe-area-inset-bottom));

    z-index: 1000;

    padding: 8px 11px;

    border-left: 2px solid rgba(55, 224, 127, 0.8);

    background:
      linear-gradient(
        90deg,
        rgba(3, 11, 8, 0.78),
        rgba(3, 11, 8, 0.35)
      );

    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);

    color: #dce9e2;

    text-shadow: 0 1px 4px #000;

    pointer-events: none;
  }

  .status-title {
    display: flex;
    align-items: center;
    gap: 7px;

    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1.8px;
  }

  .status-title .mini-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #35e27f;
    box-shadow: 0 0 7px #35e27f;
  }

  .clock {
    margin-top: 3px;

    font-family:
      "SFMono-Regular",
      Consolas,
      "Liberation Mono",
      monospace;

    font-size: 10px;
    letter-spacing: 0.7px;

    color: rgba(220, 235, 226, 0.72);
  }

  /* =========================
     LEAFLET UI
  ========================= */

  .leaflet-control-zoom {
    margin-top: 75px !important;
    margin-right: 9px !important;

    border: none !important;
    box-shadow: none !important;
  }

  .leaflet-control-zoom a {
    width: 32px !important;
    height: 32px !important;
    line-height: 30px !important;

    margin-bottom: 4px;

    border: 1px solid rgba(170, 210, 190, 0.16) !important;
    border-radius: 5px !important;

    background: rgba(5, 13, 11, 0.78) !important;
    color: rgba(230, 245, 237, 0.82) !important;

    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
  }

  .leaflet-control-attribution {
    background: rgba(3, 8, 7, 0.65) !important;

    color: rgba(205, 220, 212, 0.62) !important;

    font-size: 8px !important;

    padding: 2px 5px !important;
  }

  .leaflet-control-attribution a {
    color: rgba(215, 230, 220, 0.8) !important;
  }

  /* =========================
     MAP LABELS
  ========================= */

  .city-label {
    background: transparent;
    border: none;
    box-shadow: none;

    color: rgba(235, 244, 239, 0.86);

    font-size: 10px;
    font-weight: 600;

    text-shadow:
      0 1px 2px #000,
      0 0 5px #000;

    white-space: nowrap;
  }

  .city-label.major {
    color: #ffffff;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.2px;
  }

  .city-label::before {
    display: none;
  }

  /* =========================
     REGION BORDER
  ========================= */

  .region-border {
    filter:
      drop-shadow(0 0 3px rgba(125, 245, 177, 0.25));
  }

  /* =========================
     MAP SCALE
  ========================= */

  .leaflet-control-scale-line {
    background: rgba(3, 10, 8, 0.55) !important;

    border:
      1px solid rgba(220, 235, 226, 0.55) !important;

    border-top: none !important;

    color: rgba(230, 240, 235, 0.72) !important;

    font-size: 8px !important;
  }

  /* =========================
     MOBILE
  ========================= */

  @media (max-width: 600px) {

    .brand {
      font-size: 13px;
      letter-spacing: 1.7px;
    }

    .status-panel {
      left: 10px;
      bottom: calc(10px + env(safe-area-inset-bottom));
    }

    .leaflet-control-zoom {
      margin-top: 70px !important;
    }
  }
</style>
</head>

<body>

<!-- MAP -->
<div id="map"></div>

<!-- HEADER -->
<div class="top-bar">
  <div class="brand">
    <span class="status-dot"></span>
    <span>ONLINE RADAR</span>
  </div>
</div>

<!-- STATUS -->
<div class="status-panel">
  <div class="status-title">
    <span class="mini-dot"></span>
    КИЇВСЬКА ОБЛАСТЬ
  </div>

  <div class="clock" id="clock">
    --.--.---- · --:--:--
  </div>
</div>

<!-- Leaflet -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
/* ==========================================================
   ONLINE RADAR — KYIV OBLAST
   Static geographic map / neutral interface
========================================================== */


/* ----------------------------------------------------------
   1. KYIV OBLAST APPROXIMATE VIEW
---------------------------------------------------------- */

const kyivCenter = [50.45, 30.85];


/* ----------------------------------------------------------
   2. CREATE MAP
---------------------------------------------------------- */

const map = L.map("map", {
  center: kyivCenter,

  zoom: 8,

  minZoom: 7,
  maxZoom: 15,

  zoomControl: true,

  attributionControl: true,

  // Touch / mobile
  touchZoom: true,
  dragging: true,

  // Better mobile behaviour
  tap: true,

  // Prevent map from jumping outside Ukraine too far
  maxBounds: [
    [49.15, 28.15],
    [52.15, 33.15]
  ],

  maxBoundsViscosity: 0.65
});


/* ----------------------------------------------------------
   3. OPENSTREETMAP BASEMAP
---------------------------------------------------------- */

L.tileLayer(
  "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19,

    attribution:
      '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors'
  }
).addTo(map);


/* ----------------------------------------------------------
   4. SCALE
---------------------------------------------------------- */

L.control.scale({
  imperial: false,
  position: "bottomright"
}).addTo(map);


/* ----------------------------------------------------------
   5. KYIV CITY
---------------------------------------------------------- */

/*
  Kyiv is administratively separate from Kyiv Oblast.
  We show it with a subtle neutral outline.
*/

const kyivCity = L.circle(
  [50.4501, 30.5234],
  {
    radius: 9500,

    color: "#b9d8c7",

    weight: 1,

    opacity: 0.55,

    fillColor: "#15231d",

    fillOpacity: 0.13,

    interactive: false
  }
).addTo(map);


/* ----------------------------------------------------------
   6. IMPORTANT CITIES
---------------------------------------------------------- */

const cities = [

  // Kyiv
  {
    name: "Київ",
    lat: 50.4501,
    lon: 30.5234,
    major: true
  },

  // Bila Tserkva
  {
    name: "Біла Церква",
    lat: 49.7983,
    lon: 30.1127,
    major: true
  },

  // Uzin
  {
    name: "Узин",
    lat: 49.8262,
    lon: 30.4472
  },

  // Vasylkiv
  {
    name: "Васильків",
    lat: 50.1797,
    lon: 30.3156
  },

  // Fastiv
  {
    name: "Фастів",
    lat: 50.0767,
    lon: 29.9175,
    major: true
  },

  // Obukhiv
  {
    name: "Обухів",
    lat: 50.1069,
    lon: 30.6286,
    major: true
  },

  // Ukrainka
  {
    name: "Українка",
    lat: 50.1439,
    lon: 30.7467
  },

  // Trypillia
  {
    name: "Трипілля",
    lat: 50.1187,
    lon: 30.7825
  },

  // Rzhyshchiv
  {
    name: "Ржищів",
    lat: 49.9686,
    lon: 31.0456
  },

  // Kaharlyk
  {
    name: "Кагарлик",
    lat: 49.8622,
    lon: 30.8281
  },

  // Boryspil
  {
    name: "Бориспіль",
    lat: 50.3527,
    lon: 30.9550,
    major: true
  },

  // Brovary
  {
    name: "Бровари",
    lat: 50.5111,
    lon: 30.7909,
    major: true
  },

  // Vyshhorod
  {
    name: "Вишгород",
    lat: 50.5848,
    lon: 30.4898,
    major: true
  },

  // Dymer
  {
    name: "Димер",
    lat: 50.7864,
    lon: 30.3039
  },

  // Ivankiv
  {
    name: "Іванків",
    lat: 50.9386,
    lon: 29.8947
  },

  // Yahotyn
  {
    name: "Яготин",
    lat: 50.2567,
    lon: 31.7794,
    major: true
  },

  // Berezan
  {
    name: "Березань",
    lat: 50.3142,
    lon: 31.4706
  },

  // Irpin
  {
    name: "Ірпінь",
    lat: 50.5218,
    lon: 30.2506
  },

  // Bucha
  {
    name: "Буча",
    lat: 50.5431,
    lon: 30.2120
  },

  // Chornobyl
  {
    name: "Чорнобиль",
    lat: 51.2763,
    lon: 30.2219
  },

  // Pripyat
  {
    name: "Прип'ять",
    lat: 51.4043,
    lon: 30.0564
  }
];


/* ----------------------------------------------------------
   7. DRAW CITY LABELS
---------------------------------------------------------- */

cities.forEach(city => {

  L.marker(
    [city.lat, city.lon],
    {
      interactive: false,

      icon: L.divIcon({
        className: "",
        html: `
          <div class="city-label ${city.major ? "major" : ""}">
            ${city.name}
          </div>
        `,
        iconSize: null,
        iconAnchor: [-4, 8]
      })
    }
  ).addTo(map);

});


/* ----------------------------------------------------------
   8. IMPORTANT GEOGRAPHIC POINTS
---------------------------------------------------------- */

/*
  Small neutral dots.
  These are NOT operational markers.
*/

const geographicPoints = [

  [50.4501, 30.5234],
  [49.7983, 30.1127],
  [50.3527, 30.9550],
  [50.5111, 30.7909],
  [50.5848, 30.4898],
  [50.1069, 30.6286],
  [50.0767, 29.9175],
  [50.2567, 31.7794],
  [49.9686, 31.0456],
  [49.8622, 30.8281],
  [49.8262, 30.4472]
];

geographicPoints.forEach(point => {

  L.circleMarker(point, {
    radius: 2.2,

    color: "#d9e9df",

    weight: 1,

    opacity: 0.55,

    fillColor: "#d9e9df",

    fillOpacity: 0.55,

    interactive: false
  }).addTo(map);

});


/* ----------------------------------------------------------
   9. CLOCK
---------------------------------------------------------- */

function updateClock() {

  const now = new Date();

  const day =
    String(now.getDate()).padStart(2, "0");

  const month =
    String(now.getMonth() + 1).padStart(2, "0");

  const year =
    now.getFullYear();

  const hours =
    String(now.getHours()).padStart(2, "0");

  const minutes =
    String(now.getMinutes()).padStart(2, "0");

  const seconds =
    String(now.getSeconds()).padStart(2, "0");

  document.getElementById("clock").textContent =
    `${day}.${month}.${year} · ${hours}:${minutes}:${seconds}`;
}

updateClock();

setInterval(updateClock, 1000);


/* ----------------------------------------------------------
   10. MOBILE RESIZE
---------------------------------------------------------- */

window.addEventListener("resize", () => {
  map.invalidateSize();
});


/* ----------------------------------------------------------
   11. TELEGRAM MINI APP
---------------------------------------------------------- */

if (window.Telegram && Telegram.WebApp) {

  Telegram.WebApp.ready();

  Telegram.WebApp.expand();

  /*
    Keep Telegram interface dark.
  */
  try {
    Telegram.WebApp.setHeaderColor("#050908");
    Telegram.WebApp.setBackgroundColor("#050908");
  } catch (e) {
    // Older Telegram versions may not support these methods.
  }
}


/* ----------------------------------------------------------
   12. INITIAL MAP POSITION
---------------------------------------------------------- */

setTimeout(() => {

  map.invalidateSize();

  map.setView(
    [50.45, 30.85],
    8,
    {
      animate: false
    }
  );

}, 300);

</script>

</body>
</html>
