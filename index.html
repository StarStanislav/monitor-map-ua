<script>

/* =========================================================
   TELEGRAM MINI APP
========================================================= */

const tg = window.Telegram?.WebApp;

if (tg) {
    try {
        tg.ready();
        tg.expand();

        tg.setHeaderColor?.("#050708");
        tg.setBackgroundColor?.("#050708");
    } catch (_) {}
}


/* =========================================================
   CLOCK
========================================================= */

const clock = document.getElementById("clock");

function updateClock() {

    const now = new Date();

    const date = new Intl.DateTimeFormat("uk-UA", {
        timeZone: "Europe/Kyiv",
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
    }).format(now);

    const time = new Intl.DateTimeFormat("uk-UA", {
        timeZone: "Europe/Kyiv",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
    }).format(now);

    clock.textContent = `${date} · ${time}`;
}

updateClock();

setInterval(updateClock, 1000);


/* =========================================================
   CONFIG
========================================================= */

const STYLE_URL =
    "https://tiles.openfreemap.org/styles/dark";

const KYIV_OBLAST_URL =
    "https://geo2day.com/europe/ukraine/kiev_oblast.geojson";


/*
 * Максимальна територія, в межах якої дозволяємо
 * користувачу рухати карту.
 *
 * Це не стартовий zoom.
 */

const MAX_BOUNDS = [
    [29.00, 49.00],
    [32.50, 51.65]
];


/* =========================================================
   START MAP
========================================================= */

async function startMap() {

    try {

        /* ---------------------------------------------------
           Завантажуємо стиль OpenFreeMap
        --------------------------------------------------- */

        const response =
            await fetch(STYLE_URL);

        if (!response.ok) {
            throw new Error(
                `Style HTTP ${response.status}`
            );
        }

        const style =
            await response.json();


        customizeStyle(style);


        /* ---------------------------------------------------
           Створюємо карту
        --------------------------------------------------- */

        const map = new maplibregl.Map({

            container: "map",

            style: style,

            /*
             * Початкова позиція лише тимчасова.
             * Після завантаження області буде fitBounds().
             */

            center: [30.7, 50.3],

            zoom: 8,

            minZoom: 7.4,

            maxZoom: 16,

            maxBounds: MAX_BOUNDS,

            attributionControl: true,

            pitchWithRotate: false,

            dragRotate: false,

            touchPitch: false,

            touchZoomRotate: true

        });


        window.KYIV_MAP = map;


        /* ---------------------------------------------------
           MAP LOAD
        --------------------------------------------------- */

        map.once("load", async () => {

            try {

                /*
                 * Завантажуємо контур області
                 */

                const oblast =
                    await loadOblast(map);


                /*
                 * ------------------------------------------------
                 * ВАЖЛИВО:
                 *
                 * Автоматично підганяємо масштаб під всю область.
                 * ------------------------------------------------
                 */

                fitKyivOblast(map, oblast);


                /*
                 * Затемнення всього, що поза областю
                 */

                addOutsideMask(
                    map,
                    oblast
                );


                /*
                 * Дуже легке підсвічування території області
                 */

                addOblastFill(map);


                /*
                 * Райони
                 */

                addDistrictBoundaries(map);


                /*
                 * Міста
                 */

                addCityLabels(map);


                /*
                 * Вода

                 */

                addWaterLabels(map);


                /*
                 * Головний красивий контур області
                 */

                addOblastBorder(map);


                /*
                 * Контур Києва
                 */

                addKyivBoundary(map);


            } catch (error) {

                console.error(
                    "MAP LAYERS:",
                    error
                );

            }


            /* ------------------------------------------------
               Прибираємо loading
            ------------------------------------------------ */

            setTimeout(() => {

                document
                    .getElementById("loading")
                    .classList
                    .add("hidden");

            }, 350);

        });


    } catch (error) {

        console.error(
            "MAP START:",
            error
        );

        document
            .querySelector(".loading-text")
            .textContent =
            "MAP CONNECTION ERROR";
    }
}


/* =========================================================
   STYLE CUSTOMIZATION
========================================================= */

function customizeStyle(style) {

    for (const layer of style.layers || []) {

        const sourceLayer =
            String(
                layer["source-layer"] || ""
            ).toLowerCase();


        /* ---------------------------------------------------
           Background
        --------------------------------------------------- */

        if (layer.type === "background") {

            layer.paint = {

                ...(layer.paint || {}),

                "background-color":
                    "#050708"

            };
        }


        /* ---------------------------------------------------
           WATER
        --------------------------------------------------- */

        if (
            sourceLayer === "water" &&
            layer.type === "fill"
        ) {

            layer.paint = {

                ...(layer.paint || {}),

                "fill-color":
                    "#07191d",

                "fill-opacity":
                    0.98
            };
        }


        /* ---------------------------------------------------
           WATERWAYS
        --------------------------------------------------- */

        if (
            sourceLayer === "waterway" &&
            layer.type === "line"
        ) {

            layer.paint = {

                ...(layer.paint || {}),

                "line-color":
                    "#16464d",

                "line-opacity":
                    0.68
            };
        }


        /* ---------------------------------------------------
           ROADS
        --------------------------------------------------- */

        if (
            sourceLayer === "transportation" &&
            layer.type === "line"
        ) {

            layer.paint = {

                ...(layer.paint || {}),

                "line-opacity":
                    0.48
            };
        }


        /* ---------------------------------------------------
           POI прибираємо
        --------------------------------------------------- */

        if (
            sourceLayer === "poi" ||
            sourceLayer === "housenumber"
        ) {

            layer.layout = {

                ...(layer.layout || {}),

                visibility:
                    "none"
            };
        }


        /* ---------------------------------------------------
           PLACE LABELS
           
           НЕ ВИМИКАЄМО!
        --------------------------------------------------- */

        if (
            sourceLayer === "place" &&
            layer.type === "symbol"
        ) {

            layer.layout = {

                ...(layer.layout || {}),

                "text-field": [

                    "coalesce",

                    ["get", "name:uk"],

                    ["get", "name"]

                ],

                visibility:
                    "visible"

            };
        }


        /* ---------------------------------------------------
           Назви доріг вимикаємо на загальному масштабі
        --------------------------------------------------- */

        if (
            sourceLayer === "transportation_name" &&
            layer.type === "symbol"
        ) {

            layer.layout = {

                ...(layer.layout || {}),

                visibility:
                    "none"
            };
        }
    }
}


/* =========================================================
   LOAD KYIV OBLAST
========================================================= */

async function loadOblast(map) {

    const response =
        await fetch(
            KYIV_OBLAST_URL,
            {
                cache: "no-store"
            }
        );


    if (!response.ok) {

        throw new Error(
            `Kyiv Oblast HTTP ${response.status}`
        );
    }


    const raw =
        await response.json();


    let data;


    if (
        raw.type ===
        "FeatureCollection"
    ) {

        data = raw;

    } else if (
        raw.type ===
        "Feature"
    ) {

        data = raw;

    } else if (
        raw.type === "Polygon" ||
        raw.type === "MultiPolygon"
    ) {

        data = {

            type:
                "Feature",

            properties:
                {},

            geometry:
                raw
        };

    } else {

        throw new Error(
            "Invalid Kyiv Oblast GeoJSON"
        );
    }


    map.addSource(
        "kyiv-oblast",
        {

            type:
                "geojson",

            data:
                data
        }
    );


    return data;
}


/* =========================================================
   FIT MAP TO KYIV OBLAST
========================================================= */

function fitKyivOblast(
    map,
    oblast
) {

    let features = [];


    /*
     * Нормалізуємо GeoJSON
     */

    if (
        oblast.type ===
        "FeatureCollection"
    ) {

        features =
            oblast.features;

    } else {

        features =
            [oblast];

    }


    /*
     * Об'єднуємо всі частини області
     */

    let combined;


    try {

        combined =
            turf.combine(
                turf.featureCollection(
                    features
                )
            );

    } catch (error) {

        console.warn(
            "Turf combine:",
            error
        );

        combined =
            turf.featureCollection(
                features
            );
    }


    /*
     * Bounds
     */

    const bounds =
        new maplibregl.LngLatBounds();


    const geometry =
        combined.features[0].geometry;


    function walk(coords) {

        if (
            typeof coords[0] ===
            "number"
        ) {

            bounds.extend(coords);

            return;
        }


        for (
            const item
            of coords
        ) {

            walk(item);

        }
    }


    walk(
        geometry.coordinates
    );


    /*
     * -------------------------------------------------------
     * ОЦЕЙ БЛОК ВИРІШУЄ ТВОЮ ПРОБЛЕМУ ЗІ СКРІНА.
     *
     * Область автоматично влазить у весь екран.
     * -------------------------------------------------------
     */

    map.fitBounds(
        bounds,
        {

            padding: {

                top:
                    115,

                bottom:
                    105,

                left:
                    25,

                right:
                    25
            },


            /*
             * Не дозволяємо занадто сильно наблизитися
             * при старті.
             */

            maxZoom:
                9.15,


            duration:
                0

        }
    );
}


/* =========================================================
   OUTSIDE MASK
========================================================= */

function addOutsideMask(
    map,
    oblast
) {

    let region;


    if (
        oblast.type ===
        "FeatureCollection"
    ) {

        if (
            oblast.features.length === 1
        ) {

            region =
                oblast.features[0];

        } else {

            try {

                region =
                    turf.combine(
                        oblast
                    ).features[0];

            } catch (_) {

                return;
            }
        }

    } else {

        region =
            oblast;
    }


    /*
     * Велика територія навколо Київщини
     */

    const outer =
        turf.polygon([

            [

                [27.0, 47.0],

                [34.8, 47.0],

                [34.8, 53.2],

                [27.0, 53.2],

                [27.0, 47.0]

            ]

        ]);


    let outside;


    try {

        outside =
            turf.difference(
                turf.featureCollection([
                    outer,
                    region
                ])
            );

    } catch (error) {

        console.warn(
            "Outside mask:",
            error
        );

        return;
    }


    if (!outside) {
        return;
    }


    map.addSource(
        "outside-kyiv-oblast",
        {

            type:
                "geojson",

            data:
                outside
        }
    );


    map.addLayer({

        id:
            "outside-kyiv-oblast",

        type:
            "fill",

        source:
            "outside-kyiv-oblast",

        paint: {

            "fill-color":
                "#020405",

            "fill-opacity":
                0.62
        }

    });
}


/* =========================================================
   OBLAST SOFT FILL
========================================================= */

function addOblastFill(map) {

    map.addLayer({

        id:
            "kyiv-oblast-fill",

        type:
            "fill",

        source:
            "kyiv-oblast",

        paint: {

            /*
             * Дуже легкий зелено-бірюзовий відтінок.
             */

            "fill-color":
                "#12352d",

            "fill-opacity":
                0.12
        }

    });
}


/* =========================================================
   BEAUTIFUL OBLAST BORDER
========================================================= */

function addOblastBorder(map) {

    map.addLayer({

        id:
            "kyiv-oblast-border",

        type:
            "line",

        source:
            "kyiv-oblast",

        paint: {

            /*
             * Головний контур області.
             */

            "line-color":
                "#55e6b1",

            "line-width": [

                "interpolate",

                ["linear"],

                ["zoom"],

                7,
                1.25,

                8,
                1.55,

                9,
                1.9,

                11,
                2.15,

                14,
                2.65,

                16,
                3.0

            ],

            "line-opacity": [

                "interpolate",

                ["linear"],

                ["zoom"],

                7,
                0.70,

                8,
                0.84,

                10,
                0.94,

                14,
                1.0
            ],


            /*
             * Легка м'якість лінії
             */

            "line-blur":
                0.15
        }

    });
}


/* =========================================================
   DISTRICT BOUNDARIES
========================================================= */

function addDistrictBoundaries(map) {

    map.addLayer({

        id:
            "kyiv-district-boundaries",

        type:
            "line",

        source:
            "openmaptiles",

        "source-layer":
            "boundary",

        minzoom:
            7.5,

        filter: [

            "all",

            [
                "==",
                "admin_level",
                6
            ],

            [
                "!=",
                "name",
                "Київ"
            ],

            [
                "!=",
                "name",
                "Kyiv"
            ]

        ],

        paint: {

            /*
             * ІНШИЙ КОЛІР,
             * але значно слабший за зовнішній контур.
             */

            "line-color":
                "#8a9993",

            "line-width": [

                "interpolate",

                ["linear"],

                ["zoom"],

                7.5,
                0.35,

                8.5,
                0.48,

                10,
                0.62,

                12,
                0.82,

                15,
                1.05

            ],

            "line-opacity": [

                "interpolate",

                ["linear"],

                ["zoom"],

                7.5,
                0.25,

                8.5,
                0.34,

                10,
                0.43,

                12,
                0.54,

                15,
                0.65

            ],


            /*
             * Тонкий пунктир.
             */

            "line-dasharray":
                [2, 3]

        }

    });
}


/* =========================================================
   CITY LABELS
========================================================= */

function addCityLabels(map) {

    /*
     * Великі міста
     */

    map.addLayer({

        id:
            "kyiv-main-place-labels",

        type:
            "symbol",

        source:
            "openmaptiles",

        "source-layer":
            "place",

        minzoom:
            7.5,

        filter: [

            "all",

            [
                "==",
                "$type",
                "Point"
            ],

            [
                "in",
                "class",
                "city",
                "town"
            ]

        ],

        layout: {

            "text-field": [

                "coalesce",

                ["get", "name:uk"],

                ["get", "name"]

            ],

            "text-font": [
                "Noto Sans Bold"
            ],

            "text-size": [

                "interpolate",

                ["linear"],

                ["zoom"],

                7.5,
                8.0,

                8.5,
                9.2,

                9.5,
                10.3,

                11,
                11.5,

                14,
                13.5,

                16,
                15

            ],

            "text-padding":
                5,

            "text-max-width":
                9,

            "text-allow-overlap":
                false,

            "text-ignore-placement":
                false

        },

        paint: {

            "text-color":
                "#d9e1e1",

            "text-halo-color":
                "#050708",

            "text-halo-width":
                2.1,

            "text-halo-blur":
                0.15
        }

    });


    /*
     * Малі населені пункти.
     *
     * На старті їх небагато,
     * при збільшенні стає більше.
     */

    map.addLayer({

        id:
            "kyiv-small-place-labels",

        type:
            "symbol",

        source:
            "openmaptiles",

        "source-layer":
            "place",

        minzoom:
            10,

        filter: [

            "all",

            [
                "==",
                "$type",
                "Point"
            ],

            [
                "in",
                "class",
                "village",
                "hamlet"
            ]

        ],

        layout: {

            "text-field": [

                "coalesce",

                ["get", "name:uk"],

                ["get", "name"]

            ],

            "text-font": [
                "Noto Sans Regular"
            ],

            "text-size": [

                "interpolate",

                ["linear"],

                ["zoom"],

                10,
                6.8,

                11.5,
                7.5,

                13,
                8.5,

                15,
                10

            ],

            "text-padding":
                3,

            "text-allow-overlap":
                false

        },

        paint: {

            "text-color":
                "#9ca8a8",

            "text-opacity": [

                "interpolate",

                ["linear"],

                ["zoom"],

                10,
                0.35,

                11.5,
                0.52,

                13,
                0.70,

                15,
                0.88

            ],

            "text-halo-color":
                "#050708",

            "text-halo-width":
                1.4
        }

    });
}


/* =========================================================
   WATER LABELS
========================================================= */

function addWaterLabels(map) {

    map.addLayer({

        id:
            "kyiv-water-labels",

        type:
            "symbol",

        source:
            "openmaptiles",

        "source-layer":
            "water_name",

        minzoom:
            7.8,

        filter: [

            "has",
            "name"

        ],

        layout: {

            "text-field": [

                "coalesce",

                ["get", "name:uk"],

                ["get", "name"]

            ],

            "text-font": [
                "Noto Sans Regular"
            ],

            "text-size": [

                "interpolate",

                ["linear"],

                ["zoom"],

                8,
                7.5,

                10,
                8.5,

                13,
                10,

                15,
                11

            ],

            "text-letter-spacing":
                0.04

        },

        paint: {

            "text-color":
                "#36727a",

            "text-opacity":
                0.65,

            "text-halo-color":
                "#061013",

            "text-halo-width":
                1.1

        }

    });
}


/* =========================================================
   KYIV CITY BORDER
========================================================= */

function addKyivBoundary(map) {

    map.addLayer({

        id:
            "kyiv-city-boundary",

        type:
            "line",

        source:
            "openmaptiles",

        "source-layer":
            "boundary",

        minzoom:
            8,

        filter: [

            "all",

            [
                "==",
                "admin_level",
                6
            ],

            [
                "any",

                [
                    "==",
                    "name",
                    "Київ"
                ],

                [
                    "==",
                    "name",
                    "Kyiv"
                ]

            ]

        ],

        paint: {

            "line-color":
                "#b8c9c4",

            "line-width": [

                "interpolate",

                ["linear"],

                ["zoom"],

                8,
                0.7,

                10,
                0.95,

                13,
                1.35,

                16,
                1.8

            ],

            "line-opacity":
                0.62

        }

    });
}


/* =========================================================
   START
========================================================= */

startMap();

</script>
