<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<title>MONITOR MAP UA</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: #070b0e;
  color: #f4f7f7;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    Inter,
    Arial,
    sans-serif;
}

body {
  position: relative;
}

#map {
  position: absolute;
  inset: 0;
  z-index: 1;
  background: #080c10;
}

.leaflet-container {
  background: #080c10;
  font-family: inherit;
}

.leaflet-control-attribution {
  background: rgba(5, 8, 10, .7) !important;
  color: rgba(255,255,255,.42) !important;
  font-size: 8px;
  backdrop-filter: blur(8px);
}

.leaflet-control-attribution a {
  color: rgba(255,255,255,.58) !important;
}

/* =========================
   HEADER
========================= */

.top-ui {
  position: absolute;
  top: max(12px, env(safe-area-inset-top));
  left: 13px;
  right: 13px;
  z-index: 1000;
  pointer-events: none;
}

.header-card {
  pointer-events: auto;

  height: 82px;
  padding: 10px 12px 10px 11px;

  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;

  border-radius: 24px;

  border: 1px solid rgba(255,255,255,.09);

  background:
    linear-gradient(
      135deg,
      rgba(18,25,30,.94),
      rgba(7,12,16,.91)
    );

  box-shadow:
    0 14px 38px rgba(0,0,0,.38),
    inset 0 1px 0 rgba(255,255,255,.035);

  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
}

/* =========================
   BRAND
========================= */

.brand {
  display: flex;
  align-items: center;
  gap: 13px;
  min-width: 0;
}

.brand-icon {
  position: relative;

  width: 58px;
  height: 58px;

  flex: 0 0 58px;

  border-radius: 18px;

  display: flex;
  align-items: center;
  justify-content: center;

  border: 1px solid rgba(109,221,190,.22);

  background:
    linear-gradient(
      145deg,
      rgba(22,38,40,.95),
      rgba(8,17,20,.92)
    );

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.04);
}

.radar-ring {
  position: absolute;

  border: 1.5px solid rgba(91,220,185,.78);

  border-radius: 50%;
}

.radar-ring.r1 {
  width: 34px;
  height: 34px;
}

.radar-ring.r2 {
  width: 22px;
  height: 22px;

  border-color: rgba(91,220,185,.48);
}

.radar-dot {
  width: 7px;
  height: 7px;

  border-radius: 50%;

  background: #67dfbd;

  box-shadow:
    0 0 12px rgba(103,223,189,.72);
}

.radar-sweep {
  position: absolute;

  width: 17px;
  height: 1px;

  right: 10px;
  top: 18px;

  background:
    linear-gradient(
      90deg,
      transparent,
      #67dfbd
    );

  transform: rotate(-35deg);

  transform-origin: right center;

  opacity: .65;
}

.brand-text {
  min-width: 0;
}

.brand-title {
  font-size: 19px;
  line-height: 22px;

  font-weight: 800;

  letter-spacing: .115em;

  white-space: nowrap;
}

.brand-subtitle {
  margin-top: 5px;

  font-size: 7.5px;
  line-height: 10px;

  font-weight: 650;

  letter-spacing: .19em;

  color: rgba(231,239,239,.39);

  white-space: nowrap;
}

/* =========================
   ONLINE INDICATOR
========================= */

.system-status {
  width: 39px;
  height: 39px;

  flex: 0 0 39px;

  border-radius: 14px;

  display: flex;
  align-items: center;
  justify-content: center;

  border: 1px solid rgba(255,255,255,.085);

  background: rgba(255,255,255,.025);

  box-shadow:
    inset 0 0 0 5px rgba(103,223,189,.025);
}

.status-dot {
  width: 10px;
  height: 10px;

  border-radius: 50%;

  background: #69ddb9;

  box-shadow:
    0 0 13px rgba(105,221,185,.62);
}

/* =========================
   SEARCH
========================= */

.search-wrap {
  position: absolute;

  top: 104px;

  left: 13px;
  right: 13px;

  z-index: 1000;
}

.search-box {
  height: 50px;

  padding: 0 11px 0 15px;

  display: flex;
  align-items: center;

  border-radius: 17px;

  border: 1px solid rgba(255,255,255,.085);

  background: rgba(9,14,18,.89);

  box-shadow:
    0 11px 28px rgba(0,0,0,.31),
    inset 0 1px 0 rgba(255,255,255,.025);

  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}

.search-icon {
  position: relative;

  width: 16px;
  height: 16px;

  margin-right: 11px;

  flex: 0 0 16px;

  border:
    1.6px solid
    rgba(222,232,232,.5);

  border-radius: 50%;
}

.search-icon::after {
  content: "";

  position: absolute;

  width: 7px;
  height: 1.6px;

  right: -5px;
  bottom: -3px;

  background: rgba(222,232,232,.5);

  border-radius: 2px;

  transform: rotate(45deg);
}

#search {
  width: 100%;

  border: 0;
  outline: 0;

  background: transparent;

  color: #f4f7f7;

  font-size: 13.5px;

  font-weight: 500;
}

#search::placeholder {
  color: rgba(226,234,234,.34);
}

.search-clear {
  display: none;

  width: 27px;
  height: 27px;

  border: 0;

  border-radius: 9px;

  background: rgba(255,255,255,.07);

  color: rgba(255,255,255,.58);

  font-size: 17px;
}

/* =========================
   SEARCH RESULTS
========================= */

.search-results {
  display: none;

  margin-top: 7px;

  overflow: hidden;

  border-radius: 14px;

  background: rgba(8,13,17,.96);

  border: 1px solid rgba(255,255,255,.08);

  box-shadow:
    0 16px 35px rgba(0,0,0,.42);

  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}

.search-result {
  padding: 11px 13px;

  border-bottom:
    1px solid
    rgba(255,255,255,.055);

  cursor: pointer;
}

.search-result:last-child {
  border-bottom: 0;
}

.search-result-title {
  font-size: 12.5px;
  font-weight: 650;
}

.search-result-type {
  margin-top: 3px;

  font-size: 8.5px;

  color: rgba(255,255,255,.36);
}

/* =========================
   STATUS CARD
========================= */

.status-card {
  position: absolute;

  left: 13px;
  right: 13px;

  bottom: 88px;

  z-index: 900;

  padding: 12px 13px;

  border-radius: 16px;

  border: 1px solid rgba(255,255,255,.075);

  background: rgba(7,11,15,.87);

  box-shadow:
    0 12px 32px rgba(0,0,0,.38);

  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}

.status-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.status-label {
  display: flex;
  align-items: center;
  gap: 7px;

  font-size: 9px;

  font-weight: 750;

  letter-spacing: .11em;

  color: rgba(255,255,255,.58);
}

.status-light {
  width: 6px;
  height: 6px;

  border-radius: 50%;

  background: #67ddb8;

  box-shadow:
    0 0 10px rgba(103,221,184,.55);
}

.status-time {
  font-size: 8.5px;

  color: rgba(255,255,255,.3);
}

.status-main {
  margin-top: 7px;

  font-size: 12px;

  font-weight: 650;
}

.status-sub {
  margin-top: 3px;

  font-size: 9.5px;

  color: rgba(255,255,255,.34);
}

/* =========================
   MAP CONTROLS
========================= */

.map-controls {
  position: absolute;

  right: 13px;
  bottom: 170px;

  z-index: 900;

  display: flex;

  flex-direction: column;

  gap: 7px;
}

.map-btn {
  width: 40px;
  height: 40px;

  border-radius: 12px;

  border:
    1px solid
    rgba(255,255,255,.08);

  background:
    rgba(8,12,16,.89);

  color:
    rgba(255,255,255,.7);

  box-shadow:
    0 8px 22px rgba(0,0,0,.34);

  backdrop-filter: blur(18px);

  font-size: 19px;

  cursor: pointer;
}

.map-btn:active {
  transform: scale(.94);
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav {
  position: absolute;

  left: 10px;
  right: 10px;

  bottom:
    max(9px, env(safe-area-inset-bottom));

  height: 61px;

  z-index: 1000;

  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  padding: 5px;

  border-radius: 18px;

  background:
    rgba(7,11,15,.93);

  border:
    1px solid
    rgba(255,255,255,.08);

  box-shadow:
    0 15px 40px rgba(0,0,0,.46);

  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
}

.nav-btn {
  border: 0;

  background: transparent;

  color:
    rgba(255,255,255,.34);

  border-radius: 13px;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  gap: 3px;

  cursor: pointer;
}

.nav-btn.active {
  background:
    rgba(255,255,255,.07);

  color: #fff;
}

.nav-icon {
  font-size: 17px;
  line-height: 17px;
}

.nav-label {
  font-size: 7.5px;

  font-weight: 700;

  letter-spacing: .08em;

  text-transform: uppercase;
}

/* =========================
   PANELS
========================= */

.panel {
  position: absolute;

  left: 10px;
  right: 10px;

  bottom: 79px;

  z-index: 1100;

  max-height: 62vh;

  padding: 16px;

  border-radius: 19px;

  background:
    rgba(7,11,15,.96);

  border:
    1px solid
    rgba(255,255,255,.09);

  box-shadow:
    0 20px 55px rgba(0,0,0,.52);

  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);

  transform: translateY(120%);

  opacity: 0;

  pointer-events: none;

  transition:
    transform .28s ease,
    opacity .25s ease;
}

.panel.open {
  transform: translateY(0);

  opacity: 1;

  pointer-events: auto;
}

.panel-head {
  display: flex;

  align-items: center;

  justify-content: space-between;

  margin-bottom: 14px;
}

.panel-title {
  font-size: 13px;

  font-weight: 800;

  letter-spacing: .06em;
}

.panel-close {
  width: 29px;
  height: 29px;

  border: 0;

  border-radius: 9px;

  background:
    rgba(255,255,255,.07);

  color:
    rgba(255,255,255,.55);

  font-size: 17px;

  cursor: pointer;
}

.panel-row {
  display: flex;

  justify-content: space-between;

  padding: 12px 0;

  border-bottom:
    1px solid
    rgba(255,255,255,.055);
}

.panel-row:last-child {
  border-bottom: 0;
}

.panel-row-name {
  font-size: 11.5px;

  color:
    rgba(255,255,255,.68);
}

.panel-row-value {
  font-size: 10px;

  color:
    rgba(255,255,255,.38);
}

/* =========================
   REGION LABELS
========================= */

.region-label {
  background: transparent;

  border: 0;

  box-shadow: none;

  color:
    rgba(255,255,255,.55);

  font-size: 8px;

  font-weight: 700;

  text-shadow:
    0 1px 5px #000,
    0 0 8px #000;

  white-space: nowrap;
}

/* =========================
   OBJECT MARKERS
========================= */

.object-marker {
  width: 27px;
  height: 27px;

  border-radius: 50%;

  display: flex;

  align-items: center;
  justify-content: center;

  background:
    rgba(9,13,17,.93);

  border:
    1px solid
    rgba(255,255,255,.42);

  box-shadow:
    0 0 0 5px rgba(255,255,255,.04),
    0 5px 18px rgba(0,0,0,.4);

  position: relative;
}

.object-marker::before {
  content: "";

  width: 7px;
  height: 7px;

  border-radius: 50%;

  background: #fff;

  box-shadow:
    0 0 10px rgba(255,255,255,.7);
}

.object-label {
  position: absolute;

  left: 32px;
  top: 50%;

  transform:
    translateY(-50%);

  padding: 4px 6px;

  border-radius: 6px;

  background:
    rgba(5,8,11,.82);

  border:
    1px solid
    rgba(255,255,255,.07);

  color:
    rgba(255,255,255,.68);

  font-size: 7.5px;

  font-weight: 700;

  letter-spacing: .06em;

  white-space: nowrap;
}

/* =========================
   POPUPS
========================= */

.leaflet-popup-content-wrapper {
  background:
    rgba(8,12,16,.95);

  color: #fff;

  border:
    1px solid
    rgba(255,255,255,.09);

  border-radius: 13px;

  box-shadow:
    0 15px 40px rgba(0,0,0,.5);

  backdrop-filter: blur(18px);
}

.leaflet-popup-tip {
  background:
    rgba(8,12,16,.95);
}

.leaflet-popup-content {
  margin: 12px 14px;

  font-family: inherit;
}

.popup-title {
  font-size: 12.5px;

  font-weight: 800;

  margin-bottom: 4px;
}

.popup-sub {
  font-size: 9px;

  color:
    rgba(255,255,255,.4);
}

/* =========================
   DESKTOP
========================= */

@media (min-width: 700px) {

  .top-ui,
  .search-wrap {
    left: 22px;
    right: auto;
    width: 430px;
  }

  .status-card {
    left: 22px;
    right: auto;
    width: 430px;
  }

  .map-controls {
    right: 22px;
  }

  .bottom-nav {
    left: 50%;
    right: auto;
    width: 420px;

    transform:
      translateX(-50%);
  }
}
</style>
</head>

<body>

<div id="map"></div>

<!-- HEADER -->

<div class="top-ui">

  <div class="header-card">

    <div class="brand">

      <div class="brand-icon">

        <span class="radar-ring r1"></span>

        <span class="radar-ring r2"></span>

        <span class="radar-sweep"></span>

        <span class="radar-dot"></span>

      </div>

      <div class="brand-text">

        <div class="brand-title">
          MONITOR MAP UA
        </div>

        <div class="brand-subtitle">
          PERSONAL MONITORING SYSTEM
        </div>

      </div>

    </div>

    <div class="system-status">
      <span class="status-dot"></span>
    </div>

  </div>

</div>

<!-- SEARCH -->

<div class="search-wrap">

  <div class="search-box">

    <div class="search-icon"></div>

    <input
      id="search"
      type="text"
      autocomplete="off"
      placeholder="Пошук населеного пункту"
    >

    <button
      id="searchClear"
      class="search-clear"
      type="button"
    >
      ×
    </button>

  </div>

  <div
    id="searchResults"
    class="search-results"
  ></div>

</div>

<!-- STATUS -->

<div class="status-card">

  <div class="status-top">

    <div class="status-label">

      <span class="status-light"></span>

      СТАН СИСТЕМИ

    </div>

    <div
      id="statusTime"
      class="status-time"
    >
      ONLINE
    </div>

  </div>

  <div
    id="statusMain"
    class="status-main"
  >
    Система працює у штатному режимі
  </div>

  <div
    id="statusSub"
    class="status-sub"
  >
    Моніторинг карти активний
  </div>

</div>

<!-- MAP CONTROLS -->

<div class="map-controls">

  <button
    id="locateBtn"
    class="map-btn"
    type="button"
  >
    ⌾
  </button>

  <button
    id="resetBtn"
    class="map-btn"
    type="button"
  >
    ⌂
  </button>

  <button
    id="zoomIn"
    class="map-btn"
    type="button"
  >
    +
  </button>

  <button
    id="zoomOut"
    class="map-btn"
    type="button"
  >
    −
  </button>

</div>

<!-- INFO PANEL -->

<div
  id="infoPanel"
  class="panel"
>

  <div class="panel-head">

    <div class="panel-title">
      MONITOR MAP UA
    </div>

    <button
      class="panel-close"
      data-close="infoPanel"
      type="button"
    >
      ×
    </button>

  </div>

  <div class="panel-row">

    <div class="panel-row-name">
      Статус системи
    </div>

    <div class="panel-row-value">
      ONLINE
    </div>

  </div>

  <div class="panel-row">

    <div class="panel-row-name">
      Карта
    </div>

    <div class="panel-row-value">
      Leaflet / OpenStreetMap
    </div>

  </div>

  <div class="panel-row">

    <div class="panel-row-name">
      Режим
    </div>

    <div class="panel-row-value">
      PERSONAL
    </div>

  </div>

</div>

<!-- SETTINGS PANEL -->

<div
  id="settingsPanel"
  class="panel"
>

  <div class="panel-head">

    <div class="panel-title">
      НАЛАШТУВАННЯ
    </div>

    <button
      class="panel-close"
      data-close="settingsPanel"
      type="button"
    >
      ×
    </button>

  </div>

  <div class="panel-row">

    <div class="panel-row-name">
      Темна карта
    </div>

    <div class="panel-row-value">
      ACTIVE
    </div>

  </div>

  <div class="panel-row">

    <div class="panel-row-name">
      Географічні межі
    </div>

    <div class="panel-row-value">
      ACTIVE
    </div>

  </div>

  <div class="panel-row">

    <div class="panel-row-name">
      Автооновлення
    </div>

    <div class="panel-row-value">
      READY
    </div>

  </div>

</div>

<!-- BOTTOM NAV -->

<div class="bottom-nav">

  <button
    class="nav-btn active"
    data-panel="map"
    type="button"
  >

    <div class="nav-icon">
      ⌖
    </div>

    <div class="nav-label">
      Карта
    </div>

  </button>

  <button
    class="nav-btn"
    data-panel="infoPanel"
    type="button"
  >

    <div class="nav-icon">
      ◉
    </div>

    <div class="nav-label">
      Система
    </div>

  </button>

  <button
    class="nav-btn"
    data-panel="settingsPanel"
    type="button"
  >

    <div class="nav-icon">
      ⚙
    </div>

    <div class="nav-label">
      Налаштування
    </div>

  </button>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================
   TELEGRAM
========================= */

const tg =
  window.Telegram?.WebApp;

if (tg) {

  tg.ready();

  tg.expand();

  try {

    tg.setHeaderColor("#070b0e");

    tg.setBackgroundColor("#070b0e");

  } catch (e) {}

}


/* =========================
   MAP
========================= */

const map =
  L.map("map", {

    zoomControl: false,

    attributionControl: true,

    minZoom: 5,

    maxZoom: 12,

    preferCanvas: true

  });


L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {

    maxZoom: 19,

    attribution:
      "&copy; OpenStreetMap"

  }
).addTo(map);


/* =========================
   UKRAINE
========================= */

const ukraineBounds = [

  [44, 21],

  [53, 41]

];

map.fitBounds(
  ukraineBounds,
  {
    padding: [20,20]
  }
);


/* =========================
   GEOJSON
========================= */

const GEOJSON_URL =
  "https://cdn.jsdelivr.net/gh/darmat1/ukraine-geo-data@main/geodata/Ukraine.geojson";

let regionsLayer = null;


function regionStyle() {

  return {

    color:
      "rgba(255,255,255,.25)",

    weight: 1,

    opacity: .75,

    fillColor:
      "#0d1419",

    fillOpacity: .23

  };

}


function onRegionEachFeature(
  feature,
  layer
) {

  const name =
    feature?.properties?.name ||
    feature?.properties?.NAME_1 ||
    feature?.properties?.NAME ||
    feature?.properties?.name_1 ||
    "Регіон";


  layer.bindTooltip(

    name,

    {

      permanent: true,

      direction: "center",

      className:
        "region-label",

      opacity: .9

    }

  );


  layer.bindPopup(`

    <div class="popup-title">
      ${escapeHtml(name)}
    </div>

    <div class="popup-sub">
      Регіон України
    </div>

  `);


  layer.on({

    mouseover: () => {

      layer.setStyle({

        color:
          "rgba(103,221,185,.62)",

        weight: 1.4,

        fillColor:
          "#16221f",

        fillOpacity: .38

      });

      layer.bringToFront();

    },


    mouseout: () => {

      if (regionsLayer) {

        regionsLayer.resetStyle(layer);

      }

    },


    click: () => {

      layer.setStyle({

        color:
          "rgba(103,221,185,.62)",

        weight: 1.4,

        fillColor:
          "#16221f",

        fillOpacity: .38

      });

    }

  });

}

/* =========================
   DEMO ANIMATION
========================= */

let lastTime =
  performance.now();


function animateObjects(now) {

  const delta =
    now - lastTime;

  lastTime = now;


  if (
    delta >= 0 &&
    delta < 1000
  ) {

    objectMarkers.forEach(
      item => {

        const object =
          item.object;


        object.lat +=
          object.speedLat *
          delta;


        object.lng +=
          object.speedLng *
          delta;


        if (
          object.lat > 52.4 ||
          object.lat < 46
        ) {

          object.speedLat *= -1;

        }


        if (
          object.lng > 38 ||
          object.lng < 23
        ) {

          object.speedLng *= -1;

        }


        item.marker.setLatLng([

          object.lat,

          object.lng

        ]);

      }
    );

  }


  requestAnimationFrame(
    animateObjects
  );

}


requestAnimationFrame(
  animateObjects

/* =========================

const searchInput =
  document.getElementById(
    "search"
  );

const searchResults =
  document.getElementById(
    "searchResults"
  );

const searchClear =
  document.getElementById(
    "searchClear"
  );


let searchTimer = null;


searchInput.addEventListener(
  "input",
  () => {

    const value =
      searchInput.value.trim();


    searchClear.style.display =
      value
        ? "block"
        : "none";


    clearTimeout(
      searchTimer
    );


    if (
      value.length < 2
    ) {

      searchResults.style.display =
        "none";

      searchResults.innerHTML =
        "";

      return;

    }


    searchTimer =
      setTimeout(

        () =>
          searchPlace(value),

        450

      );

  }
);


/* =========================
   NOMINATIM
========================= */

async function searchPlace(
  query
) {

  try {

    const url =
      "https://nominatim.openstreetmap.org/search" +
      "?format=json" +
      "&accept-language=uk" +
      "&countrycodes=ua" +
      "&limit=5" +
      "&q=" +
      encodeURIComponent(query);


    const response =
      await fetch(url);


    if (!response.ok) {

      throw new Error(
        "Search failed"
      );

    }


    const results =
      await response.json();


    renderSearchResults(
      results
    );

  }

  catch (error) {

    searchResults.innerHTML = `

      <div class="search-result">

        <div class="search-result-title">
          Помилка пошуку
        </div>

        <div class="search-result-type">
          Спробуйте ще раз
        </div>

      </div>

    `;

    searchResults.style.display =
      "block";

  }

}


/* =========================
   RESULTS
========================= */

function renderSearchResults(
  results
) {

  if (!results.length) {

    searchResults.innerHTML = `

      <div class="search-result">

        <div class="search-result-title">
          Нічого не знайдено
        </div>

        <div class="search-result-type">
          Спробуйте іншу назву
        </div>

      </div>

    `;

    searchResults.style.display =
      "block";

    return;

  }


  searchResults.innerHTML =
    results.map(
      (place, index) => {

        const title =
          place.display_name
            ?.split(",")[0] ||
          "Населений пункт";


        return `

          <div
            class="search-result"
            data-index="${index}"
          >

            <div class="search-result-title">

              ${escapeHtml(
                title
              )}

            </div>

            <div class="search-result-type">

              ${escapeHtml(
                place.type ||
                "location"
              )}

            </div>

          </div>

        `;

      }
    ).join("");


  searchResults.style.display =
    "block";


  document
    .querySelectorAll(
      ".search-result"
    )
    .forEach(
      (element, index) => {

        element.addEventListener(
          "click",
          () => {

            const place =
              results[index];


            const lat =
              Number(place.lat);

            const lon =
              Number(place.lon);


            map.flyTo(

              [lat,lon],

              10,

              {
                duration: 1.1
              }

            );


            L.popup()

              .setLatLng(
                [lat,lon]
              )

              .setContent(`

                <div class="popup-title">

                  ${escapeHtml(
                    place
                      .display_name
                      ?.split(",")[0] ||
                    "Місце"
                  )}

                </div>

                <div class="popup-sub">

                  ${escapeHtml(
                    place.type ||
                    "location"
                  )}

                </div>

              `)

              .openOn(map);


            searchResults.style.display =
              "none";

          }
        );

      }
    );

}

            L.circleMarker(

              {

                radius: 7,

                color: "#fff",

                fillColor: "#fff",

                fillOpacity: .22

              }

            )

            .addTo(map)

            .bindPopup(
              "Ваше місцезнаходження"
            )

            .openPopup();

          },


          () => {

            alert(
              "Не вдалося отримати місцезнаходження"
            );

          },


          {

            enableHighAccuracy:
              true,

            timeout:
              10000,

            maximumAge:
              30000

          }

        );

    }
  );


/* =========================
   NAVIGATION
========================= */

const navButtons =
  document.querySelectorAll(
    ".nav-btn"
  );

const panels =
  document.querySelectorAll(
    ".panel"
  );


navButtons.forEach(
  button => {

    button.addEventListener(
      "click",
      () => {

        const panelId =
          button.dataset.panel;


        navButtons.forEach(
          btn =>
            btn.classList.remove(
              "active"
            )
        );


        button.classList.add(
          "active"
        );


        panels.forEach(
          panel =>
            panel.classList.remove(
              "open"
            )
        );


        if (
          panelId === "map"
        ) {

          map.invalidateSize();

          return;

        }


        const panel =
          document.getElementById(
            panelId
          );


        if (panel) {

          panel.classList.add(
            "open"
          );

        }

      }
    );

  }
);


/* =========================
   CLOSE PANELS
========================= */

document
  .querySelectorAll(
    "[data-close]"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          const panel =
            document.getElementById(
              button.dataset.close
            );


          if (panel) {

            panel.classList.remove(
              "open"
            );

          }


          navButtons.forEach(
            btn =>
              btn.classList.remove(
                "active"
              )
          );


          document
            .querySelector(
              '.nav-btn[data-panel="map"]'
            )
            ?.classList.add(
              "active"
            );

        }
      );

    }
  );

/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(
  value
) {

  return String(
    value ?? ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

}
