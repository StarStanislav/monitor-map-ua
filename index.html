<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {

    width: 100%;
    height: 100%;

    margin: 0;
    padding: 0;

    overflow: hidden;

    background: #050708;

    font-family:
        -apple-system,
        BlinkMacSystemFont,

        "Segoe UI",
        Roboto,
        Arial,

}

body {
    position: fixed;
    inset: 0;
}


/* =====================================================
   MAP
===================================================== */

#map {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    background: #050708;
}


/* =====================================================
   ONLINE RADAR
===================================================== */

.topbar {

    position: fixed;

    z-index: 1000;

    top:
        max(12px, env(safe-area-inset-top));

    left: 14px;

    display: flex;

    align-items: center;

    gap: 10px;

    padding:
        10px 14px;

    border:

        rgba(255,255,255,0.09);

    border-radius:
        13px;

    background:

    backdrop-filter:

}


.status-dot {

    width: 9px;
    height: 9px;

    flex: 0 0 9px;

    border-radius:
        50%;

    background:

    box-shadow:

        pulse 1.8s infinite;
}


.top-title {

}

    }

    70% {

        box-shadow:
            0 0 0 7px
            rgba(93,255,145,0),

            0 0 12px
            rgba(93,255,145,0.9);
    }

    100% {

        box-shadow:
            0 0 0 0
            rgba(93,255,145,0),

            0 0 10px
            rgba(93,255,145,0.9);
    }
}

   BOTTOM PANEL
===================================================== */

.bottom-panel {

    border-radius:
        12px;

<script>

/* =====================================================
   TELEGRAM
===================================================== */

const tg =
    window.Telegram?.WebApp;


if (tg) {

    try {

        tg.ready();

        tg.expand();

        tg.setHeaderColor(
            "#050708"
        );

        tg.setBackgroundColor(
            "#050708"
        );

    } catch (_) {}

}


/* =====================================================
   CLOCK
===================================================== */

const clock =
    document.getElementById(
        "clock"
    );


function updateClock() {

    const now =
        new Date();


    const date =
        new Intl.DateTimeFormat(
            "uk-UA",
            {

                timeZone:
                    "Europe/Kyiv",

                day:
                    "2-digit",

                month:
                    "2-digit",

                year:
                    "numeric"

            }
        ).format(now);


    const time =
        new Intl.DateTimeFormat(
            "uk-UA",
            {

                timeZone:
                    "Europe/Kyiv",

                hour:
                    "2-digit",

                minute:
                    "2-digit",

                second:
                    "2-digit",

                hour12:
                    false

            }
        ).format(now);


    clock.textContent =
        `${date} · ${time}`;

}


updateClock();

setInterval(
    updateClock,
    1000
);


/* =====================================================
   CONFIG
===================================================== */

const STYLE_URL =
    "https://tiles.openfreemap.org/styles/dark";


/*
 * Максимальні межі руху.
 */

const MAX_BOUNDS = [

    [28.8, 49.0],

    [32.7, 51.8]

];


/*
 * Резервний кадр Київщини.
 *
 * Він використовується одразу.
 * Після завантаження справжнього
 * контуру кадр буде уточнений.
 */

const FALLBACK_BOUNDS = [

    [29.05, 49.18],

    [32.15, 51.55]

];


/* =====================================================
   LOAD STYLE
===================================================== */

async function createMap() {

    let style;


    try {

        /*
         * Завантажуємо стиль самі,
         * щоб прибрати стандартні
         * англійські підписи ДО запуску карти.
         */

        const response =
            await fetch(
                STYLE_URL,
                {
                    cache:
                        "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                `Style HTTP ${response.status}`
            );

        }


        style =
            await response.json();


        /*
         * Прибираємо всі штатні
         * place-label layers.
         */

        prepareStyle(
            style
        );


    } catch (error) {

        /*
         * Якщо style fetch не вдався,
         * використовуємо прямий URL.
         *
         * Карта все одно відкриється.
         */

        console.warn(
            "STYLE FETCH:",
            error
        );

        style =
            STYLE_URL;

    }


    /* =================================================
       CREATE MAP
    ================================================= */

    const map =
        new maplibregl.Map({

            container:
                "map",

            style:
                style,

            center:
                [30.72, 50.30],

            zoom:
                8.2,

            minZoom:
                7.2,

            maxZoom:
                16,

            maxBounds:
                MAX_BOUNDS,

            attributionControl:
                true,

            pitchWithRotate:
                false,

            dragRotate:
                false,

            touchPitch:
                false,

            touchZoomRotate:
                true,

            renderWorldCopies:
                false

        });


    window.KYIV_MAP =
        map;


    /* =================================================
       MAP LOAD
    ================================================= */

    map.once(
        "load",
        async () => {

            console.log(
                "ONLINE RADAR MAP READY"
            );


            /*
             * Якщо fallback style був використаний,
             * додатково ховаємо штатні labels.
             */

            hidePlaceLabels(
                map
            );


            /*
             * Наші українські назви.
             */

            addCityLabels(
                map
            );


            /*
             * Вода.
             */

            addWaterLabels(
                map
            );


            /*
             * Райони.
             */

            addDistrictLines(
                map
            );


            /*
             * Контур.
             *
             * Тут використовуємо стабільний
             * статичний GeoJSON.
             */

            try {

                await loadOblast(
                    map
                );

            } catch (error) {

                console.warn(
                    "OBLAST:",
                    error
                );


                /*
                 * Навіть без контуру
                 * карта залишається.
                 */

                map.fitBounds(
                    FALLBACK_BOUNDS,
                    {

                        padding: {

                            top:
                                145,

                            bottom:
                                125,

                            left:
                                22,

                            right:
                                22

                        },

                        maxZoom:
                            8.65,

                        duration:
                            0

                    }
                );

            }


            /*
             * Loading.
             */

            setTimeout(
                () => {

                    document
                        .getElementById(
                            "loading"
                        )
                        .classList
                        .add("hidden");

                },
                300
            );

        }
    );


    /*
     * MapLibre errors не повинні
     * ламати весь інтерфейс.
     */

    map.on(
        "error",
        event => {

            console.warn(
                "MAP ERROR:",
                event?.error ||
                event
            );

        }
    );

}


/* =====================================================
   PREPARE STYLE
===================================================== */

function prepareStyle(
    style
) {

    if (
        !style ||
        !Array.isArray(
            style.layers
        )
    ) {
        return;
    }


    for (
        const layer
        of style.layers
    ) {

        const sourceLayer =
            String(
                layer[
                    "source-layer"
                ] || ""
            ).toLowerCase();


        const id =
            String(
                layer.id || ""
            ).toLowerCase();


        /*
         * -----------------------------------------------
         * УСІ стандартні place labels ВИМИКАЄМО.
         * -----------------------------------------------
         */

        if (
            layer.type === "symbol" &&
            (
                sourceLayer === "place" ||
                sourceLayer === "settlement" ||
                id.includes("place") ||
                id.includes("settlement")
            )
        ) {

            layer.layout = {

                ...(layer.layout || {}),

                visibility:
                    "none"

            };

        }


        /*
         * -----------------------------------------------
         * Дороги з назвами залишаємо тільки
         * для великого zoom.
         * -----------------------------------------------
         */

        if (
            sourceLayer ===
            "transportation_name"
        ) {

            layer.minzoom =
                Math.max(
                    layer.minzoom || 0,
                    13
                );

        }


        /*
         * -----------------------------------------------
         * POI вимикаємо.
         * -----------------------------------------------
         */

        if (
            sourceLayer === "poi" ||
            sourceLayer === "housenumber"
        ) {

            layer.layout = {

                ...(layer.layout || {}),

                visibility:
                    "none"

            };

        }

    }

}


/* =====================================================
   HIDE PLACE LABELS
===================================================== */

function hidePlaceLabels(
    map
) {

    const layers =
        map.getStyle().layers || [];


    for (
        const layer
        of layers
    ) {

        const sourceLayer =
            String(
                layer[
                    "source-layer"
                ] || ""
            ).toLowerCase();


        const id =
            String(
                layer.id || ""
            ).toLowerCase();


        if (
            layer.type === "symbol" &&
            (
                sourceLayer === "place" ||
                sourceLayer === "settlement" ||
                id.includes("place") ||
                id.includes("settlement")
            )
        ) {

            try {

                map.setLayoutProperty(
                    layer.id,
                    "visibility",
                    "none"
                );

            } catch (_) {}

        }

    }

}


/* =====================================================
   LOAD KYIV OBLAST
===================================================== */

async function loadOblast(
    map
) {

    /*
     * Використовуємо статичний OSM extract.
     *
     * Він значно надійніший для Mini App,
     * ніж Nominatim.
     */

    const url =
        "https://geo2day.com/europe/ukraine/" +
        "kiev_oblast.geojson";


    const response =
        await fetch(
            url,
            {
                cache:
                    "no-store"
            }
        );


    if (!response.ok) {

        throw new Error(
            `GeoJSON HTTP ${response.status}`
        );

    }


    const data =
        await response.json();


    /*
     * Source.
     */

    map.addSource(
        "kyiv-oblast",
        {

            type:
                "geojson",

            data:
                data

        }
    );


    /*
     * Дуже легке підсвічування.
     */

    map.addLayer({

        id:
            "kyiv-oblast-fill",

        type:
            "fill",

        source:
            "kyiv-oblast",

        paint: {

            "fill-color":
                "#0d3b30",

            "fill-opacity":
                0.12

        }

    });


    /*
     * ГОЛОВНИЙ КОНТУР.
     */

    map.addLayer({

        id:
            "kyiv-oblast-border",

        type:
            "line",

        source:
            "kyiv-oblast",

        paint: {

            "line-color":
                "#52e8b0",

            "line-width": [

                "interpolate",

                ["linear"],

                ["zoom"],

                7,
                1.2,

                8,
                1.55,

                9,
                1.9,

                10,
                2.15,

                12,
                2.4,

                14,
                2.7,

                16,
                3.1

            ],

            "line-opacity":
                0.96,

            "line-blur":
                0.12

        }

    });


    /*
     * Підганяємо карту.
     */

    fitOblast(
        map,
        data
    );

}


/* =====================================================
   FIT OBLAST
===================================================== */

function fitOblast(
    map,
    data
) {

    const bounds =
        new maplibregl.LngLatBounds();


    function walk(
        coordinates
    ) {

        if (
            typeof coordinates[0] ===
            "number"
        ) {

            bounds.extend(
                coordinates
            );

            return;

        }


        for (
            const item
            of coordinates
        ) {

            walk(
                item
            );

        }

    }


    function feature(
        item
    ) {

        if (
            !item ||
            !item.geometry
        ) {
            return;
        }


        walk(
            item.geometry.coordinates
        );

    }


    if (
        data.type ===
        "FeatureCollection"
    ) {

        for (
            const item
            of data.features
        ) {

            feature(
                item
            );

        }

    } else if (
        data.type ===
        "Feature"
    ) {

        feature(
            data
        );

    } else if (
        data.coordinates
    ) {

        walk(
            data.coordinates
        );

    }


    if (
        bounds.isEmpty()
    ) {

        return;

    }


    map.fitBounds(
        bounds,
        {

            padding: {

                /*
                 * Враховуємо Telegram header.
                 */

                top:
                    145,

                bottom:
                    125,

                left:
                    22,

                right:
                    22

            },

            /*
             * Стартова область
             * не повинна бути надто близькою.
             */

            maxZoom:
                8.7,

            duration:
                500

        }
    );

}


/* =====================================================
   DISTRICT LINES
===================================================== */

function addDistrictLines(
    map
) {

    map.addLayer({

        id:
            "kyiv-district-lines",

        type:
            "line",

        source:
            "openmaptiles",

        "source-layer":
            "boundary",

        minzoom:
            7.2,

        filter: [

            "all",

            [
                "==",
                "admin_level",
                6
            ],

            [
                "!=",
                "name",
                "Київ"
            ],

            [
                "!=",
                "name",
                "Kyiv"
            ]

        ],

        paint: {

            /*
             * Райони — інший, спокійніший колір.
             */

            "line-color":
                "#8fa59d",

            "line-width": [

                "interpolate",

                ["linear"],

                ["zoom"],

                7.2,
                0.28,

                8,
                0.40,

                9,
                0.52,

                10,
                0.63,

                12,
                0.78,

                14,
                1.0

            ],

            "line-opacity": [

                "interpolate",

                ["linear"],

                ["zoom"],

                7.2,
                0.20,

                8,
                0.27,

                9,
                0.34,

                10,
                0.40,

                12,
                0.50,

                14,
                0.60

            ],

            /*
             * Тонкий пунктир.
             */

            "line-dasharray":
                [2, 3]

        }

    });

}


/* =====================================================
   CITY LABELS
===================================================== */

function addCityLabels(
    map
) {

    /*
     * Великі міста.
     *
     * ТІЛЬКИ УКРАЇНСЬКА НАЗВА.
     */

    map.addLayer({

        id:
            "ukrainian-city-labels",

        type:
            "symbol",

        source:
            "openmaptiles",

        "source-layer":
            "place",

        minzoom:
            7.2,

        filter: [

            "all",

            [
                "==",
                "$type",
                "Point"
            ],

            [
                "in",
                "class",
                "city",
                "town"
            ],

            /*
             * Вимагаємо name:uk,
             * щоб не було fallback на English.
             */

            [
                "has",
                "name:uk"
            ]

        ],

        layout: {

            "text-field": [
                "get",
                "name:uk"
            ],

            "text-font": [
                "Noto Sans Bold"
            ],

            "text-size": [

                "interpolate",

                ["linear"],

                ["zoom"],

                7.2,
                8,

                8,
                8.7,

                8.7,
                9.5,

                9.5,
                10.2,

                11,
                11.5,

                13,
                12.5,

                16,
                15

            ],

            "text-padding":
                5,

            "text-max-width":
                9,

            "text-allow-overlap":
                false,

            "text-ignore-placement":
                false

        },

        paint: {

            "text-color":
                "#e1e8e6",

            "text-halo-color":
                "#050708",

            "text-halo-width":
                2,

            "text-halo-blur":
                0.15

        }

    });


    /*
     * Малі населені пункти.
     *
     * Теж тільки українська.
     */

    map.addLayer({

        id:
            "ukrainian-small-place-labels",

        type:
            "symbol",

        source:
            "openmaptiles",

        "source-layer":
            "place",

        minzoom:
            9.0,

        filter: [

            "all",

            [
                "==",
                "$type",
                "Point"
            ],

            [
                "in",
                "class",
                "village",
                "hamlet"
            ],

            [
                "has",
                "name:uk"
            ]

        ],

        layout: {

            "text-field": [
                "get",
                "name:uk"
            ],

            "text-font": [
                "Noto Sans Regular"
            ],

            "text-size": [

                "interpolate",

                ["linear"],

                ["zoom"],

                9,
                6.4,

                10.5,
                7,

                12,
                7.8,

                14,
                9,

                16,
                10

            ],

            "text-padding":
                3,

            "text-allow-overlap":
                false

        },

        paint: {

            "text-color":
                "#a4afad",

            "text-opacity": [

                "interpolate",

                ["linear"],

                ["zoom"],

                9,
                0.28,

                10.5,
                0.42,

                12,
                0.58,

                14,
                0.75,

                16,
                0.90

            ],

            "text-halo-color":
                "#050708",

            "text-halo-width":
                1.3

        }

    });

}


/* =====================================================
   WATER LABELS
===================================================== */

function addWaterLabels(
    map
) {

    /*
     * Вода залишаємо українською,
     * якщо name:uk існує.
     */

    map.addLayer({

        id:
            "ukrainian-water-labels",

        type:
            "symbol",

        source:
            "openmaptiles",

        "source-layer":
            "water_name",

        minzoom:
            7.5,

        filter: [

            "has",
            "name:uk"

        ],

        layout: {

            "text-field": [
                "get",
                "name:uk"
            ],

            "text-font": [
                "Noto Sans Regular"
            ],

            "text-size": [

                "interpolate",

                ["linear"],

                ["zoom"],

                7.5,
                7,

                9,
                8,

                12,
                9.5,

                15,
                11

            ],

            "text-letter-spacing":
                0.04,

            "text-max-width":
                7

        },

        paint: {

            "text-color":
                "#39747b",

            "text-opacity":
                0.62,

            "text-halo-color":
                "#061013",

            "text-halo-width":
                1.1

        }

    });

}
