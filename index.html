<!DOCTYPE html>
<html lang="uk">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
    initial-scale=1,
    maximum-scale=1,
    user-scalable=no,
    viewport-fit=cover"
>

<title>ONLINE RADAR</title>


<!-- =====================================================
     MAPLIBRE
===================================================== -->

<link
    rel="stylesheet"
    href="https://unpkg.com/maplibre-gl@5.9.0/dist/maplibre-gl.css"
>

<script src="https://unpkg.com/maplibre-gl@5.9.0/dist/maplibre-gl.js"></script>


<!-- =====================================================
     TELEGRAM
===================================================== -->

<script src="https://telegram.org/js/telegram-web-app.js"></script>


<style>

/* =====================================================
   BASIC
===================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #050708;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        Arial,
        sans-serif;
}

body {
    position: fixed;
    inset: 0;
}


/* =====================================================
   MAP
===================================================== */

#map {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    background: #050708;
}


/* =====================================================
   ONLINE RADAR
===================================================== */

.topbar {

    position: fixed;

    z-index: 1000;

    top:
        max(12px, env(safe-area-inset-top));

    left: 14px;

    display: flex;

    align-items: center;

    gap: 10px;

    padding:
        10px 14px;

    border:
        1px solid
        rgba(255,255,255,0.09);

    border-radius:
        13px;

    background:
        rgba(4,8,9,0.82);

    backdrop-filter:
        blur(15px);

    -webkit-backdrop-filter:
        blur(15px);

    pointer-events:
        none;
}


.status-dot {

    width: 9px;
    height: 9px;

    border-radius: 50%;

    background:
        #5dff91;

    box-shadow:
        0 0 10px
        rgba(93,255,145,0.9);

    animation:
        pulse 1.8s infinite;
}


.top-title {

    color: #f0f4f4;

    font-size: 11px;

    font-weight: 750;

    letter-spacing: 0.18em;

    white-space: nowrap;
}


@keyframes pulse {

    0% {
        box-shadow:
            0 0 0 0
            rgba(93,255,145,0.45),
            0 0 10px
            rgba(93,255,145,0.9);
    }

    70% {
        box-shadow:
            0 0 0 7px
            rgba(93,255,145,0),
            0 0 12px
            rgba(93,255,145,0.9);
    }

    100% {
        box-shadow:
            0 0 0 0
            rgba(93,255,145,0),
            0 0 10px
            rgba(93,255,145,0.9);
    }
}


/* =====================================================
   BOTTOM INFO
===================================================== */

.bottom-panel {

    position: fixed;

    z-index: 1000;

    left: 14px;

    bottom:
        max(14px, env(safe-area-inset-bottom));

    padding:
        10px 13px;

    border:
        1px solid
        rgba(255,255,255,0.09);

    border-radius:
        12px;

    background:
        rgba(4,8,9,0.84);

    backdrop-filter:
        blur(15px);

    -webkit-backdrop-filter:
        blur(15px);

    pointer-events:
        none;
}


.region-name {

    color:
        #e9eeee;

    font-size:
        10px;

    font-weight:
        750;

    letter-spacing:
        0.17em;
}


.clock {

    margin-top:
        5px;

    color:
        #7e898e;

    font-family:
        monospace;

    font-size:
        9px;

    letter-spacing:
        0.04em;
}


/* =====================================================
   INFO BUTTON
===================================================== */

.info-button {

    position: fixed;

    z-index: 1000;

    right: 13px;

    bottom:
        max(14px, env(safe-area-inset-bottom));

    width: 42px;
    height: 42px;

    display: flex;

    align-items: center;
    justify-content: center;

    border:
        1px solid
        rgba(255,255,255,0.13);

    border-radius: 50%;

    background:
        rgba(5,8,9,0.84);

    backdrop-filter:
        blur(12px);

    -webkit-backdrop-filter:
        blur(12px);

    color:
        #b4bdc0;

    font-family:
        Georgia,
        serif;

    font-size:
        22px;

    font-weight:
        bold;
}


/* =====================================================
   LOADING
===================================================== */

#loading {

    position: fixed;

    z-index: 5000;

    inset: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        #050708;

    transition:
        opacity .35s ease;
}


#loading.hidden {

    opacity: 0;

    pointer-events:
        none;
}


.loader {

    width: 28px;
    height: 28px;

    border:
        2px solid
        rgba(255,255,255,0.08);

    border-top-color:
        #5dff91;

    border-radius: 50%;

    animation:
        spin .7s linear infinite;
}


.loading-text {

    margin-top: 11px;

    color:
        #758084;

    font-size: 9px;

    font-weight: 650;

    letter-spacing:
        .17em;

    text-align: center;
}


@keyframes spin {

    to {
        transform:
            rotate(360deg);
    }
}


/* =====================================================
   ATTRIBUTION
===================================================== */

.maplibregl-ctrl-bottom-right {

    right: 5px;
    bottom: 5px;
}

.maplibregl-ctrl-attrib {

    background:
        rgba(3,6,7,.68) !important;

    color:
        #667175 !important;

    font-size:
        8px !important;

    border-radius:
        5px;
}

.maplibregl-ctrl-attrib a {

    color:
        #7b878b !important;
}

</style>

</head>


<body>


<!-- =====================================================
     MAP
===================================================== -->

<div id="map"></div>


<!-- =====================================================
     LOADING
===================================================== -->

<div id="loading">

    <div>

        <div class="loader"></div>

        <div class="loading-text">
            LOADING MAP
        </div>

    </div>

</div>


<!-- =====================================================
     ONLINE RADAR
===================================================== -->

<div class="topbar">

    <div class="status-dot"></div>

    <div class="top-title">
        ONLINE RADAR
    </div>

</div>


<!-- =====================================================
     BOTTOM PANEL
===================================================== -->

<div class="bottom-panel">

    <div class="region-name">
        КИЇВСЬКА ОБЛАСТЬ
    </div>

    <div
        id="clock"
        class="clock"
    >
        --.--.---- · --:--:--
    </div>

</div>


<!-- =====================================================
     INFO
===================================================== -->

<div class="info-button">
    i
</div>


<script>

/* =====================================================
   TELEGRAM
===================================================== */

const tg =
    window.Telegram?.WebApp;

if (tg) {

    try {

        tg.ready();

        tg.expand();

        tg.setHeaderColor?.(
            "#050708"
        );

        tg.setBackgroundColor?.(
            "#050708"
        );

    } catch (_) {}

}


/* =====================================================
   CLOCK
===================================================== */

const clock =
    document.getElementById(
        "clock"
    );


function updateClock() {

    const now =
        new Date();


    const date =
        new Intl.DateTimeFormat(
            "uk-UA",
            {
                timeZone:
                    "Europe/Kyiv",

                day:
                    "2-digit",

                month:
                    "2-digit",

                year:
                    "numeric"
            }
        ).format(now);


    const time =
        new Intl.DateTimeFormat(
            "uk-UA",
            {
                timeZone:
                    "Europe/Kyiv",

                hour:
                    "2-digit",

                minute:
                    "2-digit",

                second:
                    "2-digit",

                hour12:
                    false
            }
        ).format(now);


    clock.textContent =
        `${date} · ${time}`;

}


updateClock();

setInterval(
    updateClock,
    1000
);


/* =====================================================
   MAP CONFIG
===================================================== */


/*
 * Стабільний прямий style URL.
 *
 * НІЯКОГО fetch(style).
 */

const MAP_STYLE =
    "https://tiles.openfreemap.org/styles/dark";


/*
 * GeoJSON області.
 *
 * Якщо він не завантажиться,
 * карта все одно працюватиме.
 */

const OBLAST_URL =
    "https://geo2day.com/europe/ukraine/kiev_oblast.geojson";


/*
 * Максимальна область переміщення.
 */

const MAX_BOUNDS = [
    [29.0, 49.0],
    [32.5, 51.7]
];


/* =====================================================
   CREATE MAP
===================================================== */

const map =
    new maplibregl.Map({

        container:
            "map",

        style:
            MAP_STYLE,

        center:
            [30.72, 50.28],

        zoom:
            8.35,

        minZoom:
            7.2,

        maxZoom:
            16,

        maxBounds:
            MAX_BOUNDS,

        attributionControl:
            true,

        pitchWithRotate:
            false,

        dragRotate:
            false,

        touchPitch:
            false,

        touchZoomRotate:
            true,

        renderWorldCopies:
            false

    });


window.KYIV_MAP =
    map;


/* =====================================================
   MAP LOAD
===================================================== */

map.once(
    "load",
    async () => {

        console.log(
            "BASE MAP LOADED"
        );


        /*
         * Карта вже повинна бути видима.
         *
         * Навіть якщо наступні операції
         * впадуть — карта не зникне.
         */

        try {

            await loadKyivOblast();

        } catch (error) {

            console.warn(
                "OBLAST ERROR:",
                error
            );

        }


        /*
         * Райони.
         */

        try {

            addDistrictLines();

        } catch (error) {

            console.warn(
                "DISTRICT ERROR:",
                error
            );

        }


        /*
         * Міста.
         */

        try {

            addCityLabels();

        } catch (error) {

            console.warn(
                "CITY LABEL ERROR:",
                error
            );

        }


        /*
         * Водойми.
         */

        try {

            addWaterLabels();

        } catch (error) {

            console.warn(
                "WATER LABEL ERROR:",
                error
            );

        }


        /*
         * Loading прибираємо незалежно
         * від GeoJSON.
         */

        setTimeout(
            () => {

                document
                    .getElementById(
                        "loading"
                    )
                    .classList
                    .add("hidden");

            },
            400
        );

    }
);


/* =====================================================
   LOAD OBLAST GEOJSON
===================================================== */

async function loadKyivOblast() {

    const response =
        await fetch(
            OBLAST_URL,
            {
                cache:
                    "no-store"
            }
        );


    if (!response.ok) {

        throw new Error(
            "HTTP " +
            response.status
        );

    }


    const data =
        await response.json();


    /*
     * Додаємо source.
     */

    map.addSource(
        "kyiv-oblast",
        {

            type:
                "geojson",

            data:
                data
        }
    );


    /*
     * Легке заповнення області.
     */

    map.addLayer({

        id:
            "kyiv-oblast-fill",

        type:
            "fill",

        source:
            "kyiv-oblast",

        paint: {

            "fill-color":
                "#10352c",

            "fill-opacity":
                0.13
        }

    });


    /*
     * Основний контур.
     */

    map.addLayer({

        id:
            "kyiv-oblast-border",

        type:
            "line",

        source:
            "kyiv-oblast",

        paint: {

            /*
             * Красивий бірюзово-м'ятний контур.
             */

            "line-color":
                "#57e8b3",

            "line-width": [

                "interpolate",

                ["linear"],

                ["zoom"],

                7,
                1.2,

                8,
                1.5,

                9,
                1.9,

                11,
                2.2,

                14,
                2.7,

                16,
                3.0

            ],

            "line-opacity":
                0.93,

            "line-blur":
                0.12
        }

    });


    /*
     * Після отримання області —
     * автоматично масштабуємо карту.
     */

    fitMapToOblast(
        data
    );
}


/* =====================================================
   FIT TO OBLAST
===================================================== */

function fitMapToOblast(
    data
) {

    const bounds =
        new maplibregl.LngLatBounds();


    /*
     * Рекурсивно перебираємо
     * всі координати GeoJSON.
     */

    function walk(
        coordinates
    ) {

        if (
            typeof coordinates[0] ===
            "number"
        ) {

            bounds.extend(
                coordinates
            );

            return;
        }


        for (
            const item
            of coordinates
        ) {

            walk(item);

        }

    }


    function processFeature(
        feature
    ) {

        if (
            !feature ||
            !feature.geometry
        ) {
            return;
        }


        walk(
            feature.geometry.coordinates
        );

    }


    /*
     * FeatureCollection
     */

    if (
        data.type ===
        "FeatureCollection"
    ) {

        for (
            const feature
            of data.features
        ) {

            processFeature(
                feature
            );

        }

    }


    /*
     * Один Feature
     */

    else if (
        data.type ===
        "Feature"
    ) {

        processFeature(
            data
        );

    }


    /*
     * Прямий Polygon/MultiPolygon
     */

    else if (
        data.coordinates
    ) {

        walk(
            data.coordinates
        );

    }


    /*
     * Якщо bounds нормальний —
     * вписуємо область в екран.
     */

    if (
        !bounds.isEmpty()
    ) {

        map.fitBounds(
            bounds,
            {

                /*
                 * Враховуємо верхній
                 * Telegram header
                 */

                padding: {

                    top:
                        105,

                    bottom:
                        105,

                    left:
                        25,

                    right:
                        25
                },

                /*
                 * Не робимо занадто сильний zoom.
                 */

                maxZoom:
                    9.15,

                duration:
                    0

            }
        );

    }

}


/* =====================================================
   DISTRICT LINES
===================================================== */

function addDistrictLines() {

    /*
     * Межі районів.
     *
     * admin_level 6 =
     * районний рівень.
     */

    map.addLayer({

        id:
            "kyiv-district-lines",

        type:
            "line",

        source:
            "openmaptiles",

        "source-layer":
            "boundary",

        minzoom:
            7.3,

        filter: [

            "all",

            [
                "==",
                "admin_level",
                6
            ],

            [
                "!=",
                "name",
                "Київ"
            ],

            [
                "!=",
                "name",
                "Kyiv"
            ]

        ],

        paint: {

            /*
             * Інший колір.
             *
             * Значно слабший за зовнішній контур.
             */

            "line-color":
                "#9aa7a1",

            "line-width": [

                "interpolate",

                ["linear"],

                ["zoom"],

                7.3,
                0.35,

                8.5,
                0.48,

                10,
                0.65,

                12,
                0.85,

                15,
                1.1

            ],

            "line-opacity": [

                "interpolate",

                ["linear"],

                ["zoom"],

                7.3,
                0.20,

                8.5,
                0.30,

                10,
                0.40,

                12,
                0.52,

                15,
                0.64

            ],

            /*
             * Легкий пунктир.
             */

            "line-dasharray":
                [2, 3]

        }

    });

}


/* =====================================================
   CITY LABELS
===================================================== */

function addCityLabels() {

    /*
     * Великі міста.
     *
     * Беремо назви прямо
     * з OpenMapTiles.
     */

    map.addLayer({

        id:
            "kyiv-city-labels",

        type:
            "symbol",

        source:
            "openmaptiles",

        "source-layer":
            "place",

        minzoom:
            7.4,

        filter: [

            "all",

            [
                "==",
                "$type",
                "Point"
            ],

            [
                "in",
                "class",
                "city",
                "town"
            ]

        ],

        layout: {

            "text-field": [

                "coalesce",

                [
                    "get",
                    "name:uk"
                ],

                [
                    "get",
                    "name"
                ]

            ],

            "text-font": [
                "Noto Sans Bold"
            ],

            "text-size": [

                "interpolate",

                ["linear"],

                ["zoom"],

                7.4,
                8,

                8.3,
                9,

                9,
                10,

                10.5,
                11,

                13,
                12.5,

                16,
                15

            ],

            "text-padding":
                5,

            "text-max-width":
                9,

            "text-allow-overlap":
                false,

            "text-ignore-placement":
                false

        },

        paint: {

            "text-color":
                "#e3e9e8",

            "text-halo-color":
                "#050708",

            "text-halo-width":
                2,

            "text-halo-blur":
                0.15

        }

    });


    /*
     * Невеликі населені пункти.
     */

    map.addLayer({

        id:
            "kyiv-small-city-labels",

        type:
            "symbol",

        source:
            "openmaptiles",

        "source-layer":
            "place",

        minzoom:
            9.5,

        filter: [

            "all",

            [
                "==",
                "$type",
                "Point"
            ],

            [
                "in",
                "class",
                "village",
                "hamlet"
            ]

        ],

        layout: {

            "text-field": [

                "coalesce",

                [
                    "get",
                    "name:uk"
                ],

                [
                    "get",
                    "name"
                ]

            ],

            "text-font": [
                "Noto Sans Regular"
            ],

            "text-size": [

                "interpolate",

                ["linear"],

                ["zoom"],

                9.5,
                6.5,

                11,
                7.5,

                13,
                8.5,

                15,
                10

            ],

            "text-padding":
                3,

            "text-allow-overlap":
                false

        },

        paint: {

            "text-color":
                "#a6b0af",

            "text-opacity": [

                "interpolate",

                ["linear"],

                ["zoom"],

                9.5,
                0.25,

                11,
                0.48,

                13,
                0.68,

                15,
                0.88

            ],

            "text-halo-color":
                "#050708",

            "text-halo-width":
                1.4

        }

    });

}


/* =====================================================
   WATER LABELS
===================================================== */

function addWaterLabels() {

    map.addLayer({

        id:
            "kyiv-water-labels",

        type:
            "symbol",

        source:
            "openmaptiles",

        "source-layer":
            "water_name",

        minzoom:
            7.5,

        filter: [

            "has",
            "name"

        ],

        layout: {

            "text-field": [

                "coalesce",

                [
                    "get",
                    "name:uk"
                ],

                [
                    "get",
                    "name"
                ]

            ],

            "text-font": [
                "Noto Sans Regular"
            ],

            "text-size": [

                "interpolate",

                ["linear"],

                ["zoom"],

                7.5,
                7,

                9,
                8,

                12,
                9.5,

                15,
                11

            ],

            "text-letter-spacing":
                0.04,

            "text-max-width":
                7

        },

        paint: {

            "text-color":
                "#39747c",

            "text-opacity":
                0.60,

            "text-halo-color":
                "#061013",

            "text-halo-width":
                1.1

        }

    });

}


/* =====================================================
   ERROR PROTECTION
===================================================== */

window.addEventListener(
    "error",
    function(event) {

        console.warn(
            "PAGE ERROR:",
            event.message
        );

    }
);

</script>

</body>
</html>
