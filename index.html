<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               viewport-fit=cover">

<title>ONLINE RADAR</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #05070b;
}

body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #05070b;
    color: #f4f5f7;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        Arial,
        sans-serif;

    overflow-x: hidden;
}


/* =====================================================
   HEADER
===================================================== */

.top-header {

    position: fixed;

    top: 0;
    left: 0;
    right: 0;

    height: 82px;

    padding-top: env(safe-area-inset-top);

    display: flex;
    align-items: center;
    justify-content: center;

    background: rgba(5,7,11,.97);

    border-bottom: 1px solid #171b21;

    z-index: 100;

    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
}


.logo {

    display: flex;
    align-items: center;

    gap: 14px;

    font-size: 28px;
    font-weight: 700;

    letter-spacing: 4px;

    white-space: nowrap;
}


.online-dot {

    width: 13px;
    height: 13px;

    flex-shrink: 0;

    border-radius: 50%;

    background: #20e875;

    box-shadow:
        0 0 12px rgba(32,232,117,.8);

    animation:
        onlinePulse 1.7s infinite;
}


@keyframes onlinePulse {

    0% {
        opacity: 1;
        transform: scale(1);
    }

    50% {
        opacity: .45;
        transform: scale(.82);
    }

    100% {
        opacity: 1;
        transform: scale(1);
    }

}


/* =====================================================
   MAIN
===================================================== */

.app {

    width: 100%;

    padding-top: 82px;

    padding-bottom:
        calc(104px + env(safe-area-inset-bottom));

    min-height: 100vh;
}


/* =====================================================
   PAGES
===================================================== */

.page {
    display: none;

    width: 100%;
}

.page.active {
    display: block;
}


/* =====================================================
   MAP
===================================================== */

.map-page {
    width: 100%;
}


.map-wrapper {

    position: relative;

    width: 100%;

    height:
        calc(
            100svh
            - 82px
            - 104px
        );

    min-height: 500px;

    overflow: hidden;

    background: #05070b;
}


.map-frame {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    border: 0;

    display: block;
}


/* =====================================================
   EVENTS PAGE
===================================================== */

.events-page {

    padding:

        34px
        28px
        40px;

    min-height: calc(100svh - 82px);
}


.events-head {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 20px;

    margin-bottom: 42px;
}


.events-title {

    font-size: 48px;

    font-weight: 700;

    letter-spacing: -1px;

    line-height: 1;
}


.updated {

    display: flex;

    align-items: center;

    gap: 10px;

    color: #858c98;

    font-size: 18px;

    white-space: nowrap;
}


.updated-dot {

    width: 15px;
    height: 15px;

    border-radius: 50%;

    background: #20e875;

    box-shadow:
        0 0 12px rgba(32,232,117,.7);
}


/* =====================================================
   SECTION TITLE
===================================================== */

.section-title {

    margin:

        0
        0
        22px
        8px;

    color: #7e8693;

    font-size: 20px;

    font-weight: 700;

    letter-spacing: 4px;
}


/* =====================================================
   EVENT CARD
===================================================== */

.event-card {

    position: relative;

    width: 100%;

    margin-bottom: 20px;

    padding:

        27px
        25px
        24px
        37px;

    background:
        linear-gradient(
            145deg,
            #151920,
            #0d1016
        );

    border:

        1px solid
        #282d35;

    border-radius: 29px;

    overflow: hidden;
}


.event-card.active {

    border-left:
        7px solid
        #ff444b;
}


.event-card.ended {

    border-left:
        7px solid
        #26d978;
}


/* =====================================================
   EVENT TOP
===================================================== */

.event-top {

    display: flex;

    align-items: flex-start;

    justify-content: space-between;

    gap: 15px;
}


.event-region {

    min-width: 0;

    font-size: 29px;

    font-weight: 700;

    line-height: 1.12;

    word-break: normal;
}


.event-badge {

    flex-shrink: 0;

    padding:

        10px
        17px;

    border-radius: 30px;

    font-size: 16px;

    font-weight: 800;

    letter-spacing: 2px;

    white-space: nowrap;
}


.event-badge.alert {

    color: #ff696e;

    background: #35171d;
}


.event-badge.end {

    color: #42df91;

    background: #123024;
}


/* =====================================================
   EVENT DATA
===================================================== */

.event-data {

    display: flex;

    align-items: flex-start;

    gap: 42px;

    margin-top: 27px;

    flex-wrap: wrap;
}


.data-item {

    display: flex;

    flex-direction: column;

    gap: 7px;
}


.data-label {

    color: #747c89;

    font-size: 16px;

    letter-spacing: 3px;

    font-weight: 500;
}


.data-value {

    color: #e0e3e8;

    font-size: 24px;

    line-height: 1.1;
}


.event-duration {

    margin-top: 23px;

    color: #7d8591;

    font-size: 19px;
}


/* =====================================================
   EMPTY
===================================================== */

.empty {

    padding:

        45px
        20px;

    text-align: center;

    color: #727a87;

    font-size: 18px;
}


/* =====================================================
   INFO
===================================================== */

.info-page {

    padding:

        38px
        28px
        50px;
}


.info-title {

    font-size: 46px;

    font-weight: 700;

    margin-bottom: 30px;
}


.info-card {

    padding: 27px;

    background: #101319;

    border:
        1px solid
        #282d35;

    border-radius: 26px;

    color: #9fa6b1;

    font-size: 18px;

    line-height: 1.6;
}


.info-card strong {

    color: #f0f2f5;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {


    .top-header {

        height: 78px;
    }


    .app {

        padding-top: 78px;

        padding-bottom:
            calc(
                100px
                + env(safe-area-inset-bottom)
            );
    }


    .logo {

        font-size: 25px;

        letter-spacing: 4px;
    }


    .online-dot {

        width: 13px;
        height: 13px;
    }


    .map-wrapper {

        height:
            calc(
                100svh
                - 78px
                - 100px
            );

        min-height: 470px;
    }


    /* =============================
       EVENTS
    ============================= */

    .events-page {

        padding:
            32px
            28px
            40px;
    }


    .events-head {

        align-items: center;

        margin-bottom: 44px;
    }


    .events-title {

        font-size: 43px;
    }


    .updated {

        font-size: 15px;

        gap: 8px;
    }


    .updated-dot {

        width: 14px;
        height: 14px;
    }


    .section-title {

        font-size: 18px;

        letter-spacing: 4px;

        margin-left: 8px;
    }


    .event-card {

        padding:
            27px
            22px
            24px
            30px;

        border-radius: 28px;
    }


    .event-top {

        gap: 10px;
    }


    .event-region {

        font-size: 28px;
    }


    .event-badge {

        padding:
            9px
            15px;

        font-size: 15px;

        letter-spacing: 2px;
    }


    .event-data {

        gap: 30px;

        margin-top: 28px;
    }


    .data-label {

        font-size: 15px;
    }


    .data-value {

        font-size: 23px;
    }


    .event-duration {

        font-size: 18px;
    }


    /* =============================
       INFO
    ============================= */

    .info-page {

        padding:
            35px
            28px
            50px;
    }


    .info-title {

        font-size: 43px;
    }

}


/* =====================================================
   VERY SMALL PHONES
===================================================== */

@media (max-width: 390px) {


    .logo {

        font-size: 22px;

        letter-spacing: 3px;
    }


    .events-title {

        font-size: 39px;
    }


    .updated {

        font-size: 12px;
    }


    .updated-dot {

        width: 12px;
        height: 12px;
    }


    .event-region {

        font-size: 23px;
    }


    .event-badge {

        font-size: 12px;

        padding:
            8px
            12px;
    }


    .event-data {

        gap: 25px;
    }

}

</style>
</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="top-header">

    <div class="logo">

        <span class="online-dot"></span>

        <span>
            ONLINE RADAR
        </span>

    </div>

</header>



<!-- =====================================================
     APP
===================================================== -->

<main class="app">


<!-- =====================================================
     MAP
===================================================== -->

<section
    id="mapPage"
    class="page active map-page">


    <div class="map-wrapper">


        <iframe
            id="neptunMap"
            class="map-frame"
            src="https://neptun.in.ua/embed/map?lang=uk"
            allowfullscreen>
        </iframe>


    </div>


</section>



<!-- =====================================================
     EVENTS
===================================================== -->

<section
    id="eventsPage"
    class="page events-page">


    <div class="events-head">


        <div class="events-title">
            Події
        </div>


        <div class="updated">

            <span class="updated-dot"></span>

            <span id="updatedText">
                ОНОВЛЕНО --:--
            </span>

        </div>


    </div>



    <div class="section-title">
        АКТИВНІ ТРИВОГИ
    </div>


    <div id="activeEvents"></div>



    <div
        id="historyTitle"
        class="section-title"
        style="
            display:none;
            margin-top:44px;
        ">

        ІСТОРІЯ

    </div>


    <div id="historyEvents"></div>


</section>



<!-- =====================================================
     INFO
===================================================== -->

<section
    id="infoPage"
    class="page info-page">


    <div class="info-title">
        Інфо
    </div>


    <div class="info-card">


        <strong>
            ONLINE RADAR
        </strong>


        <br><br>


        Моніторинг повітряних тривог
        України на основі відкритих
        даних NEPTUN.


        <br><br>


        Дані мають інформаційний характер
        та не є офіційним попередженням.


        <br><br>


        Інформація оновлюється
        автоматично.


    </div>


</section>


</main>



<script>

/* =====================================================
   NAVIGATION
===================================================== */

function showPage(page) {


    const pages = {

        map:
            document.getElementById(
                "mapPage"
            ),

        events:
            document.getElementById(
                "eventsPage"
            ),

        info:
            document.getElementById(
                "infoPage"
            )

    };


    Object.values(pages).forEach(
        element => {

            element.classList.remove(
                "active"
            );

        }
    );


    pages[page].classList.add(
        "active"
    );


    const buttons =
        document.querySelectorAll(
            ".nav-button"
        );


    buttons.forEach(
        button => {

            button.classList.remove(
                "active"
            );

        }
    );


    if (page === "map") {

        buttons[0]
            .classList
            .add("active");

    }


    if (page === "events") {

        buttons[1]
            .classList
            .add("active");

    }


    if (page === "info") {

        buttons[2]
            .classList
            .add("active");

    }

}


/* =====================================================
   API
===================================================== */

const API_URL =
    "https://neptun.in.ua/api/v1/alerts";


const STORAGE_KEY =
    "onlineRadarAlertHistory";


let currentAlerts = {};


let history = [];


try {

    history =
        JSON.parse(
            localStorage.getItem(
                STORAGE_KEY
            )
        ) || [];

} catch (error) {

    history = [];

}


/* =====================================================
   TIME
===================================================== */

function formatTime(date) {


    return new Intl.DateTimeFormat(
        "uk-UA",
        {

            hour: "2-digit",

            minute: "2-digit",

            hour12: false

        }
    ).format(date);

}



function formatDate(date) {


    return new Intl.DateTimeFormat(
        "uk-UA",
        {

            day: "2-digit",

            month: "2-digit",

            year: "numeric"

        }
    ).format(date);

}


/* =====================================================
   DURATION
===================================================== */

function getDuration(
    start,
    end = null
) {


    const startTime =
        new Date(start).getTime();


    const endTime =
        end
            ? new Date(end).getTime()
            : Date.now();


    let minutes =
        Math.max(
            0,
            Math.floor(
                (
                    endTime -
                    startTime
                ) / 60000
            )
        );


    if (minutes < 60) {

        return `${minutes} хв`;

    }


    const hours =
        Math.floor(
            minutes / 60
        );


    const mins =
        minutes % 60;


    if (mins === 0) {

        return `${hours} год`;

    }


    return `${hours} год ${mins} хв`;

}


/* =====================================================
   UPDATE TIME
===================================================== */

function updateClock() {


    const element =
        document.getElementById(
            "updatedText"
        );


    if (!element) return;


    element.textContent =
        "ОНОВЛЕНО " +
        formatTime(
            new Date()
        );

}


/* =====================================================
   NORMALIZE
===================================================== */

function normalizeAlerts(data) {


    const result = {};


    const oblasts =
        Array.isArray(
            data.oblasts
        )
            ? data.oblasts
            : [];


    const raions =
        Array.isArray(
            data.raions
        )
            ? data.raions
            : [];


    oblasts.forEach(
        alert => {


            if (!alert.key) return;


            const id =
                "oblast_" +
                alert.key;


            result[id] = {

                id: id,

                name:
                    alert.name ||
                    alert.oblast ||
                    alert.key,

                since:
                    alert.since

            };

        }
    );


    raions.forEach(
        alert => {


            if (!alert.key) return;


            const id =
                "raion_" +
                alert.key;


            result[id] = {

                id: id,

                name:
                    alert.name ||
                    alert.key,

                since:
                    alert.since

            };

        }
    );


    return result;

}


/* =====================================================
   FETCH ALERTS
===================================================== */

async function updateAlerts() {


    try {


        const response =
            await fetch(
                API_URL +
                "?t=" +
                Date.now(),
                {

                    cache:
                        "no-store"

                }
            );


        if (!response.ok) {

            throw new Error(
                "API error"
            );

        }


        const data =
            await response.json();


        const alerts =
            normalizeAlerts(
                data
            );


        const now =
            new Date()
                .toISOString();


        /*
         * Визначаємо відбої.
         */

        Object.keys(
            currentAlerts
        ).forEach(
            id => {


                if (
                    !alerts[id]
                ) {


                    const old =
                        currentAlerts[id];


                    history.unshift({

                        id: id,

                        name:
                            old.name,

                        start:
                            old.since,

                        end:
                            now

                    });

                }

            }
        );


        /*
         * Максимум 300 подій.
         */

        history =
            history.slice(
                0,
                300
            );


        localStorage.setItem(

            STORAGE_KEY,

            JSON.stringify(
                history
            )

        );


        currentAlerts =
            alerts;


        /*
         * Час успішного оновлення.
         */

        updateClock();


        renderEvents();


    } catch (error) {


        console.error(
            "NEPTUN update error:",
            error
        );


    }

}


/* =====================================================
   ACTIVE EVENTS
===================================================== */

function renderActiveEvents() {


    const container =
        document.getElementById(
            "activeEvents"
        );


    container.innerHTML = "";


    const alerts =
        Object.values(
            currentAlerts
        );


    alerts.sort(
        (a, b) => {

            return (
                new Date(b.since) -
                new Date(a.since)
            );

        }
    );


    if (
        alerts.length === 0
    ) {


        container.innerHTML = `

            <div class="empty">

                Наразі активних
                тривог немає

            </div>

        `;


        return;

    }


    alerts.forEach(
        alert => {


            const start =
                new Date(
                    alert.since
                );


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "event-card active";


            card.innerHTML = `


                <div class="event-top">


                    <div class="event-region">

                        ${
                            escapeHtml(
                                alert.name
                            )
                        }

                    </div>


                    <div
                        class="event-badge alert">

                        ТРИВОГА!

                    </div>


                </div>



                <div class="event-data">


                    <div class="data-item">

                        <div class="data-label">
                            ПОЧАТОК
                        </div>

                        <div class="data-value">

                            ${
                                formatTime(
                                    start
                                )
                            }

                        </div>

                    </div>



                    <div class="data-item">

                        <div class="data-label">
                            СТАТУС
                        </div>

                        <div class="data-value">
                            триває
                        </div>

                    </div>



                    <div class="data-item">

                        <div class="data-label">
                            ДАТА
                        </div>

                        <div class="data-value">

                            ${
                                formatDate(
                                    start
                                )
                            }

                        </div>

                    </div>


                </div>



                <div class="event-duration">

                    Тривалість:
                    ${
                        getDuration(
                            start
                        )
                    }

                </div>


            `;


            container.appendChild(
                card
            );


        }
    );

}


/* =====================================================
   HISTORY
===================================================== */

function renderHistory() {


    const container =
        document.getElementById(
            "historyEvents"
        );


    const title =
        document.getElementById(
            "historyTitle"
        );


    container.innerHTML = "";


    if (
        !history.length
    ) {


        title.style.display =
            "none";


        return;

    }


    title.style.display =
        "block";


    history.forEach(
        event => {


            const start =
                new Date(
                    event.start
                );


            const end =
                new Date(
                    event.end
                );


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "event-card ended";


            card.innerHTML = `


                <div class="event-top">


                    <div class="event-region">

                        ${
                            escapeHtml(
                                event.name
                            )
                        }

                    </div>


                    <div
                        class="event-badge end">

                        ВІДБІЙ

                    </div>


                </div>



                <div class="event-data">


                    <div class="data-item">

                        <div class="data-label">
                            ПОЧАТОК
                        </div>

                        <div class="data-value">

                            ${
                                formatTime(
                                    start
                                )
                            }

                        </div>

                    </div>



                    <div class="data-item">

                        <div class="data-label">
                            ВІДБІЙ
                        </div>

                        <div class="data-value">

                            ${
                                formatTime(
                                    end
                                )
                            }

                        </div>

                    </div>



                    <div class="data-item">

                        <div class="data-label">
                            ДАТА
                        </div>

                        <div class="data-value">

                            ${
                                formatDate(
                                    start
                                )
                            }

                        </div>

                    </div>


                </div>



                <div class="event-duration">

                    Тривалість:
                    ${
                        getDuration(
                            start,
                            end
                        )
                    }

                </div>


            `;


            container.appendChild(
                card
            );


        }
    );

}


/* =====================================================
   RENDER
===================================================== */

function renderEvents() {

    renderActiveEvents();

    renderHistory();

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(value) {


    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =====================================================
   INITIAL
===================================================== */

updateAlerts();


/*
 * Оновлення кожні 10 секунд.
 */

setInterval(
    updateAlerts,
    10000
);


/*
 * При поверненні у вкладку
 * одразу перевіряємо дані.
 */

document.addEventListener(
    "visibilitychange",
    () => {


        if (
            document.visibilityState ===
            "visible"
        ) {


            updateAlerts();


        }

    }
);


/*
 * Оновлюємо тривалість активних
 * подій щохвилини навіть без нового
 * запиту API.
 */

setInterval(
    () => {

        if (
            Object.keys(
                currentAlerts
            ).length
        ) {

            renderActiveEvents();

        }

    },
    60000
);

</script>

</body>
</html>
