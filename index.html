<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>ONLINE RADAR</title>

  <link
    href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css"
    rel="stylesheet"
  />

  <script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #071012;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #map {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #071012;
    }

    /* ==============================
       BOTTOM STATUS
    ============================== */

    .bottom-status {
      position: fixed;
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);

      z-index: 20;

      display: flex;
      align-items: center;
      gap: 7px;

      padding: 7px 11px;

      border-radius: 999px;

      background: rgba(5, 14, 16, 0.78);
      border: 1px solid rgba(90, 170, 175, 0.18);

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      color: rgba(220, 238, 239, 0.88);

      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.4px;

      white-space: nowrap;

      pointer-events: none;
    }

    .status-dot {
      width: 6px;
      height: 6px;

      border-radius: 50%;

      background: #21ff79;

      box-shadow:
        0 0 5px rgba(33, 255, 121, 0.9),
        0 0 11px rgba(33, 255, 121, 0.55);

      animation: pulse 1.8s infinite;

      flex-shrink: 0;
    }

    @keyframes pulse {
      0% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.45;
        transform: scale(0.78);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .status-title {
      color: #d9eeee;
    }

    .status-separator {
      width: 1px;
      height: 10px;

      background: rgba(150, 190, 193, 0.25);
    }

    .status-time {
      color: rgba(187, 211, 213, 0.72);

      font-variant-numeric: tabular-nums;
    }

    /* MapLibre */
    .maplibregl-ctrl-top-right {
      display: none !important;
    }

    .maplibregl-ctrl-attrib {
      display: none !important;
    }

    .maplibregl-ctrl-logo {
      display: none !important;
    }

    .maplibregl-canvas {
      outline: none;
    }
  </style>
</head>

<body>

  <div id="map"></div>

  <div class="bottom-status">

    <span class="status-dot"></span>

    <span class="status-title">
      ONLINE RADAR
    </span>

    <span class="status-separator"></span>

    <span class="status-time" id="statusTime">
      --.--.---- · --:--:--
    </span>

  </div>


  <script>

    /* ============================================================
       MAP SETTINGS
    ============================================================ */

    const MAP_STYLE =
      "https://tiles.openfreemap.org/styles/dark";

    const KYIV_VIEW_BOUNDS = [
      [28.55, 48.82],
      [32.72, 51.78]
    ];

    const MAP_MAX_BOUNDS = [
      [28.25, 48.55],
      [33.15, 52.05]
    ];


    /* ============================================================
       MAP
    ============================================================ */

    const map = new maplibregl.Map({

      container: "map",

      style: MAP_STYLE,

      center: [30.95, 50.75],

      zoom: 5.7,

      minZoom: 5.7,

      maxZoom: 16,

      maxBounds: MAP_MAX_BOUNDS,

      dragRotate: false,

      pitchWithRotate: false,

      touchPitch: false,

      cooperativeGestures: false,

      attributionControl: true

    });


    /* ============================================================
       CLOCK
    ============================================================ */

    function updateClock() {

      const now = new Date();

      const day =
        String(now.getDate()).padStart(2, "0");

      const month =
        String(now.getMonth() + 1).padStart(2, "0");

      const year =
        now.getFullYear();

      const hours =
        String(now.getHours()).padStart(2, "0");

      const minutes =
        String(now.getMinutes()).padStart(2, "0");

      const seconds =
        String(now.getSeconds()).padStart(2, "0");

      document.getElementById("statusTime").textContent =
        `${day}.${month}.${year} · ${hours}:${minutes}:${seconds}`;
    }

    updateClock();

    setInterval(updateClock, 1000);


    /* ============================================================
       MAP LOAD
    ============================================================ */

    map.on("load", () => {

      map.fitBounds(

        KYIV_VIEW_BOUNDS,

        {

          padding: {

            top: 40,

            bottom: 95,

            left: 18,

            right: 18

          },

          maxZoom: 6.15,

          duration: 0

        }

      );

      const initialZoom =
        map.getZoom();

      map.setMinZoom(initialZoom);

      buildCustomMapLayers();

      map.dragRotate.disable();

      map.touchZoomRotate.disableRotation();

    });


    /* ============================================================
       CUSTOM MAP
    ============================================================ */

    function buildCustomMapLayers() {


      /* ==========================================================
         HIDE DEFAULT PLACE LABELS
      ========================================================== */

      const styleLayers =
        map.getStyle().layers || [];

      for (const layer of styleLayers) {

        if (
          layer.type === "symbol" &&
          layer["source-layer"] === "place"
        ) {

          try {

            map.setLayoutProperty(
              layer.id,
              "visibility",
              "none"
            );

          } catch (e) {}

        }

      }


      /* ==========================================================
         EXACT KYIV OBLAST GEOMETRY
         
         OSM relation 71248
         
         IMPORTANT:
         These layers are intentionally added FIRST.
         City labels are added AFTER them, so the neon border
         can NEVER cover the city names.
      ========================================================== */

      const KYIV_OBLAST_GEOJSON =
        "https://nominatim.openstreetmap.org/lookup" +
        "?osm_ids=R71248" +
        "&format=geojson" +
        "&polygon_geojson=1";


      fetch(KYIV_OBLAST_GEOJSON)

        .then(response => {

          if (!response.ok) {

            throw new Error(
              "Kyiv Oblast geometry request failed"
            );

          }

          return response.json();

        })

        .then(data => {


          /* ------------------------------------------------------
             GEOJSON SOURCE
          ------------------------------------------------------ */

          if (!map.getSource("kyiv-oblast-exact")) {

            map.addSource(

              "kyiv-oblast-exact",

              {

                type: "geojson",

                data: data

              }

            );

          }


          /* ------------------------------------------------------
             VERY SUBTLE FILL
          ------------------------------------------------------ */

          if (!map.getLayer("kyiv-oblast-fill")) {

            map.addLayer({

              id: "kyiv-oblast-fill",

              type: "fill",

              source: "kyiv-oblast-exact",

              paint: {

                "fill-color": "#00eaff",

                "fill-opacity": 0.018

              }

            });

          }


          /* ------------------------------------------------------
             OUTER NEON GLOW
          ------------------------------------------------------ */

          if (!map.getLayer("kyiv-oblast-glow")) {

            map.addLayer({

              id: "kyiv-oblast-glow",

              type: "line",

              source: "kyiv-oblast-exact",

              paint: {

                "line-color": "#00eaff",

                "line-opacity": 0.28,

                "line-width": [

                  "interpolate",

                  ["linear"],

                  ["zoom"],

                  5.4,
                  5,

                  7,
                  7,

                  10,
                  10,

                  14,
                  14

                ],

                "line-blur": 5

              }

            });

          }


          /* ------------------------------------------------------
             MAIN NEON BORDER
          ------------------------------------------------------ */

          if (!map.getLayer("kyiv-oblast-border")) {

            map.addLayer({

              id: "kyiv-oblast-border",

              type: "line",

              source: "kyiv-oblast-exact",

              paint: {

                "line-color": "#00eaff",

                "line-opacity": 0.92,

                "line-width": [

                  "interpolate",

                  ["linear"],

                  ["zoom"],

                  5.4,
                  1.5,

                  7,
                  2,

                  10,
                  2.6,

                  14,
                  3.5

                ],

                "line-blur": 0.15

              }

            });

          }


          /* ======================================================
             CITY LABELS
             
             IMPORTANT:
             ADDED AFTER THE NEON BORDER.
             
             Therefore labels render ABOVE the border.
          ====================================================== */

          addLabels();

        })

        .catch(error => {

          console.warn(
            "Kyiv Oblast boundary:",
            error
          );

          /*
             Even if boundary request fails,
             labels still need to appear.
          */

          addLabels();

        });

    }


    /* ============================================================
       LABELS
    ============================================================ */

    function addLabels() {


      /* ==========================================================
         UKRAINIAN SETTLEMENT LABELS
      ========================================================== */

      if (!map.getLayer("settlements-ukrainian")) {

        map.addLayer({

          id: "settlements-ukrainian",

          type: "symbol",

          source: "openmaptiles",

          "source-layer": "place",

          minzoom: 5,

          filter: [

            "in",

            ["get", "class"],

            "city",

            "town",

            "village",

            "hamlet",

            "suburb",

            "neighbourhood",

            "isolated_dwelling"

          ],

          layout: {

            "text-field": [

              "coalesce",

              ["get", "name:uk"],

              ["get", "name"]

            ],

            "text-font": [

              "Noto Sans Regular"

            ],

            "text-size": [

              "interpolate",

              ["linear"],

              ["zoom"],

              5,
              9,

              7,
              10,

              9,
              11,

              12,
              12,

              16,
              14

            ],

            "text-anchor": "center",

            "text-allow-overlap": false,

            "text-ignore-placement": false,

            "symbol-sort-key": [

              "match",

              ["get", "class"],

              "city",
              1,

              "town",
              2,

              "village",
              3,

              "hamlet",
              4,

              "suburb",
              5,

              "neighbourhood",
              6,

              7

            ]

          },

          paint: {

            "text-color": "#d8e4e5",

            "text-halo-color":
              "rgba(4,10,12,0.92)",

            "text-halo-width": 1.25,

            "text-halo-blur": 0.25

          }

        });

      }


      /* ==========================================================
         SMALL SETTLEMENTS
      ========================================================== */

      if (!map.getLayer("small-settlements-ukrainian")) {

        map.addLayer({

          id: "small-settlements-ukrainian",

          type: "symbol",

          source: "openmaptiles",

          "source-layer": "place",

          minzoom: 9,

          filter: [

            "in",

            ["get", "class"],

            "hamlet",

            "isolated_dwelling",

            "neighbourhood"

          ],

          layout: {

            "text-field": [

              "coalesce",

              ["get", "name:uk"],

              ["get", "name"]

            ],

            "text-font": [

              "Noto Sans Regular"

            ],

            "text-size": [

              "interpolate",

              ["linear"],

              ["zoom"],

              9,
              9,

              12,
              10,

              16,
              12

            ],

            "text-anchor": "center"

          },

          paint: {

            "text-color": "#b7c9ca",

            "text-halo-color":
              "rgba(4,10,12,0.9)",

            "text-halo-width": 1,

            "text-halo-blur": 0.2

          }

        });

      }


      /* ==========================================================
         WATER LABELS
      ========================================================== */

      if (!map.getLayer("water-labels-ukrainian")) {

        map.addLayer({

          id: "water-labels-ukrainian",

          type: "symbol",

          source: "openmaptiles",

          "source-layer": "water",

          minzoom: 7,

          layout: {

            "text-field": [

              "coalesce",

              ["get", "name:uk"],

              ["get", "name"]

            ],

            "text-font": [

              "Noto Sans Italic"

            ],

            "text-size": [

              "interpolate",

              ["linear"],

              ["zoom"],

              7,
              9,

              12,
              11,

              16,
              13

            ]

          },

          paint: {

            "text-color": "#63898f",

            "text-halo-color":
              "rgba(4,10,12,0.7)",

            "text-halo-width": 1

          }

        });

      }


      /* ==========================================================
         CURRENT KYIV OBLAST DISTRICT BOUNDARIES
      ========================================================== */

      if (!map.getLayer("kyiv-districts")) {

        map.addLayer({

          id: "kyiv-districts",

          type: "line",

          source: "openmaptiles",

          "source-layer": "boundary",

          minzoom: 5.4,

          filter: [

            "all",

            [

              "==",

              [

                "to-string",

                ["get", "admin_level"]

              ],

              "6"

            ]

          ],

          paint: {

            "line-color": "#52686b",

            "line-opacity": [

              "interpolate",

              ["linear"],

              ["zoom"],

              5.4,
              0.24,

              8,
              0.32,

              12,
              0.42

            ],

            "line-width": [

              "interpolate",

              ["linear"],

              ["zoom"],

              5.4,
              0.65,

              10,
              1.05,

              14,
              1.5

            ],

            "line-dasharray": [

              2,
              2

            ]

          }

        });

      }

    }


    /* ============================================================
       ROTATION OFF
    ============================================================ */

    map.on("load", () => {

      map.dragRotate.disable();

      map.touchZoomRotate.disableRotation();

    });

  </script>

</body>
</html>
