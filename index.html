<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>ONLINE RADAR</title>

  <link
    href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css"
    rel="stylesheet"
  >

  <script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>

  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #071012;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    #map {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      background: #071012;
    }


    /* ============================================================
       BOTTOM STATUS
    ============================================================ */

    .bottom-status {

      position: fixed;

      left: 50%;
      bottom: 12px;

      transform: translateX(-50%);

      z-index: 20;

      display: flex;
      align-items: center;

      gap: 7px;

      padding: 7px 11px;

      border-radius: 999px;

      background:
        rgba(5, 14, 16, 0.78);

      border:
        1px solid
        rgba(90, 170, 175, 0.18);

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      color:
        rgba(220, 238, 239, 0.88);

      font-size: 10px;

      font-weight: 600;

      letter-spacing: 0.4px;

      white-space: nowrap;

      pointer-events: none;
    }


    .status-dot {

      width: 6px;
      height: 6px;

      border-radius: 50%;

      background: #21ff79;

      box-shadow:
        0 0 5px rgba(33, 255, 121, 0.9),
        0 0 11px rgba(33, 255, 121, 0.55);

      animation:
        pulse 1.8s infinite;

      flex-shrink: 0;
    }


    @keyframes pulse {

      0% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.45;
        transform: scale(0.78);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }

    }


    .status-title {
      color: #d9eeee;
    }


    .status-separator {

      width: 1px;
      height: 10px;

      background:
        rgba(150, 190, 193, 0.25);
    }


    .status-time {

      color:
        rgba(187, 211, 213, 0.72);

      font-variant-numeric:
        tabular-nums;
    }


    /* ============================================================
       MAPLIBRE UI
    ============================================================ */

    .maplibregl-ctrl-top-right {
      display: none !important;
    }

    .maplibregl-ctrl-attrib {
      display: none !important;
    }

    .maplibregl-ctrl-logo {
      display: none !important;
    }

    .maplibregl-canvas {
      outline: none;
    }

  </style>
</head>


<body>

  <div id="map"></div>


  <div class="bottom-status">

    <span class="status-dot"></span>

    <span class="status-title">
      ONLINE RADAR
    </span>

    <span class="status-separator"></span>

    <span
      class="status-time"
      id="statusTime"
    >
      --.--.---- · --:--:--
    </span>

  </div>


  <script>

    /* ============================================================
       MAP SETTINGS
    ============================================================ */

    const MAP_STYLE =
      "https://tiles.openfreemap.org/styles/dark";


    const KYIV_VIEW_BOUNDS = [

      [28.55, 48.82],

      [32.72, 51.78]

    ];


    const MAP_MAX_BOUNDS = [

      [28.25, 48.55],

      [33.15, 52.05]

    ];


    /* ============================================================
       MAP
    ============================================================ */

    const map = new maplibregl.Map({

      container: "map",

      style: MAP_STYLE,

      center: [
        30.95,
        50.75
      ],

      zoom: 5.7,

      minZoom: 5.7,

      maxZoom: 16,

      maxBounds: MAP_MAX_BOUNDS,

      dragRotate: false,

      pitchWithRotate: false,

      touchPitch: false,

      cooperativeGestures: false,

      attributionControl: true

    });


    /* ============================================================
       CLOCK
    ============================================================ */

    function updateClock() {

      const now = new Date();


      const day =
        String(
          now.getDate()
        ).padStart(2, "0");


      const month =
        String(
          now.getMonth() + 1
        ).padStart(2, "0");


      const year =
        now.getFullYear();


      const hours =
        String(
          now.getHours()
        ).padStart(2, "0");


      const minutes =
        String(
          now.getMinutes()
        ).padStart(2, "0");


      const seconds =
        String(
          now.getSeconds()
        ).padStart(2, "0");


      document
        .getElementById("statusTime")
        .textContent =
        `${day}.${month}.${year} · ${hours}:${minutes}:${seconds}`;

    }


    updateClock();

    setInterval(
      updateClock,
      1000
    );


    /* ============================================================
       MAP LOAD
    ============================================================ */

    map.on("load", () => {


      map.fitBounds(

        KYIV_VIEW_BOUNDS,

        {

          padding: {

            top: 40,

            bottom: 95,

            left: 18,

            right: 18

          },

          maxZoom: 6.15,

          duration: 0

        }

      );


      const initialZoom =
        map.getZoom();


      map.setMinZoom(
        initialZoom
      );


      map.dragRotate.disable();

      map.touchZoomRotate.disableRotation();


      buildCustomMapLayers();


      /* ==========================================================
         BELARUS BORDER
      ========================================================== */

      addBelarusBorder();

    });


    /* ============================================================
       CUSTOM MAP LAYERS
    ============================================================ */

    function buildCustomMapLayers() {


      /* ==========================================================
         EXISTING CITY LABELS
      ========================================================== */

      const styleLayers =
        map.getStyle().layers || [];


      const symbolLayers = [];


      for (
        const layer of styleLayers
      ) {

        if (
          layer.type === "symbol" &&
          layer["source-layer"] === "place"
        ) {

          symbolLayers.push(
            layer.id
          );


          try {

            map.setLayoutProperty(

              layer.id,

              "visibility",

              "visible"

            );

          } catch (e) {}


          try {

            map.setLayoutProperty(

              layer.id,

              "text-field",

              [

                "coalesce",

                [
                  "get",
                  "name:uk"
                ],

                [
                  "get",
                  "name"
                ]

              ]

            );

          } catch (e) {}

        }

      }


      /* ==========================================================
         KYIV OBLAST DISTRICTS
      ========================================================== */

      if (
        !map.getLayer(
          "kyiv-districts"
        )
      ) {

        map.addLayer({

          id:
            "kyiv-districts",

          type:
            "line",

          source:
            "openmaptiles",

          "source-layer":
            "boundary",

          minzoom:
            5.4,

          filter: [

            "all",

            [

              "==",

              [

                "to-string",

                [
                  "get",
                  "admin_level"
                ]

              ],

              "6"

            ]

          ],

          paint: {

            "line-color":
              "#52686b",

            "line-opacity": [

              "interpolate",

              ["linear"],

              ["zoom"],

              5.4,
              0.24,

              8,
              0.32,

              12,
              0.42

            ],

            "line-width": [

              "interpolate",

              ["linear"],

              ["zoom"],

              5.4,
              0.65,

              10,
              1.05,

              14,
              1.5

            ],

            "line-dasharray":
              [2, 2]

          }

        });

      }


      /* ==========================================================
         WATER LABELS
      ========================================================== */

      if (
        !map.getLayer(
          "water-labels-ukrainian"
        )
      ) {

        map.addLayer({

          id:
            "water-labels-ukrainian",

          type:
            "symbol",

          source:
            "openmaptiles",

          "source-layer":
            "water",

          minzoom:
            7,

          layout: {

            "text-field": [

              "coalesce",

              [
                "get",
                "name:uk"
              ],

              [
                "get",
                "name"
              ]

            ],

            "text-font":
              [
                "Noto Sans Italic"
              ],

            "text-size": [

              "interpolate",

              ["linear"],

              ["zoom"],

              7,
              9,

              12,
              11,

              16,
              13

            ]

          },

          paint: {

            "text-color":
              "#63898f",

            "text-halo-color":
              "rgba(4,10,12,0.7)",

            "text-halo-width":
              1

          }

        });

      }


      /* ==========================================================
         EXACT KYIV OBLAST BORDER
         
         OSM RELATION 71248
      ========================================================== */

      const KYIV_OBLAST_GEOJSON =

        "https://nominatim.openstreetmap.org/lookup" +

        "?osm_ids=R71248" +

        "&format=geojson" +

        "&polygon_geojson=1";


      fetch(
        KYIV_OBLAST_GEOJSON
      )

      .then(
        response => {

          if (
            !response.ok
          ) {

            throw new Error(
              "Kyiv Oblast geometry request failed"
            );

          }

          return response.json();

        }
      )

      .then(
        data => {


          if (
            !map.getSource(
              "kyiv-oblast-exact"
            )
          ) {

            map.addSource(

              "kyiv-oblast-exact",

              {

                type:
                  "geojson",

                data:
                  data

              }

            );

          }


          let firstSymbolId =
            undefined;


          const allLayers =
            map.getStyle().layers || [];


          for (
            const layer of allLayers
          ) {

            if (
              layer.type === "symbol"
            ) {

              firstSymbolId =
                layer.id;

              break;

            }

          }


          /* ------------------------------------------------------
             FILL
          ------------------------------------------------------ */

          if (
            !map.getLayer(
              "kyiv-oblast-fill"
            )
          ) {

            map.addLayer(

              {

                id:
                  "kyiv-oblast-fill",

                type:
                  "fill",

                source:
                  "kyiv-oblast-exact",

                paint: {

                  "fill-color":
                    "#00eaff",

                  "fill-opacity":
                    0.018

                }

              },

              firstSymbolId

            );

          }


          /* ------------------------------------------------------
             GLOW
          ------------------------------------------------------ */

          if (
            !map.getLayer(
              "kyiv-oblast-glow"
            )
          ) {

            map.addLayer(

              {

                id:
                  "kyiv-oblast-glow",

                type:
                  "line",

                source:
                  "kyiv-oblast-exact",

                paint: {

                  "line-color":
                    "#00eaff",

                  "line-opacity":
                    0.28,

                  "line-width": [

                    "interpolate",

                    ["linear"],

                    ["zoom"],

                    5.4,
                    5,

                    7,
                    7,

                    10,
                    10,

                    14,
                    14

                  ],

                  "line-blur":
                    5

                }

              },

              firstSymbolId

            );

          }


          /* ------------------------------------------------------
             MAIN BORDER
          ------------------------------------------------------ */

          if (
            !map.getLayer(
              "kyiv-oblast-border"
            )
          ) {

            map.addLayer(

              {

                id:
                  "kyiv-oblast-border",

                type:
                  "line",

                source:
                  "kyiv-oblast-exact",

                paint: {

                  "line-color":
                    "#00eaff",

                  "line-opacity":
                    0.92,

                  "line-width": [

                    "interpolate",

                    ["linear"],

                    ["zoom"],

                    5.4,
                    1.5,

                    7,
                    2,

                    10,
                    2.6,

                    14,
                    3.5

                  ],

                  "line-blur":
                    0.15

                }

              },

              firstSymbolId

            );

          }


          /* ------------------------------------------------------
             CITY LABELS TO TOP
          ------------------------------------------------------ */

          for (
            const id of symbolLayers
          ) {

            if (
              map.getLayer(id)
            ) {

              try {

                map.moveLayer(
                  id
                );

              } catch (e) {}

            }

          }

        }

      )

      .catch(
        error => {

          console.warn(
            "Kyiv Oblast boundary:",
            error
          );

        }
      );

    }


    /* ============================================================
       BELARUS BORDER
       
       RED BARBED-WIRE STYLE
    ============================================================ */

    async function addBelarusBorder() {


      /*
       * We deliberately use a simple geographic bounding box
       * covering the Ukraine-Belarus border.
       *
       * This avoids relying on country-relation properties that
       * may differ between OSM extracts.
       */

      const OVERPASS_QUERY = `

        [out:json][timeout:30];

        way
          ["boundary"="administrative"]
          ["admin_level"="2"]
          (50.45,27.5,52.55,32.8);

        out geom;

      `;


      try {


        const response =
          await fetch(

            "https://overpass-api.de/api/interpreter",

            {

              method:
                "POST",

              headers: {

                "Content-Type":
                  "application/x-www-form-urlencoded"

              },

              body:
                "data=" +
                encodeURIComponent(
                  OVERPASS_QUERY
                )

            }

          );


        if (
          !response.ok
        ) {

          throw new Error(
            "Overpass request failed"
          );

        }


        const data =
          await response.json();


        const features = [];


        for (
          const element of
          data.elements || []
        ) {


          if (
            !element.geometry ||
            element.geometry.length < 2
          ) {

            continue;

          }


          const coordinates =
            element.geometry.map(

              point => [

                point.lon,
                point.lat

              ]

            );


          features.push({

            type:
              "Feature",

            properties:
              {},

            geometry: {

              type:
                "LineString",

              coordinates:
                coordinates

            }

          });

        }


        if (
          features.length === 0
        ) {

          throw new Error(
            "Belarus border geometry not found"
          );

        }


        const geojson = {

          type:
            "FeatureCollection",

          features:
            features

        };


        /* ========================================================
           SOURCE
           
           lineMetrics:true is important for line-pattern.
        ======================================================== */

        map.addSource(

          "belarus-border",

          {

            type:
              "geojson",

            data:
              geojson,

            lineMetrics:
              true

          }

        );


        /* ========================================================
           RED GLOW
        ======================================================== */

        map.addLayer({

          id:
            "belarus-border-glow",

          type:
            "line",

          source:
            "belarus-border",

          paint: {

            "line-color":
              "#ff304f",

            "line-opacity":
              0.22,

            "line-width": [

              "interpolate",

              ["linear"],

              ["zoom"],

              5.4,
              5,

              7,
              6,

              10,
              8,

              14,
              10

            ],

            "line-blur":
              4

          }

        });


        /* ========================================================
           DARK RED BASE
        ======================================================== */

        map.addLayer({

          id:
            "belarus-border-base",

          type:
            "line",

          source:
            "belarus-border",

          paint: {

            "line-color":
              "#7d182b",

            "line-opacity":
              0.95,

            "line-width": [

              "interpolate",

              ["linear"],

              ["zoom"],

              5.4,
              2,

              7,
              2.3,

              10,
              2.8,

              14,
              3.2

            ]

          }

        });


        /* ========================================================
           CREATE BARBED-WIRE PATTERN
        ======================================================== */

        if (
          !map.hasImage(
            "red-barbed-wire"
          )
        ) {


          const canvas =
            document.createElement(
              "canvas"
            );


          canvas.width =
            48;

          canvas.height =
            20;


          const ctx =
            canvas.getContext(
              "2d"
            );


          ctx.clearRect(
            0,
            0,
            48,
            20
          );


          /* ------------------------------------------------------
             MAIN WIRE
          ------------------------------------------------------ */

          ctx.strokeStyle =
            "#ff304f";

          ctx.lineWidth =
            1.4;

          ctx.beginPath();

          ctx.moveTo(
            0,
            10
          );

          ctx.lineTo(
            48,
            10
          );

          ctx.stroke();


          /* ------------------------------------------------------
             BARBS
          ------------------------------------------------------ */

          ctx.strokeStyle =
            "#ff5268";

          ctx.lineWidth =
            1.2;


          for (
            let x = 7;
            x < 48;
            x += 16
          ) {


            ctx.beginPath();

            ctx.moveTo(
              x - 4,
              4
            );

            ctx.lineTo(
              x + 4,
              16
            );

            ctx.stroke();


            ctx.beginPath();

            ctx.moveTo(
              x - 4,
              16
            );

            ctx.lineTo(
              x + 4,
              4
            );

            ctx.stroke();

          }


          const imageData =
            ctx.getImageData(

              0,
              0,
              48,
              20

            );


          map.addImage(

            "red-barbed-wire",

            {

              width:
                48,

              height:
                20,

              data:
                imageData.data

            }

          );

        }


        /* ========================================================
           BARBED WIRE
        ======================================================== */

        map.addLayer({

          id:
            "belarus-border-wire",

          type:
            "line",

          source:
            "belarus-border",

          paint: {

            "line-pattern":
              "red-barbed-wire",

            "line-opacity":
              0.9

          }

        });


        /* ========================================================
           KEEP ALL SYMBOL LABELS ABOVE
        ======================================================== */

        const layers =
          map.getStyle().layers || [];


        for (
          const layer of layers
        ) {

          if (
            layer.type === "symbol"
          ) {

            try {

              map.moveLayer(
                layer.id
              );

            } catch (e) {}

          }

        }


      } catch (error) {

        console.warn(
          "Belarus border:",
          error
        );

      }

    }


    /* ============================================================
       ROTATION OFF
    ============================================================ */

    map.on("load", () => {

      map.dragRotate.disable();

      map.touchZoomRotate.disableRotation();

    });

  </script>

</body>
</html>
