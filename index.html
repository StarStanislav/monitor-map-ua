<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>ONLINE RADAR</title>

  <link
    href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css"
    rel="stylesheet"
  >

  <script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>

  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #071012;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    #map {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      background: #071012;
    }


    /* ============================================================
       BOTTOM STATUS
    ============================================================ */

    .bottom-status {

      position: fixed;

      left: 50%;
      bottom: 12px;

      transform: translateX(-50%);

      z-index: 20;

      display: flex;
      align-items: center;

      gap: 7px;

      padding: 7px 11px;

      border-radius: 999px;

      background:
        rgba(5, 14, 16, 0.78);

      border:
        1px solid
        rgba(90, 170, 175, 0.18);

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      color:
        rgba(220, 238, 239, 0.88);

      font-size: 10px;

      font-weight: 600;

      letter-spacing: 0.4px;

      white-space: nowrap;

      pointer-events: none;
    }


    .status-dot {

      width: 6px;
      height: 6px;

      border-radius: 50%;

      background: #21ff79;

      box-shadow:
        0 0 5px rgba(33, 255, 121, 0.9),
        0 0 11px rgba(33, 255, 121, 0.55);

      animation:
        pulse 1.8s infinite;

      flex-shrink: 0;
    }


    @keyframes pulse {

      0% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.45;
        transform: scale(0.78);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }

    }


    .status-title {
      color: #d9eeee;
    }


    .status-separator {

      width: 1px;
      height: 10px;

      background:
        rgba(150, 190, 193, 0.25);
    }


    .status-time {

      color:
        rgba(187, 211, 213, 0.72);

      font-variant-numeric:
        tabular-nums;
    }


    /* ============================================================
       MAPLIBRE UI
    ============================================================ */

    .maplibregl-ctrl-top-right {
      display: none !important;
    }

    .maplibregl-ctrl-attrib {
      display: none !important;
    }

    .maplibregl-ctrl-logo {
      display: none !important;
    }

    .maplibregl-canvas {
      outline: none;
    }

  </style>
</head>


<body>

  <div id="map"></div>


  <div class="bottom-status">

    <span class="status-dot"></span>

    <span class="status-title">
      ONLINE RADAR
    </span>

    <span class="status-separator"></span>

    <span
      class="status-time"
      id="statusTime"
    >
      --.--.---- · --:--:--
    </span>

  </div>


  <script>

    /* ============================================================
       MAP SETTINGS
    ============================================================ */

    const MAP_STYLE =
      "https://tiles.openfreemap.org/styles/dark";


    const KYIV_VIEW_BOUNDS = [

      [28.55, 48.82],

      [32.72, 51.78]

    ];


    const MAP_MAX_BOUNDS = [

      [28.25, 48.55],

      [33.15, 52.05]

    ];


    /* ============================================================
       MAP
    ============================================================ */

    const map = new maplibregl.Map({

      container: "map",

      style: MAP_STYLE,

      center: [
        30.95,
        50.75
      ],

      zoom: 5.7,

      minZoom: 5.7,

      maxZoom: 16,

      maxBounds: MAP_MAX_BOUNDS,

      dragRotate: false,

      pitchWithRotate: false,

      touchPitch: false,

      cooperativeGestures: false,

      attributionControl: true

    });


    /* ============================================================
       CLOCK
    ============================================================ */

    function updateClock() {

      const now = new Date();


      const day =
        String(
          now.getDate()
        ).padStart(2, "0");


      const month =
        String(
          now.getMonth() + 1
        ).padStart(2, "0");


      const year =
        now.getFullYear();


      const hours =
        String(
          now.getHours()
        ).padStart(2, "0");


      const minutes =
        String(
          now.getMinutes()
        ).padStart(2, "0");


      const seconds =
        String(
          now.getSeconds()
        ).padStart(2, "0");


      document
        .getElementById("statusTime")
        .textContent =
        `${day}.${month}.${year} · ${hours}:${minutes}:${seconds}`;

    }


    updateClock();

    setInterval(
      updateClock,
      1000
    );


    /* ============================================================
       MAP LOAD
    ============================================================ */

    map.on("load", () => {


      map.fitBounds(

        KYIV_VIEW_BOUNDS,

        {

          padding: {

            top: 40,

            bottom: 95,

            left: 18,

            right: 18

          },

          maxZoom: 6.15,

          duration: 0

        }

      );


      const initialZoom =
        map.getZoom();


      map.setMinZoom(
        initialZoom
      );


      map.dragRotate.disable();

      map.touchZoomRotate.disableRotation();


      buildCustomMapLayers();


      /* ==========================================================
         BELARUS BORDER
      ========================================================== */

      addBelarusBorder();

    });


    /* ============================================================
       CUSTOM MAP LAYERS
    ============================================================ */

    function buildCustomMapLayers() {


      /* ==========================================================
         EXISTING CITY LABELS
         
         DO NOT REBUILD THEM.
      ========================================================== */

      const styleLayers =
        map.getStyle().layers || [];


      const symbolLayers = [];


      for (
        const layer of styleLayers
      ) {

        if (
          layer.type === "symbol" &&
          layer["source-layer"] === "place"
        ) {

          symbolLayers.push(
            layer.id
          );


          try {

            map.setLayoutProperty(

              layer.id,

              "visibility",

              "visible"

            );

          } catch (e) {}


          try {

            map.setLayoutProperty(

              layer.id,

              "text-field",

              [

                "coalesce",

                [
                  "get",
                  "name:uk"
                ],

                [
                  "get",
                  "name"
                ]

              ]

            );

          } catch (e) {}

        }

      }


      /* ==========================================================
         KYIV OBLAST DISTRICTS
      ========================================================== */

      if (
        !map.getLayer(
          "kyiv-districts"
        )
      ) {

        map.addLayer({

          id:
            "kyiv-districts",

          type:
            "line",

          source:
            "openmaptiles",

          "source-layer":
            "boundary",

          minzoom:
            5.4,

          filter: [

            "all",

            [

              "==",

              [

                "to-string",

                [
                  "get",
                  "admin_level"
                ]

              ],

              "6"

            ]

          ],

          paint: {

            "line-color":
              "#52686b",

            "line-opacity": [

              "interpolate",

              ["linear"],

              ["zoom"],

              5.4,
              0.24,

              8,
              0.32,

              12,
              0.42

            ],

            "line-width": [

              "interpolate",

              ["linear"],

              ["zoom"],

              5.4,
              0.65,

              10,
              1.05,

              14,
              1.5

            ],

            "line-dasharray":
              [2, 2]

          }

        });

      }


      /* ==========================================================
         WATER LABELS
      ========================================================== */

      if (
        !map.getLayer(
          "water-labels-ukrainian"
        )
      ) {

        map.addLayer({

          id:
            "water-labels-ukrainian",

          type:
            "symbol",

          source:
            "openmaptiles",

          "source-layer":
            "water",

          minzoom:
            7,

          layout: {

            "text-field": [

              "coalesce",

              [
                "get",
                "name:uk"
              ],

              [
                "get",
                "name"
              ]

            ],

            "text-font":
              [
                "Noto Sans Italic"
              ],

            "text-size": [

              "interpolate",

              ["linear"],

              ["zoom"],

              7,
              9,

              12,
              11,

              16,
              13

            ]

          },

          paint: {

            "text-color":
              "#63898f",

            "text-halo-color":
              "rgba(4,10,12,0.7)",

            "text-halo-width":
              1

          }

        });

      }


      /* ==========================================================
         EXACT KYIV OBLAST BORDER
      ========================================================== */

      const KYIV_OBLAST_GEOJSON =

        "https://nominatim.openstreetmap.org/lookup" +

        "?osm_ids=R71248" +

        "&format=geojson" +

        "&polygon_geojson=1";


      fetch(
        KYIV_OBLAST_GEOJSON
      )

      .then(
        response => {

          if (
            !response.ok
          ) {

            throw new Error(
              "Kyiv Oblast geometry request failed"
            );

          }

          return response.json();

        }
      )

      .then(
        data => {


          if (
            !map.getSource(
              "kyiv-oblast-exact"
            )
          ) {

            map.addSource(

              "kyiv-oblast-exact",

              {

                type:
                  "geojson",

                data:
                  data

              }

            );

          }


          /* ------------------------------------------------------
             FIRST SYMBOL LAYER
          ------------------------------------------------------ */

          let firstSymbolId =
            undefined;


          const allLayers =
            map.getStyle().layers || [];


          for (
            const layer of allLayers
          ) {

            if (
              layer.type === "symbol"
            ) {

              firstSymbolId =
                layer.id;

              break;

            }

          }


          /* ------------------------------------------------------
             FILL
          ------------------------------------------------------ */

          if (
            !map.getLayer(
              "kyiv-oblast-fill"
            )
          ) {

            map.addLayer(

              {

                id:
                  "kyiv-oblast-fill",

                type:
                  "fill",

                source:
                  "kyiv-oblast-exact",

                paint: {

                  "fill-color":
                    "#00eaff",

                  "fill-opacity":
                    0.018

                }

              },

              firstSymbolId

            );

          }


          /* ------------------------------------------------------
             GLOW
          ------------------------------------------------------ */

          if (
            !map.getLayer(
              "kyiv-oblast-glow"
            )
          ) {

            map.addLayer(

              {

                id:
                  "kyiv-oblast-glow",

                type:
                  "line",

                source:
                  "kyiv-oblast-exact",

                paint: {

                  "line-color":
                    "#00eaff",

                  "line-opacity":
                    0.28,

                  "line-width": [

                    "interpolate",

                    ["linear"],

                    ["zoom"],

                    5.4,
                    5,

                    7,
                    7,

                    10,
                    10,

                    14,
                    14

                  ],

                  "line-blur":
                    5

                }

              },

              firstSymbolId

            );

          }


          /* ------------------------------------------------------
             MAIN BORDER
          ------------------------------------------------------ */

          if (
            !map.getLayer(
              "kyiv-oblast-border"
            )
          ) {

            map.addLayer(

              {

                id:
                  "kyiv-oblast-border",

                type:
                  "line",

                source:
                  "kyiv-oblast-exact",

                paint: {

                  "line-color":
                    "#00eaff",

                  "line-opacity":
                    0.92,

                  "line-width": [

                    "interpolate",

                    ["linear"],

                    ["zoom"],

                    5.4,
                    1.5,

                    7,
                    2,

                    10,
                    2.6,

                    14,
                    3.5

                  ],

                  "line-blur":
                    0.15

                }

              },

              firstSymbolId

            );

          }


          /* ------------------------------------------------------
             KEEP CITY LABELS ABOVE EVERYTHING
          ------------------------------------------------------ */

          for (
            const id of symbolLayers
          ) {

            if (
              map.getLayer(id)
            ) {

              try {

                map.moveLayer(id);

              } catch (e) {}

            }

          }

        }

      )

      .catch(
        error => {

          console.warn(
            "Kyiv Oblast boundary:",
            error
          );

        }
      );

    }


    /* ============================================================
       BELARUS BORDER
       
       We query ONLY the shared ways between the Ukraine and
       Belarus country boundary relations.
       
       Bounding box is limited to northern Ukraine so that
       unrelated international borders are not drawn.
    ============================================================ */

    async function addBelarusBorder() {


      const OVERPASS_QUERY = `

        [out:json][timeout:30];

        rel
          ["boundary"="administrative"]
          ["admin_level"="2"]
          ["ISO3166-1"="UA"]
          ->.ukraine;

        rel
          ["boundary"="administrative"]
          ["admin_level"="2"]
          ["ISO3166-1"="BY"]
          ->.belarus;

        way
          (r.ukraine)
          (r.belarus)
          (50.5,27.5,52.5,32.8);

        out geom;

      `;


      try {


        const response =
          await fetch(

            "https://overpass-api.de/api/interpreter",

            {

              method:
                "POST",

              headers: {

                "Content-Type":
                  "application/x-www-form-urlencoded"

              },

              body:
                "data=" +
                encodeURIComponent(
                  OVERPASS_QUERY
                )

            }

          );


        if (
          !response.ok
        ) {

          throw new Error(
            "Belarus border request failed"
          );

        }


        const data =
          await response.json();


        const features = [];


        for (
          const element of
          data.elements || []
        ) {


          if (
            !element.geometry ||
            element.geometry.length < 2
          ) {

            continue;

          }


          const coordinates =
            element.geometry.map(
              point => [
                point.lon,
                point.lat
              ]
            );


          features.push({

            type:
              "Feature",

            properties:
              {},

            geometry: {

              type:
                "LineString",

              coordinates:
                coordinates

            }

          });

        }


        if (
          features.length === 0
        ) {

          throw new Error(
            "No Belarus-Ukraine border geometry found"
          );

        }


        const geojson = {

          type:
            "FeatureCollection",

          features:
            features

        };


        /* ========================================================
           SOURCE
        ======================================================== */

        map.addSource(

          "belarus-border",

          {

            type:
              "geojson",

            data:
              geojson

          }

        );


        /* ========================================================
           SIMPLE DARK UNDERLINE
        ======================================================== */

        map.addLayer({

          id:
            "belarus-border-base",

          type:
            "line",

          source:
            "belarus-border",

          paint: {

            "line-color":
              "#142d30",

            "line-opacity":
              0.95,

            "line-width": [

              "interpolate",

              ["linear"],

              ["zoom"],

              5.4,
              2,

              7,
              2.5,

              10,
              3

            ]

          }

        });


        /* ========================================================
           SMALL BARBED-WIRE PATTERN
           
           Generated locally — no external image needed.
        ======================================================== */

        if (
          !map.hasImage(
            "barbed-wire-pattern"
          )
        ) {


          const canvas =
            document.createElement(
              "canvas"
            );


          canvas.width = 32;
          canvas.height = 16;


          const ctx =
            canvas.getContext(
              "2d"
            );


          ctx.clearRect(
            0,
            0,
            32,
            16
          );


          /* Main wire */

          ctx.strokeStyle =
            "#55aeb2";

          ctx.lineWidth =
            1.35;

          ctx.beginPath();

          ctx.moveTo(
            0,
            8
          );

          ctx.lineTo(
            32,
            8
          );

          ctx.stroke();


          /* Barbs */

          ctx.strokeStyle =
            "#72c7ca";

          ctx.lineWidth =
            1;


          for (
            let x = 5;
            x < 32;
            x += 10
          ) {

            ctx.beginPath();

            ctx.moveTo(
              x - 3,
              4
            );

            ctx.lineTo(
              x + 3,
              12
            );

            ctx.stroke();


            ctx.beginPath();

            ctx.moveTo(
              x - 3,
              12
            );

            ctx.lineTo(
              x + 3,
              4
            );

            ctx.stroke();

          }


          const imageData =
            ctx.getImageData(
              0,
              0,
              32,
              16
            );


          map.addImage(

            "barbed-wire-pattern",

            {

              width:
                32,

              height:
                16,

              data:
                imageData.data

            }

          );

        }


        /* ========================================================
           BARBED WIRE
        ======================================================== */

        map.addLayer({

          id:
            "belarus-border-wire",

          type:
            "line",

          source:
            "belarus-border",

          paint: {

            "line-pattern":
              "barbed-wire-pattern",

            "line-opacity":
              0.72

          }

        });


        /* ========================================================
           SUBTLE GLOW
        ======================================================== */

        map.addLayer({

          id:
            "belarus-border-glow",

          type:
            "line",

          source:
            "belarus-border",

          paint: {

            "line-color":
              "#36aeb3",

            "line-opacity":
              0.14,

            "line-width": [

              "interpolate",

              ["linear"],

              ["zoom"],

              5.4,
              4,

              7,
              5,

              10,
              7

            ],

            "line-blur":
              3

          }

        });


        /* ========================================================
           KEEP CITY LABELS ABOVE BORDER
        ======================================================== */

        const layers =
          map.getStyle().layers || [];


        for (
          const layer of layers
        ) {

          if (
            layer.type === "symbol"
          ) {

            try {

              map.moveLayer(
                layer.id
              );

            } catch (e) {}

          }

        }


      } catch (error) {

        console.warn(
          "Belarus border:",
          error
        );

      }

    }

  </script>

</body>
</html>
