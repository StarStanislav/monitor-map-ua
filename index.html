<!DOCTYPE html>
<html lang="uk">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,
           initial-scale=1,
           maximum-scale=1,
           user-scalable=no,
           viewport-fit=cover"
>

<title>ONLINE RADAR</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/maplibre-gl@5.9.0/dist/maplibre-gl.css"
>

<script src="https://unpkg.com/maplibre-gl@5.9.0/dist/maplibre-gl.js"></script>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>


<style>

/* =========================================================
   BASE
========================================================= */

:root {

  --bg: #050708;

  --panel:
    rgba(5, 8, 9, .84);

  --border:
    rgba(255,255,255,.085);

  --text:
    #edf2f3;

  --muted:
    #7c898e;

  --green:
    #62ff91;
}


* {

  box-sizing:
    border-box;

  -webkit-tap-highlight-color:
    transparent;
}


html,
body {

  width:100%;
  height:100%;

  margin:0;
  padding:0;

  overflow:hidden;

  background:
    var(--bg);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
}


body {

  position:fixed;

  inset:0;
}


/* =========================================================
   MAP
========================================================= */

#map {

  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  background:
    #050708;
}


/* =========================================================
   TOP STATUS
========================================================= */

.topbar {

  position:fixed;

  z-index:1000;

  top:
    max(12px,env(safe-area-inset-top));

  left:13px;

  display:flex;

  align-items:center;

  gap:9px;

  padding:
    9px 13px;

  border:
    1px solid var(--border);

  border-radius:
    12px;

  background:
    rgba(5,8,9,.80);

  backdrop-filter:
    blur(16px);

  -webkit-backdrop-filter:
    blur(16px);

  box-shadow:
    0 8px 30px rgba(0,0,0,.42);

  pointer-events:
    none;
}


.status-dot {

  width:8px;
  height:8px;

  flex:
    0 0 8px;

  border-radius:
    50%;

  background:
    var(--green);

  box-shadow:
    0 0 9px
    rgba(98,255,145,.9);

  animation:
    pulse 1.8s infinite;
}


.top-title {

  color:
    #f2f5f6;

  font-size:
    11px;

  font-weight:
    750;

  letter-spacing:
    .17em;

  line-height:
    1;
}


@keyframes pulse {

  0% {

    box-shadow:
      0 0 0 0
      rgba(98,255,145,.50),

      0 0 9px
      rgba(98,255,145,.9);
  }

  70% {

    box-shadow:
      0 0 0 7px
      rgba(98,255,145,0),

      0 0 12px
      rgba(98,255,145,.9);
  }

  100% {

    box-shadow:
      0 0 0 0
      rgba(98,255,145,0),

      0 0 9px
      rgba(98,255,145,.9);
  }

}


/* =========================================================
   BOTTOM
========================================================= */

.bottom-panel {

  position:fixed;

  z-index:1000;

  left:13px;

  bottom:
    max(13px,env(safe-area-inset-bottom));

  padding:
    10px 12px;

  border:
    1px solid var(--border);

  border-radius:
    11px;

  background:
    rgba(5,8,9,.84);

  backdrop-filter:
    blur(16px);

  -webkit-backdrop-filter:
    blur(16px);

  box-shadow:
    0 8px 30px rgba(0,0,0,.42);

  pointer-events:
    none;
}


.region-name {

  color:
    #e9edef;

  font-size:
    9px;

  font-weight:
    750;

  letter-spacing:
    .16em;
}


.clock {

  margin-top:
    4px;

  color:
    #7e8a8f;

  font-family:
    "SF Mono",
    "Roboto Mono",
    Consolas,
    monospace;

  font-size:
    9px;

  letter-spacing:
    .035em;
}


/* =========================================================
   INFO
========================================================= */

.info-button {

  position:fixed;

  z-index:1001;

  right:12px;

  bottom:
    max(15px,env(safe-area-inset-bottom));

  width:39px;
  height:39px;

  display:flex;

  align-items:center;
  justify-content:center;

  border-radius:
    50%;

  border:
    1px solid
    rgba(255,255,255,.11);

  background:
    rgba(8,11,12,.80);

  backdrop-filter:

  color:
    #aab3b6;

  font-size:

}


/* =========================================================
   ATTRIBUTION
========================================================= */

.maplibregl-ctrl-bottom-right {

  right:
    6px;

  bottom:
    6px;
}


.maplibregl-ctrl-attrib {

  background:
    rgba(4,7,8,.70)!important;

  color:
    #647075!important;

  font-size:
    8px!important;

  border-radius:
    6px;
}


.maplibregl-ctrl-attrib a {

  color:
    #7d898e!important;
}


/* =========================================================
   LOADING
========================================================= */

#loading {

  position:fixed;

  z-index:5000;

  inset:0;

  display:flex;

  align-items:center;

  justify-content:center;

  background:

    radial-gradient(
      circle,

      #06090a 48%,
      #030506 100%
    );

  transition:
    opacity .45s ease;
}


#loading.hidden {

  opacity:0;

  pointer-events:none;
}


.loading-ring {

  width:30px;
  height:30px;

  margin:
    0 auto 12px;

  border-radius:
    50%;

  border:
    2px solid
    rgba(255,255,255,.08);

  border-top-color:
    var(--green);

  animation:
    spin .75s linear infinite;
}


.loading-text {

  color:
    #778388;

  font-size:
    9px;

  font-weight:
    650;

  letter-spacing:
    .18em;
}


@keyframes spin {

  to {
    transform:
      rotate(360deg);
  }

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:430px) {

  .topbar {
    left:10px;
  }

  .bottom-panel {
    left:10px;
  }

  .info-button {
    right:10px;
  }

}

</head>


<body>


<div id="map"></div>


<div id="loading">

  <div>

    <div class="loading-ring"></div>

    <div class="loading-text">
      LOADING KYIV OBLAST
    </div>

  </div>

</div>


<div class="topbar">

  <span class="status-dot"></span>

  <span class="top-title">
    ONLINE RADAR
  </span>

</div>


<div class="bottom-panel">

  <div class="region-name">
    КИЇВСЬКА ОБЛАСТЬ
  </div>

  <div
    id="clock"
    class="clock"
  >
    --.--.---- · --:--:--
  </div>

</div>


<div class="info-button">
  i
</div>


<script>


/* =========================================================
   TELEGRAM
========================================================= */

const tg =
  window.Telegram?.WebApp;

if (tg) {

  try {

    tg.ready();

    tg.expand();

    tg.setHeaderColor?.(
      "#050708"
    );

    tg.setBackgroundColor?.(
      "#050708"
    );

  } catch (_) {}

}


/* =========================================================
   CLOCK
========================================================= */

const clock =
  document.getElementById(
    "clock"
  );


function updateClock() {

  const now =
    new Date();


  const date =
    new Intl.DateTimeFormat(
      "uk-UA",
      {

        timeZone:
          "Europe/Kyiv",

        day:
          "2-digit",

        month:
          "2-digit",

        year:
          "numeric"

      }
    ).format(now);


  const time =
    new Intl.DateTimeFormat(
      "uk-UA",
      {

        timeZone:
          "Europe/Kyiv",

        hour:
          "2-digit",

        minute:
          "2-digit",

        second:
          "2-digit",

        hour12:
          false

      }
    ).format(now);


  clock.textContent =
    `${date} · ${time}`;

}


updateClock();

setInterval(
  updateClock,
  1000
);


/* =========================================================
   MAP CONFIG
========================================================= */

const STYLE_URL =
  "https://tiles.openfreemap.org/styles/dark";


const OBLAST_URL =
  "https://geo2day.com/europe/ukraine/kiev_oblast.geojson";


/*
 * OSM relation IDs.
 *
 * 7 актуальних районів Київщини.
 */

const DISTRICTS = [

  {
    id:
      11913383,

    name:
      "БІЛОЦЕРКІВСЬКИЙ"
  },

  {
    id:
      11900985,

    name:
      "БОРИСПІЛЬСЬКИЙ"
  },

  {
    id:
      11900969,

    name:
      "БРОВАРСЬКИЙ"
  },

  {
    id:
      11913603,

    name:
      "БУЧАНСЬКИЙ"
  },

  {
    id:
      11892210,

    name:
      "ВИШГОРОДСЬКИЙ"
  },

  {
    id:
      11909246,

    name:
      "ОБУХІВСЬКИЙ"
  },

  {
    id:
      11913464,

    name:
      "ФАСТІВСЬКИЙ"
  }

];


/*
 * Старт.
 *
 * Спеціально трохи ближче,
 * ніж на попередньому скріні.
 */

const START_CENTER = [
  30.78,
  50.31
];


const START_ZOOM =
  8.75;


/*
 * Панорамування тільки
 * в межах Київщини та невеликого
 * запасу навколо.
 */

const MAX_BOUNDS = [

  [29.10,49.05],

  [32.35,51.65]

];


/* =========================================================
   LOAD MAP STYLE
========================================================= */

async function start() {

  try {

    const response =
      await fetch(
        STYLE_URL,
        {
          cache:
            "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        `Style ${response.status}`
      );

    }


    const style =
      await response.json();


    prepareBaseStyle(
      style
    );


    createMap(
      style
    );

  }

  catch (error) {

    console.error(
      error
    );

    document
      .querySelector(
        ".loading-text"
      )
      .textContent =
        "MAP CONNECTION ERROR";

  }

}


/* =========================================================
   BASE STYLE
========================================================= */

function prepareBaseStyle(
  style
) {

  for (
    const layer
      of style.layers || []
  ) {

    const sourceLayer =
      String(
        layer[
          "source-layer"
        ] || ""
      ).toLowerCase();


    /*
     * Background.
     */

    if (
      layer.type ===
      "background"
    ) {

      layer.paint = {

        ...(layer.paint || {}),

        "background-color":
          "#050708"

      };

    }


    /*
     * Water.
     */

    if (
      sourceLayer ===
      "water"
    ) {

      if (
        layer.type ===
        "fill"
      ) {

        layer.paint = {

          ...(layer.paint || {}),

          "fill-color":
            "#08191d",

          "fill-opacity":
            .98

        };

      }

    }


    /*
     * Rivers.
     */

    if (
      sourceLayer ===
        "waterway" &&
      layer.type ===
        "line"
    ) {

      layer.paint = {

        ...(layer.paint || {}),

        "line-color":
          "#15464e",

        "line-opacity":
          .72

      };

    }


    /*
     * Roads.
     */

    if (
      sourceLayer ===
        "transportation" &&
      layer.type ===
        "line"
    ) {

      layer.paint = {

        ...(layer.paint || {}),

        "line-opacity":
          .56

      };

    }


    /*
     * Remove POI clutter.
     */

    if (

      sourceLayer === "poi" ||

      sourceLayer ===
        "housenumber"

    ) {

      layer.layout = {

        ...(layer.layout || {}),

        visibility:
          "none"

      };

    }


    /*
     * Remove default place labels.
     */

    if (

      sourceLayer ===
        "place" &&

      layer.type ===
        "symbol"

    ) {

      layer.layout = {

        ...(layer.layout || {}),

        visibility:
          "none"

      };

    }


    /*
     * Remove default road names.
     */

    if (
      sourceLayer ===
        "transportation_name" &&
      layer.type ===
        "symbol"
    ) {

      layer.layout = {

        ...(layer.layout || {}),

        visibility:
          "none"

      };

    }

  }

}


/* =========================================================
   CREATE MAP
========================================================= */

function createMap(
  style
) {

  const map =
    new maplibregl.Map({

      container:
        "map",

      style:
        style,

      center:
        START_CENTER,

      zoom:
        START_ZOOM,

      minZoom:
        7.6,

      maxZoom:
        16,

      maxBounds:
        MAX_BOUNDS,

      attributionControl:
        true,

      pitchWithRotate:
        false,

      dragRotate:
        false,

      touchPitch:
        false,

      touchZoomRotate:
        true,

      cooperativeGestures:
        false

    });


  window.KYIV_MAP =
    map;


  map.once(
    "load",
    async () => {

      try {

        /*
         * 1. Реальна область.
         */

        const oblast =
          await loadOblast(
            map
          );


        /*
         * 2. Справжня маска.
         */

        addOutsideMask(
          map,
          oblast
        );


        /*
         * 3. Область.
         */

        addOblastFill(
          map
        );


        /*
         * 4. Райони.
         */

        await loadDistricts(
          map
        );


        /*
         * 5. Міста.
         */

        addPlaces(
          map
        );


        /*
         * 6. Вода.
         */

        addWaterLabels(
          map
        );


        /*
         * 7. Межа області
         * поверх усього.
         */

        addOblastBorder(
          map
        );


        /*
         * 8. Київ окремо.
         */

        addKyivBoundary(
          map
        );


        /*
         * 9. Старт.
         */

        map.jumpTo({

          center:
            START_CENTER,

          zoom:
            START_ZOOM

        });

      }

      catch(error) {

        console.error(
          "Layers:",
          error
        );

      }


      setTimeout(
        () => {

          document
            .getElementById(
              "loading"
            )
            .classList.add(
              "hidden"
            );

        },
        500
      );

    }
  );

}


/* =========================================================
   OBLAST GEOJSON
========================================================= */

async function loadOblast(
  map
) {

  const response =
    await fetch(
      OBLAST_URL,
      {
        cache:
          "no-store"
      }
    );


  if (!response.ok) {

    throw new Error(
      `Oblast ${response.status}`
    );

  }


  const raw =
    await response.json();


  /*
   * Нормалізуємо можливі формати
   * Geo2day.
   */

  let feature;


  if (
    raw.type ===
    "FeatureCollection"
  ) {

    feature =
      raw.features[0];

  }

  else if (
    raw.type ===
    "Feature"
  ) {

    feature =
      raw;

  }

  else if (
    raw.type ===
      "Polygon" ||

    raw.type ===
      "MultiPolygon"
  ) {

    feature = {

      type:
        "Feature",

      properties:
        {},

      geometry:
        raw

    };

  }

  else if (
    raw.type ===
      "GeometryCollection"
  ) {

    const geometry =
      raw.geometries
        .find(
          g =>
            g.type ===
              "Polygon" ||

            g.type ===
              "MultiPolygon"
        );


    feature = {

      type:
        "Feature",

      properties:
        {},

      geometry:
        geometry

    };

  }


  if (
    !feature ||
    !feature.geometry
  ) {

    throw new Error(
      "Invalid Kyiv Oblast GeoJSON"
    );

  }


  map.addSource(
    "kyiv-oblast",
    {

      type:
        "geojson",

      data:
        feature

    }
  );


  return feature;

}


/* =========================================================
   REAL OUTSIDE MASK
========================================================= */

function addOutsideMask(
  map,
  oblast
) {

  /*
   * Великий полігон.
   */

  const outer =
    turf.polygon([

      [

        [27.5,47.8],

        [34.5,47.8],

        [34.5,53.0],

        [27.5,53.0],

        [27.5,47.8]

      ]

    ]);


  let outside;


  try {

    outside =
      turf.difference(
        turf.featureCollection([
          outer,
          oblast
        ])
      );

  }

  catch(error) {

    console.warn(
      "Mask:",
      error
    );

    return;

  }


  if (!outside) {
    return;
  }


  map.addSource(
    "outside-kyiv-oblast",
    {

      type:
        "geojson",

      data:
        outside

    }
  );


  map.addLayer({

    id:
      "outside-kyiv-oblast-fill",

    type:
      "fill",

    source:
      "outside-kyiv-oblast",

    paint: {

      "fill-color":
        "#020405",

      "fill-opacity":
        .64

    }

  });

}


/* =========================================================
   OBLAST FILL
========================================================= */

function addOblastFill(
  map
) {

  map.addLayer({

    id:
      "kyiv-oblast-fill",

    type:
      "fill",

    source:
      "kyiv-oblast",

    paint: {

      "fill-color":
        "#14261f",

      "fill-opacity":
        .12

    }

  });

}


/* =========================================================
   OBLAST BORDER
========================================================= */

function addOblastBorder(
  map
) {

  map.addLayer({

    id:
      "kyiv-oblast-border",

    type:
      "line",

    source:
      "kyiv-oblast",

    paint: {

      "line-color":
        "#91a9a2",

      "line-width":[

        "interpolate",

        ["linear"],

        ["zoom"],

        7.5,
        1.0,

        9,
        1.5,

        12,
        2.0,

        15,
        2.7

      ],

      "line-opacity":
        .9

    }

  });

}


/* =========================================================
   LOAD ONE DISTRICT
========================================================= */

async function fetchDistrict(
  district
) {

  /*
   * OSM relation -> GeoJSON.
   *
   * Це справжня геометрія relation.
   */

  const url =
    `https://polygons.openstreetmap.fr/get_geojson.py?id=${district.id}&params=0`;


  const response =
    await fetch(
      url,
      {
        cache:
          "no-store"
      }
    );


  if (!response.ok) {

    throw new Error(
      `${district.name}: ${response.status}`
    );

  }


  const raw =
    await response.json();


  /*
   * API може повернути
   * GeometryCollection.
   */

  if (
    raw.type ===
      "GeometryCollection"
  ) {

    const geometries =
      raw.geometries
        .filter(
          g =>
            g.type ===
              "Polygon" ||

            g.type ===
              "MultiPolygon"
        );


    return {

      type:
        "FeatureCollection",

      features:
        geometries.map(
          geometry => ({

            type:
              "Feature",

            properties: {

              district:
                district.name

            },

            geometry:
              geometry

          })
        )

    };

  }


  if (
    raw.type ===
      "FeatureCollection"
  ) {

    return raw;

  }


  if (
    raw.type ===
      "Polygon" ||

    raw.type ===
      "MultiPolygon"
  ) {

    return {

      type:
        "FeatureCollection",

      features: [

        {

          type:
            "Feature",

          properties: {

            district:
              district.name

          },

          geometry:
            raw

        }

      ]

    };

  }


  throw new Error(
    `${district.name}: unsupported GeoJSON`
  );

}


/* =========================================================
   LOAD ALL 7 DISTRICTS
========================================================= */

async function loadDistricts(
  map
) {

  const results = [];


  /*
   * Послідовно.
   *
   * Не стріляємо сімма запитами
   * одночасно по зовнішньому сервісу.
   */

  for (
    const district
      of DISTRICTS
  ) {

    try {

      const data =
        await fetchDistrict(
          district
        );


      results.push({

        ...district,

        data:
          data

      });

    }

    catch(error) {

      console.warn(
        error
      );

    }

  }


  /*
   * Додаємо один FeatureCollection.
   */

  const features = [];


  for (
    const item
      of results
  ) {

    for (
      const feature
        of item.data.features
    ) {

      feature.properties = {

        ...(feature.properties || {}),

        district:
          item.name

      };


      features.push(
        feature
      );

    }

  }


  if (!features.length) {

    console.warn(
      "District geometry unavailable"
    );

    return;

  }


  const collection = {

    type:
      "FeatureCollection",

    features:
      features

  };


  map.addSource(
    "kyiv-districts-real",
    {

      type:
        "geojson",

      data:
        collection

    }
  );


  /*
   * Дуже слабкий tint.
   */

  map.addLayer({

    id:
      "district-fill",

    type:
      "fill",

    source:
      "kyiv-districts-real",

    paint: {

      "fill-color":
        "#6e8b83",

      "fill-opacity":
        .018

    }

  });


  /*
   * Головна лінія районів.
   */

  map.addLayer({

    id:
      "district-border",

    type:
      "line",

    source:
      "kyiv-districts-real",

    paint: {

      "line-color":
        "#657b76",

      "line-width":[

        "interpolate",

        ["linear"],

        ["zoom"],

        7.5,
        .45,

        9,
        .75,

        12,
        1.15,

        15,
        1.5

      ],

      "line-opacity":[

        "interpolate",

        ["linear"],

        ["zoom"],

        7.5,
        .34,

        9,
        .44,

        12,
        .57,

        15,
        .68

      ],

      "line-dasharray":[
        2,
        3
      ]

    }

  });


  /*
   * Підписи районів.
   *
   * Turf знаходить реальний центр
   * полігону.
   */

  const labelFeatures = [];


  for (
    const item
      of results
  ) {

    try {

      const center =
        turf.pointOnFeature(
          item.data.features[0]
        );


      center.properties = {

        district:
          item.name

      };


      labelFeatures.push(
        center
      );

    }

    catch(error) {

      console.warn(
        "District label:",
        item.name
      );

    }

  }


  map.addSource(
    "district-label-points",
    {

      type:
        "geojson",

      data: {

        type:
          "FeatureCollection",

        features:
          labelFeatures

      }

    }
  );


  map.addLayer({

    id:
      "district-labels",

    type:
      "symbol",

    source:
      "district-label-points",

    minzoom:
      8.15,

    layout: {

      "text-field":
        [
          "get",
          "district"
        ],

      "text-font":[
        "Noto Sans Regular"
      ],

      "text-size":[

        "interpolate",

        ["linear"],

        ["zoom"],

        8.15,
        7,

        10,
        8,

        13,
        9.5

      ],

      "text-letter-spacing":
        .10,

      "text-max-width":
        8,

      "text-allow-overlap":
        false

    },

    paint: {

      "text-color":
        "#71847f",

      "text-opacity":[

        "interpolate",

        ["linear"],

        ["zoom"],

        8.15,
        .32,

        10,
        .43,

        13,
        .55

      ],

      "text-halo-color":
        "#050708",

      "text-halo-width":
        1.5

    }

  });

}
