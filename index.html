<!DOCTYPE html>
<html lang="uk">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover"
>

<title>ONLINE RADAR — TEST 9.5</title>

<link
  href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css"
  rel="stylesheet"
>

<style>

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {

  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  background: #050707;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Helvetica,
    Arial,
    sans-serif;
}

body {

  position: fixed;

  inset: 0;
}


/* =========================================================
   MAP
========================================================= */

#map {

  position: absolute;

  inset: 0;

  width: 100%;
  height: 100%;

  background: #070909;
}


/* =========================================================
   TEST LABEL
========================================================= */

.test-label {

  position: absolute;

  z-index: 9999;

  top: 90px;

  left: 22px;

  padding: 14px 22px;

  border-radius: 16px;

  background: #ff1744;

  color: white;

  font-size: 20px;

  font-weight: 900;

  letter-spacing: 2px;

  box-shadow:
    0 0 25px rgba(255,23,68,.7);

  pointer-events: none;
}


/* =========================================================
   ONLINE RADAR
========================================================= */

.radar-badge {

  position: absolute;

  z-index: 20;

  top:
    max(
      160px,
      env(safe-area-inset-top)
    );

  left: 22px;

  height: 58px;

  padding: 0 22px;

  display: flex;

  align-items: center;

  gap: 14px;

  border-radius: 28px;

  background:
    rgba(5,10,10,.92);

  border:
    1px solid
    rgba(100,140,135,.22);

  box-shadow:

    0 8px 30px
    rgba(0,0,0,.35),

    inset 0 0 18px
    rgba(80,255,190,.025);

  backdrop-filter:
    blur(12px);

  -webkit-backdrop-filter:
    blur(12px);

  pointer-events:
    none;
}


.radar-dot {

  width: 20px;
  height: 20px;

  flex: 0 0 20px;

  border-radius: 50%;

  background:
    #55f5a5;

  box-shadow:

    0 0 10px
    rgba(85,245,165,.9),

    0 0 25px
    rgba(85,245,165,.55);
}


.radar-title {

  color:
    #f1f6f5;

  font-size:
    16px;

  font-weight:
    700;

  letter-spacing:
    5px;

  white-space:
    nowrap;
}


/* =========================================================
   INFO
========================================================= */

.info-panel {

  position: absolute;

  z-index: 20;

  left: 22px;

  bottom:
    max(
      22px,
      env(safe-area-inset-bottom)
    );

  padding:
    18px 24px 17px;

  min-width:
    305px;

  border-radius:
    24px;

  background:
    rgba(5,9,9,.94);

  border:
    1px solid
    rgba(105,145,140,.20);

  pointer-events:
    none;
}


.region-name {

  color:
    #e7eeee;

  font-size:
    17px;

  font-weight:
    700;

  letter-spacing:
    4px;

  margin-bottom:
    8px;
}


.date-time {

  color:
    #81908e;

  font-size:
    14px;

  font-family:
    ui-monospace,
    SFMono-Regular,
    Menlo,
    Monaco,
    Consolas,
    monospace;
}


/* =========================================================
   INFO BUTTON
========================================================= */

.info-button {

  position: absolute;

  z-index: 30;

  right: 22px;

  bottom:
    max(
      22px,
      env(safe-area-inset-bottom)
    );

  width: 62px;
  height: 62px;

  border-radius: 50%;

  border:
    1px solid
    rgba(140,155,153,.25);

  background:
    rgba(8,12,12,.92);

  color:
    #c6cfce;

  font-family:
    Georgia, serif;

  font-size:
    38px;

  font-weight:
    bold;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;
}


/* =========================================================
   CONTROLS
========================================================= */

.maplibregl-ctrl-top-right {

  top: 20px;

  right: 18px;
}


.maplibregl-ctrl-group {

  background:
    rgba(5,9,9,.90) !important;

  border:
    1px solid
    rgba(130,150,145,.20) !important;

  border-radius:
    14px !important;

  overflow:
    hidden;
}


.maplibregl-ctrl-group button {

  background:
    transparent !important;
}


.maplibregl-ctrl-group
button span {

  filter:
    invert(1);
}


.maplibregl-ctrl-attrib {

  background:
    rgba(5,8,8,.7) !important;

  color:
    #73807e !important;

  font-size:
    9px !important;
}

</style>

</head>


<body>


<div id="map"></div>


<!-- =========================================================
     ТЕСТОВИЙ НАПИС
========================================================= -->

<div class="test-label">
  TEST 9.5
</div>


<!-- =========================================================
     RADAR
========================================================= -->

<div class="radar-badge">

  <div class="radar-dot"></div>

  <div class="radar-title">
    ONLINE RADAR
  </div>

</div>


<!-- =========================================================
     INFO
========================================================= -->

<div class="info-panel">

  <div class="region-name">
    КИЇВСЬКА ОБЛАСТЬ
  </div>

  <div
    class="date-time"
    id="datetime"
  >
  </div>

</div>


<button
  class="info-button"
  id="infoButton"
>
  i
</button>


<script
  src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"
></script>


<script>


/* ============================================================
   SETTINGS
============================================================ */


/*
  Центр карти.
*/

const INITIAL_CENTER =
  [30.95, 50.65];


/*
  ==========================================================
  ТЕСТОВИЙ ZOOM
  ==========================================================

  Спеціально ставимо 9.5.

  Якщо новий файл завантажився,
  карта буде суттєво ближче.
*/

const INITIAL_ZOOM =
  9.5;


/*
  Можна віддаляти.
*/

const MIN_ZOOM =
  5;


/*
  Можна збільшувати.
*/

const MAX_ZOOM =
  20;


/*
  Версія для примусового
  оновлення URL у браузері.
*/

const VERSION =
  "TEST_9_5_20260911";


/* ============================================================
   CLOCK
============================================================ */

function updateDateTime() {

  const now =
    new Date();

  const day =
    String(
      now.getDate()
    ).padStart(2,"0");

  const month =
    String(
      now.getMonth()+1
    ).padStart(2,"0");

  const year =
    now.getFullYear();

  const hours =
    String(
      now.getHours()
    ).padStart(2,"0");

  const minutes =
    String(
      now.getMinutes()
    ).padStart(2,"0");

  const seconds =
    String(
      now.getSeconds()
    ).padStart(2,"0");


  document
    .getElementById("datetime")
    .textContent =
    `${day}.${month}.${year} · ${hours}:${minutes}:${seconds}`;
}


updateDateTime();

setInterval(
  updateDateTime,
  1000
);


/* ============================================================
   MAP
============================================================ */

const STYLE_URL =
  "https://tiles.openfreemap.org/styles/dark";


const map =
  new maplibregl.Map({

    container:
      "map",

    style:
      STYLE_URL,

    center:
      INITIAL_CENTER,

    zoom:
      INITIAL_ZOOM,

    minZoom:
      MIN_ZOOM,

    maxZoom:
      MAX_ZOOM,

    pitch:
      0,

    bearing:
      0,

    dragRotate:
      false,

    touchPitch:
      false,

    renderWorldCopies:
      false,

    attributionControl:
      true

  });


/* ============================================================
   CONTROLS
============================================================ */

map.addControl(

  new maplibregl.NavigationControl({

    showCompass:
      false,

    showZoom:
      true

  }),

  "top-right"

);


/* ============================================================
   MOST IMPORTANT TEST
============================================================ */

map.once(
  "load",
  () => {


    /*
      Після повного завантаження
      примусово ставимо 9.5.
    */

    map.jumpTo({

      center:
        INITIAL_CENTER,

      zoom:
        INITIAL_ZOOM,

      bearing:
        0,

      pitch:
        0

    });


    /*
      Ще раз через 500 мс.

      Це спеціально для тесту
      Telegram WebView/cache.
    */

    setTimeout(
      () => {

        map.jumpTo({

          center:
            INITIAL_CENTER,

          zoom:
            INITIAL_ZOOM,

          bearing:
            0,

          pitch:
            0

        });

      },
      500
    );


    /*
      І ще раз через 1500 мс.
    */

    setTimeout(
      () => {

        map.jumpTo({

          center:
            INITIAL_CENTER,

          zoom:
            INITIAL_ZOOM,

          bearing:
            0,

          pitch:
            0

        });

      },
      1500
    );

  }
);


/* ============================================================
   RESIZE
============================================================ */

window.addEventListener(
  "resize",
  () => {

    map.resize();

  }
);


/* ============================================================
   INFO
============================================================ */

document
  .getElementById("infoButton")
  .addEventListener(
    "click",
    () => {

      alert(
        "ONLINE RADAR\n\n" +
        "TEST VERSION 9.5\n\n" +
        "Якщо ти бачиш цей текст — " +
        "новий index.html завантажився."
      );

    }
  );


</script>

</body>
</html>
