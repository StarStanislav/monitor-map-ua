<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Monitor Map UA</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #080b10;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
}

#map {
  position: absolute;
  inset: 0;
  z-index: 1;
}

/* DARK MAP */

.leaflet-tile {
  filter: brightness(0.72) contrast(1.12) saturate(0.72);
}

.leaflet-container {
  background: #080b10;
}

/* TOP HEADER */

.top-panel {
  position: absolute;
  top: 16px;
  left: 16px;
  right: 16px;
  z-index: 1000;

  padding: 15px 16px;

  background: rgba(10, 14, 20, 0.88);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 22px;

  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);

  box-shadow: 0 8px 30px rgba(0,0,0,0.35);

  display: flex;
  align-items: center;
  justify-content: space-between;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-icon {
  width: 46px;
  height: 46px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 14px;

  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);

  font-size: 24px;
}

.brand-title {
  color: #f5f7fa;
  font-size: 20px;
  font-weight: 700;
  line-height: 1.1;
}

.brand-subtitle {
  margin-top: 4px;
  color: #8e98a6;
  font-size: 13px;
}

.status {
  display: flex;
  align-items: center;
  gap: 8px;

  padding: 9px 13px;

  border-radius: 15px;

  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);

  color: #b8c0ca;
  font-size: 13px;
}

.status-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #42d878;
  box-shadow: 0 0 12px rgba(66,216,120,0.7);
}

/* SEARCH */

.search-box {
  position: absolute;
  top: 92px;
  left: 16px;
  right: 82px;
  z-index: 1000;

  height: 58px;

  display: flex;
  align-items: center;

  padding: 0 18px;

  background: rgba(10,14,20,0.9);
  border: 1px solid rgba(255,255,255,0.11);
  border-radius: 19px;

  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);

  box-shadow: 0 8px 25px rgba(0,0,0,0.28);
}

.search-icon {
  color: #8f99a7;
  font-size: 24px;
  margin-right: 12px;
}

#search {
  width: 100%;
  border: 0;
  outline: none;
  background: transparent;

  color: #f4f6f8;
  font-size: 16px;
}

#search::placeholder {
  color: #737d8b;
}

/* RIGHT CONTROLS */

.controls {
  position: absolute;
  top: 92px;
  right: 16px;
  z-index: 1000;

  display: flex;
  flex-direction: column;
  gap: 10px;
}

.control-btn {
  width: 58px;
  height: 58px;

  border-radius: 18px;

  border: 1px solid rgba(255,255,255,0.1);

  background: rgba(10,14,20,0.92);

  color: #eef2f6;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 25px;

  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);

  box-shadow: 0 8px 25px rgba(0,0,0,0.3);
}

.control-btn:active {
  transform: scale(0.94);
}

/* LEAFLET CONTROLS */

.leaflet-control-zoom {
  display: none !important;
}

.leaflet-control-attribution {
  background: rgba(5,8,12,0.65) !important;
  color: #78818d !important;
  font-size: 9px !important;
}

.leaflet-control-attribution a {
  color: #8c96a3 !important;
}

/* BOTTOM NAV */

.bottom-nav {
  position: absolute;
  left: 16px;
  right: 16px;
  bottom: 16px;

  height: 78px;

  z-index: 1000;

  display: grid;
  grid-template-columns: repeat(4, 1fr);

  padding: 7px;

  background: rgba(8,12,17,0.94);

  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 24px;

  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);

  box-shadow: 0 10px 35px rgba(0,0,0,0.4);
}

.nav-item {
  border: 0;
  background: transparent;

  color: #858e9b;

  border-radius: 18px;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  gap: 4px;

  font-size: 11px;
}

.nav-icon {
  font-size: 23px;
  line-height: 1;
}

.nav-item.active {
  color: #6ea8ff;
  background: rgba(55,105,190,0.13);
}

.nav-item:active {
  transform: scale(0.96);
}

/* SEARCH RESULT */

.search-result {
  position: absolute;
  top: 158px;
  left: 16px;
  right: 82px;

  z-index: 1100;

  display: none;

  padding: 12px 15px;

  background: rgba(10,14,20,0.96);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 16px;

  color: #e8edf3;

  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}

.search-result.show {
  display: block;
}

.result-title {
  font-weight: 600;
}

.result-subtitle {
  margin-top: 3px;
  color: #7f8997;
  font-size: 12px;
}

/* MOBILE */

@media (max-width: 430px) {

  .top-panel {
    top: 12px;
    left: 12px;
    right: 12px;
  }

  .search-box {
    top: 88px;
    left: 12px;
    right: 78px;
  }

  .controls {
    top: 88px;
    right: 12px;
  }

  .control-btn {
    width: 54px;
    height: 54px;
  }

  .bottom-nav {
    left: 12px;
    right: 12px;
    bottom: 12px;
  }

  .brand-title {
    font-size: 18px;
  }

  .status {
    padding: 8px 10px;
  }
}
</style>
</head>

<body>

<div id="map"></div>

<!-- HEADER -->

<div class="top-panel">

  <div class="brand">

    <div class="brand-icon">⌖</div>

    <div>
      <div class="brand-title">
        Monitor Map UA
      </div>

      <div class="brand-subtitle">
        Оперативна ситуація
      </div>
    </div>

  </div>

  <div class="status">
    <span class="status-dot"></span>
    Онлайн
  </div>

</div>

<!-- SEARCH -->

<div class="search-box">

  <div class="search-icon">⌕</div>

  <input
    id="search"
    type="text"
    placeholder="Пошук населеного пункту..."
    autocomplete="off"
  >

</div>

<div id="searchResult" class="search-result"></div>

<!-- CONTROLS -->

<div class="controls">

  <button
    class="control-btn"
    onclick="zoomIn()"
    aria-label="Збільшити"
  >
    +
  </button>

  <button
    class="control-btn"
    onclick="zoomOut()"
    aria-label="Зменшити"
  >
    −
  </button>

  <button
    class="control-btn"
    onclick="centerUkraine()"
    aria-label="Україна"
  >
    ◎
  </button>

</div>

<!-- BOTTOM NAV -->

<div class="bottom-nav">

  <button class="nav-item active">
    <div class="nav-icon">⌖</div>
    <div>Карта</div>
  </button>

  <button class="nav-item">
    <div class="nav-icon">☷</div>
    <div>Події</div>
  </button>

  <button class="nav-item">
    <div class="nav-icon">ⓘ</div>
    <div>Легенда</div>
  </button>

  <button class="nav-item">
    <div class="nav-icon">⚙</div>
    <div>Про проєкт</div>
  </button>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* MAP */

const map = L.map("map", {
  zoomControl: false,
  attributionControl: true,
  minZoom: 4,
  maxZoom: 12
}).setView([49.0, 31.0], 6);

/* DARK CARTO MAP */

L.tileLayer(
  "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
  {
    subdomains: "abcd",
    maxZoom: 20,
    attribution:
      '&copy; OpenStreetMap contributors &copy; CARTO'
  }
).addTo(map);


/* ZOOM */

function zoomIn() {
  map.zoomIn();
}

function zoomOut() {
  map.zoomOut();
}


/* CENTER UKRAINE */

function centerUkraine() {
  map.flyTo(
    [49.0, 31.0],
    6,
    {
      animate: true,
      duration: 0.7
    }
  );
}


/* SEARCH */

const searchInput = document.getElementById("search");
const searchResult = document.getElementById("searchResult");

let searchTimer = null;

searchInput.addEventListener("input", function() {

  const query = this.value.trim();

  clearTimeout(searchTimer);

  if (query.length < 3) {
    searchResult.classList.remove("show");
    return;
  }

  searchTimer = setTimeout(() => {

    fetch(
      "https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=uk&q=" +
      encodeURIComponent(query)
    )
    .then(response => response.json())
    .then(data => {

      if (!data.length) {

        searchResult.innerHTML =
          "<div class='result-title'>Нічого не знайдено</div>";

        searchResult.classList.add("show");

        return;
      }

      const place = data[0];

      searchResult.innerHTML = `
        <div class="result-title">
          ${place.display_name.split(",")[0]}
        </div>

        <div class="result-subtitle">
          Натисніть, щоб перейти
        </div>
      `;

      searchResult.classList.add("show");

      searchResult.onclick = function() {

        map.flyTo(
          [
            parseFloat(place.lat),
            parseFloat(place.lon)
          ],
          10,
          {
            animate: true,
            duration: 0.8
          }
        );

        searchResult.classList.remove("show");

      };

    })
    .catch(() => {

      searchResult.innerHTML =
        "<div class='result-title'>Помилка пошуку</div>";

      searchResult.classList.add("show");

    });

  }, 450);

});


/* CLOSE SEARCH */

map.on("click", function() {
  searchResult.classList.remove("show");
});


/* TELEGRAM MINI APP */

if (window.Telegram && Telegram.WebApp) {

  Telegram.WebApp.ready();

  Telegram.WebApp.expand();

}


/* PREVENT ACCIDENTAL PAGE SCROLL */

document.addEventListener(
  "touchmove",
  function(e) {

    if (e.target.closest("#map")) {
      return;
    }

  },
  {
    passive: true
  }
);

</script>

</body>
</html>
