<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />

  <title>ONLINE RADAR</title>

  <link
    href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css"
    rel="stylesheet"
  />

  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #050708;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }

    body {
      position: fixed;
      inset: 0;
      color: #eaf4f6;
    }


    /* =========================================================
       MAP
       ========================================================= */

    #map {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      background: #050708;
    }


    /* =========================================================
       SMALL BOTTOM STATUS
       ========================================================= */

    .bottom-status {
      position: absolute;

      z-index: 30;

      left: 50%;

      bottom:
        calc(
          env(safe-area-inset-bottom, 0px) + 14px
        );

      transform: translateX(-50%);

      display: flex;

      align-items: center;
      justify-content: center;

      height: 34px;

      padding: 0 14px;

      border-radius: 18px;

      border: 1px solid rgba(65, 225, 192, 0.13);

      background:
        rgba(3, 11, 12, 0.68);

      box-shadow:
        0 5px 22px rgba(0, 0, 0, 0.32);

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      pointer-events: none;

      white-space: nowrap;
    }


    /* =========================================================
       ONLINE DOT
       ========================================================= */

    .online-dot {
      width: 6px;
      height: 6px;

      flex: 0 0 6px;

      margin-right: 7px;

      border-radius: 50%;

      background: #48efad;

      box-shadow:
        0 0 6px rgba(72, 239, 173, 0.85),
        0 0 12px rgba(72, 239, 173, 0.3);

      animation:
        smallPulse 2s ease-in-out infinite;
    }


    @keyframes smallPulse {

      0%,
      100% {
        opacity: 0.72;
        transform: scale(0.9);
      }

      50% {
        opacity: 1;
        transform: scale(1);
      }

    }


    /* =========================================================
       ONLINE RADAR
       ========================================================= */

    .online-label {

      font-size: 9px;

      font-weight: 700;

      letter-spacing: 0.16em;

      color:
        rgba(239, 248, 248, 0.88);
    }


    /* =========================================================
       SEPARATOR
       ========================================================= */

    .status-separator {

      width: 1px;

      height: 12px;

      margin:
        0 9px;

      background:
        rgba(210, 230, 232, 0.16);
    }


    /* =========================================================
       DATE / TIME
       ========================================================= */

    .datetime {

      font-family:
        "SFMono-Regular",
        Menlo,
        Monaco,
        Consolas,
        monospace;

      font-size: 9px;

      letter-spacing: 0.045em;

      color:
        rgba(193, 213, 215, 0.62);
    }


    /* =========================================================
       MAPLIBRE CONTROLS
       ========================================================= */

    .maplibregl-ctrl-top-right {
      display: none !important;
    }

    .maplibregl-ctrl-attrib {
      display: none !important;
    }

    .maplibregl-ctrl-logo {
      display: none !important;
    }


    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 600px) {

      .bottom-status {

        bottom:
          calc(
            env(safe-area-inset-bottom, 0px) + 13px
          );

        height: 33px;

        padding:
          0 13px;

        border-radius: 17px;
      }


      .online-dot {

        width: 6px;
        height: 6px;

        flex-basis: 6px;

        margin-right: 7px;
      }


      .online-label {

        font-size: 8.5px;

        letter-spacing: 0.145em;
      }


      .status-separator {

        height: 11px;

        margin:
          0 8px;
      }


      .datetime {

        font-size: 8.5px;

        letter-spacing: 0.035em;
      }

    }

  </style>
</head>


<body>


  <!-- =======================================================
       MAP
       ======================================================== -->

  <div id="map"></div>


  <!-- =======================================================
       SMALL BOTTOM STATUS
       ======================================================== -->

  <div class="bottom-status">

    <div class="online-dot"></div>

    <div class="online-label">
      ONLINE RADAR
    </div>

    <div class="status-separator"></div>

    <div
      class="datetime"
      id="datetime"
    ></div>

  </div>


  <!-- =======================================================
       MAPLIBRE
       ======================================================== -->

  <script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>


  <script>

    /* =========================================================
       MAP STYLE
       ========================================================= */

    const MAP_STYLE =
      "https://tiles.openfreemap.org/styles/dark";


    /* =========================================================
       INITIAL VIEW
       ========================================================= */

    const KYIV_VIEW_BOUNDS = [
      [28.55, 48.82],
      [32.72, 51.78]
    ];


    /* =========================================================
       MAXIMUM PAN AREA
       ========================================================= */

    const MAP_MAX_BOUNDS = [
      [28.25, 48.55],
      [33.15, 52.05]
    ];


    /* =========================================================
       MAP
       
       НЕ ЗМІНЕНО
       ========================================================= */

    const map =
      new maplibregl.Map({

        container: "map",

        style: MAP_STYLE,

        attributionControl: true,

        center: [
          30.95,
          50.75
        ],

        zoom: 5.7,

        minZoom: 5.7,

        maxZoom: 16,

        maxBounds: MAP_MAX_BOUNDS,

        dragRotate: false,

        pitchWithRotate: false,

        touchPitch: false,

        cooperativeGestures: false

      });


    /* =========================================================
       MAP LOAD
       ========================================================= */

    map.on("load", () => {

      map.fitBounds(
        KYIV_VIEW_BOUNDS,
        {

          padding: {

            top: 40,

            bottom: 95,

            left: 18,

            right: 18

          },

          maxZoom: 6.15,

          duration: 0

        }
      );


      const initialZoom =
        map.getZoom();

      map.setMinZoom(initialZoom);


      buildCustomMapLayers();


      map.dragRotate.disable();

      map.touchZoomRotate.disableRotation();

    });


    /* =========================================================
       CUSTOM MAP LAYERS
       ========================================================= */

    function buildCustomMapLayers() {


      /* =======================================================
         HIDE DEFAULT PLACE LABELS
         ======================================================= */

      const allLayers =
        map.getStyle().layers || [];


      allLayers.forEach(layer => {

        if (
          layer.source === "openmaptiles" &&
          layer["source-layer"] === "place" &&
          layer.type === "symbol"
        ) {

          try {

            map.setLayoutProperty(
              layer.id,
              "visibility",
              "none"
            );

          } catch (e) {}

        }

      });


      /* =======================================================
         KYIV OBLAST
         
         ТІЛЬКИ ЦЕЙ БЛОК ЗМІНЕНО.
         
         Виділяємо саме UA-32 —
         Київську область.
         ======================================================= */


      /*
        ---------------------------------------------------------
        ЛЕГКА ВНУТРІШНЯ ЗАЛИВКА
        ---------------------------------------------------------
      */

      if (
        !map.getLayer(
          "kyiv-oblast-fill"
        )
      ) {

        map.addLayer({

          id:
            "kyiv-oblast-fill",

          type:
            "fill",

          source:
            "openmaptiles",

          "source-layer":
            "boundary",

          minzoom:
            3,

          filter: [

            "all",

            [
              "==",
              [
                "to-string",
                [
                  "get",
                  "admin_level"
                ]
              ],
              "4"
            ],

            [
              "any",

              [
                "==",
                [
                  "get",
                  "iso_3166_2"
                ],
                "UA-32"
              ],

              [
                "==",
                [
                  "get",
                  "name:uk"
                ],
                "Київська область"
              ],

              [
                "==",
                [
                  "get",
                  "name"
                ],
                "Kyiv Oblast"
              ],

              [
                "==",
                [
                  "get",
                  "name"
                ],
                "Київська область"
              ]

            ]

          ],

          paint: {

            "fill-color":
              "#00d9e8",

            "fill-opacity":
              0.045

          }

        });

      }


      /*
        ---------------------------------------------------------
        NEON GLOW
        ---------------------------------------------------------
      */

      if (
        !map.getLayer(
          "kyiv-oblast-neon-glow"
        )
      ) {

        map.addLayer({

          id:
            "kyiv-oblast-neon-glow",

          type:
            "line",

          source:
            "openmaptiles",

          "source-layer":
            "boundary",

          minzoom:
            3,

          filter: [

            "all",

            [
              "==",
              [
                "to-string",
                [
                  "get",
                  "admin_level"
                ]
              ],
              "4"
            ],

            [
              "any",

              [
                "==",
                [
                  "get",
                  "iso_3166_2"
                ],
                "UA-32"
              ],

              [
                "==",
                [
                  "get",
                  "name:uk"
                ],
                "Київська область"
              ],

              [
                "==",
                [
                  "get",
                  "name"
                ],
                "Kyiv Oblast"
              ],

              [
                "==",
                [
                  "get",
                  "name"
                ],
                "Київська область"
              ]

            ]

          ],

          paint: {

            "line-color":
              "#00eaff",

            "line-opacity":
              0.30,

            "line-width": [
              "interpolate",
              ["linear"],
              ["zoom"],

              4,
              3,

              7,
              4,

              11,
              6,

              16,
              9

            ],

            "line-blur":
              5

          }

        });

      }


      /*
        ---------------------------------------------------------
        ОСНОВНИЙ НЕОНОВИЙ КОНТУР
        ---------------------------------------------------------
      */

      if (
        !map.getLayer(
          "kyiv-oblast-neon-outline"
        )
      ) {

        map.addLayer({

          id:
            "kyiv-oblast-neon-outline",

          type:
            "line",

          source:
            "openmaptiles",

          "source-layer":
            "boundary",

          minzoom:
            3,

          filter: [

            "all",

            [
              "==",
              [
                "to-string",
                [
                  "get",
                  "admin_level"
                ]
              ],
              "4"
            ],

            [
              "any",

              [
                "==",
                [
                  "get",
                  "iso_3166_2"
                ],
                "UA-32"
              ],

              [
                "==",
                [
                  "get",
                  "name:uk"
                ],
                "Київська область"
              ],

              [
                "==",
                [
                  "get",
                  "name"
                ],
                "Kyiv Oblast"
              ],

              [
                "==",
                [
                  "get",
                  "name"
                ],
                "Київська область"
              ]

            ]

          ],

          paint: {

            "line-color":
              "#00eaff",

            "line-opacity":
              0.92,

            "line-width": [

              "interpolate",

              ["linear"],

              ["zoom"],

              4,
              1.4,

              6,
              1.8,

              8,
              2.2,

              11,
              2.8,

              15,
              3.5

            ],

            "line-blur":
              0.25

          }

        });

      }


      /* =======================================================
         DISTRICT BOUNDARIES
         ======================================================= */

      if (
        !map.getLayer(
          "kyiv-districts"
        )
      ) {

        map.addLayer({

          id:
            "kyiv-districts",

          type:
            "line",

          source:
            "openmaptiles",

          "source-layer":
            "boundary",

          minzoom:
            5.4,

          filter: [

            "all",

            [
              "==",
              [
                "to-string",
                [
                  "get",
                  "admin_level"
                ]
              ],
              "6"
            ]

          ],

          paint: {

            "line-color":
              "#52686b",

            "line-opacity": [

              "interpolate",

              ["linear"],

              ["zoom"],

              5.4,
              0.24,

              8,
              0.32,

              12,
              0.42

            ],

            "line-width": [

              "interpolate",

              ["linear"],

              ["zoom"],

              5.4,
              0.65,

              10,
              1.05,

              14,
              1.5

            ],

            "line-dasharray":
              [2, 2]

          }

        });

      }


      /* =======================================================
         MAIN UKRAINIAN SETTLEMENT LABELS
         ======================================================= */

      if (
        !map.getLayer(
          "settlements-ukrainian"
        )
      ) {

        map.addLayer({

          id:
            "settlements-ukrainian",

          type:
            "symbol",

          source:
            "openmaptiles",

          "source-layer":
            "place",

          minzoom:
            5.0,

          maxzoom:
            16,

          layout: {

            "symbol-placement":
              "point",

            "symbol-sort-key": [

              "coalesce",

              [
                "to-number",
                [
                  "get",
                  "rank"
                ]
              ],

              99

            ],

            "text-field": [

              "coalesce",

              [
                "get",
                "name:uk"
              ],

              [
                "get",
                "name"
              ]

            ],

            "text-font": [
              "Noto Sans Regular"
            ],

            "text-anchor":
              "top",

            "text-offset": [
              0,
              0.72
            ],

            "text-allow-overlap":
              false,

            "text-ignore-placement":
              false,

            "text-padding":
              2,

            "text-max-width":
              9,

            "text-size": [

              "interpolate",

              ["linear"],

              ["zoom"],

              5.0,

              [

                "match",

                ["get", "class"],

                "city",
                15,

                "town",
                13,

                "village",
                10,

                9

              ],

              6.2,

              [

                "match",

                ["get", "class"],

                "city",
                17,

                "town",
                14,

                "village",
                10.5,

                9

              ],

              9.0,

              [

                "match",

                ["get", "class"],

                "city",
                20,

                "town",
                16,

                "village",
                12,

                "hamlet",
                10,

                9

              ],

              13.0,

              [

                "match",

                ["get", "class"],

                "city",
                22,

                "town",
                18,

                "village",
                14,

                "hamlet",
                11,

                10

              ],

              16.0,

              [

                "match",

                ["get", "class"],

                "city",
                24,

                "town",
                20,

                "village",
                16,

                "hamlet",
                12,

                10

              ]

            ]

          },

          paint: {

            "text-color": [

              "match",

              ["get", "class"],

              "city",
              "#ffffff",

              "town",
              "#e8f4f5",

              "village",
              "#d0e1e3",

              "hamlet",
              "#b9ccce",

              "#c9dcde"

            ],

            "text-halo-color":
              "#050708",

            "text-halo-width": [

              "interpolate",

              ["linear"],

              ["zoom"],

              5,
              2.2,

              10,
              2.5,

              16,
              3

            ],

            "text-halo-blur":
              0.15

          },

          filter: [

            "in",

            "class",

            "city",

            "town",

            "village",

            "hamlet",

            "suburb",

            "neighbourhood",

            "isolated_dwelling"

          ]

        });

      }


      /* =======================================================
         SMALL SETTLEMENTS
         ======================================================= */

      if (
        !map.getLayer(
          "small-settlements-ukrainian"
        )
      ) {

        map.addLayer({

          id:
            "small-settlements-ukrainian",

          type:
            "symbol",

          source:
            "openmaptiles",

          "source-layer":
            "place",

          minzoom:
            9.0,

          maxzoom:
            16,

          layout: {

            "symbol-placement":
              "point",

            "symbol-sort-key": [

              "coalesce",

              [
                "to-number",
                [
                  "get",
                  "rank"
                ]
              ],

              100

            ],

            "text-field": [

              "coalesce",

              [
                "get",
                "name:uk"
              ],

              [
                "get",
                "name"
              ]

            ],

            "text-font": [
              "Noto Sans Regular"
            ],

            "text-anchor":
              "top",

            "text-offset": [
              0,
              0.65
            ],

            "text-padding":
              1,

            "text-max-width":
              8,

            "text-size": [

              "interpolate",

              ["linear"],

              ["zoom"],

              9,
              9,

              12,
              11,

              16,
              14

            ]

          },

          paint: {

            "text-color":
              "#aebfc1",

            "text-halo-color":
              "#050708",

            "text-halo-width":
              2,

            "text-halo-blur":
              0.2

          },

          filter: [

            "in",

            "class",

            "hamlet",

            "isolated_dwelling",

            "neighbourhood"

          ]

        });

      }


      /* =======================================================
         WATER LABELS
         ======================================================= */

      if (
        !map.getLayer(
          "water-labels-ukrainian"
        )
      ) {

        map.addLayer({

          id:
            "water-labels-ukrainian",

          type:
            "symbol",

          source:
            "openmaptiles",

          "source-layer":
            "water",

          minzoom:
            7,

          layout: {

            "text-field": [

              "coalesce",

              [
                "get",
                "name:uk"
              ],

              [
                "get",
                "name"
              ]

            ],

            "text-font": [
              "Noto Sans Italic"
            ],

            "text-size": [

              "interpolate",

              ["linear"],

              ["zoom"],

              7,
              10,

              11,
              14,

              15,
              18

            ],

            "text-max-width":
              8

          },

          paint: {

            "text-color":
              "rgba(110, 170, 180, 0.65)",

            "text-halo-color":
              "rgba(3, 8, 10, 0.9)",

            "text-halo-width":
              1.5

          }

        });

      }

    }


    /* =========================================================
       DATE / TIME
       ========================================================= */

    function updateDateTime() {

      const now =
        new Date();


      const date =

        String(
          now.getDate()
        ).padStart(2, "0")

        + "."

        +

        String(
          now.getMonth() + 1
        ).padStart(2, "0")

        + "."

        +

        now.getFullYear();


      const time =

        String(
          now.getHours()
        ).padStart(2, "0")

        + ":"

        +

        String(
          now.getMinutes()
        ).padStart(2, "0")

        + ":"

        +

        String(
          now.getSeconds()
        ).padStart(2, "0");


      document
        .getElementById("datetime")
        .textContent =
          `${date} · ${time}`;
    }


    updateDateTime();


    setInterval(
      updateDateTime,
      1000
    );

  </script>

</body>
</html>
