<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
>

<title>ONLINE RADAR</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/maplibre-gl@5.9.0/dist/maplibre-gl.css"
>

<script src="https://unpkg.com/maplibre-gl@5.9.0/dist/maplibre-gl.js"></script>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

:root {
  --bg: #050708;
  --panel: rgba(5,8,9,.82);
  --border: rgba(255,255,255,.085);
  --white: #edf2f3;
  --muted: #78858a;
  --green: #62ff91;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width:100%;
  height:100%;
  margin:0;
  padding:0;
  overflow:hidden;
  background:var(--bg);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
}

body {
  position:fixed;
  inset:0;
}

#map {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  background:#050708;
}


/* =========================================================
   TOP
========================================================= */

.topbar {

  position:fixed;
  z-index:1000;

  top:max(12px,env(safe-area-inset-top));
  left:13px;

  display:flex;
  align-items:center;

  gap:9px;

  padding:9px 13px;

  border:1px solid var(--border);
  border-radius:12px;

  background:rgba(5,8,9,.80);

  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);

  box-shadow:
    0 8px 30px rgba(0,0,0,.42);

  pointer-events:none;
}

.status-dot {

  width:8px;
  height:8px;

  border-radius:50%;

  background:var(--green);

  box-shadow:
    0 0 9px rgba(98,255,145,.9);

  animation:pulse 1.8s infinite;
}

.top-title {

  color:#f2f5f6;

  font-size:11px;

  font-weight:750;

  letter-spacing:.17em;

  line-height:1;

  white-space:nowrap;
}

@keyframes pulse {

  0% {
    box-shadow:
      0 0 0 0 rgba(98,255,145,.5),
      0 0 9px rgba(98,255,145,.9);
  }

  70% {
    box-shadow:
      0 0 0 7px rgba(98,255,145,0),
      0 0 12px rgba(98,255,145,.9);
  }

  100% {
    box-shadow:
      0 0 0 0 rgba(98,255,145,0),
      0 0 9px rgba(98,255,145,.9);
  }
}


/* =========================================================
   BOTTOM
========================================================= */

.bottom-panel {

  position:fixed;
  z-index:1000;

  left:13px;
  bottom:max(13px,env(safe-area-inset-bottom));

  padding:10px 12px;

  border:1px solid var(--border);
  border-radius:11px;

  background:rgba(5,8,9,.84);

  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);

  box-shadow:
    0 8px 30px rgba(0,0,0,.42);

  pointer-events:none;
}

.region-name {

  color:#e9edef;

  font-size:9px;

  font-weight:750;

  letter-spacing:.16em;
}

.clock {

  margin-top:4px;

  color:#7e8a8f;

  font-family:
    "SF Mono",
    "Roboto Mono",
    Consolas,
    monospace;

  font-size:9px;

  letter-spacing:.035em;
}


/* =========================================================
   MAPLIBRE
========================================================= */

.maplibregl-ctrl-bottom-right {
  right:7px;
  bottom:7px;
}

.maplibregl-ctrl-attrib {

  background:rgba(4,7,8,.72)!important;

  color:#647075!important;

  font-size:8px!important;

  border-radius:6px;
}

.maplibregl-ctrl-attrib a {
  color:#7d898e!important;
}


/* =========================================================
   INFO BUTTON
========================================================= */

.info-button {

  position:fixed;

  z-index:1001;

  right:12px;

  bottom:max(15px,env(safe-area-inset-bottom));

  width:38px;
  height:38px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  border:1px solid rgba(255,255,255,.12);

  background:rgba(8,11,12,.82);

  backdrop-filter:blur(12px);

  color:#aab3b6;

  font-size:18px;

  font-weight:700;

  box-shadow:
    0 8px 24px rgba(0,0,0,.4);
}


/* =========================================================
   LOADING
========================================================= */

#loading {

  position:fixed;

  z-index:5000;

  inset:0;

  display:flex;

  align-items:center;
  justify-content:center;

  background:
    radial-gradient(
      circle,
      #11191a 0%,
      #06090a 48%,
      #030506 100%
    );

  transition:opacity .45s ease;
}

#loading.hidden {

  opacity:0;

  pointer-events:none;
}

.loading-ring {

  width:30px;
  height:30px;

  margin:0 auto 12px;

  border-radius:50%;

  border:
    2px solid rgba(255,255,255,.08);

  border-top-color:var(--green);

  animation:spin .75s linear infinite;
}

.loading-text {

  color:#778388;

  font-size:9px;

  font-weight:650;

  letter-spacing:.18em;
}

@keyframes spin {
  to {
    transform:rotate(360deg);
  }
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:430px) {

  .topbar {
    left:10px;
  }

  .bottom-panel {
    left:10px;
  }

  .info-button {
    right:10px;
  }
}

</style>
</head>

<body>


<div id="map"></div>


<div id="loading">

  <div>

    <div class="loading-ring"></div>

    <div class="loading-text">
      INITIALIZING MAP
    </div>

  </div>

</div>


<div class="topbar">

  <span class="status-dot"></span>

  <span class="top-title">
    ONLINE RADAR
  </span>

</div>


<div class="bottom-panel">

  <div class="region-name">
    КИЇВСЬКА ОБЛАСТЬ
  </div>

  <div
    id="clock"
    class="clock"
  >
    --.--.---- · --:--:--
  </div>

</div>


<div class="info-button">
  i
</div>


<script>

/* =========================================================
   TELEGRAM
========================================================= */

const tg =
  window.Telegram?.WebApp;

if (tg) {

  try {

    tg.ready();
    tg.expand();

    tg.setHeaderColor?.("#050708");
    tg.setBackgroundColor?.("#050708");

  } catch(e) {}

}


/* =========================================================
   CLOCK
========================================================= */

const clock =
  document.getElementById("clock");

function updateClock() {

  const now =
    new Date();

  const date =
    new Intl.DateTimeFormat(
      "uk-UA",
      {
        timeZone:"Europe/Kyiv",
        day:"2-digit",
        month:"2-digit",
        year:"numeric"
      }
    ).format(now);

  const time =
    new Intl.DateTimeFormat(
      "uk-UA",
      {
        timeZone:"Europe/Kyiv",
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit",
        hour12:false
      }
    ).format(now);

  clock.textContent =
    `${date} · ${time}`;

}

updateClock();

setInterval(
  updateClock,
  1000
);


/* =========================================================
   SOURCES
========================================================= */

const STYLE_URL =
  "https://tiles.openfreemap.org/styles/dark";

const OBLAST_URL =
  "https://geo2day.com/europe/ukraine/kiev_oblast.geojson";


/*
 * Стартовий viewport.
 *
 * Тут спеціально не беремо весь bounding box області:
 * на телефоні вона тоді стає занадто маленькою.
 */

const START_CENTER = [
  30.78,
  50.32
];

const START_ZOOM = 8.45;


/*
 * Максимально дозволена зона.
 */

const MAX_BOUNDS = [

  [29.18,49.10],

  [32.25,51.58]

];


/* =========================================================
   LOAD STYLE
========================================================= */

async function start() {

  try {

    const response =
      await fetch(
        STYLE_URL,
        {
          cache:"no-store"
        }
      );

    if (!response.ok) {
      throw new Error(
        `Style HTTP ${response.status}`
      );
    }

    const style =
      await response.json();


    prepareStyle(style);

    createMap(style);

  }

  catch(error) {

    console.error(
      "Map style error:",
      error
    );

    document
      .querySelector(".loading-text")
      .textContent =
        "MAP CONNECTION ERROR";

  }

}


/* =========================================================
   STYLE
========================================================= */

function prepareStyle(style) {

  if (!style.layers) {
    return;
  }


  for (
    const layer of style.layers
  ) {

    const sourceLayer =
      String(
        layer["source-layer"] || ""
      ).toLowerCase();

    const id =
      String(
        layer.id || ""
      ).toLowerCase();


    /* -----------------------------------------------------
       BACKGROUND
    ------------------------------------------------------ */

    if (
      layer.type === "background"
    ) {

      layer.paint = {

        ...(layer.paint || {}),

        "background-color":
          "#050708"

      };

    }


    /* -----------------------------------------------------
       WATER
    ------------------------------------------------------ */

    if (
      sourceLayer === "water"
    ) {

      if (
        layer.type === "fill"
      ) {

        layer.paint = {

          ...(layer.paint || {}),

          "fill-color":
            "#08191d",

          "fill-opacity":
            .96

        };

      }

    }


    /* -----------------------------------------------------
       WATERWAYS
    ------------------------------------------------------ */

    if (
      sourceLayer === "waterway" &&
      layer.type === "line"
    ) {

      layer.paint = {

        ...(layer.paint || {}),

        "line-color":
          "#16464e",

        "line-opacity":
          .68

      };

    }


    /* -----------------------------------------------------
       LAND
    ------------------------------------------------------ */

    if (
      (
        sourceLayer === "landcover" ||
        sourceLayer === "landuse"
      ) &&
      layer.type === "fill"
    ) {

      layer.paint = {

        ...(layer.paint || {}),

        "fill-opacity":
          .72

      };

    }


    /* -----------------------------------------------------
       ROADS
    ------------------------------------------------------ */

    if (
      sourceLayer === "transportation" &&
      layer.type === "line"
    ) {

      layer.paint = {

        ...(layer.paint || {}),

        "line-opacity":
          0.58

      };

    }


    /* -----------------------------------------------------
       POI
    ------------------------------------------------------ */

    if (
      sourceLayer === "poi" ||
      sourceLayer === "housenumber"
    ) {

      layer.layout = {

        ...(layer.layout || {}),

        visibility:
          "none"

      };

    }


    /* -----------------------------------------------------
       DEFAULT PLACE LABELS
       
       Вимикаємо — створимо власні.
    ------------------------------------------------------ */

    if (
      sourceLayer === "place" &&
      layer.type === "symbol"
    ) {

      layer.layout = {

        ...(layer.layout || {}),

        visibility:
          "none"

      };

    }


    /* -----------------------------------------------------
       ROAD LABELS
    ------------------------------------------------------ */

    if (
      sourceLayer === "transportation_name" &&
      layer.type === "symbol"
    ) {

      layer.layout = {

        ...(layer.layout || {}),

        visibility:
          "none"

      };

    }

  }

}


/* =========================================================
   CREATE MAP
========================================================= */

function createMap(style) {

  const map =
    new maplibregl.Map({

      container:"map",

      style:style,

      center:
        START_CENTER,

      zoom:
        START_ZOOM,

      minZoom:
        7.45,

      maxZoom:
        16,

      maxBounds:
        MAX_BOUNDS,

      attributionControl:
        true,

      pitchWithRotate:
        false,

      dragRotate:
        false,

      touchPitch:
        false,

      touchZoomRotate:
        true,

      cooperativeGestures:
        false

    });


  window.KYIV_MAP =
    map;


  map.once(
    "load",
    async () => {

      try {

        const oblast =
          await loadOblast(
            map
          );


        addDistricts(
          map
        );


        addPlaces(
          map
        );


        addWaterLabels(
          map
        );


        addOblastFill(
          map
        );


        addOutsideDark(
          map,
          oblast
        );


        addOblastBorder(
          map
        );


        addKyivBoundary(
          map
        );


        /*
         * Після завантаження
         * залишаємо заданий стартовий кадр.
         */

        map.jumpTo({

          center:
            START_CENTER,

          zoom:
            START_ZOOM

        });


      }

      catch(error) {

        console.error(
          "Map layers:",
          error
        );

      }


      setTimeout(
        () => {

          document
            .getElementById("loading")
            .classList.add("hidden");

        },
        400
      );

    }
  );

}


/* =========================================================
   OBLAST
========================================================= */

async function loadOblast(map) {

  const response =
    await fetch(
      OBLAST_URL,
      {
        cache:"no-store"
      }
    );

  if (!response.ok) {

    throw new Error(
      `Oblast HTTP ${response.status}`
    );

  }

  const data =
    await response.json();


  map.addSource(
    "kyiv-oblast-real",
    {
      type:"geojson",
      data:data
    }
  );


  return data;

}


/* =========================================================
   OBLAST FILL
========================================================= */

function addOblastFill(map) {

  map.addLayer({

    id:
      "kyiv-oblast-fill",

    type:
      "fill",

    source:
      "kyiv-oblast-real",

    paint: {

      "fill-color":
        "#172923",

      "fill-opacity":
        .13

    }

  });

}


/* =========================================================
   OUTSIDE AREA
========================================================= */

function addOutsideDark(map, oblast) {

  /*
   * Великий полігон навколо області.
   *
   * Робимо сусідню територію темнішою.
   */

  const outer = {

    type:"Feature",

    geometry:{

      type:"Polygon",

      coordinates:[[

        [28.5,48.5],

        [33.2,48.5],

        [33.2,52.2],

        [28.5,52.2],

        [28.5,48.5]

      ]]

    }

  };


  /*
   * GeoJSON може бути MultiPolygon.
   * Для різниці використовуємо polygon clipping
   * через MapLibre fill-rule / mask-підхід.
   *
   * Найнадійніший варіант для Mini App:
   * зовнішній великий fill + реальна область
   * поверх нього.
   */

  map.addSource(
    "kyiv-outside",
    {
      type:"geojson",
      data:outer
    }
  );


  map.addLayer({

    id:
      "kyiv-outside-dark",

    type:
      "fill",

    source:
      "kyiv-outside",

    paint: {

      "fill-color":
        "#020405",

      "fill-opacity":
        .34

    }

  });


  /*
   * Повторно кладемо область поверх маски.
   */

  map.moveLayer(
    "kyiv-oblast-fill"
  );

}


/* =========================================================
   OBLAST BORDER
========================================================= */

function addOblastBorder(map) {

  map.addLayer({

    id:
      "kyiv-oblast-border",

    type:
      "line",

    source:
      "kyiv-oblast-real",

    paint: {

      "line-color":
        "#8da59e",

      "line-width":[

        "interpolate",

        ["linear"],

        ["zoom"],

        7.5,
        1.0,

        9,
        1.55,

        12,
        2.0,

        15,
        2.7

      ],

      "line-opacity":
        .88

    }

  });

}


/* =========================================================
   DISTRICTS
========================================================= */

function addDistricts(map) {

  /*
   * Реальні OSM admin_level 6.
   *
   * Важливо:
   * не додаємо жодних ручних полігонів.
   */

  map.addLayer({

    id:
      "kyiv-district-boundaries",

    type:
      "line",

    source:
      "openmaptiles",

    "source-layer":
      "boundary",

    minzoom:
      7.5,

    filter:[

      "all",

      [
        "==",
        "admin_level",
        6
      ]

    ],

    paint: {

      "line-color":
        "#647974",

      "line-width":[

        "interpolate",

        ["linear"],

        ["zoom"],

        7.5,
        .35,

        9,
        .65,

        12,
        1.0,

        15,
        1.35

      ],

      "line-opacity":[

        "interpolate",

        ["linear"],

        ["zoom"],

        7.5,
        .28,

        9,
        .42,

        12,
        .56,

        15,
        .68

      ],

      "line-dasharray":[
        2,
        3
      ]

    }

  });


  /*
   * Назви районів.
   */

  map.addLayer({

    id:
      "kyiv-district-names",

    type:
      "symbol",

    source:
      "openmaptiles",

    "source-layer":
      "boundary",

    minzoom:
      8.1,

    filter:[

      "all",

      [
        "==",
        "admin_level",
        6
      ],

      [
        "has",
        "name"
      ]

    ],

    layout:{

      "text-field":[

        "coalesce",

        [
          "get",
          "name:uk"
        ],

        [
          "get",
          "name"
        ]

      ],

      "text-font":[
        "Noto Sans Regular"
      ],

      "text-size":[

        "interpolate",

        ["linear"],

        ["zoom"],

        8.1,
        7.5,

        10,
        8.5,

        13,
        9.5

      ],

      "text-letter-spacing":
        .08,

      "text-max-width":
        8,

      "text-padding":
        5

    },

    paint:{

      "text-color":
        "#748783",

      "text-opacity":[

        "interpolate",

        ["linear"],

        ["zoom"],

        8.1,
        .25,

        10,
        .40,

        13,
        .52

      ],

      "text-halo-color":
        "#050708",

      "text-halo-width":
        1.4

    }

  });

}


/* =========================================================
   CITIES / SETTLEMENTS
========================================================= */

function addPlaces(map) {


  /*
   * ВЕЛИКІ МІСТА
   */

  map.addLayer({

    id:
      "kyiv-major-cities",

    type:
      "symbol",

    source:
      "openmaptiles",

    "source-layer":
      "place",

    minzoom:
      7.5,

    filter:[

      "all",

      [
        "==",
        "$type",
        "Point"
      ],

      [
        "==",
        "class",
        "city"
      ]

    ],

    layout:{

      "text-field":[

        "coalesce",

        [
          "get",
          "name:uk"
        ],

        [
          "get",
          "name"
        ]

      ],

      "text-font":[
        "Noto Sans Bold"
      ],

      "text-size":[

        "interpolate",

        ["linear"],

        ["zoom"],

        7.5,
        9,

        8.5,
        10,

        10,
        11,

        13,
        13,

        16,
        15

      ],

      "text-padding":
        5,

      "text-anchor":
        "center",

      "text-allow-overlap":
        false

    },

    paint:{

      "text-color":
        "#e9eeee",

      "text-halo-color":
        "#050708",

      "text-halo-width":
        2

    }

  });


  /*
   * TOWNS
   */

  map.addLayer({

    id:
      "kyiv-towns",

    type:
      "symbol",

    source:
      "openmaptiles",

    "source-layer":
      "place",

    minzoom:
      8.2,

    filter:[

      "all",

      [
        "==",
        "$type",
        "Point"
      ],

      [
        "==",
        "class",
        "town"
      ]

    ],

    layout:{

      "text-field":[

        "coalesce",

        [
          "get",
          "name:uk"
        ],

        [
          "get",
          "name"
        ]

      ],

      "text-font":[
        "Noto Sans Regular"
      ],

      "text-size":[

        "interpolate",

        ["linear"],

        ["zoom"],

        8.2,
        7.5,

        10,
        8.5,

        12,
        10,

        15,
        12

      ],

      "text-padding":
        4

    },

    paint:{

      "text-color":
        "#b7c1c2",

      "text-halo-color":
        "#050708",

      "text-halo-width":
        1.6

    }

  });


  /*
   * VILLAGES
   *
   * На стартовому масштабі приховані.
   */

  map.addLayer({

    id:
      "kyiv-villages",

    type:
      "symbol",

    source:
      "openmaptiles",

    "source-layer":
      "place",

    minzoom:
      10.5,

    filter:[

      "all",

      [
        "==",
        "$type",
        "Point"
      ],

      [
        "==",
        "class",
        "village"
      ]

    ],

    layout:{

      "text-field":[

        "coalesce",

        [
          "get",
          "name:uk"
        ],

        [
          "get",
          "name"
        ]

      ],

      "text-font":[
        "Noto Sans Regular"
      ],

      "text-size":[

        "interpolate",

        ["linear"],

        ["zoom"],

        10.5,
        7,

        13,
        8,

        16,
        10

      ],

      "text-padding":
        3

    },

    paint:{

      "text-color":
        "#8f9a9d",

      "text-halo-color":
        "#050708",

      "text-halo-width":
        1.3,

      "text-opacity":[

        "interpolate",

        ["linear"],

        ["zoom"],

        10.5,
        .35,

        12,
        .65,

        15,
        .85

      ]

    }

  });

}


/* =========================================================
   WATER LABELS
========================================================= */

function addWaterLabels(map) {

  map.addLayer({

    id:
      "kyiv-water-labels",

    type:
      "symbol",

    source:
      "openmaptiles",

    "source-layer":
      "water_name",

    minzoom:
      8,

    filter:[
      "has",
      "name"
    ],

    layout:{

      "text-field":[

        "coalesce",

        [
          "get",
          "name:uk"
        ],

        [
          "get",
          "name"
        ]

      ],

      "text-font":[
        "Noto Sans Regular"
      ],

      "text-size":[

        "interpolate",

        ["linear"],

        ["zoom"],

        8,
        8,

        11,
        9,

        14,
        11

      ],

      "text-letter-spacing":
        .05,

      "text-max-width":
        7

    },

    paint:{

      "text-color":
        "#39717a",

      "text-opacity":
        .66,

      "text-halo-color":
        "#061013",

      "text-halo-width":
        1.1

    }

  });

}


/* =========================================================
   KYIV CITY
========================================================= */

function addKyivBoundary(map) {

  /*
   * Київ має окремий адміністративний статус.
   *
   * Показуємо його тонкою лінією,
   * без яскравого заповнення.
   */

  map.addLayer({

    id:
      "kyiv-city-boundary",

    type:
      "line",

    source:
      "openmaptiles",

    "source-layer":
      "boundary",

    minzoom:
      8,

    filter:[

      "all",

      [
        "==",
        "admin_level",
        6
      ],

      [
        "any",

        [
          "==",
          "name",
          "Київ"
        ],

        [
          "==",
          "name",
          "Kyiv"
        ]

      ]

    ],

    paint:{

      "line-color":
        "#a4b8b2",

      "line-width":[

        "interpolate",

        ["linear"],

        ["zoom"],

        8,
        .7,

        10,
        1.1,

        13,
        1.6,

        16,
        2

      ],

      "line-opacity":
        .62

    }

  });

}


/* =========================================================
   DISABLE ROTATION
========================================================= */

const mapElement =
  document.getElementById("map");

mapElement.addEventListener(
  "contextmenu",
  e => e.preventDefault()
);


/* =========================================================
   START
========================================================= */

start();

</script>
