<!DOCTYPE html>
<html lang="uk">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0,
  maximum-scale=1.0, user-scalable=no,
  viewport-fit=cover"
>

<title>Monitor Map UA</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #080d13;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    Arial,
    sans-serif;
}

body {
  position: fixed;
  inset: 0;
  color: #f5f8fb;
}

/* =========================================================
   MAP
========================================================= */

#map {
  position: absolute;
  inset: 0;
  z-index: 1;
  background: #0b1118;
}

/*
  OpenStreetMap працює без API-ключа.
  CSS робить звичайну карту темною.
*/

.leaflet-tile-pane {
  filter:
    brightness(0.52)
    contrast(1.18)
    saturate(0.72);
}

.leaflet-container {
  background: #0b1118;
  font-family: inherit;
}

.leaflet-control-attribution {
  background: rgba(4, 10, 16, 0.82) !important;
  color: #8b969f !important;
  border-radius: 10px 0 0 0;
  padding: 3px 7px !important;
  font-size: 9px !important;
}

.leaflet-control-attribution a {
  color: #8b969f !important;
}

/* =========================================================
   MAP OVERLAY
========================================================= */

.map-vignette {
  position: absolute;
  inset: 0;
  z-index: 400;
  pointer-events: none;

  background:
    radial-gradient(
      circle at center,
      transparent 35%,
      rgba(0,0,0,0.08) 65%,
      rgba(0,0,0,0.42) 100%
    );
}

/* =========================================================
   TOP PANEL
========================================================= */

.top-panel {
  position: absolute;
  z-index: 1000;

  top: calc(env(safe-area-inset-top) + 64px);
  left: 18px;
  right: 18px;

  max-width: 760px;
  margin: 0 auto;

  padding: 18px 18px 16px;

  border-radius: 30px;

  background:
    linear-gradient(
      145deg,
      rgba(5, 20, 30, 0.96),
      rgba(3, 11, 18, 0.94)
    );

  border: 1px solid rgba(0, 157, 224, 0.55);

  box-shadow:
    0 18px 45px rgba(0,0,0,0.48),
    inset 0 1px 0 rgba(255,255,255,0.04);

  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}

/* Верхній ряд */

.top-row {
  display: flex;
  align-items: center;
  gap: 14px;
}

/* Іконка */

.logo-box {
  flex: 0 0 64px;

  width: 64px;
  height: 64px;

  border-radius: 22px;

  display: flex;
  align-items: center;
  justify-content: center;

  background:
    linear-gradient(
      145deg,
      rgba(9, 43, 62, 0.95),
      rgba(3, 19, 28, 0.95)
    );

  border: 2px solid rgba(0, 158, 224, 0.72);

  font-size: 31px;

  box-shadow:
    0 0 20px rgba(0,150,220,0.12);
}

/* Назва */

.title-block {
  min-width: 0;
  flex: 1;
}

.main-title {
  font-size: clamp(22px, 6vw, 31px);
  line-height: 1.05;
  font-weight: 800;
  letter-spacing: -0.7px;

  white-space: nowrap;
}

.subtitle {
  margin-top: 5px;

  color: #8d9aa4;

  font-size: 16px;
  line-height: 1.2;

  white-space: nowrap;
}

/* Online */

.online {
  flex: 0 0 auto;

  display: flex;
  align-items: center;
  gap: 9px;

  padding: 12px 17px;

  border-radius: 999px;

  color: #43e5a1;

  font-size: 16px;
  font-weight: 700;

  background:
    rgba(0, 88, 59, 0.23);

  border: 1px solid rgba(0, 202, 128, 0.48);

  box-shadow:
    inset 0 0 18px rgba(0,255,160,0.04);
}

.online-dot {
  width: 11px;
  height: 11px;

  border-radius: 50%;

  background: #38e7a0;

  box-shadow:
    0 0 12px rgba(56,231,160,0.75);
}

/* Search */

.search-box {
  margin-top: 14px;

  height: 58px;

  display: flex;
  align-items: center;

  padding: 0 17px;

  border-radius: 22px;

  background: rgba(17, 30, 39, 0.94);

  border: 1px solid rgba(104, 143, 165, 0.23);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.025);
}

.search-icon {
  flex: 0 0 auto;

  width: 28px;

  font-size: 25px;

  color: #82919b;
}

#search {
  width: 100%;
  min-width: 0;

  border: none;
  outline: none;

  background: transparent;

  color: #f3f7fa;

  font-size: 18px;

  font-family: inherit;
}

#search::placeholder {
  color: #77838d;
}

/* =========================================================
   MAP BUTTONS
========================================================= */

.map-buttons {
  position: absolute;

  z-index: 1000;

  right: 18px;

  top: 50%;

  transform: translateY(-50%);

  display: flex;
  flex-direction: column;

  gap: 12px;
}

.map-btn {
  width: 66px;
  height: 66px;

  border-radius: 22px;

  display: flex;
  align-items: center;
  justify-content: center;

  background:
    rgba(4, 17, 25, 0.94);

  border: 1px solid rgba(0, 142, 201, 0.45);

  color: #ffffff;

  font-size: 38px;

  box-shadow:
    0 12px 30px rgba(0,0,0,0.38);

  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.map-btn:active {
  transform: scale(0.94);
}

.location-btn {
  color: #31baff;
  font-size: 34px;
}

/* =========================================================
   UKRAINE / CRIMEA / KYIV LABELS
========================================================= */

.region-label {
  background: transparent !important;
  border: none !important;
  box-shadow: none !important;

  color: rgba(220,235,244,0.52);

  font-size: 12px;
  font-weight: 700;

  text-transform: uppercase;

  letter-spacing: 2px;
}

.region-label::before {
  display: none;
}

/* Крим */

.crimea-label {
  color: #aeb8bf;

  background:
    rgba(7,15,21,0.82) !important;

  border:
    1px solid rgba(130,145,155,0.28) !important;

  padding: 8px 13px !important;

  border-radius: 13px !important;

  font-size: 13px;
  font-weight: 700;

  letter-spacing: 0.4px;

  box-shadow:
    0 8px 20px rgba(0,0,0,0.28) !important;
}

.crimea-label strong {
  display: block;

  color: #dce4e9;

  font-size: 14px;
  margin-bottom: 3px;
}

.crimea-label span {
  color: #7e8a93;

  font-size: 10px;
  font-weight: 500;
}

/* Київ */

.kyiv-marker {
  width: 18px;
  height: 18px;

  border-radius: 50%;

  background: #27b8ff;

  border: 3px solid rgba(5,20,29,0.95);

  box-shadow:
    0 0 0 4px rgba(39,184,255,0.24),
    0 0 22px rgba(39,184,255,0.72);
}

.kyiv-label {
  color: #ffffff;

  background:
    rgba(3,17,27,0.94) !important;

  border:
    1px solid rgba(39,184,255,0.62) !important;

  padding: 6px 10px !important;

  border-radius: 10px !important;

  font-size: 12px;

  font-weight: 800;

  letter-spacing: 0.5px;

  box-shadow:
    0 8px 18px rgba(0,0,0,0.3) !important;
}

/* =========================================================
   BOTTOM NAV
========================================================= */

.bottom-panel {
  position: absolute;

  z-index: 1000;

  left: 18px;
  right: 18px;

  bottom: calc(env(safe-area-inset-bottom) + 14px);

  max-width: 760px;
  margin: 0 auto;

  height: 92px;

  padding: 8px;

  display: grid;

  grid-template-columns:
    repeat(4, 1fr);

  gap: 4px;

  border-radius: 30px;

  background:
    rgba(3, 14, 21, 0.96);

  border:
    1px solid rgba(0, 139, 200, 0.48);

  box-shadow:
    0 16px 40px rgba(0,0,0,0.5);

  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}

.nav-item {
  border: none;

  border-radius: 23px;

  background: transparent;

  color: #77838c;

  display: flex;
  flex-direction: column;

  align-items: center;
  justify-content: center;

  gap: 5px;

  font-family: inherit;

  font-size: 14px;
  font-weight: 700;
}

.nav-icon {
  font-size: 25px;
  line-height: 1;
}

.nav-item.active {
  color: #35baff;

  background:
    linear-gradient(
      145deg,
      rgba(7,52,78,0.95),
      rgba(4,35,54,0.95)
    );
}

/* =========================================================
   DATA LABEL
========================================================= */

.data-label {
  position: absolute;

  z-index: 1000;

  left: 18px;

  bottom:
    calc(
      env(safe-area-inset-bottom) + 112px
    );

  padding: 9px 14px;

  border-radius: 18px;

  background:
    rgba(4,15,22,0.9);

  border:
    1px solid rgba(0,120,170,0.3);

  color: #84929c;

  font-size: 12px;

  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

  .top-panel {
    top: calc(env(safe-area-inset-top) + 54px);

    left: 14px;
    right: 14px;

    padding: 15px 14px 14px;

    border-radius: 25px;
  }

  .top-row {
    gap: 11px;
  }

  .logo-box {
    flex-basis: 55px;

    width: 55px;
    height: 55px;

    border-radius: 18px;

    font-size: 27px;
  }

  .main-title {
    font-size: 22px;
  }

  .subtitle {
    font-size: 14px;
    margin-top: 3px;
  }

  .online {
    padding: 10px 12px;

    font-size: 14px;

    gap: 7px;
  }

  .online-dot {
    width: 9px;
    height: 9px;
  }

  .search-box {
    height: 53px;

    margin-top: 12px;

    border-radius: 19px;
  }

  #search {
    font-size: 16px;
  }

  .map-buttons {
    right: 12px;
    gap: 10px;
  }

  .map-btn {
    width: 62px;
    height: 62px;

    border-radius: 20px;
  }

  .bottom-panel {
    left: 12px;
    right: 12px;

    height: 88px;

    border-radius: 27px;
  }

  .nav-item {
    font-size: 12px;
  }

  .nav-icon {
    font-size: 23px;
  }

  .data-label {
    left: 14px;
    bottom:
      calc(
        env(safe-area-inset-bottom) + 105px
      );
  }
}

/* Дуже вузькі екрани */

@media (max-width: 380px) {

  .logo-box {
    flex-basis: 50px;
    width: 50px;
    height: 50px;
  }

  .main-title {
    font-size: 19px;
  }

  .subtitle {
    font-size: 12px;
  }

  .online {
    padding: 9px 10px;
    font-size: 12px;
  }

  .bottom-panel {
    height: 82px;
  }

  .nav-item {
    font-size: 11px;
  }
}

</style>
</head>


<body>

<!-- =====================================================
     MAP
===================================================== -->

<div id="map"></div>

<div class="map-vignette"></div>


<!-- =====================================================
     TOP
===================================================== -->

<div class="top-panel">

  <div class="top-row">

    <div class="logo-box">
      🗺️
    </div>

    <div class="title-block">

      <div class="main-title">
        Monitor Map UA
      </div>

      <div class="subtitle">
        Оперативна ситуація
      </div>

    </div>

    <div class="online">

      <span class="online-dot"></span>

      Онлайн

    </div>

  </div>


  <div class="search-box">

    <div class="search-icon">
      ⌕
    </div>

    <input
      id="search"
      type="search"
      placeholder="Пошук населеного пункту..."
      autocomplete="off"
      spellcheck="false"
    >

  </div>

</div>


<!-- =====================================================
     MAP CONTROLS
===================================================== -->

<div class="map-buttons">

  <button
    class="map-btn"
    id="zoomIn"
    aria-label="Збільшити"
  >
    +
  </button>

  <button
    class="map-btn"
    id="zoomOut"
    aria-label="Зменшити"
  >
    −
  </button>

  <button
    class="map-btn location-btn"
    id="locationBtn"
    aria-label="Моє місцезнаходження"
  >
    ◎
  </button>

</div>


<!-- =====================================================
     DATA
===================================================== -->

<div class="data-label">
  Карта · OpenStreetMap
</div>


<!-- =====================================================
     BOTTOM NAV
===================================================== -->

<div class="bottom-panel">

  <button class="nav-item active">

    <div class="nav-icon">
      ◎
    </div>

    <div>
      Карта
    </div>

  </button>


  <button class="nav-item">

    <div class="nav-icon">
      ●
    </div>

    <div>
      Події
    </div>

  </button>


  <button class="nav-item">

    <div class="nav-icon">
      ▤
    </div>

    <div>
      Легенда
    </div>

  </button>


  <button class="nav-item">

    <div class="nav-icon">
      ⓘ
    </div>

    <div>
      Про проєкт
    </div>

  </button>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>

/* =========================================================
   MAP INITIALIZATION
========================================================= */

/*
   Центр України.
   Zoom 6 = видно всю Україну.
*/

const map = L.map("map", {

  center: [48.5, 31.2],

  zoom: 6,

  minZoom: 5,

  maxZoom: 19,

  zoomControl: false,

  attributionControl: true,

  worldCopyJump: false,

  maxBoundsViscosity: 0.85

});


/* =========================================================
   OPENSTREETMAP
========================================================= */

L.tileLayer(
  "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
  {

    maxZoom: 19,

    minZoom: 0,

    attribution:
      '&copy; OpenStreetMap contributors',

    keepBuffer: 4,

    updateWhenZooming: false,

    updateWhenIdle: true

  }
).addTo(map);


/* =========================================================
   UKRAINE VIEW
========================================================= */

const ukraineBounds = L.latLngBounds(

  [44.0, 21.0],

  [53.0, 41.0]

);

map.setMaxBounds(ukraineBounds);


/* =========================================================
   CUSTOM ZOOM BUTTONS
========================================================= */

document
  .getElementById("zoomIn")
  .addEventListener("click", () => {

    map.zoomIn();

  });


document
  .getElementById("zoomOut")
  .addEventListener("click", () => {

    map.zoomOut();

  });


/* =========================================================
   LOCATION
========================================================= */

document
  .getElementById("locationBtn")
  .addEventListener("click", () => {

    map.locate({

      setView: true,

      maxZoom: 15,

      enableHighAccuracy: true

    });

  });


map.on("locationfound", function(e) {

  L.circleMarker(e.latlng, {

    radius: 8,

    color: "#35baff",

    fillColor: "#35baff",

    fillOpacity: 0.9,

    weight: 3

  })

  .addTo(map)

  .bindPopup("Ваше місцезнаходження");

});


map.on("locationerror", function() {

  alert(
    "Не вдалося визначити місцезнаходження."
  );

});


/* =========================================================
   KYIV
   Тільки місто
========================================================= */

const kyivIcon = L.divIcon({

  className: "",

  html:
    '<div class="kyiv-marker"></div>',

  iconSize: [18,18],

  iconAnchor: [9,9]

});


const kyiv = L.marker(

  [50.4501, 30.5234],

  {
    icon: kyivIcon,
    interactive: true
  }

).addTo(map);


kyiv.bindTooltip(

  "КИЇВ",

  {
    permanent: false,

    direction: "top",

    offset: [0,-10],

    className: "kyiv-label"

  }

);


/* =========================================================
   CRIMEA
========================================================= */

/*
   Без великого червоного напису.
   Акуратна нейтральна позначка.
*/

const crimeaLabel = L.marker(

  [45.15, 34.35],

  {
    interactive: false,

    icon: L.divIcon({

      className: "region-label",

      html: `
        <div class="crimea-label">
          <strong>Крим</strong>
          <span>тимчасово окупована територія</span>
        </div>
      `,

      iconSize: [190, 55],

      iconAnchor: [95, 27]

    })

  }

).addTo(map);


/* =========================================================
   SEARCH
========================================================= */

const searchInput =
  document.getElementById("search");


let searchTimer = null;


searchInput.addEventListener(
  "input",
  function() {

    const query =
      this.value.trim();

    clearTimeout(searchTimer);

    if (query.length < 2) {
      return;
    }

    searchTimer = setTimeout(
      () => searchPlace(query),
      650
    );

  }
);


async function searchPlace(query) {

  try {

    const url =
      "https://nominatim.openstreetmap.org/search?" +

      new URLSearchParams({

        q: query,

        format: "json",

        limit: "1",

        countrycodes: "ua",

        "accept-language": "uk"

      });


    const response =
      await fetch(url, {

        headers: {

          "Accept":
            "application/json"

        }

      });


    const data =
      await response.json();


    if (!data.length) {

      return;

    }


    const place = data[0];


    const lat =
      parseFloat(place.lat);

    const lon =
      parseFloat(place.lon);


    map.flyTo(

      [lat, lon],

      13,

      {
        duration: 1.2
      }

    );


    L.popup({

      closeButton: false,

      className: "place-popup"

    })

    .setLatLng([lat, lon])

    .setContent(

      `<strong>${escapeHtml(
        place.display_name
          .split(",")[0]
      )}</strong>`

    )

    .openOn(map);


  } catch (error) {

    console.log(
      "Search error:",
      error
    );

  }

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}


/* =========================================================
   BOTTOM NAV
========================================================= */

const navItems =
  document.querySelectorAll(
    ".nav-item"
  );


navItems.forEach(
  item => {

    item.addEventListener(
      "click",
      function() {

        navItems.forEach(
          el =>
            el.classList.remove(
              "active"
            )
        );

        this.classList.add(
          "active"
        );

      }
    );

  }
);


/* =========================================================
   TELEGRAM MINI APP
========================================================= */

if (
  window.Telegram &&
  window.Telegram.WebApp
) {

  const tg =
    window.Telegram.WebApp;

  tg.ready();

  tg.expand();

}


/* =========================================================
   FIX MAP SIZE
========================================================= */

setTimeout(
  () => {

    map.invalidateSize();

  },
  300
);


window.addEventListener(
  "resize",
  () => {

    map.invalidateSize();

  }
);

</script>

</body>
</html>
