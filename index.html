<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Monitor Map UA</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #080d12;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                 "Segoe UI", sans-serif;
}

#map {
    width: 100%;
    height: 100%;
    background: #080d12;
}

/* Верхня панель */
.header {
    position: absolute;
    z-index: 1000;
    top: 12px;
    left: 12px;
    right: 12px;
    height: 72px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 16px;

    background: rgba(10, 16, 22, 0.90);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 18px;

    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);

    box-shadow: 0 8px 30px rgba(0,0,0,0.35);
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.trident {
    font-size: 30px;
    color: #aeb9c5;
}

.title {
    color: #f3f5f7;
    font-size: 21px;
    font-weight: 700;
}

.subtitle {
    margin-top: 2px;
    color: #8d99a5;
    font-size: 12px;
}

.status {
    display: flex;
    align-items: center;
    gap: 8px;

    padding: 9px 12px;

    background: rgba(255,255,255,0.045);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 13px;

    color: #aeb7c0;
    font-size: 11px;
}

.status-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #58c878;
    box-shadow: 0 0 10px rgba(88,200,120,0.65);
}

/* Пошук */
.search {
    position: absolute;
    z-index: 1000;
    top: 94px;
    left: 12px;
    right: 75px;
}

.search input {
    width: 100%;
    height: 52px;

    padding: 0 18px 0 48px;

    color: white;
    font-size: 15px;

    background: rgba(10,16,22,0.90);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 16px;

    outline: none;

    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
}

.search input::placeholder {
    color: #77828d;
}

.search-icon {
    position: absolute;
    left: 17px;
    top: 14px;

    color: #aeb7c0;
    font-size: 21px;
}

/* Кнопки */
.controls {
    position: absolute;
    z-index: 1000;
    top: 94px;
    right: 12px;

    display: flex;
    flex-direction: column;
    gap: 10px;
}

.control {
    width: 52px;
    height: 52px;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #e6ebef;
    font-size: 23px;

    background: rgba(10,16,22,0.90);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 16px;

    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);

    box-shadow: 0 6px 20px rgba(0,0,0,0.25);
}

.control:active {
    transform: scale(0.94);
}

/* Нижня панель */
.bottom {
    position: absolute;
    z-index: 1000;

    left: 12px;
    right: 12px;
    bottom: 12px;

    height: 68px;

    display: flex;
    align-items: center;
    justify-content: space-around;

    background: rgba(10,16,22,0.94);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 20px;

    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);

    box-shadow: 0 -8px 30px rgba(0,0,0,0.30);
}

.bottom-item {
    min-width: 70px;

    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;

    color: #89949e;
    font-size: 11px;
}

.bottom-item.active {
    color: #6fa7ff;
}

.bottom-icon {
    font-size: 23px;
}

/* Leaflet */
.leaflet-control-zoom {
    display: none !important;
}

.leaflet-control-attribution {
    background: rgba(8,13,18,0.75) !important;
    color: #77828d !important;
    font-size: 8px !important;
}

.leaflet-control-attribution a {
    color: #8999a8 !important;
}

/* затемнення карти */
.leaflet-tile {
    filter: brightness(0.72) contrast(1.08) saturate(0.65);
}

/* Popup */
.leaflet-popup-content-wrapper,
.leaflet-popup-tip {
    background: #101820;
    color: white;
}

.leaflet-popup-content {
    font-size: 13px;
}

/* адаптація */
@media (max-width: 500px) {
    .header {
        height: 68px;
    }

    .title {
        font-size: 19px;
    }

    .subtitle {
        font-size: 11px;
    }

    .status {
        padding: 7px 9px;
    }
}
</style>
</head>

<body>

<div id="map"></div>

<!-- Верх -->
<div class="header">
    <div class="brand">
        <div class="trident">♜</div>

        <div>
            <div class="title">Monitor Map UA</div>
            <div class="subtitle">Оперативна ситуація</div>
        </div>
    </div>

    <div class="status">
        <span class="status-dot"></span>
        <span>Онлайн</span>
    </div>
</div>

<!-- Пошук -->
<div class="search">
    <div class="search-icon">⌕</div>
    <input
        id="search"
        type="text"
        placeholder="Пошук населеного пункту..."
    >
</div>

<!-- Кнопки -->
<div class="controls">
    <div class="control" onclick="map.zoomIn()">＋</div>
    <div class="control" onclick="map.zoomOut()">−</div>
    <div class="control" onclick="findLocation()">⌾</div>
</div>

<!-- Низ -->
<div class="bottom">

    <div class="bottom-item active">
        <div class="bottom-icon">⌖</div>
        <div>Карта</div>
    </div>

    <div class="bottom-item">
        <div class="bottom-icon">☷</div>
        <div>Події</div>
    </div>

    <div class="bottom-item">
        <div class="bottom-icon">ⓘ</div>
        <div>Легенда</div>
    </div>

    <div class="bottom-item">
        <div class="bottom-icon">⚙</div>
        <div>Про проєкт</div>
    </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map('map', {
    zoomControl: false,
    attributionControl: true,
    minZoom: 5,
    maxZoom: 18
}).setView([49.0, 31.0], 6);

/* Темна актуальна карта */
L.tileLayer(
    'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
    {
        maxZoom: 20,
        attribution:
        '&copy; OpenStreetMap contributors &copy; CARTO'
    }
).addTo(map);


/* Пошук населеного пункту */
const searchInput = document.getElementById('search');

let searchTimer;

searchInput.addEventListener('input', function() {

    clearTimeout(searchTimer);

    const query = this.value.trim();

    if (query.length < 3) return;

    searchTimer = setTimeout(async () => {

        try {

            const url =
                'https://nominatim.openstreetmap.org/search?' +
                'format=json&limit=1&countrycodes=ua&q=' +
                encodeURIComponent(query);

            const response = await fetch(url, {
                headers: {
                    'Accept-Language': 'uk'
                }
            });

            const data = await response.json();

            if (data.length > 0) {

                const lat = parseFloat(data[0].lat);
                const lon = parseFloat(data[0].lon);

                map.flyTo([lat, lon], 12, {
                    duration: 1.2
                });

                L.popup()
                    .setLatLng([lat, lon])
                    .setContent(
                        '<b>' +
                        data[0].display_name.split(',')[0] +
                        '</b>'
                    )
                    .openOn(map);
            }

        } catch (error) {
            console.log(error);
        }

    }, 700);
});


/* Моє місцезнаходження */
function findLocation() {

    if (!navigator.geolocation) {
        alert('Геолокація недоступна');
        return;
    }

    navigator.geolocation.getCurrentPosition(

        function(position) {

            const lat = position.coords.latitude;
            const lon = position.coords.longitude;

            map.flyTo([lat, lon], 12, {
                duration: 1.2
            });

            L.circleMarker([lat, lon], {
                radius: 8,
                color: '#ffffff',
                weight: 3,
                fillOpacity: 1
            })
            .addTo(map)
            .bindPopup('Ваше місцезнаходження')
            .openPopup();

        },

        function() {
            alert('Не вдалося отримати місцезнаходження');
        }
    );
}

</script>

</body>
</html>
