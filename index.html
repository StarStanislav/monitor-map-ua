<!DOCTYPE html>
<html lang="uk">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover"
>

<title>ONLINE RADAR</title>

<link
  href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css"
  rel="stylesheet"
>

<style>

/* =========================================================
   RESET
========================================================= */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {

  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  background: #050707;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Helvetica,
    Arial,
    sans-serif;
}

body {

  position: fixed;

  inset: 0;
}


/* =========================================================
   MAP
========================================================= */

#map {

  position: absolute;

  inset: 0;

  width: 100%;
  height: 100%;

  background: #070909;
}


/* =========================================================
   ONLINE RADAR
========================================================= */

.radar-badge {

  position: absolute;

  z-index: 20;

  top:
    max(
      24px,
      env(safe-area-inset-top)
    );

  left: 22px;

  height: 58px;

  padding: 0 22px;

  display: flex;

  align-items: center;

  gap: 14px;

  border-radius: 28px;

  background:
    rgba(5,10,10,.92);

  border:
    1px solid
    rgba(100,140,135,.22);

  box-shadow:

    0 8px 30px
    rgba(0,0,0,.35),

    inset 0 0 18px
    rgba(80,255,190,.025);

  backdrop-filter:
    blur(12px);

  -webkit-backdrop-filter:
    blur(12px);

  pointer-events:
    none;
}


.radar-dot {

  position: relative;

  width: 20px;
  height: 20px;

  flex: 0 0 20px;

  border-radius: 50%;

  background:
    #55f5a5;

  box-shadow:

    0 0 10px
    rgba(85,245,165,.9),

    0 0 25px
    rgba(85,245,165,.55);
}


.radar-dot::after {

  content: "";

  position: absolute;

  inset: -8px;

  border-radius: 50%;

  border:
    1px solid
    rgba(85,245,165,.28);

  animation:
    pulse 2s infinite ease-out;
}


@keyframes pulse {

  0% {

    transform:
      scale(.65);

    opacity:
      .8;
  }

  70% {

    transform:
      scale(1.25);

    opacity:
      0;
  }

  100% {

    transform:
      scale(1.25);

    opacity:
      0;
  }

}


.radar-title {

  color:
    #f1f6f5;

  font-size:
    16px;

  font-weight:
    700;

  letter-spacing:
    5px;

  white-space:
    nowrap;
}


/* =========================================================
   BOTTOM INFO PANEL
========================================================= */

.info-panel {

  position: absolute;

  z-index: 20;

  left: 22px;

  bottom:
    max(
      22px,
      env(safe-area-inset-bottom)
    );

  padding:
    18px 24px 17px;

  min-width:
    305px;

  border-radius:
    24px;

  background:
    rgba(5,9,9,.94);

  border:
    1px solid
    rgba(105,145,140,.20);

  box-shadow:

    0 10px 35px
    rgba(0,0,0,.4),

    inset 0 0 20px
    rgba(100,255,200,.02);

  backdrop-filter:
    blur(12px);

  -webkit-backdrop-filter:
    blur(12px);

  pointer-events:
    none;
}


.region-name {

  color:
    #e7eeee;

  font-size:
    17px;

  font-weight:
    700;

  letter-spacing:
    4px;

  margin-bottom:
    8px;
}


.date-time {

  color:
    #81908e;

  font-size:
    14px;

  font-family:
    ui-monospace,
    SFMono-Regular,
    Menlo,
    Monaco,
    Consolas,
    monospace;

  letter-spacing:
    1px;
}


/* =========================================================
   INFO BUTTON
========================================================= */

.info-button {

  position: absolute;

  z-index: 30;

  right: 22px;

  bottom:
    max(
      22px,
      env(safe-area-inset-bottom)
    );

  width: 62px;
  height: 62px;

  border-radius:
    50%;

  border:
    1px solid
    rgba(140,155,153,.25);

  background:
    rgba(8,12,12,.92);

  color:
    #c6cfce;

  font-family:
    Georgia, serif;

  font-size:
    38px;

  font-weight:
    bold;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  box-shadow:

    0 8px 30px
    rgba(0,0,0,.45),

    inset 0 0 15px
    rgba(255,255,255,.02);

  backdrop-filter:
    blur(10px);

  -webkit-backdrop-filter:
    blur(10px);
}


/* =========================================================
   MAP CONTROLS
========================================================= */

.maplibregl-ctrl-top-right {

  top: 20px;

  right: 18px;
}


.maplibregl-ctrl-group {

  background:
    rgba(5,9,9,.88) !important;

  border:
    1px solid
    rgba(130,150,145,.20) !important;

  border-radius:
    14px !important;

  overflow:
    hidden;

  backdrop-filter:
    blur(10px);
}


.maplibregl-ctrl-group button {

  background-color:
    transparent !important;
}


.maplibregl-ctrl-group
button span {

  filter:
    invert(1);

  opacity:
    .7;
}


.maplibregl-ctrl-attrib {

  background:
    rgba(5,8,8,.7) !important;

  color:
    #73807e !important;

  font-size:
    9px !important;
}


.maplibregl-ctrl-attrib a {

  color:
    #7e928e !important;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width:600px) {

  .radar-badge {

    top:
      max(
        18px,
        env(safe-area-inset-top)
      );

    left:
      22px;

    height:
      56px;

    padding:
      0 20px;
  }


  .radar-title {

    font-size:
      15px;

    letter-spacing:
      4px;
  }


  .radar-dot {

    width:
      19px;

    height:
      19px;

    flex-basis:
      19px;
  }


  .info-panel {

    left:
      22px;

    bottom:
      max(
        20px,
        env(safe-area-inset-bottom)
      );

    min-width:
      285px;

    padding:
      17px 21px;
  }


  .region-name {

    font-size:
      16px;
  }


  .date-time {

    font-size:
      13px;
  }


  .info-button {

    right:
      20px;

    bottom:
      max(
        20px,
        env(safe-area-inset-bottom)
      );

    width:
      60px;

    height:
      60px;
  }

}

</style>

</head>


<body>


<div id="map"></div>


<!-- =========================================================
     ONLINE RADAR
========================================================= -->

<div class="radar-badge">

  <div class="radar-dot"></div>

  <div class="radar-title">
    ONLINE RADAR
  </div>

</div>


<!-- =========================================================
     INFORMATION
========================================================= -->

<div class="info-panel">

  <div class="region-name">
    КИЇВСЬКА ОБЛАСТЬ
  </div>

  <div
    class="date-time"
    id="datetime"
  >
  </div>

</div>


<!-- =========================================================
     INFO BUTTON
========================================================= -->

<button
  class="info-button"
  id="infoButton"
>
  i
</button>


<script
  src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"
></script>


<script>


/* ============================================================
   CONFIGURATION
============================================================ */


/*
  OpenFreeMap Dark.
*/

const STYLE_URL =
  "https://tiles.openfreemap.org/styles/dark";


/*
  Максимальне наближення.
*/

const MAX_ZOOM =
  20;


/*
  Мінімальний zoom буде визначений
  АВТОМАТИЧНО після підгонки карти
  під Київську область.
*/

let calculatedMinZoom =
  5;


/*
  ------------------------------------------------------------
  РЕАЛЬНІ ГЕОГРАФІЧНІ МЕЖІ КИЇВСЬКОЇ ОБЛАСТІ
  ------------------------------------------------------------

  Використовуємо їх для стартового
  fitBounds.

  Це не фіксований zoom.

  MapLibre сам визначить,
  який zoom потрібен конкретно
  під розмір екрана.
*/

const KYIV_OBLAST_BOUNDS = [

  [29.00, 49.15],

  [32.35, 51.65]

];


/*
  Контур області.
*/

const KYIV_OBLAST_GEOJSON =
  "https://geo2day.com/europe/ukraine/kiev_oblast.geojson";


/* ============================================================
   DATE / TIME
============================================================ */

function updateDateTime() {

  const now =
    new Date();


  const day =
    String(
      now.getDate()
    ).padStart(
      2,
      "0"
    );


  const month =
    String(
      now.getMonth() + 1
    ).padStart(
      2,
      "0"
    );


  const year =
    now.getFullYear();


  const hours =
    String(
      now.getHours()
    ).padStart(
      2,
      "0"
    );


  const minutes =
    String(
      now.getMinutes()
    ).padStart(
      2,
      "0"
    );


  const seconds =
    String(
      now.getSeconds()
    ).padStart(
      2,
      "0"
    );


  document
    .getElementById(
      "datetime"
    )
    .textContent =
    `${day}.${month}.${year} · ${hours}:${minutes}:${seconds}`;
}


updateDateTime();


setInterval(
  updateDateTime,
  1000
);


/* ============================================================
   MAP
============================================================ */

const map =
  new maplibregl.Map({

    container:
      "map",

    style:
      STYLE_URL,


    /*
      Тимчасовий центр.

      Він буде замінений fitBounds.
    */

    center:
      [30.70, 50.35],


    zoom:
      7.5,


    /*
      Максимум збільшення.
    */

    maxZoom:
      MAX_ZOOM,


    /*
      Мінімальний буде встановлений
      після fitBounds.
    */

    minZoom:
      calculatedMinZoom,


    pitch:
      0,


    bearing:
      0,


    dragRotate:
      false,


    pitchWithRotate:
      false,


    touchPitch:
      false,


    cooperativeGestures:
      false,


    renderWorldCopies:
      false,


    attributionControl:
      true

  });


/* ============================================================
   NAVIGATION
============================================================ */

map.addControl(

  new maplibregl.NavigationControl({

    showCompass:
      false,

    showZoom:
      true,

    visualizePitch:
      false

  }),

  "top-right"

);


/* ============================================================
   MAP LOAD
============================================================ */

map.once(
  "load",
  async () => {


    /*
      ========================================================
      ГОЛОВНЕ
      ========================================================

      Підганяємо карту під Київську область.

      padding:

      зверху — запас під ONLINE RADAR
      знизу — запас під інформаційну панель
      з боків — невеликий запас
    */

    map.fitBounds(

      KYIV_OBLAST_BOUNDS,

      {

        padding: {

          top:
            125,

          bottom:
            150,

          left:
            35,

          right:
            35

        },


        /*
          Не дозволяємо fitBounds
          піти занадто близько.
        */

        maxZoom:
          9,


        duration:
          0

      }

    );


    /*
      Отримуємо zoom,
      який реально підібрав MapLibre.
    */

    const fittedZoom =
      map.getZoom();


    /*
      Фіксуємо цей zoom
      як нижню межу.

      Тобто кнопка "−"
      нижче вже не піде.
    */

    calculatedMinZoom =
      Math.max(
        5,
        fittedZoom
      );


    map.setMinZoom(
      calculatedMinZoom
    );


    /*
      Повторно ставимо саме
      потрібний стан без анімації.
    */

    map.jumpTo({

      center:
        map.getCenter(),

      zoom:
        calculatedMinZoom,

      bearing:
        0,

      pitch:
        0

    });


    /*
      Додаємо українські підписи.
    */

    hideDefaultPlaceLabels();

    addCustomPlaceLabels();

    addWaterLabels();


    /*
      Райони.
    */

    addDistrictBoundaries();


    /*
      Контур Київської області.
    */

    await addKyivOblastBoundary();


    /*
      Після завантаження всіх шарів
      ще раз залишаємо стартовий стан.
    */

    map.jumpTo({

      center:
        map.getCenter(),

      zoom:
        calculatedMinZoom,

      bearing:
        0,

      pitch:
        0

    });

  }
);


/* ============================================================
   HIDE DEFAULT PLACE LABELS
============================================================ */

function hideDefaultPlaceLabels() {


  const layers =
    map.getStyle().layers || [];


  for (
    const layer of layers
  ) {


    const sourceLayer =
      String(
        layer["source-layer"] || ""
      ).toLowerCase();


    const layerId =
      String(
        layer.id || ""
      ).toLowerCase();


    const isPlace =

      sourceLayer === "place" ||

      sourceLayer === "settlement" ||

      sourceLayer === "place_label" ||

      sourceLayer === "settlement_label" ||

      layerId.includes("place") ||

      layerId.includes("settlement");


    if (
      isPlace &&
      layer.type === "symbol"
    ) {


      try {

        map.setLayoutProperty(

          layer.id,

          "visibility",

          "none"

        );

      }

      catch(error) {}

    }

  }

}


/* ============================================================
   UKRAINIAN PLACE LABELS
============================================================ */

function addCustomPlaceLabels() {


  if (
    !map.getSource(
      "custom-places"
    )
  ) {


    map.addSource(

      "custom-places",

      {

        type:
          "vector",

        url:
          "https://tiles.openfreemap.org/planet"

      }

    );

  }


  if (
    map.getLayer(
      "ukrainian-city-labels"
    )
  ) {

    return;

  }


  map.addLayer({

    id:
      "ukrainian-city-labels",

    type:
      "symbol",

    source:
      "custom-places",

    "source-layer":
      "place",


    /*
      Назви з'являються вже
      на нормальному масштабі.
    */

    minzoom:
      6.5,


    filter:
      [
        "has",
        "name:uk"
      ],


    layout: {

      "text-field":
        [
          "get",
          "name:uk"
        ],


      "text-font":
        [
          "Noto Sans Regular"
        ],


      "text-size":
        [

          "interpolate",

          ["linear"],

          ["zoom"],


          6.5,
          8,


          7.5,
          8.5,


          9,
          9,


          11,
          10,


          13,
          11,


          16,
          12,


          20,
          13

        ],


      "text-anchor":
        "center",


      "text-offset":
        [0,0],


      "text-allow-overlap":
        false,


      "text-ignore-placement":
        false

    },


    paint: {

      "text-color":
        "#b9c5c2",


      "text-halo-color":
        "rgba(4,7,7,.96)",


      "text-halo-width":
        1.2,


      "text-halo-blur":
        .25

    }

  });

}


/* ============================================================
   WATER LABELS
============================================================ */

function addWaterLabels() {


  if (
    map.getLayer(
      "ukrainian-water-labels"
    )
  ) {

    return;

  }


  map.addLayer({

    id:
      "ukrainian-water-labels",

    type:
      "symbol",

    source:
      "custom-places",

    "source-layer":
      "water",

    minzoom:
      7,


    filter:
      [
        "has",
        "name:uk"
      ],


    layout: {

      "text-field":
        [
          "get",
          "name:uk"
        ],


      "text-font":
        [
          "Noto Sans Regular"
        ],


      "text-size":
        10,


      "text-allow-overlap":
        false

    },


    paint: {

      "text-color":
        "#657674",


      "text-halo-color":
        "rgba(4,7,7,.8)",


      "text-halo-width":
        1

    }

  });

}


/* ============================================================
   DISTRICT BOUNDARIES
============================================================ */

function addDistrictBoundaries() {


  if (
    map.getSource(
      "district-boundaries"
    )
  ) {

    return;

  }


  map.addSource(

    "district-boundaries",

    {

      type:
        "vector",

      url:
        "https://tiles.openfreemap.org/planet"

    }

  );


  map.addLayer({

    id:
      "kyiv-district-boundaries",

    type:
      "line",

    source:
      "district-boundaries",

    "source-layer":
      "boundary",


    minzoom:
      6,


    filter:
      [

        "all",

        [

          "==",

          [
            "get",
            "admin_level"
          ],

          6

        ]

      ],


    paint: {

      "line-color":
        "rgba(130,155,149,.38)",


      "line-width":
        [

          "interpolate",

          ["linear"],

          ["zoom"],


          6,
          .45,


          9,
          .7,


          12,
          .9,


          16,
          1

        ],


      "line-opacity":
        .58

    }

  });

}


/* ============================================================
   KYIV OBLAST
============================================================ */

async function addKyivOblastBoundary() {


  try {


    const response =
      await fetch(
        KYIV_OBLAST_GEOJSON
      );


    if (
      !response.ok
    ) {

      throw new Error(
        "GeoJSON loading failed"
      );

    }


    const geojson =
      await response.json();


    /*
      Source.
    */

    map.addSource(

      "kyiv-oblast",

      {

        type:
          "geojson",

        data:
          geojson

      }

    );


    /*
      Легке затемнення
      самої області.
    */

    map.addLayer({

      id:
        "kyiv-oblast-fill",

      type:
        "fill",

      source:
        "kyiv-oblast",

      paint: {

        "fill-color":
          "#15332b",

        "fill-opacity":
          .08

      }

    });


    /*
      Glow.
    */

    map.addLayer({

      id:
        "kyiv-oblast-glow",

      type:
        "line",

      source:
        "kyiv-oblast",

      paint: {

        "line-color":
          "#52e8b0",

        "line-width":
          [

            "interpolate",

            ["linear"],

            ["zoom"],


            5,
            3,


            7,
            4,


            10,
            5,


            15,
            6

          ],


        "line-opacity":
          .12,


        "line-blur":
          4

      }

    });


    /*
      Основний контур.
    */

    map.addLayer({

      id:
        "kyiv-oblast-outline",

      type:
        "line",

      source:
        "kyiv-oblast",

      paint: {

        "line-color":
          "#52e8b0",


        "line-width":
          [

          "interpolate",

          ["linear"],

          ["zoom"],


          5,
          1.1,


          7,
          1.5,


          10,
          1.9,


          15,
          2.4,


          20,
          3

        ],


        "line-opacity":
          .95

      }

    });

  }


  catch(error) {

    console.warn(
      "Kyiv Oblast boundary error:",
      error
    );

  }

}


/* ============================================================
   INFO BUTTON
============================================================ */

document
  .getElementById(
    "infoButton"
  )
  .addEventListener(
    "click",
    () => {


      alert(

        "ONLINE RADAR\n\n" +

        "Карта Київської області\n\n" +

        "Мінімальний масштаб — " +

        "Київська область у кадрі.\n\n" +

        "Збільшення доступне до " +

        MAX_ZOOM + "."

      );

    }
  );


/* ============================================================
   TOUCH
============================================================ */

map.touchZoomRotate.enable();

map.dragPan.enable();

map.scrollZoom.enable();

map.doubleClickZoom.enable();


/* ============================================================
   RESIZE
============================================================ */

window.addEventListener(
  "resize",
  () => {

    if (!map) {
      return;
    }


    map.resize();

  }
);

</script>

</body>

</html>
