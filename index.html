<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  >

  <title>ONLINE RADAR</title>

  <link
    href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css"
    rel="stylesheet"
  >

  <script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>

  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #05090b;

      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }

    body {
      position: fixed;
      inset: 0;
    }


    /* =========================================================
       MAP
    ========================================================= */

    #map {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      background: #05090b;
    }


    /* =========================================================
       ONLINE STATUS
    ========================================================= */

    #status {

      position: fixed;

      left: 50%;

      bottom:
        calc(
          12px +
          env(safe-area-inset-bottom)
        );

      transform: translateX(-50%);

      z-index: 1000;

      display: flex;

      align-items: center;
      justify-content: center;

      gap: 7px;

      padding: 7px 11px;

      border:
        1px solid
        rgba(120, 150, 155, 0.22);

      border-radius: 999px;

      background:
        rgba(5, 10, 12, 0.72);

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

      color: #d5dedf;

      font-size: 10px;

      line-height: 1;

      letter-spacing: 0.45px;

      white-space: nowrap;

      pointer-events: none;

      user-select: none;
    }


    #online-dot {

      width: 6px;
      height: 6px;

      border-radius: 50%;

      background: #00ff66;

      box-shadow:
        0 0 4px rgba(0, 255, 102, 0.9),
        0 0 9px rgba(0, 255, 102, 0.45);

      animation:
        pulse 1.7s
        infinite
        ease-in-out;

      flex: 0 0 auto;
    }


    #online-text {

      color: #00ff66;

      font-weight: 700;

      letter-spacing: 0.65px;
    }


    #datetime {

      color: #b9c5c7;

      font-variant-numeric:
        tabular-nums;
    }


    @keyframes pulse {

      0%,
      100% {

        opacity: 1;

        transform:
          scale(1);
      }

      50% {

        opacity: 0.45;

        transform:
          scale(0.78);
      }
    }


    /* =========================================================
       MAP CONTROLS
    ========================================================= */

    .maplibregl-ctrl-top-left,
    .maplibregl-ctrl-top-right,
    .maplibregl-ctrl-bottom-left {

      display: none !important;
    }


    .maplibregl-ctrl-bottom-right {

      opacity: 0.25;

      transform:
        scale(0.72);

      transform-origin:
        bottom right;
    }


    .maplibregl-ctrl-attrib {

      background:
        rgba(0, 0, 0, 0.2) !important;

      color:
        #899496 !important;
    }


    .maplibregl-ctrl-attrib a {

      color:
        #899496 !important;
    }


    #map canvas {

      outline: none;
    }

  </style>
</head>


<body>


  <div id="map"></div>


  <div id="status">

    <span id="online-dot"></span>

    <span id="online-text">
      ONLINE RADAR
    </span>

    <span>|</span>

    <span id="datetime">
      --.--.---- · --:--:--
    </span>

  </div>


  <script>


    /* =========================================================
       CONFIG
    ========================================================= */

    const MAP_STYLE =
      "https://tiles.openfreemap.org/styles/dark";


    const KYIV_VIEW_BOUNDS = [

      [28.55, 48.82],

      [32.72, 51.78]

    ];


    const MAP_MAX_BOUNDS = [

      [28.25, 48.55],

      [33.15, 52.05]

    ];



    /* =========================================================
       MAP
    ========================================================= */

    const map = new maplibregl.Map({

      container: "map",

      style: MAP_STYLE,

      center: [
        30.95,
        50.75
      ],

      zoom: 5.7,

      minZoom: 5.7,

      maxZoom: 16,

      maxBounds:
        MAP_MAX_BOUNDS,

      dragRotate: false,

      pitchWithRotate: false,

      touchPitch: false,

      cooperativeGestures: false,

      attributionControl: true

    });



    /* =========================================================
       CLOCK
    ========================================================= */

    function updateClock() {

      const now =
        new Date();


      const dd =
        String(
          now.getDate()
        ).padStart(2, "0");


      const mm =
        String(
          now.getMonth() + 1
        ).padStart(2, "0");


      const yyyy =
        now.getFullYear();


      const hh =
        String(
          now.getHours()
        ).padStart(2, "0");


      const min =
        String(
          now.getMinutes()
        ).padStart(2, "0");


      const sec =
        String(
          now.getSeconds()
        ).padStart(2, "0");


      document
        .getElementById("datetime")
        .textContent =
          `${dd}.${mm}.${yyyy} · ${hh}:${min}:${sec}`;
    }


    updateClock();

    setInterval(
      updateClock,
      1000
    );



    /* =========================================================
       MAP LOAD
    ========================================================= */

    map.on("load", async () => {


      map.fitBounds(

        KYIV_VIEW_BOUNDS,

        {

          padding: {

            top: 40,

            bottom: 95,

            left: 18,

            right: 18

          },

          maxZoom: 6.15,

          duration: 0

        }

      );


      const initialZoom =
        map.getZoom();


      map.setMinZoom(
        initialZoom
      );


      map.dragRotate.disable();

      map.touchZoomRotate
        .disableRotation();


      await buildCustomMapLayers();


      /*
       * ЄГОЗА БІЛОРУСЬКОГО КОРДОНУ
       *
       * Без Overpass.
       * Без додаткового fetch.
       * Малюється безпосередньо
       * з vector tiles.
       */

      addBelarusBorderInstant();

    });



    /* =========================================================
       CUSTOM MAP LAYERS
    ========================================================= */

    async function buildCustomMapLayers() {


      const styleLayers =
        map.getStyle().layers || [];


      let firstSymbolLayerId =
        null;


      const placeSymbolLayers =
        [];


      /*
       * Населені пункти.
       */

      for (
        const layer
        of styleLayers
      ) {


        if (

          layer.type === "symbol" &&

          layer["source-layer"] === "place"

        ) {


          if (
            !firstSymbolLayerId
          ) {

            firstSymbolLayerId =
              layer.id;

          }


          placeSymbolLayers.push(
            layer.id
          );

        }

      }



      /* =======================================================
         УКРАЇНСЬКІ НАЗВИ
      ======================================================= */

      for (
        const layerId
        of placeSymbolLayers
      ) {


        try {


          map.setLayoutProperty(

            layerId,

            "visibility",

            "visible"

          );


          map.setLayoutProperty(

            layerId,

            "text-field",

            [

              "coalesce",

              [
                "get",
                "name:uk"
              ],

              [
                "get",
                "name"
              ]

            ]

          );


        } catch (e) {

          console.warn(

            "Place layer:",
            layerId,
            e

          );

        }

      }



      /* =======================================================
         DISTRICTS
      ======================================================= */

      if (
        !map.getLayer(
          "kyiv-districts"
        )
      ) {


        map.addLayer(

          {

            id:
              "kyiv-districts",

            type:
              "line",

            source:
              "openmaptiles",

            "source-layer":
              "boundary",

            minzoom:
              5.4,

            filter:
              [

                "==",

                [
                  "get",
                  "admin_level"
                ],

                6

              ],

            paint:
              {

                "line-color":
                  "#52686b",

                "line-opacity":
                  [

                    "interpolate",

                    ["linear"],

                    ["zoom"],

                    5.4,
                    0.24,

                    12,
                    0.42

                  ],

                "line-width":
                  [

                    "interpolate",

                    ["linear"],

                    ["zoom"],

                    5.4,
                    0.65,

                    14,
                    1.5

                  ],

                "line-dasharray":
                  [
                    2,
                    2
                  ]

              }

          },

          firstSymbolLayerId ||
          undefined

        );

      }



      /* =======================================================
         WATER LABELS
      ======================================================= */

      if (
        !map.getLayer(
          "water-labels-ukrainian"
        )
      ) {


        map.addLayer(

          {

            id:
              "water-labels-ukrainian",

            type:
              "symbol",

            source:
              "openmaptiles",

            "source-layer":
              "water",

            minzoom:
              7,

            layout:
              {

                "text-field":
                  [

                    "coalesce",

                    [
                      "get",
                      "name:uk"
                    ],

                    [
                      "get",
                      "name"
                    ]

                  ],

                "text-font":
                  [
                    "Noto Sans Italic"
                  ],

                "text-size":
                  [

                    "interpolate",

                    ["linear"],

                    ["zoom"],

                    7,
                    9,

                    12,
                    11,

                    16,
                    13

                  ]

              },

            paint:
              {

                "text-color":
                  "#63898f",

                "text-halo-color":
                  "#071012",

                "text-halo-width":
                  1

              }

          }

        );

      }



      /* =======================================================
         EXACT KYIV OBLAST
      ======================================================= */

      try {


        const response =
          await fetch(

            "https://nominatim.openstreetmap.org/lookup?osm_ids=R71248&format=geojson&polygon_geojson=1",

            {

              headers:
                {

                  "Accept":
                    "application/json"

                }

            }

          );


        if (!response.ok) {

          throw new Error(

            `Nominatim HTTP ${response.status}`

          );

        }


        const data =
          await response.json();


        if (

          !data ||

          !data.features ||

          !data.features.length

        ) {

          throw new Error(

            "Геометрію Київської області не знайдено"

          );

        }



        /* =====================================================
           SOURCE
        ===================================================== */

        if (
          !map.getSource(
            "kyiv-oblast-exact"
          )
        ) {


          map.addSource(

            "kyiv-oblast-exact",

            {

              type:
                "geojson",

              data:
                data

            }

          );

        }



        /* =====================================================
           FILL
        ===================================================== */

        if (
          !map.getLayer(
            "kyiv-oblast-fill"
          )
        ) {


          map.addLayer(

            {

              id:
                "kyiv-oblast-fill",

              type:
                "fill",

              source:
                "kyiv-oblast-exact",

              paint:
                {

                  "fill-color":
                    "#00eaff",

                  "fill-opacity":
                    0.018

                }

            },

            firstSymbolLayerId ||
            undefined

          );

        }



        /* =====================================================
           GLOW
        ===================================================== */

        if (
          !map.getLayer(
            "kyiv-oblast-glow"
          )
        ) {


          map.addLayer(

            {

              id:
                "kyiv-oblast-glow",

              type:
                "line",

              source:
                "kyiv-oblast-exact",

              paint:
                {

                  "line-color":
                    "#00eaff",

                  "line-opacity":
                    0.28,

                  "line-width":
                    [

                      "interpolate",

                      ["linear"],

                      ["zoom"],

                      5,
                      5,

                      14,
                      9

                    ],

                  "line-blur":
                    5

                }

            },

            firstSymbolLayerId ||
            undefined

          );

        }



        /* =====================================================
           MAIN KYIV OBLAST BORDER
        ===================================================== */

        if (
          !map.getLayer(
            "kyiv-oblast-border"
          )
        ) {


          map.addLayer(

            {

              id:
                "kyiv-oblast-border",

              type:
                "line",

              source:
                "kyiv-oblast-exact",

              paint:
                {

                  "line-color":
                    "#00eaff",

                  "line-opacity":
                    0.92,

                  "line-width":
                    [

                      "interpolate",

                      ["linear"],

                      ["zoom"],

                      5,
                      1.5,

                      10,
                      2.4,

                      14,
                      3.5

                    ],

                  "line-blur":
                    0.15

                }

            },

            firstSymbolLayerId ||
            undefined

          );

        }


      } catch (error) {

        console.warn(

          "Kyiv oblast:",
          error

        );

      }



      /*
       * Назви міст поверх меж.
       */

      for (
        const layerId
        of placeSymbolLayers
      ) {


        try {

          map.moveLayer(
            layerId
          );

        } catch (e) {}

      }

    }



    /* =========================================================
       BELARUS BORDER / RAZOR WIRE
    =========================================================

       Тут спеціально НЕМАЄ fetch.

       Використовується existing vector source:

         openmaptiles

       source-layer:

         boundary

       admin_level 2

       Фільтр:

         BLR <-> UKR

    ========================================================= */

    function addBelarusBorderInstant() {


      /*
       * =======================================================
       * RAZOR WIRE IMAGE
       * =======================================================
       *
       * Робимо більший патерн, ніж був раніше.
       *
       * Вигляд приблизно:
       *
       *       /\        /\
       * ------\/-------\/------
       *
       * Дві лінії + великі леза.
       */


      if (
        !map.hasImage(
          "red-razor-wire"
        )
      ) {


        const width =
          64;


        const height =
          24;


        const canvas =
          document.createElement(
            "canvas"
          );


        canvas.width =
          width;


        canvas.height =
          height;


        const ctx =
          canvas.getContext(
            "2d"
          );


        ctx.clearRect(
          0,
          0,
          width,
          height
        );


        /*
         * Основні два дроти.
         */

        ctx.strokeStyle =
          "#ff304f";


        ctx.lineWidth =
          1.6;


        ctx.beginPath();


        ctx.moveTo(
          0,
          9
        );


        ctx.lineTo(
          width,
          9
        );


        ctx.stroke();


        ctx.beginPath();


        ctx.moveTo(
          0,
          15
        );


        ctx.lineTo(
          width,
          15
        );


        ctx.stroke();



        /*
         * Великі леза.
         *
         * Вони спеціально зроблені
         * значно більшими,
         * щоб були помітні навіть
         * на віддаленому zoom.
         */

        const bladePositions = [

          8,
          24,
          40,
          56

        ];


        for (
          const x
          of bladePositions
        ) {


          ctx.strokeStyle =
            "#ff5369";


          ctx.lineWidth =
            1.45;


          /*
           * Верхнє лезо.
           */

          ctx.beginPath();


          ctx.moveTo(
            x - 6,
            4
          );


          ctx.lineTo(
            x + 6,
            20
          );


          ctx.stroke();


          /*
           * Нижнє лезо.
           */

          ctx.beginPath();


          ctx.moveTo(
            x - 6,
            20
          );


          ctx.lineTo(
            x + 6,
            4
          );


          ctx.stroke();


          /*
           * Маленькі наконечники.
           */

          ctx.fillStyle =
            "#ff304f";


          ctx.beginPath();

          ctx.arc(
            x - 6,
            4,
            1.25,
            0,
            Math.PI * 2
          );

          ctx.fill();


          ctx.beginPath();

          ctx.arc(
            x + 6,
            4,
            1.25,
            0,
            Math.PI * 2
          );

          ctx.fill();


          ctx.beginPath();

          ctx.arc(
            x - 6,
            20,
            1.25,
            0,
            Math.PI * 2
          );

          ctx.fill();


          ctx.beginPath();

          ctx.arc(
            x + 6,
            20,
            1.25,
            0,
            Math.PI * 2
          );

          ctx.fill();

        }



        map.addImage(

          "red-razor-wire",

          {

            width:
              width,

            height:
              height,

            data:
              ctx.getImageData(

                0,
                0,
                width,
                height

              ).data

          }

        );

      }



      /* =======================================================
         FIND LABEL LAYER
      ======================================================= */

      const styleLayers =
        map.getStyle().layers || [];


      let firstSymbolLayerId =
        null;


      for (
        const layer
        of styleLayers
      ) {


        if (
          layer.type === "symbol"
        ) {


          firstSymbolLayerId =
            layer.id;


          break;

        }

      }



      /* =======================================================
         COMMON BORDER FILTER
      ======================================================= */

      const belarusUkraineFilter = [

        "all",

        [

          "==",

          [
            "get",
            "admin_level"
          ],

          2

        ],

        [

          "==",

          [
            "get",
            "maritime"
          ],

          0

        ],

        [

          "any",


          /*
           * BLR -> UKR
           */

          [

            "all",

            [

              "==",

              [
                "get",
                "adm0_l"
              ],

              "BLR"

            ],

            [

              "==",

              [
                "get",
                "adm0_r"
              ],

              "UKR"

            ]

          ],


          /*
           * UKR -> BLR
           */

          [

            "all",

            [

              "==",

              [
                "get",
                "adm0_l"
              ],

              "UKR"

            ],

            [

              "==",

              [
                "get",
                "adm0_r"
              ],

              "BLR"

            ]

          ],


          /*
           * Альтернативні country codes.
           */

          [

            "all",

            [

              "==",

              [
                "get",
                "adm0_l"
              ],

              "BY"

            ],

            [

              "==",

              [
                "get",
                "adm0_r"
              ],

              "UA"

            ]

          ],


          [

            "all",

            [

              "==",

              [
                "get",
                "adm0_l"
              ],

              "UA"

            ],

            [

              "==",

              [
                "get",
                "adm0_r"
              ],

              "BY"

            ]

          ]

        ]

      ];



      /* =======================================================
         DARK RED UNDERLINE
      ======================================================= */

      if (
        !map.getLayer(
          "belarus-border-base"
        )
      ) {


        map.addLayer(

          {

            id:
              "belarus-border-base",

            type:
              "line",

            source:
              "openmaptiles",

            "source-layer":
              "boundary",

            minzoom:
              5,

            filter:
              belarusUkraineFilter,

            layout:
              {

                "line-cap":
                  "round",

                "line-join":
                  "round"

              },

            paint:
              {

                "line-color":
                  "#8f1830",

                "line-opacity":
                  0.95,

                "line-width":
                  [

                    "interpolate",

                    ["linear"],

                    ["zoom"],

                    5,
                    1.5,

                    8,
                    2,

                    12,
                    2.8,

                    16,
                    3.5

                  ]

              }

          },

          firstSymbolLayerId ||
          undefined

        );

      }



      /* =======================================================
         RED GLOW
      ======================================================= */

      if (
        !map.getLayer(
          "belarus-border-glow"
        )
      ) {


        map.addLayer(

          {

            id:
              "belarus-border-glow",

            type:
              "line",

            source:
              "openmaptiles",

            "source-layer":
              "boundary",

            minzoom:
              5,

            filter:
              belarusUkraineFilter,

            layout:
              {

                "line-cap":
                  "round",

                "line-join":
                  "round"

              },

            paint:
              {

                "line-color":
                  "#ff304f",

                "line-opacity":
                  0.32,

                "line-width":
                  [

                    "interpolate",

                    ["linear"],

                    ["zoom"],

                    5,
                    5,

                    8,
                    6,

                    12,
                    8,

                    16,
                    11

                  ],

                "line-blur":
                  4

              }

          },

          firstSymbolLayerId ||
          undefined

        );

      }



      /* =======================================================
         MAIN RAZOR WIRE
      ======================================================= */

      if (
        !map.getLayer(
          "belarus-razor-wire"
        )
      ) {


        map.addLayer(

          {

            id:
              "belarus-razor-wire",

            type:
              "line",

            source:
              "openmaptiles",

            "source-layer":
              "boundary",

            minzoom:
              5,

            filter:
              belarusUkraineFilter,

            layout:
              {

                "line-cap":
                  "butt",

                "line-join":
                  "round"

              },

            paint:
              {

                "line-pattern":
                  "red-razor-wire",

                "line-opacity":
                  1

              }

          },

          firstSymbolLayerId ||
          undefined

        );

      }



      /* =======================================================
         ADD EXTRA BRIGHT CORE
      ======================================================= */

      if (
        !map.getLayer(
          "belarus-border-core"
        )
      ) {


        map.addLayer(

          {

            id:
              "belarus-border-core",

            type:
              "line",

            source:
              "openmaptiles",

            "source-layer":
              "boundary",

            minzoom:
              5.8,

            filter:
              belarusUkraineFilter,

            layout:
              {

                "line-cap":
                  "round",

                "line-join":
                  "round"

              },

            paint:
              {

                "line-color":
                  "#ff304f",

                "line-opacity":
                  0.58,

                "line-width":
                  [

                    "interpolate",

                    ["linear"],

                    ["zoom"],

                    5.8,
                    0.7,

                    10,
                    1.1,

                    16,
                    1.6

                  ]

              }

          },

          firstSymbolLayerId ||
          undefined

        );

      }



      /* =======================================================
         LABELS ABOVE BORDER
      ======================================================= */

      const finalLayers =
        map.getStyle().layers || [];


      for (
        const layer
        of finalLayers
      ) {


        if (

          layer.type === "symbol" &&

          layer["source-layer"] === "place"

        ) {


          try {

            map.moveLayer(
              layer.id
            );

          } catch (e) {}

        }

      }


      console.log(
        "🇧🇾 Razor wire border loaded instantly"
      );

    }



    /* =========================================================
       MAP ERRORS
    ========================================================= */

    map.on(
      "error",
      event => {

        if (
          event &&
          event.error
        ) {

          console.warn(
            "MapLibre:",
            event.error
          );

        }
