<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Monitor Map UA</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#02070b;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",
                 "Segoe UI",sans-serif;
}

#map{
    position:absolute;
    inset:0;
    background:#03080d;
}

/* DARK MAP */

.leaflet-tile{
    filter:none;
}

.leaflet-container{
    background:#03080d;
}

/* HEADER */

.top-card{
    position:absolute;
    z-index:1000;
    top:28px;
    left:22px;
    right:22px;

    padding:18px;

    border-radius:30px;

    background:rgba(3,12,18,.93);
    border:1px solid rgba(45,145,205,.22);

    box-shadow:
        0 15px 45px rgba(0,0,0,.55),
        inset 0 1px rgba(255,255,255,.035);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
}

.brand-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.brand-left{
    display:flex;
    align-items:center;
    gap:14px;
}

.logo{
    width:58px;
    height:58px;

    border-radius:18px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:30px;

    background:#071b28;
    border:1px solid #075b86;

    box-shadow:0 0 25px rgba(0,145,255,.12);
}

.title{
    font-size:25px;
    font-weight:750;
    color:#fff;
}

.subtitle{
    margin-top:3px;
    font-size:16px;
    color:#8b969d;
}

/* ONLINE */

.online{
    display:flex;
    align-items:center;
    gap:9px;

    padding:11px 17px;

    border-radius:30px;

    color:#48e69b;
    font-size:16px;
    font-weight:650;

    background:rgba(0,100,65,.17);
    border:1px solid rgba(0,220,135,.28);
}

.online-dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:#35e69b;

    box-shadow:0 0 13px #35e69b;
}

/* SEARCH */

.search{
    margin-top:17px;

    height:64px;

    display:flex;
    align-items:center;

    padding:0 18px;

    border-radius:23px;

    background:rgba(20,30,37,.88);
    border:1px solid rgba(150,180,195,.12);

    color:#777f85;
}

.search-icon{
    font-size:24px;
    margin-right:17px;
}

.search input{
    width:100%;
    border:0;
    outline:0;

    background:transparent;

    color:white;
    font-size:18px;
}

.search input::placeholder{
    color:#747c82;
}

/* MAP CONTROLS */

.controls{
    position:absolute;
    z-index:900;

    right:18px;
    top:55%;

    display:flex;
    flex-direction:column;
    gap:10px;
}

.control{
    width:62px;
    height:62px;

    border-radius:21px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:rgba(3,14,21,.94);
    border:1px solid rgba(90,140,170,.17);

    color:#fff;
    font-size:32px;

    box-shadow:0 8px 20px rgba(0,0,0,.45);
}

.control.location{
    color:#45bfff;
    font-size:28px;
}

/* LEGEND */

.legend{
    position:absolute;
    z-index:900;

    left:22px;
    bottom:145px;

    width:285px;

    padding:15px;

    border-radius:22px;

    background:rgba(3,13,20,.91);
    border:1px solid rgba(90,150,180,.18);

    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);

    color:#b9c2c8;
}

.legend-title{
    color:#fff;
    font-size:14px;
    font-weight:700;
    margin-bottom:11px;
    letter-spacing:.5px;
}

.legend-row{
    display:flex;
    align-items:center;
    gap:11px;

    margin:9px 0;

    font-size:13px;
}

.legend-icon{
    width:28px;
    height:20px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:7px;
}

.icon-event{
    color:#ff5148;
    font-size:18px;
}

.icon-direction{
    color:#ff493f;
    font-size:18px;
}

.icon-drone{
    color:#ffc83d;
    font-size:17px;
}

.icon-border{
    border:2px dashed #4dbaff;
}

.icon-occupied{
    border:2px solid #ff4b4b;
    background:repeating-linear-gradient(
        135deg,
        rgba(255,60,60,.25) 0px,
        rgba(255,60,60,.25) 4px,
        transparent 4px,
        transparent 8px
    );
}

/* STATUS */

.status{
    position:absolute;
    z-index:900;

    right:22px;
    bottom:150px;

    padding:11px 15px;

    border-radius:17px;

    background:rgba(3,13,20,.91);
    border:1px solid rgba(90,150,180,.18);

    color:#89959c;
    font-size:12px;
}

/* BOTTOM NAV */

.bottom-nav{
    position:absolute;
    z-index:1000;

    left:16px;
    right:16px;
    bottom:15px;

    height:100px;

    display:flex;
    align-items:center;
    justify-content:space-around;

    border-radius:29px;

    background:rgba(2,12,18,.96);
    border:1px solid rgba(70,130,165,.19);

    box-shadow:
        0 -10px 35px rgba(0,0,0,.45),
        inset 0 1px rgba(255,255,255,.025);

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
}

.nav-item{
    width:23%;
    height:76px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    border-radius:24px;

    color:#737d84;
    font-size:13px;
    font-weight:650;

    transition:.2s;
}

.nav-item.active{
    color:#43b9ff;
    background:#062033;
}

.nav-icon{
    font-size:24px;
    margin-bottom:5px;
}

/* MAP LABELS */

.map-label{
    color:#dbe8ee;

    font-size:14px;
    font-weight:600;

    text-shadow:
        0 2px 5px #000,
        0 0 8px #000;
}

.big-label{
    color:#78919d;

    font-size:23px;
    letter-spacing:8px;
    font-weight:700;

    text-shadow:0 2px 7px #000;
}

.aggressor-label{
    color:#ff5b5b;

    font-weight:800;
    font-size:15px;

    text-align:center;

    text-shadow:0 2px 8px #000;
}

/* EVENT MARKER */

.event-marker{
    width:30px;
    height:30px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#fff;
    font-size:15px;

    background:rgba(255,50,45,.22);
    border:2px solid #ff4d46;

    box-shadow:
        0 0 0 5px rgba(255,50,45,.08),
        0 0 20px rgba(255,60,50,.35);
}

.drone-marker{
    width:28px;
    height:28px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:rgba(255,190,40,.16);
    border:2px solid #ffca3a;

    color:#ffca3a;

    box-shadow:0 0 18px rgba(255,190,40,.25);
}

/* REMOVE LEAFLET DEFAULT */

.leaflet-control-zoom{
    display:none;
}

.leaflet-control-attribution{
    background:rgba(0,0,0,.55)!important;
    color:#68747b!important;
    font-size:8px!important;
}

.leaflet-control-attribution a{
    color:#73838b!important;
}
</style>
</head>

<body>

<div id="map"></div>

<!-- TOP CARD -->

<div class="top-card">

    <div class="brand-row">

        <div class="brand-left">

            <div class="logo">🗺️</div>

            <div>
                <div class="title">Monitor Map UA</div>
                <div class="subtitle">Оперативна ситуація</div>
            </div>

        </div>

        <div class="online">
            <span class="online-dot"></span>
            Онлайн
        </div>

    </div>

    <div class="search">
        <div class="search-icon">⌕</div>
        <input
            id="searchInput"
            type="text"
            placeholder="Пошук населеного пункту..."
        >
    </div>

</div>

<!-- CONTROLS -->

<div class="controls">

    <div class="control" id="zoomIn">+</div>

    <div class="control" id="zoomOut">−</div>

    <div class="control location" id="locate">◎</div>

</div>

<!-- LEGEND -->

<div class="legend">

    <div class="legend-title">ПОЗНАЧЕННЯ</div>

    <div class="legend-row">
        <div class="legend-icon icon-event">✦</div>
        <span>Події</span>
    </div>

    <div class="legend-row">
        <div class="legend-icon icon-direction">➜</div>
        <span>Напрямок / активність</span>
    </div>

    <div class="legend-row">
        <div class="legend-icon icon-drone">✈</div>
        <span>Повітряна активність</span>
    </div>

    <div class="legend-row">
        <div class="legend-icon icon-occupied"></div>
        <span>Окуповані території</span>
    </div>

    <div class="legend-row">
        <div class="legend-icon icon-border"></div>
        <span>Межі областей</span>
    </div>

</div>

<div class="status">
    Дані: OpenStreetMap
</div>

<!-- BOTTOM NAV -->

<div class="bottom-nav">

    <div class="nav-item active">
        <div class="nav-icon">⌖</div>
        Карта
    </div>

    <div class="nav-item">
        <div class="nav-icon">◉</div>
        Події
    </div>

    <div class="nav-item">
        <div class="nav-icon">☷</div>
        Легенда
    </div>

    <div class="nav-item">
        <div class="nav-icon">ⓘ</div>
        Про проєкт
    </div>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================
   MAP
========================= */

const map = L.map('map', {
    zoomControl:false,
    attributionControl:true,
    minZoom:5,
    maxZoom:12
}).setView([49.0, 31.0], 5.6);


/* DARK BASEMAP */

L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}",
    {
        maxZoom:19,
        attribution:"Tiles © Esri"
    }
).addTo(map);


/* =========================
   UKRAINE OBLASTS
========================= */

const oblastsURL =
"https://cdn.jsdelivr.net/gh/darmat1/ukraine-geo-data@main/geodata/Ukraine.geojson";


fetch(oblastsURL)
.then(response => response.json())
.then(data => {

    L.geoJSON(data, {

        style:function(){

            return {
                color:"#36a9e1",
                weight:1.4,
                opacity:.75,

                dashArray:"5 6",

                fillColor:"#062238",
                fillOpacity:.08
            };

        },

        onEachFeature:function(feature, layer){

            let name =
                feature.properties?.name ||
                feature.properties?.NAME ||
                "";

            layer.bindTooltip(
                name,
                {
                    sticky:true,
                    className:"oblast-tooltip"
                }
            );

        }

    }).addTo(map);

})
.catch(error => {
    console.log("GeoJSON error:", error);
});


/* =========================
   SVG HATCH
========================= */

function createHatch(){

    const svg =
        document.querySelector(".leaflet-overlay-pane svg");

    if(!svg) return;

    const ns =
        "http://www.w3.org/2000/svg";

    const defs =
        document.createElementNS(ns,"defs");

    const pattern =
        document.createElementNS(ns,"pattern");

    pattern.setAttribute("id","dangerHatch");
    pattern.setAttribute("patternUnits","userSpaceOnUse");
    pattern.setAttribute("width","10");
    pattern.setAttribute("height","10");
    pattern.setAttribute("patternTransform","rotate(35)");

    const line =
        document.createElementNS(ns,"line");

    line.setAttribute("x1","0");
    line.setAttribute("y1","0");
    line.setAttribute("x2","0");
    line.setAttribute("y2","10");

    line.setAttribute("stroke","#ff4545");
    line.setAttribute("stroke-width","3");
    line.setAttribute("opacity",".35");

    pattern.appendChild(line);
    defs.appendChild(pattern);
    svg.insertBefore(defs,svg.firstChild);
}

setTimeout(createHatch,800);


/* =========================
   OCCUPIED ZONES
   APPROXIMATE VISUAL AREAS
========================= */

const occupiedStyle = {

    color:"#ff4545",
    weight:2,

    opacity:.9,

    fillColor:"#ff3030",
    fillOpacity:.13,

    dashArray:"7 5"
};


/* CRIMEA */

const crimea = L.polygon([

    [46.18,32.50],
    [46.25,33.00],
    [46.05,34.00],
    [45.55,35.40],
    [45.05,36.40],
    [44.35,36.55],
    [44.35,35.00],
    [45.00,33.50],
    [45.55,32.70]

], occupiedStyle).addTo(map);

crimea.bindTooltip(
    "Крим<br><small>тимчасово окупована територія</small>",
    {
        permanent:true,
        direction:"center",
        className:"aggressor-label"
    }
);


/* =========================
   GENERIC EVENT MARKERS
   OBLAST-LEVEL / ILLUSTRATIVE
========================= */

function eventIcon(symbol="✦"){

    return L.divIcon({

        className:"",

        html:
        `<div class="event-marker">${symbol}</div>`,

        iconSize:[30,30],
        iconAnchor:[15,15]
    });
}

function droneIcon(){

    return L.divIcon({

        className:"",

        html:
        `<div class="drone-marker">✈</div>`,

        iconSize:[28,28],
        iconAnchor:[14,14]
    });
}


/*
  ДЕМО-ПОДІЇ.
  Надалі тут можна підключити агреговані
  публічні дані по областях.
*/

const demoEvents = [

    {
        lat:50.45,
        lng:30.52,
        type:"event",
        title:"Київська область",
        text:"Публічна подія"
    },

    {
        lat:49.99,
        lng:36.23,
        type:"event",
        title:"Харківська область",
        text:"Публічна подія"
    },

    {
        lat:48.46,
        lng:35.05,
        type:"drone",
        title:"Дніпропетровська область",
        text:"Повітряна активність"
    },

    {
        lat:46.97,
        lng:32.00,
        type:"event",
        title:"Миколаївська область",
        text:"Публічна подія"
    },

    {
        lat:47.84,
        lng:35.14,
        type:"event",
        title:"Запорізька область",
        text:"Публічна подія"
    },

    {
        lat:48.01,
        lng:37.80,
        type:"event",
        title:"Донецька область",
        text:"Публічна подія"
    }

];


demoEvents.forEach(event => {

    const marker =
        L.marker(
            [event.lat,event.lng],
            {
                icon:
                event.type === "drone"
                ? droneIcon()
                : eventIcon()
            }
        ).addTo(map);

    marker.bindPopup(`
        <b>${event.title}</b><br>
        ${event.text}
    `);

});


/* =========================
   UKRAINE LABEL
========================= */

L.marker(
    [49.0,31.2],
    {
        icon:L.divIcon({
            className:"",
            html:
            `<div class="big-label">УКРАЇНА</div>`,
            iconSize:[220,40],
            iconAnchor:[110,20]
        })
    }
).addTo(map);


/* =========================
   AGGRESSOR LABEL
========================= */

L.marker(
    [51.6,34.7],
    {
        icon:L.divIcon({
            className:"",
            html:`
                <div class="aggressor-label">
                    КРАЇНА-АГРЕСОР<br>
                    <span style="
                        font-size:11px;
                        font-weight:500;
                        color:#bd6666;
                    ">
                    (російська федерація)
                    </span>
                </div>
            `,
            iconSize:[220,55],
            iconAnchor:[110,27]
        })
    }
).addTo(map);


/* =========================
   BUTTONS
========================= */

document
.getElementById("zoomIn")
.onclick = () => map.zoomIn();

document
.getElementById("zoomOut")
.onclick = () => map.zoomOut();


document
.getElementById("locate")
.onclick = () => {

    map.locate({
        setView:true,
        maxZoom:10
    });

};


/* =========================
   SEARCH
========================= */

const searchInput =
    document.getElementById("searchInput");


searchInput.addEventListener(
    "keydown",
    async function(e){

        if(e.key !== "Enter") return;

        const query =
            searchInput.value.trim();

        if(!query) return;

        try{

            const url =
                "https://nominatim.openstreetmap.org/search" +
                "?format=json" +
                "&limit=1" +
                "&countrycodes=ua" +
                "&accept-language=uk" +
                "&q=" +
                encodeURIComponent(query);

            const response =
                await fetch(url);

            const results =
                await response.json();

            if(results.length){

                const place = results[0];

                map.flyTo(
                    [
                        parseFloat(place.lat),
                        parseFloat(place.lon)
                    ],
                    10,
                    {
                        duration:1.2
                    }
                );

            }

        }catch(error){

            console.log(error);

        }

    }
);


/* =========================
   NAVIGATION
========================= */

document
.querySelectorAll(".nav-item")
.forEach(item => {

    item.addEventListener(
        "click",
        function(){

            document
            .querySelectorAll(".nav-item")
            .forEach(x =>
                x.classList.remove("active")
            );

            this.classList.add("active");

        }
    );

});


/* =========================
   MAP RESIZE
========================= */

setTimeout(
    () => map.invalidateSize(),
    500
);

</script>

</body>
</html>
