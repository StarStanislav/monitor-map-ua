<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=19, user-scalable=no, viewport-fit=cover"
>

<title>Monitor Map UA</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #050a0f;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    Arial,
    sans-serif;
}

body {
  color: #f4f7fa;
}

#map {
  position: fixed;
  inset: 0;
  z-index: 1;
  background: #111820;
}

/* =========================================================
   MAP
   ========================================================= */

.leaflet-container {
  background: #111820 !important;
  font-family: inherit;
}

/*
  OSM має native zoom 19.
  maxNativeZoom не дає Leaflet показувати білу область,
  коли користувач збільшує карту далі.
*/
.leaflet-tile {
  max-width: none !important;
}

.map-tiles {
  filter:
    brightness(0.48)
    contrast(1.12)
    saturate(0.62);
}

.leaflet-control-attribution {
  display: none !important;
}

.leaflet-control-zoom {
  display: none !important;
}

/* =========================================================
   DARK OVERLAY
   ========================================================= */

.map-dark {
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;

  background:
    linear-gradient(
      180deg,
      rgba(3, 9, 14, 0.18) 0%,
      rgba(3, 9, 14, 0.03) 42%,
      rgba(3, 9, 14, 0.28) 100%
    );
}

/* =========================================================
   TOP CARD
   ========================================================= */

.top-card {
  position: fixed;
  z-index: 20;

  top: calc(env(safe-area-inset-top) + 18px);
  left: 30px;
  right: 30px;

  padding: 22px 26px 24px;

  border-radius: 32px;

  background:
    linear-gradient(
      145deg,
      rgba(5, 18, 27, 0.97),
      rgba(3, 12, 19, 0.96)
    );

  border: 1px solid rgba(41, 174, 255, 0.32);

  box-shadow:
    0 22px 55px rgba(0,0,0,0.52),
    inset 0 1px 0 rgba(255,255,255,0.035);

  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
}

.top-row {
  display: flex;
  align-items: center;
  gap: 18px;
}

.logo {
  width: 78px;
  height: 78px;

  flex: 0 0 78px;

  border-radius: 25px;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 38px;

  background:
    linear-gradient(
      145deg,
      rgba(10, 40, 57, 0.95),
      rgba(4, 20, 29, 0.98)
    );

  border: 2px solid rgba(0, 157, 231, 0.62);

  box-shadow:
    inset 0 0 22px rgba(0,150,255,0.08);
}

.title-block {
  min-width: 0;
  flex: 1;
}

.title {
  font-size: 31px;
  line-height: 1.05;
  font-weight: 800;
  letter-spacing: -0.7px;
  white-space: nowrap;
}

.subtitle {
  margin-top: 8px;

  color: #8795a0;

  font-size: 20px;
  font-weight: 500;
}

.online {
  flex: 0 0 auto;

  display: flex;
  align-items: center;
  gap: 10px;

  padding: 13px 19px;

  border-radius: 999px;

  color: #45e7a1;

  font-size: 19px;
  font-weight: 700;

  background: rgba(0, 81, 53, 0.22);

  border: 1px solid rgba(0, 222, 126, 0.42);

  box-shadow:
    0 0 25px rgba(0, 220, 130, 0.06);
}

.online-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #39e49b;

  box-shadow:
    0 0 12px rgba(57,228,155,0.7);
}

/* =========================================================
   SEARCH
   ========================================================= */

.search {
  margin-top: 20px;

  height: 66px;

  display: flex;
  align-items: center;

  padding: 0 20px;

  border-radius: 25px;

  background: rgba(21, 33, 42, 0.9);

  border: 1px solid rgba(120, 151, 170, 0.18);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.025);
}

.search-icon {
  font-size: 28px;
  color: #7e8b95;
  margin-right: 17px;
}

.search input {
  width: 100%;

  border: 0;
  outline: 0;

  background: transparent;

  color: #fff;

  font-size: 21px;
  font-weight: 500;
}

.search input::placeholder {
  color: #707d87;
}

/* =========================================================
   MAP CONTROLS
   ========================================================= */

.controls {
  position: fixed;
  z-index: 20;

  right: 28px;

  top: 50%;
  transform: translateY(-50%);

  display: flex;
  flex-direction: column;
  gap: 16px;
}

.map-btn {
  width: 76px;
  height: 76px;

  border-radius: 25px;

  border: 1px solid rgba(0, 157, 231, 0.20);

  background:
    linear-gradient(
      145deg,
      rgba(5, 20, 29, 0.97),
      rgba(3, 13, 20, 0.97)
    );

  color: #f5f8fa;

  font-size: 39px;
  font-weight: 300;

  display: flex;
  align-items: center;
  justify-content: center;

  box-shadow:
    0 15px 35px rgba(0,0,0,0.45);

  cursor: pointer;
}

.map-btn:active {
  transform: scale(0.94);
}

.locate-icon {
  width: 29px;
  height: 29px;

  border: 2px solid #35baff;

  border-radius: 50%;

  position: relative;
}

.locate-icon::after {
  content: "";

  position: absolute;

  inset: 6px;

  border: 2px solid #35baff;

  border-radius: 50%;
}

/* =========================================================
   REGION BORDERS
   ========================================================= */

.region-border {
  fill: transparent;

  stroke: #2fb7ff;
  stroke-width: 2.2;

  stroke-dasharray: 8 8;

  stroke-linecap: round;

  opacity: 0.9;
}

.region-border.city {
  stroke: #55c7ff;
  stroke-width: 3;

  stroke-dasharray: 5 5;
}

/* =========================================================
   CRIMEA / OCCUPIED TERRITORY
   ========================================================= */

.crimea-area {
  fill: rgba(255, 71, 78, 0.13);

  stroke: #ff535b;
  stroke-width: 2.6;

  stroke-dasharray: 9 7;

  stroke-linejoin: round;
}

.crimea-label {
  background: transparent !important;
  border: none !important;
  box-shadow: none !important;

  color: #ff6970 !important;

  font-size: 15px;
  font-weight: 800;

  text-align: center;

  text-shadow:
    0 2px 8px rgba(0,0,0,0.8);
}

.crimea-label::before {
  display: none !important;
}

.crimea-label small {
  display: block;

  margin-top: 3px;

  color: #c9787d;

  font-size: 10px;
  font-weight: 600;
}

/* =========================================================
   KYIV
   ========================================================= */

.kyiv-area {
  fill: rgba(51, 190, 255, 0.13);

  stroke: #4ac2ff;
  stroke-width: 3;

  stroke-dasharray: 7 5;
}

.kyiv-label {
  background: rgba(4, 17, 26, 0.88) !important;

  color: #5cc8ff !important;

  border:
    1px solid rgba(70, 194, 255, 0.42) !important;

  border-radius: 999px !important;

  padding: 7px 12px !important;

  box-shadow:
    0 8px 25px rgba(0,0,0,0.35) !important;

  font-size: 13px;
  font-weight: 800;
}

.kyiv-label::before {
  display: none !important;
}

/* =========================================================
   BOTTOM INFO
   ========================================================= */

.bottom-info {
  position: fixed;
  z-index: 20;

  left: 30px;
  bottom: calc(env(safe-area-inset-bottom) + 106px);

  padding: 11px 17px;

  border-radius: 18px;

  background: rgba(5, 16, 24, 0.92);

  border:
    1px solid rgba(43, 174, 239, 0.20);

  color: #82909a;

  font-size: 14px;

  display: none;
}

/* =========================================================
   BOTTOM NAV
   ========================================================= */

.bottom-nav {
  position: fixed;
  z-index: 30;

  left: 24px;
  right: 24px;

  bottom: calc(env(safe-area-inset-bottom) + 18px);

  height: 108px;

  display: grid;

  grid-template-columns: repeat(4, 1fr);

  padding: 8px;

  border-radius: 31px;

  background:
    linear-gradient(
      145deg,
      rgba(3, 16, 24, 0.98),
      rgba(2, 10, 16, 0.98)
    );

  border:
    1px solid rgba(20, 130, 180, 0.30);

  box-shadow:
    0 20px 55px rgba(0,0,0,0.55);

  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
}

.nav-item {
  border-radius: 25px;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  gap: 7px;

  color: #7e8991;

  font-size: 15px;
  font-weight: 700;

  cursor: pointer;
}

.nav-icon {
  font-size: 28px;
  line-height: 1;
}

.nav-item.active {
  color: #4bbcff;

  background:
    linear-gradient(
      145deg,
      rgba(5, 42, 64, 0.98),
      rgba(4, 30, 46, 0.98)
    );

  box-shadow:
    inset 0 0 30px rgba(24,157,224,0.06);
}

/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 600px) {

  .top-card {
    left: 28px;
    right: 28px;

    top: calc(env(safe-area-inset-top) + 28px);

    padding: 18px 22px 20px;

    border-radius: 29px;
  }

  .logo {
    width: 66px;
    height: 66px;
    flex-basis: 66px;

    border-radius: 21px;

    font-size: 32px;
  }

  .title {
    font-size: 26px;
  }

  .subtitle {
    font-size: 17px;
    margin-top: 5px;
  }

  .online {
    padding: 11px 14px;
    font-size: 16px;
  }

  .online-dot {
    width: 10px;
    height: 10px;
  }

  .search {
    height: 58px;
    margin-top: 16px;
  }

  .search input {
    font-size: 18px;
  }

  .controls {
    right: 22px;
    gap: 13px;
  }

  .map-btn {
    width: 66px;
    height: 66px;

    border-radius: 22px;

    font-size: 34px;
  }

  .bottom-nav {
    left: 22px;
    right: 22px;

    height: 102px;
  }

  .nav-item {
    font-size: 14px;
  }

  .nav-icon {
    font-size: 25px;
  }
}

</style>
</head>

<body>

<div id="map"></div>
<div class="map-dark"></div>

<!-- TOP -->

<div class="top-card">

  <div class="top-row">

    <div class="logo">🗺️</div>

    <div class="title-block">
      <div class="title">Monitor Map UA</div>
      <div class="subtitle">Оперативна ситуація</div>
    </div>

    <div class="online">
      <span class="online-dot"></span>
      Онлайн
    </div>

  </div>

  <div class="search">

    <div class="search-icon">⌕</div>

    <input
      id="searchInput"
      type="text"
      placeholder="Пошук населеного пункту..."
      autocomplete="off"
    >

  </div>

</div>


<!-- MAP CONTROLS -->

<div class="controls">

  <button class="map-btn" id="zoomIn">+</button>

  <button class="map-btn" id="zoomOut">−</button>

  <button class="map-btn" id="locate">
    <span class="locate-icon"></span>
  </button>

</div>


<!-- BOTTOM -->

<div class="bottom-nav">

  <div class="nav-item active">
    <div class="nav-icon">⌾</div>
    <div>Карта</div>
  </div>

  <div class="nav-item">
    <div class="nav-icon">◉</div>
    <div>Події</div>
  </div>

  <div class="nav-item">
    <div class="nav-icon">☷</div>
    <div>Легенда</div>
  </div>

  <div class="nav-item">
    <div class="nav-icon">ⓘ</div>
    <div>Про проєкт</div>
  </div>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================================================
   MAP
   ========================================================= */

const map = L.map("map", {
  zoomControl: false,

  minZoom: 5,

  /*
    Не ставимо надмірний maxZoom.
    19 — максимальний native zoom OSM.
  */
  maxZoom: 19,

  zoomSnap: 0.25,

  zoomDelta: 1,

  wheelPxPerZoomLevel: 80,

  attributionControl: false,

  preferCanvas: true
});


/* =========================================================
   OSM BASEMAP
   ========================================================= */

const tiles = L.tileLayer(
  "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    minZoom: 0,

    maxZoom: 19,

    maxNativeZoom: 19,

    tileSize: 256,

    updateWhenIdle: false,

    updateWhenZooming: true,

    keepBuffer: 3,

    attribution:
      "&copy; OpenStreetMap contributors"
  }
).addTo(map);


/*
  Робимо карту темною, але НЕ затемнюємо HTML-контейнери.
*/
tiles.getContainer().classList.add("map-tiles");


/* =========================================================
   UKRAINE INITIAL VIEW
   ========================================================= */

const ukraineBounds = L.latLngBounds(
  [44.15, 22.0],
  [52.45, 40.25]
);

map.fitBounds(ukraineBounds, {
  paddingTopLeft: [20, 230],
  paddingBottomRight: [20, 180]
});


/* =========================================================
   UKRAINE REGION APPROXIMATE BORDERS
   =========================================================

   Це візуальний шар меж.
   Він не використовується як джерело подій.
*/

const regions = [

  [
    [51.5,23.7],
    [51.9,24.5],
    [51.9,25.5],
    [51.4,26.3],
    [50.8,26.2],
    [50.3,25.5],
    [50.2,24.5],
    [50.7,23.9]
  ],

  [
    [50.2,24.0],
    [50.7,24.0],
    [51.0,25.0],
    [50.8,26.0],
    [50.1,26.1],
    [49.6,25.4],
    [49.5,24.5]
  ],

  [
    [51.0,26.0],
    [51.5,26.3],
    [51.5,27.4],
    [50.9,28.0],
    [50.4,27.6],
    [50.2,26.3]
  ],

  [
    [50.4,27.6],
    [51.0,28.0],
    [51.1,29.0],
    [50.5,29.8],
    [49.8,29.5],
    [49.5,28.4]
  ],

  [
    [49.5,28.4],
    [49.8,29.5],
    [49.4,30.4],
    [48.9,30.5],
    [48.4,29.8],
    [48.6,28.8]
  ],

  [
    [51.0,29.0],
    [51.5,29.0],
    [51.6,30.2],
    [51.0,31.1],
    [50.5,30.1]
  ],

  [
    [50.5,30.1],
    [51.0,31.1],
    [50.7,32.1],
    [49.9,32.0],
    [49.6,31.1]
  ],

  [
    [49.6,31.1],
    [49.9,32.0],
    [49.6,33.0],
    [48.9,33.1],
    [48.6,32.0]
  ],

  [
    [48.6,32.0],
    [48.9,33.1],
    [48.5,34.0],
    [47.9,33.8],
    [47.8,32.7]
  ],

  [
    [47.8,32.7],
    [47.9,33.8],
    [47.3,34.3],
    [46.9,33.7],
    [47.0,32.8]
  ],

  [
    [50.7,32.1],
    [51.1,32.8],
    [50.8,34.0],
    [50.0,34.2],
    [49.6,33.0]
  ],

  [
    [50.8,34.0],
    [51.1,34.8],
    [50.6,35.3],
    [49.8,34.2]
  ],

  [
    [49.8,34.2],
    [50.6,35.3],
    [50.1,36.0],
    [49.2,35.6],
    [48.8,34.6]
  ],

  [
    [48.8,34.6],
    [49.2,35.6],
    [48.8,36.5],
    [48.1,36.3],
    [47.9,35.5]
  ],

  [
    [47.9,35.5],
    [48.1,36.3],
    [47.5,37.0],
    [47.0,36.4],
    [47.0,35.6]
  ],

  [
    [47.0,36.4],
    [47.5,37.0],
    [47.2,38.0],
    [46.6,38.0],
    [46.5,37.0]
  ]

];

regions.forEach(coords => {

  L.polygon(coords, {
    className: "region-border",
    interactive: false
  }).addTo(map);

});


/* =========================================================
   CRIMEA
   ========================================================= */

const crimea = [

  [46.20,32.95],
  [46.10,33.55],
  [45.75,34.15],
  [45.35,34.45],
  [45.05,35.00],
  [44.75,35.30],
  [44.45,35.25],
  [44.35,34.65],
  [44.55,34.00],
  [44.75,33.45],
  [45.10,33.00],
  [45.45,32.70],
  [45.85,32.55]
];

L.polygon(crimea, {
  className: "crimea-area",
  interactive: false
}).addTo(map);

L.marker(
  [45.20, 34.20],
  {
    icon: L.divIcon({
      className: "crimea-label",
      html:
        "КРИМ<br>" +
        "<small>тимчасово окупована територія</small>",
      iconSize: [190, 48],
      iconAnchor: [95, 24]
    }),
    interactive: false
  }
).addTo(map);


/* =========================================================
   KYIV CITY ONLY
   ========================================================= */

const kyiv = [

  [50.56,30.37],
  [50.60,30.48],
  [50.59,30.61],
  [50.53,30.72],
  [50.42,30.72],
  [50.34,30.60],
  [50.34,30.46],
  [50.42,30.35]

];

L.polygon(kyiv, {
  className: "kyiv-area",
  interactive: false
}).addTo(map);

L.marker(
  [50.45,30.52],
  {
    icon: L.divIcon({
      className: "kyiv-label",
      html: "КИЇВ",
      iconSize: [72, 34],
      iconAnchor: [36, 17]
    }),
    interactive: false
  }
).addTo(map);


/* =========================================================
   ZOOM BUTTONS
   ========================================================= */

document
  .getElementById("zoomIn")
  .addEventListener("click", () => {
    map.zoomIn();
  });

document
  .getElementById("zoomOut")
  .addEventListener("click", () => {
    map.zoomOut();
  });


/* =========================================================
   LOCATION
   ========================================================= */

document
  .getElementById("locate")
  .addEventListener("click", () => {

    map.locate({
      setView: true,
      maxZoom: 15,
      enableHighAccuracy: true
    });

  });


map.on("locationerror", () => {

  map.fitBounds(ukraineBounds, {
    paddingTopLeft: [20, 230],
    paddingBottomRight: [20, 180]
  });

});


/* =========================================================
   SEARCH
   ========================================================= */

const searchInput =
  document.getElementById("searchInput");

let searchTimer = null;

searchInput.addEventListener("input", () => {

  clearTimeout(searchTimer);

  const query =
    searchInput.value.trim();

  if (query.length < 3) {
    return;
  }

  searchTimer = setTimeout(async () => {

    try {

      const url =
        "https://nominatim.openstreetmap.org/search" +
        "?format=json" +
        "&limit=1" +
        "&countrycodes=ua" +
        "&accept-language=uk" +
        "&q=" +
        encodeURIComponent(query);

      const response =
        await fetch(url);

      const results =
        await response.json();

      if (!results.length) {
        return;
      }

      const result =
        results[0];

      const lat =
        parseFloat(result.lat);

      const lon =
        parseFloat(result.lon);

      map.flyTo(
        [lat, lon],
        15,
        {
          duration: 1.2
        }
      );

    } catch (error) {

      console.log(
        "Search error:",
        error
      );

    }

  }, 500);

});


/* =========================================================
   PREVENT MAP FROM GOING UNDER UI ON START
   ========================================================= */

setTimeout(() => {

  map.invalidateSize();

  map.fitBounds(ukraineBounds, {
    paddingTopLeft: [20, 230],
    paddingBottomRight: [20, 180]
  });

}, 350);


/* =========================================================
   RESIZE
   ========================================================= */

window.addEventListener(
  "resize",
  () => {
    map.invalidateSize();
  }
);

</script>

</body>
</html>
