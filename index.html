<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Monitor Map UA</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #070b10;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
               "SF Pro Text", Arial, sans-serif;
  color: #f4f6f8;
}

#map {
  position: fixed;
  inset: 0;
  z-index: 1;
}

/* DARK MAP */
.leaflet-tile {
  filter: brightness(0.72) contrast(1.12) saturate(0.72);
}

.leaflet-control-attribution {
  background: rgba(7, 11, 16, 0.75) !important;
  color: #8b949e !important;
  font-size: 9px !important;
}

.leaflet-control-attribution a {
  color: #8b949e !important;
}

/* TOP CARD */

.top {
  position: fixed;
  top: 18px;
  left: 18px;
  right: 18px;
  z-index: 1000;

  padding: 18px 20px;

  background: rgba(10, 15, 21, 0.92);
  border: 1px solid rgba(255,255,255,0.10);
  border-radius: 22px;

  box-shadow:
    0 12px 35px rgba(0,0,0,0.45);
}

.logo-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.brand {
  display: flex;
  align-items: center;
  gap: 13px;
}

.logo {
  width: 48px;
  height: 48px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 15px;

  background: #111821;
  border: 1px solid rgba(255,255,255,0.12);

  font-size: 25px;
}

.title {
  font-size: 23px;
  font-weight: 700;
  letter-spacing: -0.5px;
}

.subtitle {
  margin-top: 3px;
  font-size: 14px;
  color: #8f99a5;
}

.status {
  display: flex;
  align-items: center;
  gap: 9px;

  padding: 10px 14px;

  border-radius: 15px;

  background: #11171e;
  border: 1px solid rgba(255,255,255,0.09);

  color: #b7bec7;
  font-size: 14px;
}

.status-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #42e36f;

  box-shadow: 0 0 12px rgba(66,227,111,0.8);
}

/* SEARCH */

.search {
  position: fixed;
  top: 128px;
  left: 18px;
  right: 82px;

  z-index: 1000;

  height: 58px;

  display: flex;
  align-items: center;

  padding: 0 18px;

  background: rgba(10,15,21,0.93);
  border: 1px solid rgba(255,255,255,0.10);
  border-radius: 19px;

  box-shadow: 0 10px 30px rgba(0,0,0,0.35);
}

.search-icon {
  font-size: 21px;
  color: #8d98a5;
  margin-right: 14px;
}

.search input {
  width: 100%;
  height: 100%;

  border: 0;
  outline: none;

  background: transparent;

  color: white;
  font-size: 16px;
}

.search input::placeholder {
  color: #737e8b;
}

/* RIGHT BUTTONS */

.map-buttons {
  position: fixed;
  top: 128px;
  right: 18px;

  z-index: 1000;

  display: flex;
  flex-direction: column;
  gap: 12px;
}

.map-btn {
  width: 58px;
  height: 58px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 19px;

  background: rgba(10,15,21,0.94);
  border: 1px solid rgba(255,255,255,0.10);

  color: white;

  font-size: 27px;

  box-shadow: 0 10px 25px rgba(0,0,0,0.4);
}

.map-btn:active {
  transform: scale(0.94);
}

/* BOTTOM NAV */

.bottom {
  position: fixed;

  left: 18px;
  right: 18px;
  bottom: 18px;

  height: 82px;

  z-index: 1000;

  display: grid;
  grid-template-columns: repeat(4, 1fr);

  padding: 8px;

  background: rgba(8,13,19,0.96);
  border: 1px solid rgba(255,255,255,0.11);

  border-radius: 24px;

  box-shadow:
    0 15px 45px rgba(0,0,0,0.55);
}

.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  gap: 5px;

  border-radius: 17px;

  color: #8d97a3;

  font-size: 12px;
}

.nav-icon {
  font-size: 23px;
}

.nav-item.active {
  background: rgba(42,104,255,0.13);
  color: #6da0ff;
}

.nav-item:active {
  transform: scale(0.96);
}

/* MOBILE */

@media (max-width: 500px) {

  .top {
    top: 12px;
    left: 12px;
    right: 12px;
    padding: 15px;
    border-radius: 20px;
  }

  .logo {
    width: 43px;
    height: 43px;
    font-size: 22px;
  }

  .title {
    font-size: 20px;
  }

  .subtitle {
    font-size: 13px;
  }

  .status {
    padding: 8px 10px;
    font-size: 13px;
  }

  .search {
    top: 116px;
    left: 12px;
    right: 78px;
    height: 55px;
  }

  .map-buttons {
    top: 116px;
    right: 12px;
  }

  .map-btn {
    width: 55px;
    height: 55px;
  }

  .bottom {
    left: 12px;
    right: 12px;
    bottom: 12px;
  }
}
</style>
</head>

<body>

<div id="map"></div>

<!-- TOP -->
<div class="top">
  <div class="logo-row">

    <div class="brand">
      <div class="logo">◎</div>

      <div>
        <div class="title">Monitor Map UA</div>
        <div class="subtitle">Оперативна ситуація</div>
      </div>
    </div>

    <div class="status">
      <span class="status-dot"></span>
      Онлайн
    </div>

  </div>
</div>

<!-- SEARCH -->
<div class="search">
  <div class="search-icon">⌕</div>

  <input
    id="searchInput"
    type="text"
    placeholder="Пошук населеного пункту..."
  />
</div>

<!-- MAP BUTTONS -->
<div class="map-buttons">

  <button class="map-btn" onclick="zoomIn()">+</button>

  <button class="map-btn" onclick="zoomOut()">−</button>

  <button class="map-btn" onclick="locateUser()">◎</button>

</div>

<!-- BOTTOM -->
<div class="bottom">

  <div class="nav-item active">
    <div class="nav-icon">⌖</div>
    <div>Карта</div>
  </div>

  <div class="nav-item" onclick="showEvents()">
    <div class="nav-icon">☷</div>
    <div>Події</div>
  </div>

  <div class="nav-item" onclick="showLegend()">
    <div class="nav-icon">ⓘ</div>
    <div>Легенда</div>
  </div>

  <div class="nav-item" onclick="showAbout()">
    <div class="nav-icon">⚙</div>
    <div>Про проєкт</div>
  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* MAP */

const map = L.map("map", {
  zoomControl: false,
  attributionControl: true,
  minZoom: 5,
  maxZoom: 12
}).setView([49.0, 31.0], 6);

/*
  Без API KEY.
  Темна карта.
*/

L.tileLayer(
  "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
  {
    maxZoom: 20,
    attribution:
      '&copy; OpenStreetMap contributors &copy; CARTO'
  }
).addTo(map);


/* ZOOM */

function zoomIn() {
  map.zoomIn();
}

function zoomOut() {
  map.zoomOut();
}


/* LOCATION */

function locateUser() {

  if (!navigator.geolocation) {
    alert("Геолокація недоступна");
    return;
  }

  navigator.geolocation.getCurrentPosition(
    function(position) {

      const lat = position.coords.latitude;
      const lon = position.coords.longitude;

      map.setView([lat, lon], 10);

      L.circleMarker([lat, lon], {
        radius: 8,
        color: "#ffffff",
        weight: 3,
        fillColor: "#4d8dff",
        fillOpacity: 1
      })
      .addTo(map)
      .bindPopup("Ваше місцезнаходження")
      .openPopup();

    },
    function() {
      alert("Не вдалося визначити місцезнаходження");
    }
  );
}


/* SEARCH */

const searchInput = document.getElementById("searchInput");

searchInput.addEventListener("keydown", function(event) {

  if (event.key === "Enter") {

    const query = searchInput.value.trim();

    if (!query) return;

    alert(
      "Пошук: " + query +
      "\n\nПошук населених пунктів підключимо наступним етапом."
    );
  }

});


/* BOTTOM BUTTONS */

function showEvents() {
  alert("Розділ «Події» підключимо наступним етапом.");
}

function showLegend() {
  alert("Легенда карти буде тут.");
}

function showAbout() {
  alert(
    "Monitor Map UA\n\n" +
    "Інформаційна карта на основі відкритих даних."
  );
}

</script>

</body>
</html>
