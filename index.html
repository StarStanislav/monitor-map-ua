<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ONLINE RADAR</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05070b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    /* =========================
       TOP
    ========================= */

    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;

      height: 58px;

      z-index: 2000;

      display: flex;
      align-items: center;
      justify-content: center;

      background: rgba(5, 7, 11, 0.98);

      border-bottom: 1px solid rgba(255,255,255,0.07);

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 11px;

      color: white;

      font-size: 16px;
      font-weight: 700;

      letter-spacing: 2.5px;
    }

    /* =========================
       ONLINE
    ========================= */

    .online-dot {
      width: 9px;
      height: 9px;

      border-radius: 50%;

      background: #27e66b;

      animation: onlinePulse 1.5s ease-in-out infinite;
    }

    @keyframes onlinePulse {

      0% {
        opacity: 1;
        transform: scale(1);

        box-shadow:
          0 0 5px rgba(39,230,107,.9),
          0 0 15px rgba(39,230,107,.65);
      }

      50% {
        opacity: .35;
        transform: scale(.75);

        box-shadow:
          0 0 2px rgba(39,230,107,.3),
          0 0 5px rgba(39,230,107,.2);
      }

      100% {
        opacity: 1;
        transform: scale(1);

        box-shadow:
          0 0 5px rgba(39,230,107,.9),
          0 0 15px rgba(39,230,107,.65);
      }

    }

    /* =========================
       MAP
    ========================= */

    .map-container {
      position: fixed;

      top: 58px;
      left: 0;
      right: 0;
      bottom: 90px;

      background: #05070b;

      overflow: hidden;
    }

    .map-frame {
      width: 100%;
      height: 100%;

      border: 0;

      display: block;
    }

    /* =========================
       DARK NEPTUN NOTICE
    ========================= */

    .neptun-notice {

      position: absolute;

      top: 20px;
      left: 50%;

      transform: translateX(-50%);

      z-index: 1500;

      width: 235px;

      padding: 10px 16px;

      border-radius: 24px;

      background: rgba(12, 15, 20, 0.90);

      border: 1px solid rgba(255,255,255,0.10);

      box-shadow:
        0 8px 30px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.04);

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

      color: #d7dbe2;

      text-align: center;

      font-size: 12px;

      line-height: 1.45;

      pointer-events: none;
    }

    .neptun-notice strong {

      display: block;

      color: #ffffff;

      font-size: 13px;

      font-weight: 700;

      margin-bottom: 1px;
    }

    /* =========================
       SOURCE
    ========================= */

    .neptun-source {

      position: absolute;

      left: 0;
      right: 0;
      bottom: 0;

      height: 30px;

      z-index: 1600;

      display: flex;
      align-items: center;
      justify-content: center;

      background: rgba(5,7,11,.96);

      border-top: 1px solid rgba(255,255,255,.05);

      font-size: 11px;
    }

    .neptun-source a {

      color: #5aa6ff;

      text-decoration: none;
    }

    /* =========================
       BOTTOM MENU
    ========================= */

    .bottom-menu {

      position: fixed;

      left: 0;
      right: 0;
      bottom: 0;

      height: 64px;

      z-index: 2000;

      background: rgba(5,7,11,.98);

      border-top: 1px solid rgba(255,255,255,.08);

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .navigation {

      width: 100%;
      max-width: 500px;

      height: 100%;

      margin: auto;

      display: flex;

      align-items: center;
      justify-content: space-around;
    }

    .nav-item {

      width: 33.333%;
      height: 100%;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      gap: 5px;

      color: #737985;

      text-decoration: none;

      font-size: 11px;
      font-weight: 500;

      transition: .2s;
    }

    .nav-icon {

      font-size: 20px;

      line-height: 1;
    }

    .nav-item.active {

      color: white;
    }

    .nav-item.active .nav-icon {

      color: #3d9cff;

      filter:
        drop-shadow(0 0 5px rgba(61,156,255,.8))
        drop-shadow(0 0 12px rgba(61,156,255,.35));
    }

    .nav-item:active {

      transform: scale(.95);
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .top-bar {
        height: 54px;
      }

      .logo {

        font-size: 15px;

        letter-spacing: 2.2px;
      }

      .map-container {

        top: 54px;

        bottom: 90px;
      }

      .bottom-menu {

        height: 62px;
      }

      .neptun-notice {

        top: 20px;

        width: 235px;

        padding: 9px 14px;

        font-size: 11px;
      }

      .neptun-notice strong {

        font-size: 12px;
      }

    }

  </style>
</head>


<body>

  <!-- =========================
       TOP
  ========================= -->

  <header class="top-bar">

    <div class="logo">

      <span class="online-dot"></span>

      <span>ONLINE RADAR</span>

    </div>

  </header>


  <!-- =========================
       MAP
  ========================= -->

  <main class="map-container">

    <iframe
      class="map-frame"
      src="https://neptun.in.ua/embed/map?lang=uk"
      title="Карта повітряних тривог України — NEPTUN"
      loading="eager"
      allow="geolocation">
    </iframe>


    <!-- НАША ТЕМНА ПЛАШКА -->

    <div class="neptun-notice">

      <strong>NEPTUN</strong>

      Інформаційний агрегатор.
      Не офіційна тривога.

    </div>


    <!-- SOURCE -->

    <div class="neptun-source">

      <a
        href="https://neptun.in.ua/"
        target="_blank"
        rel="noopener noreferrer">

        Карта повітряних тривог України — NEPTUN

      </a>

    </div>

  </main>


  <!-- =========================
       BOTTOM MENU
  ========================= -->

  <nav class="bottom-menu">

    <div class="navigation">

      <a
        href="#"
        class="nav-item active">

        <span class="nav-icon">⌁</span>

        <span>Карта</span>

      </a>


      <a
        href="#"
        class="nav-item">

        <span class="nav-icon">◷</span>

        <span>Події</span>

      </a>


      <a
        href="#"
        class="nav-item">

        <span class="nav-icon">ⓘ</span>

        <span>Інфо</span>

      </a>

    </div>

  </nav>

</body>
</html>
