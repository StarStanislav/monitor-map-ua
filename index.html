<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>ONLINE RADAR</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html {
    background: #05070b;
}

body {
    margin: 0;
    padding: 0;
    background: #05070b;
    color: #f4f5f7;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        Arial,
        sans-serif;

    -webkit-text-size-adjust: 100%;
    overflow-x: hidden;
}


/* =========================
   HEADER
========================= */

.top-header {
    height: 82px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #05070b;
    border-bottom: 1px solid #171b21;

    position: relative;
    z-index: 20;
}

.logo {
    display: flex;
    align-items: center;
    gap: 14px;

    font-size: 29px;
    font-weight: 700;
    letter-spacing: 4px;
}

.online-dot {
    width: 13px;
    height: 13px;

    border-radius: 50%;
    background: #20e875;

    box-shadow:
        0 0 10px rgba(32,232,117,.7);

    animation: pulse 1.7s infinite;
}

@keyframes pulse {

    0% {
        opacity: 1;
        transform: scale(1);
    }

    50% {
        opacity: .45;
        transform: scale(.82);
    }

    100% {
        opacity: 1;
        transform: scale(1);
    }

}


/* =========================
   APP
========================= */

.app {
    width: 100%;
    min-height: calc(100vh - 82px);
    padding-bottom: 100px;
}

.page {
    display: none;
    width: 100%;
}

.page.active {
    display: block;
}


/* =========================
   MAP
========================= */

.map-page {
    width: 100%;
}

.map-wrapper {
    position: relative;
    width: 100%;

    height: calc(100vh - 182px);

    min-height: 520px;

    overflow: hidden;
    background: #05070b;
}

.map-frame {
    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    border: 0;
}


/* =========================
   EVENTS
========================= */

.events-page {
    padding: 35px 28px 120px;
}

.events-head {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 42px;
}

.events-title {
    font-size: 48px;
    font-weight: 700;
    letter-spacing: -1px;
}

.updated {
    display: flex;
    align-items: center;
    gap: 10px;

    color: #7f8794;

    font-size: 20px;
    white-space: nowrap;
}

.updated-dot {
    width: 15px;
    height: 15px;

    border-radius: 50%;

    background: #20e875;

    box-shadow:
        0 0 12px rgba(32,232,117,.65);
}

.section-title {
    margin: 0 0 22px 8px;

    color: #7d8592;

    font-size: 21px;
    font-weight: 700;

    letter-spacing: 4px;
}


/* =========================
   EVENT CARD
========================= */

.event-card {
    position: relative;

    margin-bottom: 20px;

    padding: 28px 28px 25px 38px;

    background:
        linear-gradient(
            145deg,
            #151920,
            #0d1016
        );

    border: 1px solid #272c34;

    border-radius: 30px;

    overflow: hidden;
}

.event-card.active {
    border-left: 7px solid #ff4248;
}

.event-card.ended {
    border-left: 7px solid #26d978;
}

.event-top {
    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 20px;
}

.event-region {
    font-size: 29px;
    font-weight: 700;
    line-height: 1.15;
}

.event-badge {
    flex-shrink: 0;

    padding: 10px 20px;

    border-radius: 30px;

    font-size: 18px;
    font-weight: 800;

    letter-spacing: 2px;
}

.event-badge.alert {
    color: #ff686d;
    background: #32171d;
}

.event-badge.end {
    color: #42df91;
    background: #123024;
}


/* =========================
   EVENT DATA
========================= */

.event-data {
    display: flex;

    gap: 52px;

    margin-top: 26px;
}

.data-item {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.data-label {
    color: #727a87;

    font-size: 17px;

    letter-spacing: 3px;
}

.data-value {
    color: #dce0e6;

    font-size: 25px;
}

.event-duration {
    margin-top: 22px;

    color: #7c8490;

    font-size: 20px;
}


/* =========================
   EMPTY
========================= */

.empty {
    padding: 55px 20px;

    text-align: center;

    color: #737b88;

    font-size: 19px;
}


/* =========================
   INFO
========================= */

.info-page {
    padding: 40px 28px 130px;
}

.info-title {
    font-size: 46px;
    font-weight: 700;

    margin-bottom: 30px;
}

.info-card {
    padding: 27px;

    background: #101319;

    border: 1px solid #272c34;

    border-radius: 25px;

    color: #9ea5b0;

    font-size: 18px;
    line-height: 1.6;
}

.info-card strong {
    color: #f0f2f5;
}


/* =========================
   BOTTOM NAV
========================= */

.bottom-nav {
    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    height: 100px;

    display: flex;

    background: rgba(5,7,11,.97);

    border-top: 1px solid #191d24;

    z-index: 50;

    padding-bottom: env(safe-area-inset-bottom);
}

.nav-button {
    flex: 1;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    gap: 8px;

    border: 0;
    background: transparent;

    color: #707784;

    font-size: 18px;

    cursor: pointer;
}

.nav-button.active {
    color: #f2f4f7;
}

.nav-icon {
    width: 28px;
    height: 28px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 27px;
}

.nav-button.active .nav-icon {
    color: #2998ff;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .top-header {
        height: 78px;
    }

    .logo {
        font-size: 27px;
        letter-spacing: 4px;
    }

    .map-wrapper {
        height: calc(100vh - 178px);
        min-height: 470px;
    }


    /* =========================
       EVENTS — РОЗМІР ЯК НА
       ПЕРШОМУ СКРІНІ
    ========================= */

    .events-page {
        padding: 32px 28px 120px;
    }

    .events-head {
        margin-bottom: 40px;
    }

    .events-title {
        font-size: 43px;
    }

    .updated {
        font-size: 16px;
    }

    .updated-dot {
        width: 14px;
        height: 14px;
    }

    .section-title {
        font-size: 19px;

        margin-left: 8px;
        margin-bottom: 22px;
    }


    .event-card {
        padding:
            26px
            24px
            24px
            31px;

        border-radius: 28px;

        margin-bottom: 20px;
    }

    .event-top {
        gap: 15px;
    }

    .event-region {
        font-size: 28px;
        line-height: 1.12;
    }

    .event-badge {
        padding:
            9px
            17px;

        font-size: 16px;
    }


    .event-data {
        display: flex;

        flex-wrap: nowrap;

        gap: 32px;

        margin-top: 26px;
    }

    .data-item {
        min-width: 0;
    }

    .data-label {
        font-size: 16px;

        letter-spacing: 3px;
    }

    .data-value {
        font-size: 23px;
    }

    .event-duration {
        margin-top: 22px;

        font-size: 18px;
    }


    /* =========================
       INFO
    ========================= */

    .info-title {
        font-size: 42px;
    }

}


/* =========================
   VERY SMALL PHONES
========================= */

@media (max-width: 390px) {

    .logo {
        font-size: 23px;
    }

    .events-title {
        font-size: 38px;
    }

    .updated {
        font-size: 13px;
    }

    .event-region {
        font-size: 23px;
    }

    .event-badge {
        font-size: 13px;
        padding: 8px 13px;
    }

    .event-data {
        gap: 24px;
    }

    .data-label {
        font-size: 14px;
    }

    .data-value {
        font-size: 21px;
    }

}

</style>
</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="top-header">

    <div class="logo">

        <span class="online-dot"></span>

        <span>ONLINE RADAR</span>

    </div>

</header>



<main class="app">


<!-- =========================
     MAP
========================= -->

<section
    id="mapPage"
    class="page active map-page">

    <div class="map-wrapper">

        <iframe
            class="map-frame"
            src="https://neptun.in.ua/embed/map?lang=uk"
            allowfullscreen>
        </iframe>

    </div>

</section>



<!-- =========================
     EVENTS
========================= -->

<section
    id="eventsPage"
    class="page events-page">


    <div class="events-head">

        <div class="events-title">
            Події
        </div>


        <div class="updated">

            <span class="updated-dot"></span>

            <span id="updatedText">
                ОНОВЛЕНО --:--
            </span>

        </div>

    </div>



    <div class="section-title">
        АКТИВНІ ТРИВОГИ
    </div>


    <div id="activeEvents"></div>


    <div
        id="historyTitle"
        class="section-title"
        style="
            display:none;
            margin-top:42px;
        ">

        ІСТОРІЯ

    </div>


    <div id="historyEvents"></div>


</section>



<!-- =========================
     INFO
========================= -->

<section
    id="infoPage"
    class="page info-page">


    <div class="info-title">
        Інфо
    </div>


    <div class="info-card">

        <strong>ONLINE RADAR</strong>

        <br><br>

        Моніторинг повітряних тривог
        України на основі відкритих
        даних NEPTUN.

        <br><br>

        Дані мають інформаційний характер
        та не є офіційним попередженням.

        <br><br>

        Інформація оновлюється
        автоматично.

    </div>


</section>


</main>



<!-- =========================
     BOTTOM NAV
========================= -->

<nav class="bottom-nav">


    <button
        class="nav-button active"
        type="button"
        onclick="showPage('map')">

        <div class="nav-icon">
            ⌁
        </div>

        <div>
            Карта
        </div>

    </button>



    <button
        class="nav-button"
        type="button"
        onclick="showPage('events')">

        <div class="nav-icon">
            ◷
        </div>

        <div>
            Події
        </div>

    </button>



    <button
        class="nav-button"
        type="button"
        onclick="showPage('info')">

        <div class="nav-icon">
            ⓘ
        </div>

        <div>
            Інфо
        </div>

    </button>


</nav>



<script>

/* =====================================================
   NAVIGATION
===================================================== */

function showPage(page) {

    const pages = {

        map:
            document.getElementById("mapPage"),

        events:
            document.getElementById("eventsPage"),

        info:
            document.getElementById("infoPage")

    };


    Object.values(pages).forEach(
        element => {
            element.classList.remove("active");
        }
    );


    pages[page].classList.add("active");


    const buttons =
        document.querySelectorAll(".nav-button");


    buttons.forEach(button => {
        button.classList.remove("active");
    });


    if (page === "map") {
        buttons[0].classList.add("active");
    }

    if (page === "events") {
        buttons[1].classList.add("active");
    }

    if (page === "info") {
        buttons[2].classList.add("active");
    }

}


/* =====================================================
   API
===================================================== */

const API_URL =
    "https://neptun.in.ua/api/v1/alerts";


const STORAGE_KEY =
    "onlineRadarAlertHistory";


let currentAlerts = {};

let history = [];


try {

    history =
        JSON.parse(
            localStorage.getItem(
                STORAGE_KEY
            )
        ) || [];

} catch (error) {

    history = [];

}


/* =====================================================
   TIME
===================================================== */

function formatTime(date) {

    return new Intl.DateTimeFormat(
        "uk-UA",
        {
            hour: "2-digit",
            minute: "2-digit",
            hour12: false
        }
    ).format(date);

}


function formatDate(date) {

    return new Intl.DateTimeFormat(
        "uk-UA",
        {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
        }
    ).format(date);

}


/* =====================================================
   DURATION
===================================================== */

function getDuration(start, end = null) {

    const startTime =
        new Date(start).getTime();

    const endTime =
        end
            ? new Date(end).getTime()
            : Date.now();


    const minutes =
        Math.max(
            0,
            Math.floor(
                (endTime - startTime) / 60000
            )
        );


    if (minutes < 60) {
        return `${minutes} хв`;
    }


    const hours =
        Math.floor(minutes / 60);


    const mins =
        minutes % 60;


    if (mins === 0) {
        return `${hours} год`;
    }


    return `${hours} год ${mins} хв`;

}


/* =====================================================
   UPDATE TIME
===================================================== */

function updateClock() {

    const element =
        document.getElementById(
            "updatedText"
        );


    if (!element) return;


    element.textContent =
        "ОНОВЛЕНО " +
        formatTime(
            new Date()
        );

}


/* =====================================================
   NORMALIZE ALERTS
===================================================== */

function normalizeAlerts(data) {

    const result = {};


    const oblasts =
        Array.isArray(data.oblasts)
            ? data.oblasts
            : [];


    const raions =
        Array.isArray(data.raions)
            ? data.raions
            : [];


    oblasts.forEach(alert => {

        if (!alert.key) return;


        const id =
            "oblast_" +
            alert.key;


        result[id] = {

            id: id,

            name:
                alert.name ||
                alert.oblast ||
                alert.key,

            since:
                alert.since

        };

    });


    raions.forEach(alert => {

        if (!alert.key) return;


        const id =
            "raion_" +
            alert.key;


        result[id] = {

            id: id,

            name:
                alert.name ||
                alert.key,

            since:
                alert.since

        };

    });


    return result;

}


/* =====================================================
   UPDATE ALERTS
===================================================== */

async function updateAlerts() {

    try {

        const response =
            await fetch(
                API_URL +
                "?t=" +
                Date.now(),
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {
            throw new Error("API error");
        }


        const data =
            await response.json();


        const alerts =
            normalizeAlerts(data);


        const now =
            new Date().toISOString();


        /*
         * Відбій.
         */

        Object.keys(currentAlerts)
            .forEach(id => {

                if (!alerts[id]) {

                    const old =
                        currentAlerts[id];


                    history.unshift({

                        id: id,

                        name:
                            old.name,

                        start:
                            old.since,

                        end:
                            now

                    });

                }

            });


        history =
            history.slice(0, 300);


        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(history)
        );


        currentAlerts =
            alerts;


        updateClock();

        renderEvents();

    }

    catch (error) {

        console.error(
            "NEPTUN update error:",
            error
        );

    }

}


/* =====================================================
   ACTIVE EVENTS
===================================================== */

function renderActiveEvents() {

    const container =
        document.getElementById(
            "activeEvents"
        );


    container.innerHTML = "";


    const alerts =
        Object.values(
            currentAlerts
        );


    alerts.sort(
        (a, b) =>
            new Date(b.since) -
            new Date(a.since)
    );


    if (!alerts.length) {

        container.innerHTML = `

            <div class="empty">
                Наразі активних тривог немає
            </div>

        `;

        return;

    }


    alerts.forEach(alert => {

        const start =
            new Date(alert.since);


        const card =
            document.createElement("div");


        card.className =
            "event-card active";


        card.innerHTML = `

            <div class="event-top">

                <div class="event-region">
                    ${escapeHtml(alert.name)}
                </div>

                <div class="event-badge alert">
                    ТРИВОГА!
                </div>

            </div>


            <div class="event-data">

                <div class="data-item">

                    <div class="data-label">
                        ПОЧАТОК
                    </div>

                    <div class="data-value">
                        ${formatTime(start)}
                    </div>

                </div>


                <div class="data-item">

                    <div class="data-label">
                        СТАТУС
                    </div>

                    <div class="data-value">
                        триває
                    </div>

                </div>


                <div class="data-item">

                    <div class="data-label">
                        ДАТА
                    </div>

                    <div class="data-value">
                        ${formatDate(start)}
                    </div>

                </div>

            </div>


            <div class="event-duration">
                Тривалість:
                ${getDuration(start)}
            </div>

        `;


        container.appendChild(card);

    });

}


/* =====================================================
   HISTORY
===================================================== */

function renderHistory() {

    const container =
        document.getElementById(
            "historyEvents"
        );


    const title =
        document.getElementById(
            "historyTitle"
        );


    container.innerHTML = "";


    if (!history.length) {

        title.style.display = "none";

        return;

    }


    title.style.display = "block";


    history.forEach(event => {

        const start =
            new Date(event.start);


        const end =
            new Date(event.end);


        const card =
            document.createElement("div");


        card.className =
            "event-card ended";


        card.innerHTML = `

            <div class="event-top">

                <div class="event-region">
                    ${escapeHtml(event.name)}
                </div>

                <div class="event-badge end">
                    ВІДБІЙ
                </div>

            </div>


            <div class="event-data">

                <div class="data-item">

                    <div class="data-label">
                        ПОЧАТОК
                    </div>

                    <div class="data-value">
                        ${formatTime(start)}
                    </div>

                </div>


                <div class="data-item">

                    <div class="data-label">
                        ВІДБІЙ
                    </div>

                    <div class="data-value">
                        ${formatTime(end)}
                    </div>

                </div>


                <div class="data-item">

                    <div class="data-label">
                        ДАТА
                    </div>

                    <div class="data-value">
                        ${formatDate(start)}
                    </div>

                </div>

            </div>


            <div class="event-duration">

                Тривалість:
                ${getDuration(start, end)}

            </div>

        `;


        container.appendChild(card);

    });

}


/* =====================================================
   RENDER
===================================================== */

function renderEvents() {

    renderActiveEvents();

    renderHistory();

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(value) {

    return String(value)

        .replaceAll("&", "&amp;")

        .replaceAll("<", "&lt;")

        .replaceAll(">", "&gt;")

        .replaceAll('"', "&quot;")

        .replaceAll("'", "&#039;");

}


/* =====================================================
   START
===================================================== */

updateAlerts();


/*
 * API кожні 10 секунд.
 */

setInterval(
    updateAlerts,
    10000
);


/*
 * При поверненні на сторінку —
 * одразу оновлюємо.
 */

document.addEventListener(
    "visibilitychange",
    () => {

        if (
            document.visibilityState ===
            "visible"
        ) {

            updateAlerts();

        }

    }
);


/*
 * Оновлюємо тривалість активних
 * тривог кожну хвилину.
 */

setInterval(
    () => {

        if (
            Object.keys(
                currentAlerts
            ).length
        ) {

            renderActiveEvents();

        }

    },
    60000
);

</script>

</body>
</html>
