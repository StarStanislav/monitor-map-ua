<!DOCTYPE html>
<html lang="uk">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
    initial-scale=1,
    maximum-scale=1,
    user-scalable=no,
    viewport-fit=cover"
>

<title>ONLINE RADAR</title>


<!-- =====================================================
     MAPLIBRE
===================================================== -->

<link
    rel="stylesheet"
    href="https://unpkg.com/maplibre-gl@5.9.0/dist/maplibre-gl.css"
>

<script src="https://unpkg.com/maplibre-gl@5.9.0/dist/maplibre-gl.js"></script>


<!-- =====================================================
     TELEGRAM
===================================================== -->

<script src="https://telegram.org/js/telegram-web-app.js"></script>


<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {

    width: 100%;
    height: 100%;

    margin: 0;
    padding: 0;

    overflow: hidden;

    background: #050708;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
}

body {
    position: fixed;
    inset: 0;
}


/* =====================================================
   MAP
===================================================== */

#map {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    background: #050708;
}


/* =====================================================
   TOP ONLINE RADAR
===================================================== */

.topbar {

    position: fixed;

    z-index: 1000;

    top:
        max(12px, env(safe-area-inset-top));

    left: 14px;

    display: flex;

    align-items: center;

    gap: 10px;

    padding:
        10px 14px;

    border:
        1px solid
        rgba(255,255,255,0.09);

    border-radius:
        13px;

    background:
        rgba(4,8,9,0.82);

    backdrop-filter:
        blur(15px);

    -webkit-backdrop-filter:
        blur(15px);

    pointer-events:
        none;
}


.status-dot {

    width: 9px;
    height: 9px;

    flex: 0 0 9px;

    border-radius:
        50%;

    background:
        #5dff91;

    box-shadow:
        0 0 10px
        rgba(93,255,145,0.9);

    animation:
        pulse 1.8s infinite;
}


.top-title {

    color:
        #f0f4f4;

    font-size:
        11px;

    font-weight:
        750;

    letter-spacing:
        0.18em;

    white-space:
        nowrap;
}


@keyframes pulse {

    0% {

        box-shadow:
            0 0 0 0
            rgba(93,255,145,0.45),

            0 0 10px
            rgba(93,255,145,0.9);

    }

    70% {

        box-shadow:
            0 0 0 7px
            rgba(93,255,145,0),

            0 0 12px
            rgba(93,255,145,0.9);

    }

    100% {

        box-shadow:
            0 0 0 0
            rgba(93,255,145,0),

            0 0 10px
            rgba(93,255,145,0.9);

    }
}


/* =====================================================
   BOTTOM PANEL
===================================================== */

.bottom-panel {

    position: fixed;

    z-index: 1000;

    left: 14px;

    bottom:
        max(14px, env(safe-area-inset-bottom));

    padding:
        10px 13px;

    border:
        1px solid
        rgba(255,255,255,0.09);

    border-radius:
        12px;

    background:
        rgba(4,8,9,0.84);

    backdrop-filter:
        blur(15px);

    -webkit-backdrop-filter:
        blur(15px);

    pointer-events:
        none;
}


.region-name {

    color:
        #e9eeee;

    font-size:
        10px;

    font-weight:
        750;

    letter-spacing:
        0.17em;
}


.clock {

    margin-top:
        5px;

    color:
        #7e898e;

    font-family:
        "SF Mono",
        "Roboto Mono",
        monospace;

    font-size:
        9px;

    letter-spacing:
        0.04em;
}


/* =====================================================
   INFO
===================================================== */

.info-button {

    position: fixed;

    z-index: 1000;

    right: 13px;

    bottom:
        max(14px, env(safe-area-inset-bottom));

    width: 42px;
    height: 42px;

    display: flex;

    align-items: center;
    justify-content: center;

    border:
        1px solid
        rgba(255,255,255,0.13);

    border-radius:
        50%;

    background:
        rgba(5,8,9,0.84);

    backdrop-filter:
        blur(12px);

    -webkit-backdrop-filter:
        blur(12px);

    color:
        #b4bdc0;

    font-family:
        Georgia,
        serif;

    font-size:
        22px;

    font-weight:
        bold;
}


/* =====================================================
   LOADING
===================================================== */

#loading {

    position: fixed;

    z-index: 5000;

    inset: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        #050708;

    transition:
        opacity .35s ease;
}


#loading.hidden {

    opacity:
        0;

    pointer-events:
        none;
}


.loader {

    width: 28px;
    height: 28px;

    border:
        2px solid
        rgba(255,255,255,0.08);

    border-top-color:
        #5dff91;

    border-radius:
        50%;

    animation:
        spin .7s linear infinite;
}


.loading-text {

    margin-top:
        11px;

    color:
        #758084;

    font-size:
        9px;

    font-weight:
        650;

    letter-spacing:
        .17em;

    text-align:
        center;
}


@keyframes spin {

    to {
        transform:
            rotate(360deg);
    }
}


/* =====================================================
   MAP ATTRIBUTION
===================================================== */

.maplibregl-ctrl-bottom-right {

    right: 5px;

    bottom: 5px;
}


.maplibregl-ctrl-attrib {

    background:
        rgba(3,6,7,.68) !important;

    color:
        #667175 !important;

    font-size:
        8px !important;

    border-radius:
        5px;
}


.maplibregl-ctrl-attrib a {

    color:
        #7b878b !important;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 430px) {

    .topbar {
        left: 10px;
    }

    .bottom-panel {
        left: 10px;
    }

    .info-button {
        right: 10px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     MAP
===================================================== -->

<div id="map"></div>


<!-- =====================================================
     LOADING
===================================================== -->

<div id="loading">

    <div>

        <div class="loader"></div>

        <div class="loading-text">
            LOADING MAP
        </div>

    </div>

</div>


<!-- =====================================================
     ONLINE RADAR
===================================================== -->

<div class="topbar">

    <div class="status-dot"></div>

    <div class="top-title">
        ONLINE RADAR
    </div>

</div>


<!-- =====================================================
     BOTTOM INFORMATION
===================================================== -->

<div class="bottom-panel">

    <div class="region-name">
        КИЇВСЬКА ОБЛАСТЬ
    </div>

    <div
        id="clock"
        class="clock"
    >
        --.--.---- · --:--:--
    </div>

</div>


<!-- =====================================================
     INFO BUTTON
===================================================== -->

<div class="info-button">
    i
</div>


<script>

/* =====================================================
   TELEGRAM MINI APP
===================================================== */

const tg =
    window.Telegram?.WebApp;


if (tg) {

    try {

        tg.ready();

        tg.expand();

        tg.setHeaderColor(
            "#050708"
        );

        tg.setBackgroundColor(
            "#050708"
        );

    } catch (_) {}

}


/* =====================================================
   CLOCK
===================================================== */

const clock =
    document.getElementById(
        "clock"
    );


function updateClock() {

    const now =
        new Date();


    const date =
        new Intl.DateTimeFormat(
            "uk-UA",
            {

                timeZone:
                    "Europe/Kyiv",

                day:
                    "2-digit",

                month:
                    "2-digit",

                year:
                    "numeric"

            }
        ).format(now);


    const time =
        new Intl.DateTimeFormat(
            "uk-UA",
            {

                timeZone:
                    "Europe/Kyiv",

                hour:
                    "2-digit",

                minute:
                    "2-digit",

                second:
                    "2-digit",

                hour12:
                    false

            }
        ).format(now);


    clock.textContent =
        `${date} · ${time}`;

}


updateClock();

setInterval(
    updateClock,
    1000
);


/* =====================================================
   MAP CONFIGURATION
===================================================== */

const MAP_STYLE =
    "https://tiles.openfreemap.org/styles/dark";


/*
 * Справжня адміністративна межа
 * Київської області в OSM.
 *
 * Relation:
 * 71248
 */

const OBLAST_URL =
    "https://nominatim.openstreetmap.org/lookup" +
    "?osm_ids=R71248" +
    "&format=json" +
    "&polygon_geojson=1";


/*
 * Безпечні межі переміщення карти.
 */

const MAX_BOUNDS = [
    [28.8, 49.0],
    [32.7, 51.8]
];


/* =====================================================
   MAP
===================================================== */

const map =
    new maplibregl.Map({

        container:
            "map",

        style:
            MAP_STYLE,

        /*
         * Стартова позиція.
         *
         * Вона буде замінена fitBounds(),
         * коли прийде контур області.
         */

        center:
            [30.72, 50.30],

        zoom:
            8.1,

        minZoom:
            7.2,

        maxZoom:
            16,

        maxBounds:
            MAX_BOUNDS,

        attributionControl:
            true,

        pitchWithRotate:
            false,

        dragRotate:
            false,

        touchPitch:
            false,

        touchZoomRotate:
            true,

        renderWorldCopies:
            false

    });


window.KYIV_MAP =
    map;


/* =====================================================
   MAP READY
===================================================== */

map.once(
    "load",
    async () => {

        console.log(
            "ONLINE RADAR MAP READY"
        );


        /*
         * -------------------------------------------------
         * 1. Прибираємо штатні дублікати міст.
         * -------------------------------------------------
         */

        hideDefaultPlaceLabels();


        /*
         * -------------------------------------------------
         * 2. Наші українські назви.
         * -------------------------------------------------
         */

        try {

            addCityLabels();

        } catch (error) {

            console.warn(
                "CITY LABELS:",
                error
            );

        }


        /*
         * -------------------------------------------------
         * 3. Вода.
         * -------------------------------------------------
         */

        try {

            addWaterLabels();

        } catch (error) {

            console.warn(
                "WATER LABELS:",
                error
            );

        }


        /*
         * -------------------------------------------------
         * 4. Районні межі.
         * -------------------------------------------------
         */

        try {

            addDistrictLines();

        } catch (error) {

            console.warn(
                "DISTRICT LINES:",
                error
            );

        }


        /*
         * -------------------------------------------------
         * 5. Київська область.
         * -------------------------------------------------
         *
         * Якщо зовнішній запит впаде,
         * карта все одно залишається.
         * -------------------------------------------------
         */

        try {

            await loadOblast();

        } catch (error) {

            console.warn(
                "OBLAST LOAD FAILED:",
                error
            );


            /*
             * Навіть без GeoJSON
             * робимо нормальний стартовий кадр.
             */

            fallbackView();

        }


        /*
         * -------------------------------------------------
         * 6. Прибираємо loading.
         * -------------------------------------------------
         */

        setTimeout(
            () => {

                document
                    .getElementById(
                        "loading"
                    )
                    .classList
                    .add("hidden");

            },
            350
        );

    }
);


/* =====================================================
   HIDE DEFAULT PLACE LABELS
===================================================== */

function hideDefaultPlaceLabels() {

    const layers =
        map.getStyle().layers || [];


    for (
        const layer
        of layers
    ) {

        if (
            layer.type === "symbol" &&
            layer["source-layer"] === "place"
        ) {

            try {

                map.setLayoutProperty(
                    layer.id,
                    "visibility",
                    "none"
                );

            } catch (_) {}

        }

    }

}


/* =====================================================
   LOAD KYIV OBLAST
===================================================== */

async function loadOblast() {

    const response =
        await fetch(
            OBLAST_URL,
            {

                cache:
                    "no-store",

                headers: {

                    "Accept":
                        "application/json"

                }

            }
        );


    if (!response.ok) {

        throw new Error(
            `HTTP ${response.status}`
        );

    }


    const result =
        await response.json();


    if (
        !result ||
        !result.length ||
        !result[0].geojson
    ) {

        throw new Error(
            "OSM GeoJSON not returned"
        );

    }


    const geometry =
        result[0].geojson;


    const feature = {

        type:
            "Feature",

        properties: {

            name:
                "Київська область"

        },

        geometry:
            geometry

    };


    /* =================================================
       SOURCE
    ================================================= */

    map.addSource(
        "kyiv-oblast",
        {

            type:
                "geojson",

            data:
                feature

        }
    );


    /* =================================================
       SOFT FILL
    ================================================= */

    map.addLayer({

        id:
            "kyiv-oblast-fill",

        type:
            "fill",

        source:
            "kyiv-oblast",

        paint: {

            "fill-color":
                "#0d3b30",

            "fill-opacity":
                0.13

        }

    });


    /* =================================================
       MAIN BORDER
    ================================================= */

    map.addLayer({

        id:
            "kyiv-oblast-border",

        type:
            "line",

        source:
            "kyiv-oblast",

        paint: {

            /*
             * Основний контур області.
             */

            "line-color":
                "#52e8b0",

            "line-width": [

                "interpolate",

                ["linear"],

                ["zoom"],

                7.2,
                1.25,

                8,
                1.55,

                9,
                1.9,

                10,
                2.15,

                12,
                2.4,

                14,
                2.7,

                16,
                3.1

            ],

            "line-opacity":
                0.96,

            "line-blur":
                0.12

        }

    });


    /*
     * Автоматичний правильний масштаб.
     */

    fitOblast(
        geometry
    );

}


/* =====================================================
   FIT WHOLE KYIV OBLAST
===================================================== */

function fitOblast(
    geometry
) {

    const bounds =
        new maplibregl.LngLatBounds();


    function walk(
        coordinates
    ) {

        if (
            typeof coordinates[0] ===
            "number"
        ) {

            bounds.extend(
                coordinates
            );

            return;

        }


        for (
            const item
            of coordinates
        ) {

            walk(item);

        }

    }


    walk(
        geometry.coordinates
    );


    if (
        bounds.isEmpty()
    ) {

        fallbackView();

        return;

    }


    /*
     * Вписуємо ВСЮ область.
     */

    map.fitBounds(
        bounds,
        {

            padding: {

                /*
                 * Telegram header
                 * + ONLINE RADAR
                 */

                top:
                    145,

                /*
                 * Нижня панель
                 */

                bottom:
                    125,

                left:
                    22,

                right:
                    22

            },


            /*
             * Не дозволяємо
             * занадто сильно збільшити
             * область.

             */

            maxZoom:
                8.75,


            duration:
                500

        }
    );

}


/* =====================================================
   FALLBACK VIEW
===================================================== */

function fallbackView() {

    /*
     * Якщо OSM/Nominatim тимчасово
     * недоступний, все одно показуємо
     * Київщину приблизно правильно.
     */

    map.fitBounds(

        [
            [29.05, 49.18],
            [32.15, 51.55]
        ],

        {

            padding: {

                top:
                    145,

                bottom:
                    125,

                left:
                    22,

                right:
                    22

            },

            maxZoom:
                8.65,

            duration:
                350

        }

    );

}


/* =====================================================
   DISTRICT BOUNDARIES
===================================================== */

function addDistrictLines() {

    /*
     * admin_level=6
     *
     * Районний рівень.
     */

    map.addLayer({

        id:
            "kyiv-district-lines",

        type:
            "line",

        source:
            "openmaptiles",

        "source-layer":
            "boundary",

        minzoom:
            7.2,

        filter: [

            "all",

            [
                "==",
                "admin_level",
                6
            ],

            /*
             * Київ не повинен бути
             * районною межею області.
             */

            [
                "!=",
                "name",
                "Київ"
            ],

            [
                "!=",
                "name",
                "Kyiv"
            ]

        ],

        paint: {

            /*
             * Другий колір.
             *
             * Значно спокійніший
             * за зовнішній контур.
             */

            "line-color":
                "#8fa59d",

            "line-width": [

                "interpolate",

                ["linear"],

                ["zoom"],

                7.2,
                0.30,

                8,
                0.40,

                9,
                0.52,

                10,
                0.62,

                12,
                0.78,

                14,
                1.0,

                16,
                1.15

            ],

            "line-opacity": [

                "interpolate",

                ["linear"],

                ["zoom"],

                7.2,
                0.22,

                8,
                0.27,

                9,
                0.34,

                10,
                0.40,

                12,
                0.50,

                14,
                0.60,

                16,
                0.66

            ],

            /*
             * Тонкий пунктир.
             */

            "line-dasharray":
                [2, 3]

        }

    });

}


/* =====================================================
   CITY LABELS
===================================================== */

function addCityLabels() {

    /*
     * -------------------------------------------------
     * ОСНОВНІ МІСТА
     * -------------------------------------------------
     */

    map.addLayer({

        id:
            "kyiv-main-city-labels",

        type:
            "symbol",

        source:
            "openmaptiles",

        "source-layer":
            "place",

        minzoom:
            7.2,

        filter: [

            "all",

            [
                "==",
                "$type",
                "Point"
            ],

            [
                "in",
                "class",
                "city",
                "town"
            ]

        ],

        layout: {

            "text-field": [

                "coalesce",

                [
                    "get",
                    "name:uk"
                ],

                [
                    "get",
                    "name"
                ]

            ],

            "text-font": [
                "Noto Sans Bold"
            ],

            "text-size": [

                "interpolate",

                ["linear"],

                ["zoom"],

                7.2,
                8.0,

                8.0,
                8.7,

                8.7,
                9.5,

                9.5,
                10.2,

                11,
                11.5,

                13,
                12.5,

                16,
                15

            ],

            "text-padding":
                5,

            "text-max-width":
                9,

            "text-allow-overlap":
                false,

            "text-ignore-placement":
                false

        },

        paint: {

            "text-color":
                "#e1e8e6",

            "text-halo-color":
                "#050708",

            "text-halo-width":
                2.0,

            "text-halo-blur":
                0.15

        }

    });


    /*
     * -------------------------------------------------
     * НЕВЕЛИКІ НАСЕЛЕНІ ПУНКТИ
     * -------------------------------------------------
     */

    map.addLayer({

        id:
            "kyiv-small-place-labels",

        type:
            "symbol",

        source:
            "openmaptiles",

        "source-layer":
            "place",

        minzoom:
            9.0,

        filter: [

            "all",

            [
                "==",
                "$type",
                "Point"
            ],

            [
                "in",
                "class",
                "village",
                "hamlet"
            ]

        ],

        layout: {

            "text-field": [

                "coalesce",

                [
                    "get",
                    "name:uk"
                ],

                [
                    "get",
                    "name"
                ]

            ],

            "text-font": [
                "Noto Sans Regular"
            ],

            "text-size": [

                "interpolate",

                ["linear"],

                ["zoom"],

                9,
                6.4,

                10.5,
                7.0,

                12,
                7.8,

                14,
                9,

                16,
                10

            ],

            "text-padding":
                3,

            "text-allow-overlap":
                false

        },

        paint: {

            "text-color":
                "#a4afad",

            "text-opacity": [

                "interpolate",

                ["linear"],

                ["zoom"],

                9,
                0.28,

                10.5,
                0.42,

                12,
                0.58,

                14,
                0.75,

                16,
                0.90

            ],

            "text-halo-color":
                "#050708",

            "text-halo-width":
                1.3

        }

    });

}


/* =====================================================
   WATER LABELS
===================================================== */

function addWaterLabels() {

    map.addLayer({

        id:
            "kyiv-water-labels",

        type:
            "symbol",

        source:
            "openmaptiles",

        "source-layer":
            "water_name",

        minzoom:
            7.5,

        filter: [

            "has",
            "name"

        ],

        layout: {

            "text-field": [

                "coalesce",

                [
                    "get",
                    "name:uk"
                ],

                [
                    "get",
                    "name"
                ]

            ],

            "text-font": [
                "Noto Sans Regular"
            ],

            "text-size": [

                "interpolate",

                ["linear"],

                ["zoom"],

                7.5,
                7,

                9,
                8,

                12,
                9.5,

                15,
                11

            ],

            "text-letter-spacing":
                0.04,

            "text-max-width":
                7

        },

        paint: {

            "text-color":
                "#39747b",

            "text-opacity":
                0.62,

            "text-halo-color":
                "#061013",

            "text-halo-width":
                1.1

        }

    });

}


/* =====================================================
   MAP ERROR HANDLER
===================================================== */

map.on(
    "error",
    event => {

        console.warn(
            "MAP ERROR:",
            event?.error || event
        );

    }
);
