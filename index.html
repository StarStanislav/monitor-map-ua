<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<title>ONLINE MONITOR</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: #05070a;
  color: #f4f6f8;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    Inter,
    Arial,
    sans-serif;
}

body {
  position: relative;
}

/* =========================
   MAP
========================= */

#map {
  position: absolute;
  inset: 0;
  z-index: 1;
  background: #080b0f;
}

.leaflet-container {
  background: #080b0f;
  font-family: inherit;
}

.leaflet-control-attribution {
  background: rgba(5, 7, 10, 0.72) !important;
  color: rgba(255,255,255,.45) !important;
  backdrop-filter: blur(10px);
  font-size: 9px;
}

.leaflet-control-attribution a {
  color: rgba(255,255,255,.65) !important;
}

/* =========================
   TOP HEADER
========================= */

.top-ui {
  position: absolute;
  top: max(14px, env(safe-area-inset-top));
  left: 14px;
  right: 14px;
  z-index: 1000;
  pointer-events: none;
}

.header-card {
  pointer-events: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;

  padding: 13px 15px;

  border: 1px solid rgba(255,255,255,.08);
  border-radius: 18px;

  background:
    linear-gradient(
      135deg,
      rgba(18,22,28,.94),
      rgba(7,10,14,.88)
    );

  box-shadow:
    0 12px 35px rgba(0,0,0,.38),
    inset 0 1px 0 rgba(255,255,255,.035);

  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
}

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  min-width: 0;
}

.brand-icon {
  width: 39px;
  height: 39px;
  flex: 0 0 39px;

  border-radius: 12px;

  display: flex;
  align-items: center;
  justify-content: center;

  background:
    radial-gradient(
      circle at 50% 45%,
      rgba(255,255,255,.11),
      rgba(255,255,255,.025) 55%,
      transparent 56%
    ),
    #0d1218;

  border: 1px solid rgba(255,255,255,.09);

  position: relative;
  overflow: hidden;
}

.brand-icon::before {
  content: "";
  position: absolute;

  width: 18px;
  height: 18px;

  border: 1px solid rgba(255,255,255,.75);
  border-radius: 50%;
}

.brand-icon::after {
  content: "";

  position: absolute;

  width: 5px;
  height: 5px;

  border-radius: 50%;
  background: #fff;

  box-shadow:
    0 0 12px rgba(255,255,255,.75);
}

.brand-text {
  min-width: 0;
}

.brand-title {
  font-size: 14px;
  font-weight: 800;
  letter-spacing: .14em;
  white-space: nowrap;
}

.brand-subtitle {
  margin-top: 3px;

  color: rgba(255,255,255,.42);

  font-size: 8px;
  font-weight: 600;
  letter-spacing: .13em;

  white-space: nowrap;
}

.system-status {
  display: flex;
  align-items: center;
  gap: 7px;

  padding: 7px 9px;

  border-radius: 10px;

  background: rgba(255,255,255,.035);
  border: 1px solid rgba(255,255,255,.06);

  font-size: 9px;
  font-weight: 700;
  letter-spacing: .08em;

  color: rgba(255,255,255,.6);
}

.status-dot {
  width: 6px;
  height: 6px;

  border-radius: 50%;
  background: #65d98b;

  box-shadow:
    0 0 0 4px rgba(101,217,139,.08),
    0 0 10px rgba(101,217,139,.55);
}

/* =========================
   SEARCH
========================= */

.search-wrap {
  position: absolute;

  top: 91px;
  left: 14px;
  right: 14px;

  z-index: 1000;
}

.search-box {
  height: 47px;

  display: flex;
  align-items: center;

  padding: 0 14px;

  border-radius: 15px;

  background: rgba(9,12,16,.88);

  border: 1px solid rgba(255,255,255,.08);

  box-shadow:
    0 10px 28px rgba(0,0,0,.3);

  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}

.search-icon {
  width: 17px;
  height: 17px;

  margin-right: 9px;

  border: 1.5px solid rgba(255,255,255,.48);
  border-radius: 50%;

  position: relative;
  flex: 0 0 auto;
}

.search-icon::after {
  content: "";

  position: absolute;

  width: 7px;
  height: 1.5px;

  right: -5px;
  bottom: -3px;

  background: rgba(255,255,255,.48);

  transform: rotate(45deg);
  border-radius: 2px;
}

#search {
  width: 100%;

  border: 0;
  outline: 0;

  background: transparent;

  color: #fff;

  font-size: 14px;
  font-weight: 500;
}

#search::placeholder {
  color: rgba(255,255,255,.36);
}

.search-clear {
  display: none;

  width: 26px;
  height: 26px;

  border: 0;
  border-radius: 50%;

  background: rgba(255,255,255,.08);

  color: rgba(255,255,255,.65);

  font-size: 17px;

  cursor: pointer;
}

/* =========================
   SEARCH RESULTS
========================= */

.search-results {
  margin-top: 7px;

  overflow: hidden;

  border-radius: 14px;

  background: rgba(9,12,16,.95);

  border: 1px solid rgba(255,255,255,.08);

  box-shadow: 0 15px 35px rgba(0,0,0,.42);

  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);

  display: none;
}

.search-result {
  padding: 12px 14px;

  border-bottom: 1px solid rgba(255,255,255,.055);

  cursor: pointer;
}

.search-result:last-child {
  border-bottom: 0;
}

.search-result-title {
  font-size: 13px;
  font-weight: 650;
}

.search-result-type {
  margin-top: 3px;

  font-size: 9px;
  color: rgba(255,255,255,.38);
}

/* =========================
   STATUS CARD
========================= */

.status-card {
  position: absolute;

  left: 14px;
  right: 14px;
  bottom: 91px;

  z-index: 900;

  padding: 13px 14px;

  border-radius: 16px;

  background: rgba(8,11,15,.88);

  border: 1px solid rgba(255,255,255,.075);

  box-shadow:
    0 12px 32px rgba(0,0,0,.38);

  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);

  transition:
    background .25s ease,
    border-color .25s ease;
}

.status-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.status-label {
  display: flex;
  align-items: center;
  gap: 8px;

  font-size: 10px;
  font-weight: 750;
  letter-spacing: .11em;
  text-transform: uppercase;

  color: rgba(255,255,255,.65);
}

.status-light {
  width: 7px;
  height: 7px;

  border-radius: 50%;

  background: #65d98b;

  box-shadow:
    0 0 12px rgba(101,217,139,.55);
}

.status-time {
  font-size: 9px;
  color: rgba(255,255,255,.32);
}

.status-main {
  margin-top: 8px;

  font-size: 13px;
  font-weight: 650;

  color: #f5f6f7;
}

.status-sub {
  margin-top: 4px;

  font-size: 10px;

  color: rgba(255,255,255,.37);
}

/* =========================
   MAP CONTROLS
========================= */

.map-controls {
  position: absolute;

  right: 14px;
  bottom: 176px;

  z-index: 900;

  display: flex;
  flex-direction: column;
  gap: 8px;
}

.map-btn {
  width: 43px;
  height: 43px;

  border-radius: 13px;

  display: flex;
  align-items: center;
  justify-content: center;

  background: rgba(8,11,15,.89);

  border: 1px solid rgba(255,255,255,.08);

  color: rgba(255,255,255,.72);

  box-shadow:
    0 8px 22px rgba(0,0,0,.34);

  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);

  font-size: 20px;

  cursor: pointer;

  user-select: none;
}

.map-btn:active {
  transform: scale(.94);
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav {
  position: absolute;

  left: 10px;
  right: 10px;
  bottom: max(10px, env(safe-area-inset-bottom));

  height: 65px;

  z-index: 1000;

  display: grid;
  grid-template-columns: repeat(3, 1fr);

  padding: 6px;

  border-radius: 19px;

  background: rgba(8,11,15,.93);

  border: 1px solid rgba(255,255,255,.08);

  box-shadow:
    0 15px 40px rgba(0,0,0,.46);

  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
}

.nav-btn {
  border: 0;

  background: transparent;

  color: rgba(255,255,255,.36);

  border-radius: 14px;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  gap: 4px;

  cursor: pointer;
}

.nav-btn.active {
  background: rgba(255,255,255,.075);
  color: #fff;
}

.nav-icon {
  font-size: 18px;
  line-height: 18px;
}

.nav-label {
  font-size: 8px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
}

/* =========================
   PANELS
========================= */

.panel {
  position: absolute;

  left: 10px;
  right: 10px;
  bottom: 85px;

  z-index: 1100;

  max-height: 62vh;

  padding: 17px;

  border-radius: 20px;

  background: rgba(8,11,15,.96);

  border: 1px solid rgba(255,255,255,.09);

  box-shadow:
    0 20px 55px rgba(0,0,0,.52);

  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);

  transform: translateY(120%);
  opacity: 0;

  pointer-events: none;

  transition:
    transform .28s ease,
    opacity .25s ease;
}

.panel.open {
  transform: translateY(0);
  opacity: 1;
  pointer-events: auto;
}

.panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;

  margin-bottom: 15px;
}

.panel-title {
  font-size: 14px;
  font-weight: 800;
  letter-spacing: .06em;
}

.panel-close {
  width: 30px;
  height: 30px;

  border: 0;
  border-radius: 9px;

  background: rgba(255,255,255,.07);

  color: rgba(255,255,255,.55);

  font-size: 17px;

  cursor: pointer;
}

.panel-row {
  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 13px 0;

  border-bottom: 1px solid rgba(255,255,255,.055);
}

.panel-row:last-child {
  border-bottom: 0;
}

.panel-row-name {
  font-size: 12px;
  color: rgba(255,255,255,.7);
}

.panel-row-value {
  font-size: 11px;
  color: rgba(255,255,255,.4);
}

/* =========================
   REGION LABEL
========================= */

.region-label {
  background: transparent;
  border: 0;
  box-shadow: none;

  color: rgba(255,255,255,.62);

  font-size: 9px;
  font-weight: 700;

  text-shadow:
    0 1px 5px #000,
    0 0 8px #000;

  white-space: nowrap;
}

/* =========================
   CUSTOM OBJECTS
========================= */

.object-marker {
  width: 28px;
  height: 28px;

  border-radius: 50%;

  position: relative;

  display: flex;
  align-items: center;
  justify-content: center;

  background: rgba(10,13,17,.92);

  border: 1px solid rgba(255,255,255,.45);

  box-shadow:
    0 0 0 5px rgba(255,255,255,.045),
    0 5px 18px rgba(0,0,0,.4);
}

.object-marker::before {
  content: "";

  width: 8px;
  height: 8px;

  border-radius: 50%;

  background: #fff;

  box-shadow:
    0 0 10px rgba(255,255,255,.7);
}

.object-label {
  position: absolute;

  left: 34px;
  top: 50%;

  transform: translateY(-50%);

  padding: 5px 7px;

  border-radius: 6px;

  background: rgba(5,7,10,.82);

  border: 1px solid rgba(255,255,255,.07);

  color: rgba(255,255,255,.72);

  font-size: 8px;
  font-weight: 700;
  letter-spacing: .07em;

  white-space: nowrap;

  backdrop-filter: blur(8px);
}

/* =========================
   POPUP
========================= */

.leaflet-popup-content-wrapper {
  background: rgba(8,11,15,.95);
  color: #fff;

  border:
    1px solid rgba(255,255,255,.09);

  border-radius: 13px;

  box-shadow:
    0 15px 40px rgba(0,0,0,.5);

  backdrop-filter: blur(18px);
}

.leaflet-popup-tip {
  background: rgba(8,11,15,.95);
}

.leaflet-popup-content {
  margin: 13px 15px;

  font-family: inherit;
}

.popup-title {
  font-size: 13px;
  font-weight: 800;

  margin-bottom: 4px;
}

.popup-sub {
  font-size: 10px;
  color: rgba(255,255,255,.42);
}

/* =========================
   RESPONSIVE
========================= */

@media (min-width: 700px) {
  .top-ui,
  .search-wrap {
    left: 22px;
    right: auto;
    width: 430px;
  }

  .status-card {
    left: 22px;
    right: auto;
    width: 430px;
  }

  .map-controls {
    right: 22px;
  }

  .bottom-nav {
    left: 50%;
    right: auto;
    width: 420px;
    transform: translateX(-50%);
  }
}
</style>
</head>

<body>

<div id="map"></div>

<!-- =========================
     TOP UI
========================= -->

<div class="top-ui">
  <div class="header-card">

    <div class="brand">

      <div class="brand-icon"></div>

      <div class="brand-text">
        <div class="brand-title">
          ONLINE MONITOR
        </div>

        <div class="brand-subtitle">
          PERSONAL MONITORING SYSTEM
        </div>
      </div>

    </div>

    <div class="system-status">
      <span class="status-dot"></span>
      ONLINE
    </div>

  </div>
</div>

<!-- =========================
     SEARCH
========================= -->

<div class="search-wrap">

  <div class="search-box">

    <div class="search-icon"></div>

    <input
      id="search"
      type="text"
      autocomplete="off"
      placeholder="Пошук населеного пункту..."
    >

    <button
      id="searchClear"
      class="search-clear"
      type="button"
    >
      ×
    </button>

  </div>

  <div
    id="searchResults"
    class="search-results"
  ></div>

</div>

<!-- =========================
     STATUS
========================= -->

<div class="status-card">

  <div class="status-top">

    <div class="status-label">
      <span class="status-light"></span>
      СТАН СИСТЕМИ
    </div>

    <div
      id="statusTime"
      class="status-time"
    >
      ONLINE
    </div>

  </div>

  <div
    id="statusMain"
    class="status-main"
  >
    Система працює у штатному режимі
  </div>

  <div
    id="statusSub"
    class="status-sub"
  >
    Моніторинг карти активний
  </div>

</div>

<!-- =========================
     MAP BUTTONS
========================= -->

<div class="map-controls">

  <button
    id="locateBtn"
    class="map-btn"
    title="Моє місцезнаходження"
  >
    ⌾
  </button>

  <button
    id="resetBtn"
    class="map-btn"
    title="Україна"
  >
    ⌂
  </button>

  <button
    id="zoomIn"
    class="map-btn"
    title="Збільшити"
  >
    +
  </button>

  <button
    id="zoomOut"
    class="map-btn"
    title="Зменшити"
  >
    −
  </button>

</div>

<!-- =========================
     PANELS
========================= -->

<div
  id="infoPanel"
  class="panel"
>

  <div class="panel-head">

    <div class="panel-title">
      ONLINE MONITOR
    </div>

    <button
      class="panel-close"
      data-close="infoPanel"
    >
      ×
    </button>

  </div>

  <div class="panel-row">
    <div class="panel-row-name">
      Статус системи
    </div>

    <div class="panel-row-value">
      ONLINE
    </div>
  </div>

  <div class="panel-row">
    <div class="panel-row-name">
      Карта
    </div>

    <div class="panel-row-value">
      Leaflet / OpenStreetMap
    </div>
  </div>

  <div class="panel-row">
    <div class="panel-row-name">
      Режим
    </div>

    <div class="panel-row-value">
      PERSONAL
    </div>
  </div>

</div>

<div
  id="settingsPanel"
  class="panel"
>

  <div class="panel-head">

    <div class="panel-title">
      НАЛАШТУВАННЯ
    </div>

    <button
      class="panel-close"
      data-close="settingsPanel"
    >
      ×
    </button>

  </div>

  <div class="panel-row">

    <div class="panel-row-name">
      Темна карта
    </div>

    <div class="panel-row-value">
      ACTIVE
    </div>

  </div>

  <div class="panel-row">

    <div class="panel-row-name">
      Географічні межі
    </div>

    <div class="panel-row-value">
      ACTIVE
    </div>

  </div>

  <div class="panel-row">

    <div class="panel-row-name">
      Автооновлення
    </div>

    <div class="panel-row-value">
      READY
    </div>

  </div>

</div>

<!-- =========================
     BOTTOM NAV
========================= -->

<div class="bottom-nav">

  <button
    class="nav-btn active"
    data-panel="map"
  >
    <div class="nav-icon">⌖</div>
    <div class="nav-label">Карта</div>
  </button>

  <button
    class="nav-btn"
    data-panel="infoPanel"
  >
    <div class="nav-icon">◉</div>
    <div class="nav-label">Система</div>
  </button>

  <button
    class="nav-btn"
    data-panel="settingsPanel"
  >
    <div class="nav-icon">⚙</div>
    <div class="nav-label">Налаштування</div>
  </button>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
/* =========================================
   TELEGRAM
========================================= */

const tg = window.Telegram?.WebApp;

if (tg) {
  tg.ready();
  tg.expand();

  try {
    tg.setHeaderColor("#05070a");
    tg.setBackgroundColor("#05070a");
  } catch (e) {}
}

/* =========================================
   MAP
========================================= */

const map = L.map("map", {
  zoomControl: false,
  attributionControl: true,
  minZoom: 5,
  maxZoom: 12,
  preferCanvas: true
});

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap'
  }
).addTo(map);

/* =========================================
   UKRAINE VIEW
========================================= */

const ukraineBounds = [
  [44.0, 21.0],
  [53.0, 41.0]
];

map.fitBounds(ukraineBounds, {
  padding: [20, 20]
});

/* =========================================
   GEOJSON
========================================= */

const GEOJSON_URL =
  "https://cdn.jsdelivr.net/gh/darmat1/ukraine-geo-data@main/geodata/Ukraine.geojson";

let regionsLayer = null;

/* =========================================
   REGION STYLE
========================================= */

function regionStyle() {
  return {
    color: "rgba(255,255,255,.26)",
    weight: 1,
    opacity: .75,

    fillColor: "#0d1319",
    fillOpacity: .22
  };
}

function regionHoverStyle(layer) {

  layer.setStyle({
    color: "rgba(255,255,255,.7)",
    weight: 1.4,
    fillColor: "#1b252e",
    fillOpacity: .42
  });

  layer.bringToFront();
}

function regionLeaveStyle(layer) {

  regionsLayer.resetStyle(layer);
}

/* =========================================
   REGION INTERACTION
========================================= */

function onRegionEachFeature(feature, layer) {

  const name =
    feature?.properties?.name ||
    feature?.properties?.NAME_1 ||
    feature?.properties?.NAME ||
    feature?.properties?.name_1 ||
    "Регіон";

  layer.bindTooltip(
    name,
    {
      permanent: true,
      direction: "center",
      className: "region-label",
      opacity: .9
    }
  );

  layer.bindPopup(
    `
      <div class="popup-title">
        ${escapeHtml(name)}
      </div>

      <div class="popup-sub">
        Регіон України
      </div>
    `
  );

  layer.on({
    mouseover: () => {
      regionHoverStyle(layer);
    },

    mouseout: () => {
      regionLeaveStyle(layer);
    },

    click: () => {
      regionHoverStyle(layer);
    }
  });
}

/* =========================================
   LOAD GEOJSON
========================================= */

fetch(GEOJSON_URL)
  .then(response => {

    if (!response.ok) {
      throw new Error("GeoJSON error");
    }

    return response.json();
  })
  .then(data => {

    regionsLayer = L.geoJSON(
      data,
      {
        style: regionStyle,
        onEachFeature: onRegionEachFeature
      }
    ).addTo(map);

  })
  .catch(error => {

    console.warn(
      "Не вдалося завантажити межі регіонів:",
      error
    );

  });

/* =========================================
   DEMO OBJECTS
========================================= */

const demoObjects = [

  {
    id: "OBJ-01",
    type: "MONITOR",
    lat: 50.45,
    lng: 30.52,
    speedLat: 0.000004,
    speedLng: 0.000006
  },

  {
    id: "OBJ-02",
    type: "SCOUT",
    lat: 49.84,
    lng: 24.03,
    speedLat: -0.000003,
    speedLng: 0.000004
  },

  {
    id: "OBJ-03",
    type: "TARGET",
    lat: 48.46,
    lng: 35.05,
    speedLat: 0.000002,
    speedLng: -0.000005
  }

];

/* =========================================
   OBJECT MARKERS
========================================= */

const objectMarkers = [];

demoObjects.forEach(object => {

  const html = `
    <div class="object-marker">
      <div class="object-label">
        ${object.id}
      </div>
    </div>
  `;

  const icon = L.divIcon({
    className: "",
    html,
    iconSize: [28, 28],
    iconAnchor: [14, 14]
  });

  const marker = L.marker(
    [object.lat, object.lng],
    {
      icon,
      interactive: true
    }
  ).addTo(map);

  marker.bindPopup(`
    <div class="popup-title">
      ${escapeHtml(object.id)}
    </div>

    <div class="popup-sub">
      DEMO OBJECT · ${escapeHtml(object.type)}
    </div>
  `);

  objectMarkers.push({
    object,
    marker
  });

});

/* =========================================
   DEMO ANIMATION
========================================= */

let lastTime = performance.now();

function animateObjects(now) {

  const delta = now - lastTime;
  lastTime = now;

  if (delta < 0 || delta > 1000) {
    requestAnimationFrame(animateObjects);
    return;
  }

  objectMarkers.forEach(item => {

    const obj = item.object;

    obj.lat += obj.speedLat * delta;
    obj.lng += obj.speedLng * delta;

    /*
      Обмеження демонстраційних об'єктів
      в межах умовної області.
    */

    if (obj.lat > 52.4 || obj.lat < 46.0) {
      obj.speedLat *= -1;
    }

    if (obj.lng > 38.0 || obj.lng < 23.0) {
      obj.speedLng *= -1;
    }

    item.marker.setLatLng([
      obj.lat,
      obj.lng
    ]);

  });

  requestAnimationFrame(animateObjects);
}

requestAnimationFrame(animateObjects);

/* =========================================
   SEARCH
========================================= */

const searchInput =
  document.getElementById("search");

const searchResults =
  document.getElementById("searchResults");

const searchClear =
  document.getElementById("searchClear");

let searchTimer = null;

searchInput.addEventListener(
  "input",
  () => {

    const value =
      searchInput.value.trim();

    searchClear.style.display =
      value ? "block" : "none";

    clearTimeout(searchTimer);

    if (value.length < 2) {

      searchResults.style.display =
        "none";

      searchResults.innerHTML = "";

      return;
    }

    searchTimer = setTimeout(
      () => searchPlace(value),
      450
    );

  }
);

/* =========================================
   NOMINATIM SEARCH
========================================= */

async function searchPlace(query) {

  try {

    const url =
      "https://nominatim.openstreetmap.org/search" +
      "?format=json" +
      "&accept-language=uk" +
      "&countrycodes=ua" +
      "&limit=5" +
      "&q=" +
      encodeURIComponent(query);

    const response =
      await fetch(url, {
        headers: {
          "Accept":
            "application/json"
        }
      });

    if (!response.ok) {
      throw new Error("Search failed");
    }

    const data =
      await response.json();

    renderSearchResults(data);

  } catch (error) {

    searchResults.innerHTML = `
      <div class="search-result">
        <div class="search-result-title">
          Помилка пошуку
        </div>

        <div class="search-result-type">
          Спробуйте ще раз
        </div>
      </div>
    `;

    searchResults.style.display =
      "block";
  }
}

/* =========================================
   SEARCH RESULTS
========================================= */

function renderSearchResults(results) {

  if (!results.length) {

    searchResults.innerHTML = `
      <div class="search-result">
        <div class="search-result-title">
          Нічого не знайдено
        </div>

        <div class="search-result-type">
          Спробуйте іншу назву
        </div>
      </div>
    `;

    searchResults.style.display =
      "block";

    return;
  }

  searchResults.innerHTML =
    results.map((place, index) => {

      const title =
        place.display_name
          ?.split(",")[0] ||
        "Населений пункт";

      const type =
        place.type ||
        "location";

      return `
        <div
          class="search-result"
          data-index="${index}"
        >

          <div class="search-result-title">
            ${escapeHtml(title)}
          </div>

          <div class="search-result-type">
            ${escapeHtml(type)}
          </div>

        </div>
      `;

    }).join("");

  searchResults.style.display =
    "block";

  document
    .querySelectorAll(".search-result")
    .forEach((element, index) => {

      element.addEventListener(
        "click",
        () => {

          const place =
            results[index];

          const lat =
            Number(place.lat);

          const lon =
            Number(place.lon);

          map.flyTo(
            [lat, lon],
            10,
            {
              duration: 1.1
            }
          );

          L.popup()
            .setLatLng([lat, lon])
            .setContent(`
              <div class="popup-title">
                ${escapeHtml(
                  place.display_name
                    ?.split(",")[0] ||
                  "Місце"
                )}
              </div>

              <div class="popup-sub">
                ${escapeHtml(
                  place.type || "location"
                )}
              </div>
            `)
            .openOn(map);

          searchResults.style.display =
            "none";

        }
      );

    });
}

/* =========================================
   CLEAR SEARCH
========================================= */

searchClear.addEventListener(
  "click",
  () => {

    searchInput.value = "";

    searchClear.style.display =
      "none";

    searchResults.style.display =
      "none";

    searchResults.innerHTML = "";

    searchInput.focus();

  }
);

/* =========================================
   MAP CONTROLS
========================================= */

document
  .getElementById("zoomIn")
  .addEventListener(
    "click",
    () => map.zoomIn()
  );

document
  .getElementById("zoomOut")
  .addEventListener(
    "click",
    () => map.zoomOut()
  );

document
  .getElementById("resetBtn")
  .addEventListener(
    "click",
    () => {

      map.flyToBounds(
        ukraineBounds,
        {
          padding: [20, 20],
          duration: 1
        }
      );

    }
  );

/* =========================================
   GEOLOCATION
========================================= */

document
  .getElementById("locateBtn")
  .addEventListener(
    "click",
    () => {

      if (!navigator.geolocation) {

        alert(
          "Геолокація недоступна"
        );

        return;
      }

      navigator.geolocation.getCurrentPosition(
        position => {

          const lat =
            position.coords.latitude;

          const lng =
            position.coords.longitude;

          map.flyTo(
            [lat, lng],
            14,
            {
              duration: 1
            }
          );

          L.circleMarker(
            [lat, lng],
            {
              radius: 7,
              color: "#fff",
              weight: 2,
              fillColor: "#fff",
              fillOpacity: .22
            }
          )
          .addTo(map)
          .bindPopup(
            "Ваше місцезнаходження"
          )
          .openPopup();

        },

        error => {

          console.warn(
            "Geolocation:",
            error
          );

          alert(
            "Не вдалося отримати місцезнаходження"
          );

        },

        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 30000
        }
      );

    }
  );

/* =========================================
   NAVIGATION
========================================= */

const navButtons =
  document.querySelectorAll(
    ".nav-btn"
  );

const panels =
  document.querySelectorAll(
    ".panel"
  );

navButtons.forEach(button => {

  button.addEventListener(
    "click",
    () => {

      const panelId =
        button.dataset.panel;

      navButtons.forEach(btn =>
        btn.classList.remove("active")
      );

      button.classList.add("active");

      panels.forEach(panel =>
        panel.classList.remove("open")
      );

      if (panelId === "map") {

        map.invalidateSize();

        return;
      }

      const panel =
        document.getElementById(panelId);

      if (panel) {
        panel.classList.add("open");
      }

    }
  );

});

/* =========================================
   CLOSE PANELS
========================================= */

document
  .querySelectorAll(
    "[data-close]"
  )
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        const id =
          button.dataset.close;

        const panel =
          document.getElementById(id);

        if (panel) {
          panel.classList.remove("open");
        }

        navButtons.forEach(btn =>
          btn.classList.remove("active")
        );

        document
          .querySelector(
            '.nav-btn[data-panel="map"]'
          )
          ?.classList.add("active");

      }
    );

  });

/* =========================================
   CLICK MAP
========================================= */

map.on(
  "click",
  () => {

    searchResults.style.display =
      "none";

  }
);

/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}

/* =========================================
   CLOCK
========================================= */

function updateClock() {

  const now =
    new Date();

  const time =
    now.toLocaleTimeString(
      "uk-UA",
      {
        hour: "2-digit",
        minute: "2-digit"
      }
    );

  document
    .getElementById("statusTime")
    .textContent = time;
}

updateClock();

setInterval(
  updateClock,
  30000
);

/* =========================================
   FINAL MAP SIZE
========================================= */

setTimeout(
  () => map.invalidateSize(),
  300
);

setTimeout(
  () => map.invalidateSize(),
  1000
);

</script>
