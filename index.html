<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  >

  <title>ONLINE RADAR</title>

  <link
    href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css"
    rel="stylesheet"
  >

  <script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>

  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05090b;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      position: fixed;
      inset: 0;
    }

    /* =========================================================
       MAP
    ========================================================= */

    #map {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #05090b;
    }

    /* =========================================================
       ONLINE STATUS
    ========================================================= */

    #status {
      position: fixed;

      left: 50%;

      bottom:
        calc(
          12px +
          env(safe-area-inset-bottom)
        );

      transform: translateX(-50%);

      z-index: 1000;

      display: flex;

      align-items: center;
      justify-content: center;

      gap: 7px;

      padding: 7px 11px;

      border:
        1px solid
        rgba(120, 150, 155, 0.22);

      border-radius: 999px;

      background:
        rgba(5, 10, 12, 0.72);

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

      color: #d5dedf;

      font-size: 10px;

      line-height: 1;

      letter-spacing: 0.45px;

      white-space: nowrap;

      pointer-events: none;

      user-select: none;
    }

    #online-dot {
      width: 6px;
      height: 6px;

      border-radius: 50%;

      background: #00ff66;

      box-shadow:
        0 0 4px rgba(0, 255, 102, 0.9),
        0 0 9px rgba(0, 255, 102, 0.45);

      animation:
        pulse 1.7s
        infinite
        ease-in-out;

      flex: 0 0 auto;
    }

    #online-text {
      color: #00ff66;
      font-weight: 700;
      letter-spacing: 0.65px;
    }

    #datetime {
      color: #b9c5c7;
      font-variant-numeric: tabular-nums;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.45;
        transform: scale(0.78);
      }
    }

    /* =========================================================
       MAP CONTROLS
    ========================================================= */

    .maplibregl-ctrl-top-left,
    .maplibregl-ctrl-top-right,
    .maplibregl-ctrl-bottom-left {
      display: none !important;
    }

    .maplibregl-ctrl-bottom-right {
      opacity: 0.25;
      transform: scale(0.72);
      transform-origin: bottom right;
    }

    .maplibregl-ctrl-attrib {
      background:
        rgba(0, 0, 0, 0.2) !important;

      color:
        #899496 !important;
    }

    .maplibregl-ctrl-attrib a {
      color:
        #899496 !important;
    }

    #map canvas {
      outline: none;
    }

    /* =========================================================
       TEST / DEMO EVENTS
    ========================================================= */

    /*
     * ЗОВНІШНІЙ КОНТЕЙНЕР.
     *
     * MapLibre позиціонує саме його.
     *
     * Важливо:
     * на цьому елементі НЕМАЄ animation і transform.
     */

    .test-marker-wrapper {
      width: 22px;
      height: 22px;

      display: flex;

      align-items: center;
      justify-content: center;

      pointer-events: none;
    }


    /*
     * ЧЕРВОНА ТОЧКА.
     *
     * Анімація знаходиться тільки тут.
     *
     * Тому transform MapLibre
     * більше не конфліктує з animation.
     */

    .test-marker {
      width: 18px;
      height: 18px;

      border-radius: 50%;

      background:
        rgba(255, 48, 79, 0.18);

      border:
        2px solid
        #ff304f;

      box-shadow:
        0 0 5px
        rgba(255, 48, 79, 0.95),

        0 0 16px
        rgba(255, 48, 79, 0.65);

      position: relative;

      animation:
        testMarkerPulse 1.5s
        infinite
        ease-in-out;
    }


    .test-marker::after {
      content: "";

      position: absolute;

      left: 50%;
      top: 50%;

      width: 5px;
      height: 5px;

      transform:
        translate(-50%, -50%);

      border-radius: 50%;

      background:
        #ff304f;

      box-shadow:
        0 0 5px
        rgba(255, 48, 79, 0.95);
    }


    @keyframes testMarkerPulse {

      0%,
      100% {
        transform: scale(1);
        opacity: 1;
      }

      50% {
        transform: scale(0.82);
        opacity: 0.72;
      }

    }


    /*
     * Ніякого TEST label.
     */

    .test-label {
      display: none !important;
    }

  </style>
</head>


<body>

  <div id="map"></div>


  <div id="status">

    <span id="online-dot"></span>

    <span id="online-text">
      ONLINE RADAR
    </span>

    <span>|</span>

    <span id="datetime">
      --.--.---- · --:--:--
    </span>

  </div>


  <script>

    /* =========================================================
       CONFIG
    ========================================================= */

    const MAP_STYLE =
      "https://tiles.openfreemap.org/styles/dark";


    const BACKEND_URL =
      "https://monitor-map-ua.onrender.com";


    const HEALTH_URL =
      `${BACKEND_URL}/health`;


    const EVENTS_URL =
      `${BACKEND_URL}/events`;


    const WS_URL =
      BACKEND_URL.replace(
        /^http/,
        "ws"
      ) + "/ws";


    const KYIV_VIEW_BOUNDS = [

      [28.55, 48.82],

      [32.72, 51.78]

    ];


    const MAP_MAX_BOUNDS = [

      [28.25, 48.55],

      [33.15, 52.05]

    ];


    /* =========================================================
       BACKEND STATUS
    ========================================================= */

    const onlineDot =
      document.getElementById(
        "online-dot"
      );


    const onlineText =
      document.getElementById(
        "online-text"
      );


    function setBackendStatus(
      online
    ) {

      if (online) {

        onlineText.textContent =
          "ONLINE RADAR";

        onlineText.style.color =
          "#00ff66";

        onlineDot.style.background =
          "#00ff66";

        onlineDot.style.boxShadow =
          "0 0 4px rgba(0,255,102,.9), 0 0 9px rgba(0,255,102,.45)";

      } else {

        onlineText.textContent =
          "OFFLINE";

        onlineText.style.color =
          "#ff5369";

        onlineDot.style.background =
          "#ff304f";

        onlineDot.style.boxShadow =
          "0 0 4px rgba(255,48,79,.9), 0 0 9px rgba(255,48,79,.45)";

      }

    }


    async function checkBackend() {

      try {

        const response =
          await fetch(
            HEALTH_URL,
            {
              method: "GET",
              cache: "no-store"
            }
          );


        if (!response.ok) {
          throw new Error(
            `HTTP ${response.status}`
          );
        }


        const data =
          await response.json();


        setBackendStatus(
          data.ok === true
        );

      } catch (error) {

        console.warn(
          "Backend:",
          error
        );

        setBackendStatus(
          false
        );

      }

    }


    checkBackend();


    setInterval(
      checkBackend,
      30000
    );


    /* =========================================================
       MAP
    ========================================================= */

    const map =
      new maplibregl.Map({

        container: "map",

        style: MAP_STYLE,

        center: [
          30.95,
          50.75
        ],

        zoom: 5.7,

        minZoom: 5.7,

        maxZoom: 16,

        maxBounds:
          MAP_MAX_BOUNDS,

        dragRotate: false,

        pitchWithRotate: false,

        touchPitch: false,

        cooperativeGestures: false,

        attributionControl: true

      });


    /* =========================================================
       CLOCK
    ========================================================= */

    function updateClock() {

      const now =
        new Date();


      const dd =
        String(
          now.getDate()
        ).padStart(
          2,
          "0"
        );


      const mm =
        String(
          now.getMonth() + 1
        ).padStart(
          2,
          "0"
        );


      const yyyy =
        now.getFullYear();


      const hh =
        String(
          now.getHours()
        ).padStart(
          2,
          "0"
        );


      const min =
        String(
          now.getMinutes()
        ).padStart(
          2,
          "0"
        );


      const sec =
        String(
          now.getSeconds()
        ).padStart(
          2,
          "0"
        );


      document
        .getElementById(
          "datetime"
        )
        .textContent =
          `${dd}.${mm}.${yyyy} · ${hh}:${min}:${sec}`;

    }


    updateClock();


    setInterval(
      updateClock,
      1000
    );


    /* =========================================================
       EVENTS STATE
    ========================================================= */

    const eventMarkers =
      new Map();


    /*
     * Видаляє всі поточні маркери.
     */

    function removeAllEventMarkers() {

      for (
        const marker
        of eventMarkers.values()
      ) {

        marker.remove();

      }


      eventMarkers.clear();

    }


    /*
     * Видаляє конкретний маркер.
     */

    function removeEventMarker(
      id
    ) {

      const key =
        String(id);


      const marker =
        eventMarkers.get(
          key
        );


      if (!marker) {
        return;
      }


      marker.remove();


      eventMarkers.delete(
        key
      );

    }


    /*
     * Створення ОДНІЄЇ червоної точки.
     *
     * ВАЖЛИВО:
     *
     * MapLibre позиціонує wrapper.
     *
     * CSS animation працює тільки
     * на внутрішньому test-marker.
     */

    function createEventMarker(
      event
    ) {

      if (
        !event
      ) {
        return;
      }


      const lat =
        Number(event.lat);


      const lon =
        Number(event.lon);


      if (
        !Number.isFinite(lat) ||
        !Number.isFinite(lon) ||
        lat < -90 ||
        lat > 90 ||
        lon < -180 ||
        lon > 180
      ) {

        console.warn(
          "Invalid event coordinates:",
          event
        );

        return;

      }


      const id =
        String(
          event.id
        );


      /*
       * Якщо така точка вже існує —
       * прибираємо старий маркер.
       *
       * Це дозволяє переміщати
       * точку №1 з одного місця
       * на інше.
       */

      removeEventMarker(
        id
      );


      /*
       * ЗОВНІШНІЙ WRAPPER.
       *
       * MapLibre буде змінювати
       * його transform.
       */

      const wrapper =
        document.createElement(
          "div"
        );


      wrapper.className =
        "test-marker-wrapper";


      /*
       * ВНУТРІШНЯ ЧЕРВОНА ТОЧКА.
       *
       * Саме на ній animation.
       */

      const markerElement =
        document.createElement(
          "div"
        );


      markerElement.className =
        "test-marker";


      wrapper.appendChild(
        markerElement
      );


      /*
       * Створюємо MapLibre marker.
       *
       * Координати встановлюються
       * на wrapper.
       */

      const mapMarker =
        new maplibregl.Marker({

          element:
            wrapper,

          anchor:
            "center"

        })


        .setLngLat([

          lon,

          lat

        ])


        .addTo(map);


      /*
       * Зберігаємо маркер
       * за його ID.
       */

      eventMarkers.set(
        id,
        mapMarker
      );

    }


    /*
     * Рендер усіх поточних подій.
     *
     * Може бути:
     *
     * 1 точка
     * 5 точок
     * 10 точок
     * 50 точок
     */

    function renderEvents(
      events
    ) {

      if (
        !Array.isArray(
          events
        )
      ) {

        return;

      }


      /*
       * Створюємо набір ID,
       * які зараз прийшли
       * з backend.
       */

      const currentIds =
        new Set();


      for (
        const event
        of events
      ) {

        if (
          !event ||
          event.id === undefined ||
          event.id === null
        ) {

          continue;

        }


        const id =
          String(
            event.id
          );


        currentIds.add(
          id
        );


        createEventMarker(
          event
        );

      }


      /*
       * Видаляємо з карти маркери,
       * яких backend вже не повертає.
       */

      for (
        const [
          id,
          marker
        ]
        of eventMarkers.entries()
      ) {

        if (
          !currentIds.has(
            id
          )
        ) {

          marker.remove();

          eventMarkers.delete(
            id
          );

        }

      }

    }


    /* =========================================================
       GET CURRENT EVENTS
    ========================================================= */

    async function loadEvents() {

      try {

        const response =
          await fetch(
            EVENTS_URL,
            {
              method: "GET",
              cache: "no-store"
            }
          );


        if (!response.ok) {

          throw new Error(
            `Events HTTP ${response.status}`
          );

        }


        const data =
          await response.json();


        if (
          data &&
          Array.isArray(
            data.events
          )
        ) {

          renderEvents(
            data.events
          );

        }

      } catch (error) {

        console.warn(
          "Events:",
          error
        );

      }

    }


    /* =========================================================
       WEBSOCKET
    ========================================================= */

    let socket =
      null;


    let reconnectTimer =
      null;


    function connectWebSocket() {

      try {

        socket =
          new WebSocket(
            WS_URL
          );

      } catch (error) {

        console.warn(
          "WebSocket:",
          error
        );

        scheduleReconnect();

        return;

      }


      socket.addEventListener(
        "open",
        () => {

          console.log(
            "ONLINE RADAR WebSocket connected"
          );

        }
      );


      socket.addEventListener(
        "message",
        event => {

          try {

            const data =
              JSON.parse(
                event.data
              );


            if (
              data.type === "state" &&
              Array.isArray(
                data.events
              )
            ) {

              renderEvents(
                data.events
              );

            }

          } catch (error) {

            console.warn(
              "WebSocket message:",
              error
            );

          }

        }
      );


      socket.addEventListener(
        "close",
        () => {

          console.warn(
            "WebSocket disconnected"
          );

          scheduleReconnect();

        }
      );


      socket.addEventListener(
        "error",
        error => {

          console.warn(
            "WebSocket error:",
            error
          );

        }
      );

    }


    function scheduleReconnect() {

      if (
        reconnectTimer
      ) {

        return;

      }


      reconnectTimer =
        setTimeout(
          () => {

            reconnectTimer =
              null;

            connectWebSocket();

          },

          5000

        );

    }


    /* =========================================================
       MAP LOAD
    ========================================================= */

    map.on(
      "load",
      async () => {

        map.fitBounds(

          KYIV_VIEW_BOUNDS,

          {

            padding: {

              top: 40,

              bottom: 95,

              left: 18,

              right: 18

            },

            maxZoom: 6.15,

            duration: 0

          }

        );


        const initialZoom =
          map.getZoom();


        map.setMinZoom(
          initialZoom
        );


        map.dragRotate.disable();


        map.touchZoomRotate
          .disableRotation();


        await buildCustomMapLayers();


        addBelarusBorderInstant();


        /*
         * Поточні події.
         */

        await loadEvents();


        /*
         * Живі оновлення.
         */

        connectWebSocket();

      }
    );


    /* =========================================================
       CUSTOM MAP LAYERS
    ========================================================= */

    async function buildCustomMapLayers() {

      const styleLayers =
        map.getStyle().layers || [];


      let firstSymbolLayerId =
        null;


      const placeSymbolLayers =
        [];


      for (
        const layer
        of styleLayers
      ) {

        if (

          layer.type === "symbol" &&

          layer["source-layer"] === "place"

        ) {

          if (
            !firstSymbolLayerId
          ) {

            firstSymbolLayerId =
              layer.id;

          }


          placeSymbolLayers.push(
            layer.id
          );

        }

      }


      /* =======================================================
         УКРАЇНСЬКІ НАЗВИ
      ======================================================= */

      for (
        const layerId
        of placeSymbolLayers
      ) {

        try {

          map.setLayoutProperty(

            layerId,

            "visibility",

            "visible"

          );


          map.setLayoutProperty(

            layerId,

            "text-field",

            [

              "coalesce",

              [
                "get",
                "name:uk"
              ],

              [
                "get",
                "name"
              ]

            ]

          );

        } catch (e) {

          console.warn(
            "Place layer:",
            layerId,
            e
          );

        }

      }


      /* =======================================================
         DISTRICTS
      ======================================================= */

      if (
        !map.getLayer(
          "kyiv-districts"
        )
      ) {

        map.addLayer(

          {

            id:
              "kyiv-districts",

            type:
              "line",

            source:
              "openmaptiles",

            "source-layer":
              "boundary",

            minzoom:
              5.4,

            filter:
              [

                "==",

                [
                  "get",
                  "admin_level"
                ],

                6

              ],

            paint:
              {

                "line-color":
                  "#52686b",

                "line-opacity":
                  [

                    "interpolate",

                    ["linear"],

                    ["zoom"],

                    5.4,
                    0.24,

                    12,
                    0.42

                  ],

                "line-width":
                  [

                    "interpolate",

                    ["linear"],

                    ["zoom"],

                    5.4,
                    0.65,

                    14,
                    1.5

                  ],

                "line-dasharray":
                  [
                    2,
                    2
                  ]

              }

          },

          firstSymbolLayerId ||
          undefined

        );

      }


      /* =======================================================
         WATER LABELS
      ======================================================= */

      if (
        !map.getLayer(
          "water-labels-ukrainian"
        )
      ) {

        map.addLayer(

          {

            id:
              "water-labels-ukrainian",

            type:
              "symbol",

            source:
              "openmaptiles",

            "source-layer":
              "water",

            minzoom:
              7,

            layout:
              {

                "text-field":
                  [

                    "coalesce",

                    [
                      "get",
                      "name:uk"
                    ],

                    [
                      "get",
                      "name"
                    ]

                  ],

                "text-font":
                  [
                    "Noto Sans Italic"
                  ],

                "text-size":
                  [

                    "interpolate",

                    ["linear"],

                    ["zoom"],

                    7,
                    9,

                    12,
                    11,

                    16,
                    13

                  ]

              },

            paint:
              {

                "text-color":
                  "#63898f",

                "text-halo-color":
                  "#071012",

                "text-halo-width":
                  1

              }

          }

        );

      }


      /* =======================================================
         EXACT KYIV OBLAST
      ======================================================= */

      try {

        const response =
          await fetch(

            "https://nominatim.openstreetmap.org/lookup?osm_ids=R71248&format=geojson&polygon_geojson=1",

            {

              headers:
                {

                  "Accept":
                    "application/json"

                }

            }

          );


        if (!response.ok) {

          throw new Error(

            `Nominatim HTTP ${response.status}`

          );

        }


        const data =
          await response.json();


        if (

          !data ||

          !data.features ||

          !data.features.length

        ) {

          throw new Error(

            "Геометрію Київської області не знайдено"

          );

        }


        if (
          !map.getSource(
            "kyiv-oblast-exact"
          )
        ) {

          map.addSource(

            "kyiv-oblast-exact",

            {

              type:
                "geojson",

              data:
                data

            }

          );

        }


        /* =====================================================
           FILL
        ===================================================== */

        if (
          !map.getLayer(
            "kyiv-oblast-fill"
          )
        ) {

          map.addLayer(

            {

              id:
                "kyiv-oblast-fill",

              type:
                "fill",

              source:
                "kyiv-oblast-exact",

              paint:
                {

                  "fill-color":
                    "#00eaff",

                  "fill-opacity":
                    0.018

                }

            },

            firstSymbolLayerId ||
            undefined

          );

        }


        /* =====================================================
           GLOW
        ===================================================== */

        if (
          !map.getLayer(
            "kyiv-oblast-glow"
          )
        ) {

          map.addLayer(

            {

              id:
                "kyiv-oblast-glow",

              type:
                "line",

              source:
                "kyiv-oblast-exact",

              paint:
                {

                  "line-color":
                    "#00eaff",

                  "line-opacity":
                    0.28,

                  "line-width":
                    [

                      "interpolate",

                      ["linear"],

                      ["zoom"],

                      5,
                      5,

                      14,
                      9

                    ],

                  "line-blur":
                    5

                }

            },

            firstSymbolLayerId ||
            undefined

          );

        }


        /* =====================================================
           MAIN BORDER
        ===================================================== */

        if (
          !map.getLayer(
            "kyiv-oblast-border"
          )
        ) {

          map.addLayer(

            {

              id:
                "kyiv-oblast-border",

              type:
                "line",

              source:
                "kyiv-oblast-exact",

              paint:
                {

                  "line-color":
                    "#00eaff",

                  "line-opacity":
                    0.92,

                  "line-width":
                    [

                      "interpolate",

                      ["linear"],

                      ["zoom"],

                      5,
                      1.5,

                      10,
                      2.4,

                      14,
                      3.5

                    ],

                  "line-blur":
                    0.15

                }

            },

            firstSymbolLayerId ||
            undefined

          );

        }

      } catch (error) {

        console.warn(
          "Kyiv oblast:",
          error
        );

      }


      /*
       * Назви міст поверх меж.
       */

      for (
        const layerId
        of placeSymbolLayers
      ) {

        try {

          map.moveLayer(
            layerId
          );

        } catch (e) {}

      }

    }


    /* =========================================================
       BELARUS BORDER / RAZOR WIRE
    ========================================================= */

    function addBelarusBorderInstant() {

      if (
        !map.hasImage(
          "red-razor-wire"
        )
      ) {

        const width =
          64;


        const height =
          24;


        const canvas =
          document.createElement(
            "canvas"
          );


        canvas.width =
          width;


        canvas.height =
          height;


        const ctx =
          canvas.getContext(
            "2d"
          );


        ctx.clearRect(
          0,
          0,
          width,
          height
        );


        ctx.strokeStyle =
          "#ff304f";


        ctx.lineWidth =
          1.6;


        ctx.beginPath();


        ctx.moveTo(
          0,
          9
        );


        ctx.lineTo(
          width,
          9
        );


        ctx.stroke();


        ctx.beginPath();


        ctx.moveTo(
          0,
          15
        );


        ctx.lineTo(
          width,
          15
        );


        ctx.stroke();


        const bladePositions = [
          8,
          24,
          40,
          56
        ];


        for (
          const x
          of bladePositions
        ) {

          ctx.strokeStyle =
            "#ff5369";


          ctx.lineWidth =
            1.45;


          ctx.beginPath();

          ctx.moveTo(
            x - 6,
            4
          );

          ctx.lineTo(
            x + 6,
            20
          );

          ctx.stroke();


          ctx.beginPath();

          ctx.moveTo(
            x - 6,
            20
          );

          ctx.lineTo(
            x + 6,
            4
          );

          ctx.stroke();


          ctx.fillStyle =
            "#ff304f";


          ctx.beginPath();

          ctx.arc(
            x - 6,
            4,
            1.25,
            0,
            Math.PI * 2
          );

          ctx.fill();


          ctx.beginPath();

          ctx.arc(
            x + 6,
            4,
            1.25,
            0,
            Math.PI * 2
          );

          ctx.fill();


          ctx.beginPath();

          ctx.arc(
            x - 6,
            20,
            1.25,
            0,
            Math.PI * 2
          );

          ctx.fill();


          ctx.beginPath();

          ctx.arc(
            x + 6,
            20,
            1.25,
            0,
            Math.PI * 2
          );

          ctx.fill();

        }


        map.addImage(

          "red-razor-wire",

          {

            width:
              width,

            height:
              height,

            data:
              ctx.getImageData(

                0,
                0,
                width,
                height

              ).data

          }

        );

      }


      /* =======================================================
         FIND LABEL LAYER
      ======================================================= */

      const styleLayers =
        map.getStyle().layers || [];


      let firstSymbolLayerId =
        null;


      for (
        const layer
        of styleLayers
      ) {

        if (
          layer.type === "symbol"
        ) {

          firstSymbolLayerId =
            layer.id;

          break;

        }

      }


      /* =======================================================
         BELARUS / UKRAINE FILTER
      ======================================================= */

      const belarusUkraineFilter = [

        "all",

        [

          "==",

          [
            "get",
            "admin_level"
          ],

          2

        ],

        [

          "==",

          [
            "get",
            "maritime"
          ],

          0

        ],

        [

          "any",

          [

            "all",

            [

              "==",

              [
                "get",
                "adm0_l"
              ],

              "BLR"

            ],

            [

              "==",

              [
                "get",
                "adm0_r"
              ],

              "UKR"

            ]

          ],

          [

            "all",

            [

              "==",

              [
                "get",
                "adm0_l"
              ],

              "UKR"

            ],

            [

              "==",

              [
                "get",
                "adm0_r"
              ],

              "BLR"

            ]

          ],

          [

            "all",

            [

              "==",

              [
                "get",
                "adm0_l"
              ],

              "BY"

            ],

            [

              "==",

              [
                "get",
                "adm0_r"
              ],

              "UA"

            ]

          ],

          [

            "all",

            [

              "==",

              [
                "get",
                "adm0_l"
              ],

              "UA"

            ],

            [

              "==",

              [
                "get",
                "adm0_r"
              ],

              "BY"

            ]

          ]

        ]

      ];


      /* =======================================================
         DARK RED UNDERLINE
      ======================================================= */

      if (
        !map.getLayer(
          "belarus-border-base"
        )
      ) {

        map.addLayer(

          {

            id:
              "belarus-border-base",

            type:
              "line",

            source:
              "openmaptiles",

            "source-layer":
              "boundary",

            minzoom:
              5,

            filter:
              belarusUkraineFilter,

            layout:
              {

                "line-cap":
                  "round",

                "line-join":
                  "round"

              },

            paint:
              {

                "line-color":
                  "#8f1830",

                "line-opacity":
                  0.95,

                "line-width":
                  [

                    "interpolate",

                    ["linear"],

                    ["zoom"],

                    5,
                    1.5,

                    8,
                    2,

                    12,
                    2.8,

                    16,
                    3.5

                  ]

              }

          },

          firstSymbolLayerId ||
          undefined

        );

      }


      /* =======================================================
         RED GLOW
      ======================================================= */

      if (
        !map.getLayer(
          "belarus-border-glow"
        )
      ) {

        map.addLayer(

          {

            id:
              "belarus-border-glow",

            type:
              "line",

            source:
              "openmaptiles",

            "source-layer":
              "boundary",

            minzoom:
              5,

            filter:
              belarusUkraineFilter,

            layout:
              {

                "line-cap":
                  "round",

                "line-join":
                  "round"

              },

            paint:
              {

                "line-color":
                  "#ff304f",

                "line-opacity":
                  0.32,

                "line-width":
                  [

                    "interpolate",

                    ["linear"],

                    ["zoom"],

                    5,
                    5,

                    8,
                    6,

                    12,
                    8,

                    16,
                    11

                  ],

                "line-blur":
                  4

              }

          },

          firstSymbolLayerId ||
          undefined

        );

      }


      /* =======================================================
         RAZOR WIRE
      ======================================================= */

      if (
        !map.getLayer(
          "belarus-razor-wire"
        )
      ) {

        map.addLayer(

          {

            id:
              "belarus-razor-wire",

            type:
              "line",

            source:
              "openmaptiles",

            "source-layer":
              "boundary",

            minzoom:
              5,

            filter:
              belarusUkraineFilter,

            layout:
              {

                "line-cap":
                  "butt",

                "line-join":
                  "round"

              },

            paint:
              {

                "line-pattern":
                  "red-razor-wire",

                "line-opacity":
                  1

              }

          },

          firstSymbolLayerId ||
          undefined

        );

      }


      /* =======================================================
         BRIGHT CORE
      ======================================================= */

      if (
        !map.getLayer(
          "belarus-border-core"
        )
      ) {

        map.addLayer(

          {

            id:
              "belarus-border-core",

            type:
              "line",

            source:
              "openmaptiles",

            "source-layer":
              "boundary",

            minzoom:
              5.8,

            filter:
              belarusUkraineFilter,

            layout:
              {

                "line-cap":
                  "round",

                "line-join":
                  "round"

              },

            paint:
              {

                "line-color":
                  "#ff304f",

                "line-opacity":
                  0.58,

                "line-width":
                  [

                    "interpolate",

                    ["linear"],

                    ["zoom"],

                    5.8,
                    0.7,

                    10,
                    1.1,

                    16,
                    1.6

                  ]

              }

          },

          firstSymbolLayerId ||
          undefined

        );

      }


      /* =======================================================
         LABELS ABOVE BORDER
      ======================================================= */

      const finalLayers =
        map.getStyle().layers || [];


      for (
        const layer
        of finalLayers
      ) {

        if (

          layer.type === "symbol" &&

          layer["source-layer"] === "place"

        ) {

          try {

            map.moveLayer(
              layer.id
            );

          } catch (e) {}

        }

      }


      console.log(
        "🇧🇾 Razor wire border loaded instantly"
      );

    }


    /* =========================================================
       MAP ERRORS
    ========================================================= */

    map.on(
      "error",
      event => {

        if (
          event &&
          event.error
        ) {

          console.warn(
            "MapLibre:",
            event.error
          );

        }

      }
    );

  </script>

</body>
</html>
