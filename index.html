<script>

/* =========================================================
   TELEGRAM MINI APP
========================================================= */

const tg =
  window.Telegram?.WebApp;


if (tg) {

  try {

    tg.ready();

    tg.expand();

    tg.setHeaderColor?.(
      "#050708"
    );

    tg.setBackgroundColor?.(
      "#050708"
    );

  }

  catch (_) {}

}


/* =========================================================
   CLOCK
========================================================= */

const clock =
  document.getElementById(
    "clock"
  );


function updateClock() {

  const now =
    new Date();


  const date =
    new Intl.DateTimeFormat(
      "uk-UA",
      {

        timeZone:
          "Europe/Kyiv",

        day:
          "2-digit",

        month:
          "2-digit",

        year:
          "numeric"

      }
    ).format(now);


  const time =
    new Intl.DateTimeFormat(
      "uk-UA",
      {

        timeZone:
          "Europe/Kyiv",

        hour:
          "2-digit",

        minute:
          "2-digit",

        second:
          "2-digit",

        hour12:
          false

      }
    ).format(now);


  clock.textContent =
    `${date} · ${time}`;

}


updateClock();

setInterval(
  updateClock,
  1000
);


/* =========================================================
   CONFIG
========================================================= */


/*
 * OpenFreeMap Dark.
 *
 * OpenFreeMap офіційно підтримує MapLibre
 * та використовує OpenStreetMap/OpenMapTiles.
 */

const STYLE_URL =
  "https://tiles.openfreemap.org/styles/dark";


/*
 * Реальний контур Київської області.
 */

const KYIV_OBLAST_URL =
  "https://geo2day.com/europe/ukraine/kiev_oblast.geojson";


/*
 * Стартовий кадр.
 *
 * Київщина повинна займати більшу частину
 * екрана, ніж у попередній версії.
 */

const START_CENTER = [
  30.72,
  50.28
];


const START_ZOOM =
  8.65;


/*
 * Не дозволяємо від'їхати
 * на всю Україну.
 */

const MAX_BOUNDS = [

  [29.05, 49.05],

  [32.30, 51.60]

];


/* =========================================================
   START
========================================================= */

async function startMap() {

  try {

    /*
     * Завантажуємо style JSON.
     */

    const response =
      await fetch(
        STYLE_URL,
        {
          cache:
            "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        `Style HTTP ${response.status}`
      );

    }


    const style =
      await response.json();


    /*
     * Налаштовуємо тільки базові
     * кольори та зайвий шум.
     */

    customizeStyle(
      style
    );


    /*
     * Створюємо карту.
     */

    const map =
      new maplibregl.Map({

        container:
          "map",

        style:
          style,

        center:
          START_CENTER,

        zoom:
          START_ZOOM,

        minZoom:
          7.55,

        maxZoom:
          16,

        maxBounds:
          MAX_BOUNDS,

        attributionControl:
          true,

        pitchWithRotate:
          false,

        dragRotate:
          false,

        touchPitch:
          false,

        touchZoomRotate:
          true,

        cooperativeGestures:
          false

      });


    window.KYIV_MAP =
      map;


    /*
     * Коли базова карта готова.
     */

    map.once(
      "load",
      async () => {

        try {

          /*
           * ------------------------------------------------
           * 1. Реальна область
           * ------------------------------------------------
           */

          const oblast =
            await loadOblast(
              map
            );


          /*
           * ------------------------------------------------
           * 2. Маска навколо області
           * ------------------------------------------------
           */

          addOutsideMask(
            map,
            oblast
          );


          /*
           * ------------------------------------------------
           * 3. Легке підсвічування області
           * ------------------------------------------------
           */

          addOblastFill(
            map
          );


          /*
           * ------------------------------------------------
           * 4. Районні межі
           * ------------------------------------------------
           */

          addDistrictBoundaries(
            map
          );


          /*
           * ------------------------------------------------
           * 5. Назви міст
           * ------------------------------------------------
           */

          addCityLabels(
            map
          );


          /*
           * ------------------------------------------------
           * 6. Назви води
           * ------------------------------------------------
           */

          addWaterLabels(
            map
          );


          /*
           * ------------------------------------------------
           * 7. Реальна межа області
           * ------------------------------------------------
           */

          addOblastBorder(
            map
          );


          /*
           * ------------------------------------------------
           * 8. Київ окремо
           * ------------------------------------------------
           */

          addKyivBoundary(
            map
          );


          /*
           * ------------------------------------------------
           * 9. Стартовий кадр
           * ------------------------------------------------
           */

          map.jumpTo({

            center:
              START_CENTER,

            zoom:
              START_ZOOM

          });

        }

        catch (error) {

          console.error(
            "MAP LAYERS:",
            error
          );

        }


        /*
         * Забираємо loading.
         */

        setTimeout(
          () => {

            document
              .getElementById(
                "loading"
              )
              .classList
              .add(
                "hidden"
              );

          },
          450
        );

      }
    );

  }

  catch (error) {

    console.error(
      "MAP START:",
      error
    );


    document
      .querySelector(
        ".loading-text"
      )
      .textContent =
        "MAP CONNECTION ERROR";

  }

}


/* =========================================================
   BASE STYLE
========================================================= */

function customizeStyle(
  style
) {

  for (
    const layer
    of style.layers || []
  ) {

    const sourceLayer =
      String(
        layer[
          "source-layer"
        ] || ""
      ).toLowerCase();


    /*
     * Background.
     */

    if (
      layer.type ===
      "background"
    ) {

      layer.paint = {

        ...(layer.paint || {}),

        "background-color":
          "#050708"

      };

    }


    /*
     * Water.
     */

    if (
      sourceLayer ===
      "water" &&
      layer.type ===
      "fill"
    ) {

      layer.paint = {

        ...(layer.paint || {}),

        "fill-color":
          "#08191d",

        "fill-opacity":
          0.98

      };

    }


    /*
     * Rivers.
     */

    if (
      sourceLayer ===
      "waterway" &&
      layer.type ===
      "line"
    ) {

      layer.paint = {

        ...(layer.paint || {}),

        "line-color":
          "#15464e",

        "line-opacity":
          0.70

      };

    }


    /*
     * Roads.
     */

    if (
      sourceLayer ===
      "transportation" &&
      layer.type ===
      "line"
    ) {

      layer.paint = {

        ...(layer.paint || {}),

        "line-opacity":
          0.54

      };

    }


    /*
     * POI — вимикаємо.
     */

    if (
      sourceLayer === "poi" ||
      sourceLayer === "housenumber"
    ) {

      layer.layout = {

        ...(layer.layout || {}),

        visibility:
          "none"

      };

    }


    /*
     * ------------------------------------------------------
     * ВАЖЛИВО
     *
     * place НЕ вимикаємо.
     *
     * Це головне виправлення після попереднього скріну.
     * ------------------------------------------------------
     */

    if (
      sourceLayer ===
      "place" &&
      layer.type ===
      "symbol"
    ) {

      /*
       * Залишаємо оригінальний filter.
       */

      /*
       * Перемикаємо текст на український,
       * якщо поле існує.
       */

      layer.layout = {

        ...(layer.layout || {}),

        "text-field": [

          "coalesce",

          [
            "get",
            "name:uk"
          ],

          [
            "get",
            "name"
          ]

        ]

      };

      /*
       * Не ставимо visibility:none.
       */

      layer.layout.visibility =
        "visible";

    }


    /*
     * Назви доріг.
     *
     * На стартовому zoom вони тільки
     * створюють шум.
     */

    if (
      sourceLayer ===
      "transportation_name" &&
      layer.type ===
      "symbol"
    ) {

      layer.layout = {

        ...(layer.layout || {}),

        visibility:
          "none"

      };

    }

  }

}


/* =========================================================
   KYIV OBLAST GEOJSON
========================================================= */

async function loadOblast(
  map
) {

  const response =
    await fetch(
      KYIV_OBLAST_URL,
      {
        cache:
          "no-store"
      }
    );


  if (!response.ok) {

    throw new Error(
      `Kyiv Oblast HTTP ${response.status}`
    );

  }


  const raw =
    await response.json();


  let data =
    null;


  /*
   * Найчастіший варіант.
   */

  if (
    raw.type ===
    "FeatureCollection"
  ) {

    data =
      raw;

  }


  /*
   * Якщо повернувся Feature.
   */

  else if (
    raw.type ===
    "Feature"
  ) {

    data =
      raw;

  }


  /*
   * Якщо повернулася сама геометрія.
   */

  else if (
    raw.type ===
      "Polygon" ||

    raw.type ===
      "MultiPolygon"
  ) {

    data = {

      type:
        "Feature",

      properties:
        {},

      geometry:
        raw

    };

  }


  if (!data) {

    throw new Error(
      "Invalid Kyiv Oblast GeoJSON"
    );

  }


  map.addSource(
    "kyiv-oblast",
    {

      type:
        "geojson",

      data:
        data

    }
  );


  return data;

}


/* =========================================================
   OUTSIDE MASK
========================================================= */

function addOutsideMask(
  map,
  oblast
) {

  /*
   * Якщо GeoJSON — FeatureCollection,
   * об'єднуємо його перед difference().
   */

  let region =
    oblast;


  if (
    oblast.type ===
    "FeatureCollection"
  ) {

    if (
      oblast.features.length === 1
    ) {

      region =
        oblast.features[0];

    }

    else {

      try {

        region =
          turf.combine(
            oblast
          ).features[0];

      }

      catch (error) {

        console.warn(
          "Combine:",
          error
        );

        return;

      }

    }

  }


  /*
   * Великий прямокутник.
   */

  const outer =
    turf.polygon([

      [

        [27.0, 47.0],

        [34.8, 47.0],

        [34.8, 53.2],

        [27.0, 53.2],

        [27.0, 47.0]

      ]

    ]);


  let outside;


  try {

    outside =
      turf.difference(
        turf.featureCollection([
          outer,
          region
        ])
      );

  }

  catch (error) {

    console.warn(
      "Mask:",
      error
    );

    return;

  }


  if (!outside) {
    return;
  }


  map.addSource(
    "outside-kyiv-oblast",
    {

      type:
        "geojson",

      data:
        outside

    }
  );


  /*
   * Цей шар спеціально додається
   * після базової карти.
   *
   * У результаті все навколо
   * області стає темніше.
   */

  map.addLayer({

    id:
      "outside-kyiv-oblast",

    type:
      "fill",

    source:
      "outside-kyiv-oblast",

    paint: {

      "fill-color":
        "#020405",

      "fill-opacity":
        0.58

    }

  });

}


/* =========================================================
   OBLAST FILL
========================================================= */

function addOblastFill(
  map
) {

  map.addLayer({

    id:
      "kyiv-oblast-fill",

    type:
      "fill",

    source:
      "kyiv-oblast",

    paint: {

      "fill-color":
        "#15291f",

      "fill-opacity":
        0.10

    }

  });

}


/* =========================================================
   OBLAST BORDER
========================================================= */

function addOblastBorder(
  map
) {

  map.addLayer({

    id:
      "kyiv-oblast-border",

    type:
      "line",

    source:
      "kyiv-oblast",

    paint: {

      "line-color":
        "#91a9a2",

      "line-width": [

        "interpolate",

        ["linear"],

        ["zoom"],

        7.5,
        1.0,

        9,
        1.45,

        12,
        1.9,

        15,
        2.5

      ],

      "line-opacity":
        0.88

    }

  });

}


/* =========================================================
   DISTRICT BOUNDARIES
========================================================= */

function addDistrictBoundaries(
  map
) {

  /*
   * OSM admin_level=6.
   *
   * Вони малюються дуже тихо.
   */

  map.addLayer({

    id:
      "kyiv-district-boundaries",

    type:
      "line",

    source:
      "openmaptiles",

    "source-layer":
      "boundary",

    minzoom:
      7.7,

    filter: [

      "all",

      [
        "==",
        "admin_level",
        6
      ],

      [
        "!=",
        "name",
        "Київ"
      ],

      [
        "!=",
        "name",
        "Kyiv"
      ]

    ],

    paint: {

      "line-color":
        "#667b76",

      "line-width": [

        "interpolate",

        ["linear"],

        ["zoom"],

        7.7,
        0.35,

        9,
        0.62,

        11,
        0.90,

        14,
        1.25,

        16,
        1.50

      ],

      "line-opacity": [

        "interpolate",

        ["linear"],

        ["zoom"],

        7.7,
        0.18,

        9,
        0.28,

        11,
        0.40,

        14,
        0.54,

        16,
        0.65

      ],

      "line-dasharray":
        [2, 3]

    }

  });

}


/* =========================================================
   CITY LABELS
========================================================= */

function addCityLabels(
  map
) {

  /*
   * Ми НЕ прибираємо стандартні place labels.
   *
   * Цей шар лише підсилює міста/селища,

  map.addLayer({

      "text-halo-color":

      "text-halo-blur":

    }

  });


  /*

   * починають з'являтися при zoom.
   */

  map.addLayer({

    id:
      "kyiv-small-place-labels",

    type:
      "symbol",

    source:
      "openmaptiles",

    "source-layer":
      "place",

    minzoom:
      10.5,

      "all",

      [

        "$type",
        "Point"
      ],

        "in",

        "village",
        "hamlet"
      ]

    ],

        "coalesce",

        [
          "get",

        ],

        [

          "name"
        ]

      ],

      "text-font": [
        "Noto Sans Regular"
      ],

      "text-size": [

        ["zoom"],

        10.5,
        7,

        12,
        8,

        15,
        10

      ],

      "text-padding":
        3,

      "text-allow-overlap":

    },

    paint: {

        0.85

/* =========================================================

========================================================= */

function addKyivBoundary(
  map
) {

  map.addLayer({

    id:
      "kyiv-city-boundary",

    type:
      "line",

    source:
      "openmaptiles",

    "source-layer":
      "boundary",

    minzoom:
      8,

    filter: [

      "all",

      [
        "==",
        "admin_level",
        6
      ],

      [

          "name",

        ],

        [

        10,
        1.0,

        1.5,

        16,
        2

      ],

      "line-opacity":

    }

  });

}
