<!DOCTYPE html>
<html lang="uk">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover"
>

<title>ONLINE RADAR</title>

<link
  href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css"
  rel="stylesheet"
>

<style>

/* =========================================================
   RESET
========================================================= */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {

  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  background: #050707;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Helvetica,
    Arial,
    sans-serif;
}

body {

  position: fixed;

  inset: 0;
}


/* =========================================================
   MAP
========================================================= */

#map {

  position: absolute;

  inset: 0;

  width: 100%;
  height: 100%;

  background: #070909;
}


/* =========================================================
   ONLINE RADAR
========================================================= */

.radar-badge {

  position: absolute;

  z-index: 100;

  top:
    max(
      24px,
      env(safe-area-inset-top)
    );

  left: 22px;

  height: 58px;

  padding: 0 22px;

  display: flex;

  align-items: center;

  gap: 14px;

  border-radius: 29px;

  background:
    rgba(4,10,10,.94);

  border:
    1px solid
    rgba(80,180,160,.20);

  box-shadow:

    0 8px 30px
    rgba(0,0,0,.40),

    inset 0 0 20px
    rgba(60,255,190,.025);

  backdrop-filter:
    blur(12px);

  -webkit-backdrop-filter:
    blur(12px);

  pointer-events:
    none;
}


.radar-dot {

  position: relative;

  width: 20px;
  height: 20px;

  flex: 0 0 20px;

  border-radius: 50%;

  background:
    #55f5a5;

  box-shadow:

    0 0 10px
    rgba(85,245,165,.95),

    0 0 25px
    rgba(85,245,165,.60);
}


.radar-dot::after {

  content: "";

  position: absolute;

  inset: -8px;

  border-radius: 50%;

  border:
    1px solid
    rgba(85,245,165,.30);

  animation:
    radarPulse 2s infinite ease-out;
}


@keyframes radarPulse {

  0% {

    transform:
      scale(.65);

    opacity:
      .85;
  }

  70% {

    transform:
      scale(1.25);

    opacity:
      0;
  }

  100% {

    transform:
      scale(1.25);

    opacity:
      0;
  }

}


.radar-title {

  color:
    #f0f7f5;

  font-size:
    16px;

  font-weight:
    700;

  letter-spacing:
    5px;

  white-space:
    nowrap;
}


/* =========================================================
   BOTTOM PANEL
========================================================= */

.info-panel {

  position: absolute;

  z-index: 100;

  left: 22px;

  bottom:
    max(
      22px,
      env(safe-area-inset-bottom)
    );

  padding:
    18px 24px 17px;

  min-width:
    305px;

  border-radius:
    24px;

  background:
    rgba(4,9,9,.94);

  border:
    1px solid
    rgba(90,160,150,.20);

  box-shadow:

    0 10px 35px
    rgba(0,0,0,.45),

    inset 0 0 20px
    rgba(80,255,210,.02);

  backdrop-filter:
    blur(12px);

  -webkit-backdrop-filter:
    blur(12px);

  pointer-events:
    none;
}


.region-name {

  color:
    #e9f0ef;

  font-size:
    17px;

  font-weight:
    700;

  letter-spacing:
    4px;

  margin-bottom:
    8px;
}


.date-time {

  color:
    #7f908d;

  font-size:
    14px;

  font-family:
    ui-monospace,
    SFMono-Regular,
    Menlo,
    Monaco,
    Consolas,
    monospace;

  letter-spacing:
    1px;
}


/* =========================================================
   INFO BUTTON
========================================================= */

.info-button {

  position: absolute;

  z-index: 110;

  right: 22px;

  bottom:
    max(
      22px,
      env(safe-area-inset-bottom)
    );

  width: 62px;
  height: 62px;

  border-radius:
    50%;

  border:
    1px solid
    rgba(140,155,153,.25);

  background:
    rgba(7,12,12,.94);

  color:
    #cbd3d2;

  font-family:
    Georgia, serif;

  font-size:
    38px;

  font-weight:
    bold;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  box-shadow:

    0 8px 30px
    rgba(0,0,0,.45),

    inset 0 0 15px
    rgba(255,255,255,.02);

  backdrop-filter:
    blur(10px);

  -webkit-backdrop-filter:
    blur(10px);
}


/* =========================================================
   MAP CONTROLS
========================================================= */

.maplibregl-ctrl-top-right {

  top: 20px;

  right: 18px;
}


.maplibregl-ctrl-group {

  background:
    rgba(5,9,9,.90) !important;

  border:
    1px solid
    rgba(130,150,145,.20) !important;

  border-radius:
    14px !important;

  overflow:
    hidden;

  box-shadow:
    0 5px 20px
    rgba(0,0,0,.30);
}


.maplibregl-ctrl-group button {

  background:
    transparent !important;
}


.maplibregl-ctrl-group
button span {

  filter:
    invert(1);

  opacity:
    .72;
}


.maplibregl-ctrl-attrib {

  background:
    rgba(5,8,8,.70) !important;

  color:
    #647572 !important;

  font-size:
    9px !important;
}


.maplibregl-ctrl-attrib a {

  color:
    #718581 !important;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width:600px) {

  .radar-badge {

    top:
      max(
        18px,
        env(safe-area-inset-top)
      );

    left:
      22px;

    height:
      56px;

    padding:
      0 20px;
  }


  .radar-title {

    font-size:
      15px;

    letter-spacing:
      4px;
  }


  .radar-dot {

    width:
      19px;

    height:
      19px;

    flex-basis:
      19px;
  }


  .info-panel {

    left:
      22px;

    bottom:
      max(
        20px,
        env(safe-area-inset-bottom)
      );

    min-width:
      285px;

    padding:
      17px 21px;
  }


  .region-name {

    font-size:
      16px;
  }


  .date-time {

    font-size:
      13px;
  }


  .info-button {

    right:
      20px;

    bottom:
      max(
        20px,
        env(safe-area-inset-bottom)
      );

    width:
      60px;

    height:
      60px;
  }

}

</style>

</head>


<body>


<div id="map"></div>


<!-- =========================================================
     ONLINE RADAR
========================================================= -->

<div class="radar-badge">

  <div class="radar-dot"></div>

  <div class="radar-title">
    ONLINE RADAR
  </div>

</div>


<!-- =========================================================
     BOTTOM INFORMATION
========================================================= -->

<div class="info-panel">

  <div class="region-name">
    КИЇВСЬКА ОБЛАСТЬ
  </div>

  <div
    class="date-time"
    id="datetime"
  ></div>

</div>


<!-- =========================================================
     INFO
========================================================= -->

<button
  class="info-button"
  id="infoButton"
>
  i
</button>


<script
  src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"
></script>


<script>


/* ============================================================
   CONFIG
============================================================ */


/*
  Dark basemap.
*/

const STYLE_URL =
  "https://tiles.openfreemap.org/styles/dark";


/*
  Максимальне наближення.

  Можна йти від стартової області
  аж до рівня вулиць.
*/

const MAX_ZOOM =
  20;


/*
  ==========================================================
  СТАРТОВИЙ КАДР
  ==========================================================

  Трохи ширший за саму Київську область,
  щоб область не обрізалась по краях,
  але сусідні регіони були лише трохи видні.
*/

const KYIV_VIEW_BOUNDS = [

  [29.20, 49.35],

  [32.20, 51.55]

];


/*
  ==========================================================
  ОБМЕЖЕННЯ ПАНОРАМУВАННЯ
  ==========================================================

  Невеликий запас навколо Київщини.

  Далеко відтягнути карту пальцями
  вже не вийде.
*/

const MAP_MAX_BOUNDS = [

  [28.85, 49.05],

  [32.55, 51.80]

];


/*
  Область для неонового контуру.
*/

const KYIV_OBLAST_GEOJSON =
  "https://geo2day.com/europe/ukraine/kiev_oblast.geojson";


/*
  Мінімальний zoom розраховується
  автоматично.
*/

let minZoomCalculated =
  5;


/* ============================================================
   DATE / TIME
============================================================ */

function updateDateTime() {

  const now =
    new Date();


  const day =
    String(
      now.getDate()
    ).padStart(
      2,
      "0"
    );


  const month =
    String(
      now.getMonth() + 1
    ).padStart(
      2,
      "0"
    );


  const year =
    now.getFullYear();


  const hours =
    String(
      now.getHours()
    ).padStart(
      2,
      "0"
    );


  const minutes =
    String(
      now.getMinutes()
    ).padStart(
      2,
      "0"
    );


  const seconds =
    String(
      now.getSeconds()
    ).padStart(
      2,
      "0"
    );


  document
    .getElementById(
      "datetime"
    )
    .textContent =
    `${day}.${month}.${year} · ${hours}:${minutes}:${seconds}`;
}


updateDateTime();


setInterval(
  updateDateTime,
  1000
);


/* ============================================================
   MAP
============================================================ */

const map =
  new maplibregl.Map({

    container:
      "map",

    style:
      STYLE_URL,

    center:
      [30.70,50.40],

    zoom:
      7.5,

    minZoom:
      5,

    maxZoom:
      MAX_ZOOM,

    pitch:
      0,

    bearing:
      0,

    dragRotate:
      false,

    pitchWithRotate:
      false,

    touchPitch:
      false,

    cooperativeGestures:
      false,

    renderWorldCopies:
      false,

    attributionControl:
      true

  });


/* ============================================================
   PAN LIMIT
============================================================ */

map.setMaxBounds(
  MAP_MAX_BOUNDS
);


/* ============================================================
   CONTROLS
============================================================ */

map.addControl(

  new maplibregl.NavigationControl({

    showCompass:
      false,

    showZoom:
      true,

    visualizePitch:
      false

  }),

  "top-right"

);


/* ============================================================
   MAP LOAD
============================================================ */

map.once(
  "load",
  async () => {


    /* ======================================================
       1. STARTING VIEW
    ====================================================== */


    map.fitBounds(

      KYIV_VIEW_BOUNDS,

      {

        /*
          Тут спеціально НЕ величезний
          padding.

          Карта повинна бути трохи
          ближча, але вся область
          має залишитися в кадрі.
        */

        padding: {

          top:
            105,

          bottom:
            125,

          left:
            25,

          right:
            25

        },


        maxZoom:
          8.65,


        duration:
          0

      }

    );


    /*
      Запам'ятовуємо реальний
      стартовий масштаб.
    */

    minZoomCalculated =
      map.getZoom();


    /*
      Нижче цього масштабу
      кнопка "-" більше
      не працює.
    */

    map.setMinZoom(
      minZoomCalculated
    );


    /*
      Стартова позиція.
    */

    map.jumpTo({

      center:
        map.getCenter(),

      zoom:
        minZoomCalculated,

      bearing:
        0,

      pitch:
        0

    });


    /* ======================================================
       2. REMOVE ENGLISH PLACE LABELS
    ====================================================== */

    hideDefaultPlaceLabels();


    /* ======================================================
       3. OUR CITY NODES
    ====================================================== */

    addMajorCityNodes();


    /* ======================================================
       4. WATER LABELS
    ====================================================== */

    addWaterLabels();


    /* ======================================================
       5. DISTRICTS
    ====================================================== */

    addDistrictBoundaries();


    /* ======================================================
       6. KYIV OBLAST NEON
    ====================================================== */

    await addKyivOblastBoundary();


    /*
      Фінально залишаємо карту
      саме в стартовій позиції.
    */

    map.jumpTo({

      center:
        map.getCenter(),

      zoom:
        minZoomCalculated,

      bearing:
        0,

      pitch:
        0

    });

  }
);


/* ============================================================
   HIDE DEFAULT PLACE LABELS
============================================================ */

function hideDefaultPlaceLabels() {


  const layers =
    map.getStyle().layers || [];


  for (
    const layer of layers
  ) {


    const sourceLayer =
      String(
        layer["source-layer"] || ""
      ).toLowerCase();


    const layerId =
      String(
        layer.id || ""
      ).toLowerCase();


    const isPlace =

      sourceLayer === "place" ||

      sourceLayer === "settlement" ||

      sourceLayer === "place_label" ||

      sourceLayer === "settlement_label" ||

      layerId.includes("place") ||

      layerId.includes("settlement");


    if (
      isPlace &&
      layer.type === "symbol"
    ) {


      try {

        map.setLayoutProperty(

          layer.id,

          "visibility",

          "none"

        );

      }

      catch(error) {}

    }

  }

}


/* ============================================================
   MAJOR CITY NODES
============================================================ */

function addMajorCityNodes() {


  /*
    Статичний список основних міст
    та вузлів Київської області.

    Вони не залежать від zoom
    базової карти.

    Саме тому будуть видні
    вже при відкритті.
  */

  const cities = [

    {
      name: "Київ",
      lon: 30.5234,
      lat: 50.4501,
      important: true
    },

    {
      name: "Біла Церква",
      lon: 30.3525,
      lat: 49.7968,
      important: true
    },

    {
      name: "Бровари",
      lon: 30.7909,
      lat: 50.5112,
      important: true
    },

    {
      name: "Бориспіль",
      lon: 30.9550,
      lat: 50.3500,
      important: true
    },

    {
      name: "Вишгород",
      lon: 30.4897,
      lat: 50.5848,
      important: true
    },

    {
      name: "Буча",
      lon: 30.2120,
      lat: 50.5430,
      important: true
    },

    {
      name: "Ірпінь",
      lon: 30.2500,
      lat: 50.5218,
      important: true
    },

    {
      name: "Фастів",
      lon: 29.9170,
      lat: 50.0768,
      important: true
    },

    {
      name: "Васильків",
      lon: 30.3218,
      lat: 50.1798,
      important: true
    },

    {
      name: "Обухів",
      lon: 30.6169,
      lat: 50.1105,
      important: true
    },

    {
      name: "Українка",
      lon: 30.7467,
      lat: 50.1432,
      important: true
    },

    {
      name: "Ржищів",
      lon: 31.0458,
      lat: 49.9675,
      important: true
    },

    {
      name: "Кагарлик",
      lon: 30.8280,
      lat: 49.8620,
      important: true
    },

    {
      name: "Узин",
      lon: 30.4440,
      lat: 49.8260,
      important: true
    },

    {
      name: "Яготин",
      lon: 31.7620,
      lat: 50.2560,
      important: true
    },

    {
      name: "Березань",
      lon: 31.4700,
      lat: 50.3100,
      important: false
    },

    {
      name: "Димер",
      lon: 30.3090,
      lat: 51.0770,
      important: true
    },

    {
      name: "Іванків",
      lon: 29.8930,
      lat: 50.9380,
      important: true
    },

    {
      name: "Трипілля",
      lon: 30.7830,
      lat: 50.1180,
      important: false
    },

    {
      name: "Макарів",
      lon: 29.8110,
      lat: 50.4640,
      important: false
    },

    {
      name: "Миронівка",
      lon: 30.9830,
      lat: 49.6600,
      important: false
    },

    {
      name: "Сквира",
      lon: 29.6650,
      lat: 49.7320,
      important: false
    },

    {
      name: "Тетіїв",
      lon: 29.9510,
      lat: 49.3750,
      important: false
    },

    {
      name: "Богуслав",
      lon: 30.7770,
      lat: 49.5480,
      important: false
    },

    {
      name: "Володарка",
      lon: 29.9180,
      lat: 49.5240,
      important: false
    }

  ];


  /*
    GeoJSON.
  */

  const features =
    cities.map(
      city => ({

        type:
          "Feature",

        geometry: {

          type:
            "Point",

          coordinates: [

            city.lon,
            city.lat

          ]

        },

        properties: {

          name:
            city.name,

          important:
            city.important

        }

      })
    );


  const data = {

    type:
      "FeatureCollection",

    features:
      features

  };


  /* ========================================================
     SOURCE
  ======================================================== */

  if (
    !map.getSource(
      "major-city-nodes"
    )
  ) {


    map.addSource(

      "major-city-nodes",

      {

        type:
          "geojson",

        data:
          data

      }

    );

  }


  /* ========================================================
     CITY DOTS
  ======================================================== */

  map.addLayer({

    id:
      "major-city-dots",

    type:
      "circle",

    source:
      "major-city-nodes",


    minzoom:
      5.5,


    paint: {

      "circle-radius":
        [

          "interpolate",

          ["linear"],

          ["zoom"],


          5.5,
          2.3,


          7,
          2.8,


          9,
          3.5,


          12,
          4,


          16,
          5

        ],


      "circle-color":
        "#7bdcff",


      "circle-stroke-color":
        "#071012",


      "circle-stroke-width":
        1,


      "circle-opacity":
        .95

    }

  });


  /* ========================================================
     CITY LABELS
  ======================================================== */

  map.addLayer({

    id:
      "major-city-labels",

    type:
      "symbol",

    source:
      "major-city-nodes",


    minzoom:
      5.5,


    layout: {

      "text-field":
        [
          "get",
          "name"
        ],


      "text-font":
        [
          "Noto Sans Regular"
        ],


      /*
        Основні міста трохи
        помітніші.

        Але без величезних
        написів.
      */

      "text-size":
        [

          "interpolate",

          ["linear"],

          ["zoom"],


          5.5,
          7.2,


          7,
          7.8,


          8.5,
          8.8,


          10,
          9.5,


          13,
          10.5,


          16,
          12,


          20,
          13

        ],


      "text-offset":
        [

          0,
          1.15

        ],


      "text-anchor":
        "top",


      "text-allow-overlap":
        false,


      "text-ignore-placement":
        false

    },


    paint: {

      "text-color":
        "#d3dedc",


      "text-halo-color":
        "rgba(3,7,8,.98)",


      "text-halo-width":
        1.25,


      "text-halo-blur":
        .15

    }

  });


  /* ========================================================
     BIG CITY LABELS
  ======================================================== */

  map.addLayer({

    id:
      "major-city-emphasis",

    type:
      "symbol",

    source:
      "major-city-nodes",


    minzoom:
      5.5,


    filter:
      [
        "==",
        [
          "get",
          "important"
        ],
        true
      ],


    layout: {

      "text-field":
        [
          "get",
          "name"
        ],


      "text-font":
        [
          "Noto Sans Bold"
        ],


      "text-size":
        [

          "interpolate",

          ["linear"],

          ["zoom"],


          5.5,
          8.2,


          7,
          8.8,


          8.5,
          9.5,


          10,
          10.5,


          13,
          11.5,


          16,
          13,


          20,
          14

        ],


      "text-offset":
        [

          0,
          1.15

        ],


      "text-anchor":
        "top",


      "text-allow-overlap":
        false,


      "text-ignore-placement":
        false

    },


    paint: {

      "text-color":
        "#edf5f3",


      "text-halo-color":
        "rgba(3,7,8,1)",


      "text-halo-width":
        1.4,


      "text-halo-blur":
        .2

    }

  });

}


/* ============================================================
   WATER LABELS
============================================================ */

function addWaterLabels() {


  if (
    map.getSource(
      "water-label-source"
    )
  ) {

    return;

  }


  map.addSource(

    "water-label-source",

    {

      type:
        "vector",

      url:
        "https://tiles.openfreemap.org/planet"

    }

  );


  map.addLayer({

    id:
      "ukrainian-water-labels",

    type:
      "symbol",

    source:
      "water-label-source",

    "source-layer":
      "water",


    minzoom:
      7,


    filter:
      [
        "has",
        "name:uk"
      ],


    layout: {

      "text-field":
        [
          "get",
          "name:uk"
        ],


      "text-font":
        [
          "Noto Sans Regular"
        ],


      "text-size":
        9,


      "text-allow-overlap":
        false

    },


    paint: {

      "text-color":
        "#657a83",


      "text-halo-color":
        "rgba(4,7,8,.9)",


      "text-halo-width":
        1

    }

  });

}


/* ============================================================
   DISTRICT BOUNDARIES
============================================================ */

function addDistrictBoundaries() {


  if (
    map.getSource(
      "district-boundaries"
    )
  ) {

    return;

  }


  map.addSource(

    "district-boundaries",

    {

      type:
        "vector",

      url:
        "https://tiles.openfreemap.org/planet"

    }

  );


  map.addLayer({

    id:
      "kyiv-district-boundaries",

    type:
      "line",

    source:
      "district-boundaries",

    "source-layer":
      "boundary",


    minzoom:
      6,


    filter:
      [

        "==",

        [
          "get",
          "admin_level"
        ],

        6

      ],


    paint: {

      "line-color":
        "rgba(105,130,130,.32)",


      "line-width":
        [

          "interpolate",

          ["linear"],

          ["zoom"],


          6,
          .4,


          8,
          .55,


          11,
          .75,


          15,
          1

        ],


      "line-opacity":
        .52

    }

  });

}


/* ============================================================
   KYIV OBLAST NEON OUTLINE
============================================================ */

async function addKyivOblastBoundary() {


  try {


    const response =
      await fetch(
        KYIV_OBLAST_GEOJSON
      );


    if (
      !response.ok
    ) {

      throw new Error(
        "Kyiv Oblast GeoJSON unavailable"
      );

    }


    const geojson =
      await response.json();


    /* ======================================================
       SOURCE
    ====================================================== */

    map.addSource(

      "kyiv-oblast",

      {

        type:
          "geojson",

        data:
          geojson

      }

    );


    /* ======================================================
       SUBTLE AREA
    ====================================================== */

    map.addLayer({

      id:
        "kyiv-oblast-fill",

      type:
        "fill",

      source:
        "kyiv-oblast",

      paint: {

        "fill-color":
          "#087d9d",

        "fill-opacity":
          .055

      }

    });


    /* ======================================================
       BLUE NEON GLOW
    ====================================================== */

    map.addLayer({

      id:
        "kyiv-oblast-neon-glow",

      type:
        "line",

      source:
        "kyiv-oblast",

      paint: {

        "line-color":
          "#29d9ff",


        "line-width":
          [

            "interpolate",

            ["linear"],

            ["zoom"],


            5,
            5,


            7,
            6,


            10,
            7,


            15,
            8

          ],


        "line-opacity":
          .20,


        "line-blur":
          5

      }

    });


    /* ======================================================
       MAIN NEON LINE
    ====================================================== */

    map.addLayer({

      id:
        "kyiv-oblast-neon",

      type:
        "line",

      source:
        "kyiv-oblast",

      paint: {

        "line-color":
          "#62e7ff",


        "line-width":
          [

            "interpolate",

            ["linear"],

            ["zoom"],


            5,
            1.4,


            7,
            1.8,


            10,
            2.2,


            15,
            2.8,


            20,
            3.5

          ],


        "line-opacity":
          .96

      }

    });

  }


  catch(error) {

    console.warn(
      "Kyiv Oblast outline error:",
      error
    );

  }

}


/* ============================================================
   INFO
============================================================ */

document
  .getElementById(
    "infoButton"
  )
  .addEventListener(
    "click",
    () => {

      alert(

        "ONLINE RADAR\n\n" +

        "КИЇВСЬКА ОБЛАСТЬ\n\n" +

        "Карта масштабується " +

        "до рівня міст та вулиць."

      );

    }
  );


/* ============================================================
   TOUCH / ZOOM
============================================================ */

map.dragPan.enable();

map.touchZoomRotate.enable();

map.scrollZoom.enable();

map.doubleClickZoom.enable();


/*
  Вимикаємо нахил карти
  при жестах.
*/

map.touchPitch.disable();


/* ============================================================
   RESIZE
============================================================ */

window.addEventListener(
  "resize",
  () => {

    if (map) {

      map.resize();

    }

  }
);

</script>
